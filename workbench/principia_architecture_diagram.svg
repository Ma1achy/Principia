<svg viewBox="0 0 1280 1240" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A443A"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A5626"/>
    </marker>
    <style>
      .mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;}
      .bt{font-weight:700;}
      .lbl{letter-spacing:2px;}
      .ring{stroke-width:2;fill:none;}
      .tick{stroke-width:2;}
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="1240" fill="#F2EEE4"/>
  <rect x="14" y="14" width="1252" height="1212" fill="none" stroke="#232019" stroke-width="2.5"/>
  <rect x="22" y="22" width="1236" height="1196" fill="none" stroke="#232019" stroke-width="1"/>

  <!-- HEADER -->
  <text x="44" y="66" class="bt lbl" font-size="32" fill="#232019">PRINCIPIA</text>
  <text x="46" y="88" class="mono lbl" font-size="12" fill="#5A5346">SYSTEMS ARCHITECTURE · REV C</text>
  <text x="1236" y="64" text-anchor="end" class="mono" font-size="11" fill="#5A5346">THE LADDER · THE RINGS · THE MEMBRANE</text>
  <text x="1236" y="84" text-anchor="end" class="mono" font-size="11" fill="#8A5626" font-style="italic">rungs transform · rings decide when, how often, how faithfully, where</text>
  <line x1="44" y1="100" x2="1236" y2="100" stroke="#232019" stroke-width="1"/>

  <!-- ===== KEY-DOMAIN BANDS behind the ladder ===== -->
  <rect x="452" y="222" width="376" height="400" rx="8" fill="#E7ECEA" opacity="0.75"/>
  <text x="820" y="238" text-anchor="end" class="mono" font-size="9" fill="#4A6A6A">SIM-KEY DOMAIN — change ⇒ re-integrate</text>
  <rect x="452" y="630" width="376" height="204" rx="8" fill="#F1E7D6" opacity="0.85"/>
  <text x="820" y="646" text-anchor="end" class="mono" font-size="9" fill="#8A6A3A">RENDER-KEY DOMAIN — change ⇒ recolour</text>

  <!-- ===================== THE LADDER ===================== -->
  <!-- INTENT -->
  <rect x="470" y="132" width="340" height="60" rx="7" fill="#DCE6E3" stroke="#34586B" stroke-width="1.8"/>
  <text x="640" y="156" text-anchor="middle" class="bt" font-size="15" fill="#20303A">INTENT</text>
  <text x="640" y="175" text-anchor="middle" class="mono" font-size="10" fill="#3A4A4A">navigation · lock · keyframes · playhead</text>
  <line x1="640" y1="192" x2="640" y2="234" stroke="#4A443A" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="652" y="216" class="mono" font-size="9" fill="#5A5346">constructs</text>

  <!-- QUESTION -->
  <rect x="470" y="236" width="340" height="72" rx="7" fill="#DCE6E3" stroke="#34586B" stroke-width="1.8"/>
  <text x="640" y="260" text-anchor="middle" class="bt" font-size="15" fill="#20303A">QUESTION — CHART</text>
  <text x="640" y="279" text-anchor="middle" class="mono" font-size="10" fill="#3A4A4A">a projection of the 8D manifold</text>
  <text x="640" y="294" text-anchor="middle" class="mono" font-size="10" fill="#3A4A4A">defines a family of ICs · well-posed</text>
  <line x1="640" y1="308" x2="640" y2="368" stroke="#4A443A" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="652" y="332" class="mono" font-size="9" fill="#5A5346">per point: Φ · dispatch ▼</text>

  <!-- MEMBRANE (demoted annotation) -->
  <line x1="44" y1="344" x2="1236" y2="344" stroke="#8A6D3B" stroke-width="1.4" stroke-dasharray="8 5"/>
  <text x="52" y="338" class="mono" font-size="9" fill="#6A5230">DEPLOYMENT MEMBRANE — the <tspan font-style="italic">where</tspan>, not the hierarchy · CPU ▲ GPU ▼</text>
  <text x="52" y="358" class="mono" font-size="8.5" fill="#8A7A5A">five typed crossings: dispatch▼ render-config▼ bake▼ reduction▲ pulls▲ · rings cross freely (the f64 witness is CPU)</text>

  <!-- MATTER -->
  <rect x="470" y="370" width="340" height="72" rx="7" fill="#EBD9C2" stroke="#9A5A2B" stroke-width="1.8"/>
  <text x="640" y="394" text-anchor="middle" class="bt" font-size="15" fill="#3A2410">MATTER — DECODE</text>
  <text x="640" y="413" text-anchor="middle" class="mono" font-size="10" fill="#5A3A1A">z → mass × config × momentum</text>
  <text x="640" y="428" text-anchor="middle" class="mono" font-size="10" fill="#5A3A1A">→ canonicalise → (m, r, p)</text>
  <line x1="640" y1="442" x2="640" y2="470" stroke="#4A443A" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- ENCODE door (upward, right of ladder) -->
  <path d="M810,406 H848 V272 H814" fill="none" stroke="#8A5626" stroke-width="1.6" marker-end="url(#arrR)"/>
  <text x="856" y="330" class="mono bt" font-size="9.5" fill="#8A5626">ENCODE ▲</text>
  <text x="856" y="344" class="mono" font-size="8.5" fill="#8A5626">the door back in:</text>
  <text x="856" y="356" class="mono" font-size="8.5" fill="#8A5626">lock · lookup ·</text>
  <text x="856" y="368" class="mono" font-size="8.5" fill="#8A5626">literature ICs</text>

  <!-- PHYSICS -->
  <rect x="470" y="472" width="340" height="72" rx="7" fill="#EBD9C2" stroke="#9A5A2B" stroke-width="1.8"/>
  <text x="640" y="496" text-anchor="middle" class="bt" font-size="15" fill="#3A2410">PHYSICS — SIMULATE</text>
  <text x="640" y="515" text-anchor="middle" class="mono" font-size="10" fill="#5A3A1A">wrapper( occupant STEP ×N ) · project</text>
  <text x="640" y="530" text-anchor="middle" class="mono" font-size="10" fill="#5A3A1A">monitor · detect · classify (total)</text>
  <line x1="640" y1="544" x2="640" y2="560" stroke="#4A443A" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- MEMORY (waist) -->
  <rect x="470" y="562" width="340" height="58" rx="8" fill="#232019"/>
  <text x="640" y="586" text-anchor="middle" class="bt" font-size="14" fill="#F2EEE4">MEMORY — PAYLOAD</text>
  <text x="640" y="604" text-anchor="middle" class="mono" font-size="9" fill="#C9C3B4">SimState (live) + ICDescriptor · the waist · marches with the playhead</text>
  <line x1="640" y1="620" x2="640" y2="648" stroke="#4A443A" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="652" y="638" class="mono" font-size="9" fill="#5A5346">@ playhead t</text>

  <!-- MEANING -->
  <rect x="470" y="650" width="340" height="70" rx="7" fill="#EBD9C2" stroke="#9A5A2B" stroke-width="1.8"/>
  <text x="640" y="674" text-anchor="middle" class="bt" font-size="15" fill="#3A2410">MEANING — COLOUR</text>
  <text x="640" y="693" text-anchor="middle" class="mono" font-size="10" fill="#5A3A1A">post( combine( colour, brightness ) )</text>
  <text x="640" y="708" text-anchor="middle" class="mono" font-size="10" fill="#5A3A1A">four slots · colour IS the data</text>
  <line x1="640" y1="720" x2="640" y2="736" stroke="#4A443A" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- IMAGE -->
  <rect x="470" y="738" width="340" height="88" rx="7" fill="#EBD9C2" stroke="#9A5A2B" stroke-width="1.8"/>
  <text x="640" y="762" text-anchor="middle" class="bt" font-size="15" fill="#3A2410">IMAGE — COMPOSITE → SCREEN</text>
  <text x="640" y="781" text-anchor="middle" class="mono" font-size="10" fill="#5A3A1A">blurred backdrop ▸ fresh ▸ trace ▸ CVD</text>
  <rect x="530" y="792" width="220" height="24" rx="5" fill="#232019"/>
  <text x="640" y="808" text-anchor="middle" class="mono" font-size="9" fill="#F2EEE4">never blank · never lies · never freezes</text>

  <!-- ===================== LEFT RINGS ===================== -->
  <!-- ALLOCATION: Question -> Memory -->
  <line x1="392" y1="236" x2="392" y2="620" class="ring" stroke="#5B6470"/>
  <line x1="392" y1="236" x2="404" y2="236" class="tick" stroke="#5B6470"/>
  <line x1="392" y1="620" x2="404" y2="620" class="tick" stroke="#5B6470"/>
  <text x="56" y="252" class="bt lbl" font-size="11" fill="#3A424C">ALLOCATION RING</text>
  <text x="56" y="270" class="mono" font-size="9.5" fill="#454A52">scheduler · cache · tiles</text>
  <text x="56" y="284" class="mono" font-size="9.5" fill="#454A52">two regimes · MAX_REL_DEPTH</text>
  <text x="56" y="302" class="mono bt" font-size="9.5" fill="#8A5626">which points, when —</text>
  <text x="56" y="316" class="mono bt" font-size="9.5" fill="#8A5626">never what they compute to</text>
  <text x="56" y="330" class="mono" font-size="9" fill="#8A5626">(the firewall)</text>
  <line x1="252" y1="290" x2="388" y2="290" stroke="#5B6470" stroke-width="0.9" stroke-dasharray="3 3"/>

  <!-- PRECISION: Matter -> Memory -->
  <line x1="430" y1="370" x2="430" y2="620" class="ring" stroke="#5B6470"/>
  <line x1="430" y1="370" x2="442" y2="370" class="tick" stroke="#5B6470"/>
  <line x1="430" y1="620" x2="442" y2="620" class="tick" stroke="#5B6470"/>
  <text x="56" y="470" class="bt lbl" font-size="11" fill="#3A424C">PRECISION RING</text>
  <text x="56" y="488" class="mono" font-size="9.5" fill="#454A52">f64 witness (CPU worker)</text>
  <text x="56" y="502" class="mono" font-size="9.5" fill="#454A52">f32 survey · linearised decode</text>
  <text x="56" y="520" class="mono bt" font-size="9.5" fill="#8A5626">divergence is the observable,</text>
  <text x="56" y="534" class="mono" font-size="9.5" fill="#8A5626">never reconciled</text>
  <line x1="268" y1="498" x2="426" y2="498" stroke="#5B6470" stroke-width="0.9" stroke-dasharray="3 3"/>

  <!-- ===================== RIGHT RINGS ===================== -->
  <!-- TIME & MOTION: Question -> Image -->
  <line x1="890" y1="236" x2="890" y2="826" class="ring" stroke="#5B6470"/>
  <line x1="878" y1="236" x2="890" y2="236" class="tick" stroke="#5B6470"/>
  <line x1="878" y1="826" x2="890" y2="826" class="tick" stroke="#5B6470"/>
  <text x="984" y="452" class="bt lbl" font-size="11" fill="#3A424C">TIME &amp; MOTION RING</text>
  <text x="984" y="470" class="mono" font-size="9.5" fill="#454A52">playhead re-runs Meaning ↓ only</text>
  <text x="984" y="484" class="mono" font-size="9.5" fill="#454A52">keyframes / export re-run</text>
  <text x="984" y="498" class="mono" font-size="9.5" fill="#454A52">the whole ladder per frame</text>
  <text x="984" y="516" class="mono" font-size="9" fill="#8A5626">exported frames converged only</text>
  <line x1="894" y1="470" x2="980" y2="470" stroke="#5B6470" stroke-width="0.9" stroke-dasharray="3 3"/>

  <!-- OBSERVATION: Intent -> Image -->
  <line x1="926" y1="132" x2="926" y2="826" class="ring" stroke="#5B6470"/>
  <line x1="914" y1="132" x2="926" y2="132" class="tick" stroke="#5B6470"/>
  <line x1="914" y1="826" x2="926" y2="826" class="tick" stroke="#5B6470"/>
  <text x="984" y="580" class="bt lbl" font-size="11" fill="#3A424C">OBSERVATION RING</text>
  <text x="984" y="598" class="mono" font-size="9.5" fill="#454A52">debug catalogue taps every rung</text>
  <text x="984" y="612" class="mono" font-size="9.5" fill="#454A52">hover trace taps Memory</text>
  <text x="984" y="630" class="mono bt" font-size="9.5" fill="#8A5626">the display is the assertion</text>
  <line x1="930" y1="598" x2="980" y2="598" stroke="#5B6470" stroke-width="0.9" stroke-dasharray="3 3"/>

  <!-- PROVENANCE: Intent -> Image -->
  <line x1="962" y1="132" x2="962" y2="826" class="ring" stroke="#5B6470"/>
  <line x1="950" y1="132" x2="962" y2="132" class="tick" stroke="#5B6470"/>
  <line x1="950" y1="826" x2="962" y2="826" class="tick" stroke="#5B6470"/>
  <text x="984" y="700" class="bt lbl" font-size="11" fill="#3A424C">PROVENANCE RING</text>
  <text x="984" y="718" class="mono" font-size="9.5" fill="#454A52">records the ladder's configuration</text>
  <text x="984" y="732" class="mono" font-size="9.5" fill="#454A52">sharing ships the spec —</text>
  <text x="984" y="746" class="mono" font-size="9.5" fill="#454A52">the video is its shadow</text>
  <line x1="966" y1="718" x2="980" y2="718" stroke="#5B6470" stroke-width="0.9" stroke-dasharray="3 3"/>

  <!-- DEPLOYMENT ring note (top-right, wraps the membrane) -->
  <text x="984" y="152" class="bt lbl" font-size="11" fill="#3A424C">DEPLOYMENT RING</text>
  <text x="984" y="170" class="mono" font-size="9.5" fill="#454A52">the membrane · resolve() ·</text>
  <text x="984" y="184" class="mono" font-size="9.5" fill="#454A52">snippet assembly · precompile</text>
  <text x="984" y="202" class="mono bt" font-size="9.5" fill="#8A5626">a gesture never reaches</text>
  <text x="984" y="216" class="mono" font-size="9.5" fill="#8A5626">the compiler</text>

  <!-- ALLOCATION return tap (reduction) -->
  <path d="M470,591 H320 V344" fill="none" stroke="#8A5626" stroke-width="1.3" marker-end="url(#arrR)"/>
  <text x="308" y="380" class="mono" font-size="8.5" fill="#8A5626" text-anchor="end">TileReduction 80B ▲</text>
  <text x="308" y="392" class="mono" font-size="8.5" fill="#8A5626" text-anchor="end">sole automatic return</text>
  <text x="308" y="404" class="mono" font-size="8.5" fill="#8A5626" text-anchor="end">→ Allocation ring</text>

  <!-- RUNG / RING TEST -->
  <line x1="44" y1="856" x2="1236" y2="856" stroke="#232019" stroke-width="1"/>
  <text x="44" y="882" class="bt lbl" font-size="12" fill="#232019">THE TEST</text>
  <text x="140" y="882" class="mono" font-size="10.5" fill="#454A52">RUNG — data passes through and is transformed.   RING — nothing passes through; it decides how · when · how often · how faithfully · where the rungs fire.</text>
  <text x="140" y="902" class="mono" font-size="10.5" fill="#8A5626">No ring may touch what a rung returns.</text>

  <!-- INVARIANTS -->
  <text x="44" y="944" class="bt lbl" font-size="12" fill="#232019">CROSS-CUTTING INVARIANTS</text>
  <text x="44" y="966" class="mono" font-size="10" fill="#454A52">firewall · payload purity · sim/render key split (a line on the ladder) · navigation = chart construction</text>
  <text x="44" y="984" class="mono" font-size="10" fill="#454A52">never blank/lies/freezes · measure honesty · generate-from-one-source · totality</text>

  <!-- LADDER LEGEND -->
  <text x="44" y="1026" class="bt lbl" font-size="12" fill="#232019">READING THE LADDER</text>
  <text x="44" y="1048" class="mono" font-size="10" fill="#454A52">the waist is Memory: everything above produces the payload, everything below consumes it</text>
  <text x="44" y="1066" class="mono" font-size="10" fill="#454A52">sim key above the waist · render key below · encode is the only upward edge</text>

  <!-- swatches -->
  <rect x="760" y="1016" width="16" height="16" fill="#DCE6E3" stroke="#34586B"/><text x="782" y="1029" class="mono" font-size="10" fill="#454A52">CPU rungs (Intent · Question)</text>
  <rect x="760" y="1038" width="16" height="16" fill="#EBD9C2" stroke="#9A5A2B"/><text x="782" y="1051" class="mono" font-size="10" fill="#454A52">GPU rungs (Matter → Image)</text>
  <rect x="760" y="1060" width="16" height="16" fill="#232019"/><text x="782" y="1073" class="mono" font-size="10" fill="#454A52">the waist / final image</text>
  <line x1="1010" y1="1024" x2="1026" y2="1024" stroke="#5B6470" stroke-width="2"/><text x="1032" y="1029" class="mono" font-size="10" fill="#454A52">ring (span bracket)</text>
  <line x1="1010" y1="1046" x2="1026" y2="1046" stroke="#8A5626" stroke-width="1.4"/><text x="1032" y="1051" class="mono" font-size="10" fill="#454A52">return / upward edge</text>
  <line x1="1010" y1="1068" x2="1026" y2="1068" stroke="#8A6D3B" stroke-width="1.4" stroke-dasharray="6 4"/><text x="1032" y="1073" class="mono" font-size="10" fill="#454A52">deployment membrane</text>

  <!-- title block -->
  <rect x="44" y="1108" width="1192" height="72" fill="none" stroke="#232019" stroke-width="1"/>
  <line x1="640" y1="1108" x2="640" y2="1180" stroke="#232019" stroke-width="1"/>
  <line x1="980" y1="1108" x2="980" y2="1180" stroke="#232019" stroke-width="1"/>
  <line x1="44" y1="1144" x2="1236" y2="1144" stroke="#232019" stroke-width="1"/>
  <text x="56" y="1130" class="mono bt" font-size="10" fill="#232019">PRINCIPIA — SYSTEMS ARCHITECTURE</text>
  <text x="56" y="1166" class="mono" font-size="9" fill="#454A52">THE LADDER (7 rungs) · THE RINGS (6) · THE MEMBRANE (5 crossings)</text>
  <text x="652" y="1130" class="mono bt" font-size="10" fill="#232019">SHEET 1 / 1</text>
  <text x="652" y="1166" class="mono" font-size="9" fill="#454A52">SEAMS ①–⑭ — arch doc §5</text>
  <text x="992" y="1130" class="mono bt" font-size="10" fill="#232019">REV C</text>
  <text x="992" y="1166" class="mono" font-size="9" fill="#454A52">logical-first · deployment demoted</text>
</svg>

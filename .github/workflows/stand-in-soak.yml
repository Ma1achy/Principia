# The stand-in-executable soak (REQ-SYS-070, R-267): the tests that write a stand-in `cargo` or `gh` and run xtask
# against it, 50 consecutive runs, each test binary's tests in parallel, on ubuntu-24.04, where the fork/exec race
# (ETXTBSY, "Text file busy") shows. Not per-push: it runs on a PR that changes the spawn helper or one of these
# tests, and on demand. One job per binary, each binary with its 50 runs (RQ-688; the job below says why).
name: stand-in-soak

on:
  pull_request:
    paths:
      - crates/validation/src/spawn.rs
      - crates/validation/tests/stand_in.rs
      - xtask/tests/qa_TASK-M0-22.rs
      - xtask/tests/qa_TASK-M0-22_r235.rs
      - xtask/tests/ci.rs
      - xtask/tests/qa_TASK-M0-36.rs
      - xtask/tests/qa_TASK-M0-37.rs
      - .github/workflows/stand-in-soak.yml
  workflow_dispatch:

# A newer push to the same ref supersedes an older run, so the older run on that ref is cancelled. On `main` each
# run has a group of its own (its run id), so no run there is ever cancelled or queued behind another (applied per
# R-369).
concurrency:
  group: stand-in-soak-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # R-374: every CI job builds the dev and test profiles with line tables only. Panics and backtraces still name
  # file and line; the build, link, artefacts and caches shrink (a full-debug mutants baseline filled the runner's
  # disk). Every workflow sets the same values, so rust-cache, which hashes CARGO_* into its key, computes `ci.yml`'s
  # keys here too (R-337). R-233 (debug info at the default) governs local builds only.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  # No incremental state, the owner's CI setting (PR #394), in every workflow like R-374's values. `Swatinem/rust-cache`
  # already exports CARGO_INCREMENTAL=0 to the steps after it, and before it computes its key, so its key and every
  # build after it are the same without this line. What the line adds: the value in the steps before rust-cache, where
  # no cargo build runs and `ci.yml`'s `cachekey` hashes it, and in jobs without rust-cache, where two run cargo:
  # `ci.yml`'s `ci-release`, which builds only for the release doctests, which aren't incremental by default, and
  # `pages.yml`'s `build`, where it turns off incremental state for the dev-profile build of xtask that `cargo xtask
  # web-skeleton` starts. Local builds are unaffected (R-233).
  CARGO_INCREMENTAL: "0"

jobs:
  # `qa_m022_ci_passes_when_every_control_trips` runs the full `xtask ci`, whose golden runner renders (R-110): Mesa's
  # lavapipe, as in the ci and xtask-ci jobs (applied per R-204, RQ-168).
  #
  # One job per test binary (RQ-688; applied per R-369, under the owner's "fix the cause or split the shard"). The five
  # in series take about 5.5 times `ci_list_runs_no_control` a run, so on a runner where that test takes 85 s or more
  # the 50 runs outlast GitHub's 6 h job limit; run 41808766194, on the 74 s band, took 5 h 46. Alone, `qa_TASK-M0-22`,
  # the longest, takes 3.5 to 3.8 times it. Each job still makes all 50 runs, under the 600 s timer, in the workflow's
  # env. `fail-fast` is off, so one binary's failure doesn't stop the others' runs.
  soak:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        test:
          - qa_TASK-M0-22
          - qa_TASK-M0-22_r235
          - ci
          - qa_TASK-M0-36
          - qa_TASK-M0-37
    env:
      PRIN_GPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The toolchain rust-toolchain.toml pins, with its components: rust-gpu's nightly, on which the whole workspace
      # builds (R-169).
      - name: rustup toolchain install (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: cargo-registry
          shared-key: ci
          cache-targets: "false"
          cache-bin: "false"
          # Saved only in a run on a push to `main`, which this workflow never is, so it saves nothing (R-326). It
          # restores, read-only, the key `ci.yml`'s `ci` job saves on `main`, `cargo-registry-ci-…` (R-337).
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # Every dependency without debug info, as a cargo config in the runner's CARGO_HOME; the workspace's own crates
      # keep R-374's line tables (`.github/actions/cargo-ci-config`).
      - name: Dependencies without debug info, every profile
        uses: ./.github/actions/cargo-ci-config
      - name: Install Mesa (lavapipe)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: Build the stand-in tests
        run: cargo test -p xtask --no-run --test ${{ matrix.test }}
      # RQ-688: on run 1, `xtask ci` children side by side under `cargo test`, each with the 600 s timer, share what the
      # build step leaves cold: the build of `golden_harness`, which only the golden runner asks for, and lavapipe's
      # first compile of every shader. One golden run first, alone, with no timer on the build, in the job's env, leaves
      # both warm, and it is the very work the children's golden step does: this `target/debug/xtask` is the binary they
      # spawn, where `cargo xtask` would resolve xtask's features without its dev-dependencies and could rebuild it. The
      # 600 s timer and the 50 parallel runs stay as they are (R-649; REQ-SYS-070); applied per R-369.
      # The log gives what RQ-688's open hypotheses need: the runner's hardware, this step's time, and what the shader
      # cache holds on each side of it.
      - name: Warm up the golden harness and Mesa's shader cache, one run alone
        run: |
          lscpu
          nproc
          cache="${XDG_CACHE_HOME:-$HOME/.cache}"
          du -sh "$cache"/mesa_shader_cache* 2>/dev/null || echo "no Mesa shader cache before the warm-up"
          time target/debug/xtask golden --all
          du -sh "$cache"/mesa_shader_cache* 2>/dev/null || echo "no Mesa shader cache after the warm-up"
      - name: 50 consecutive parallel runs
        run: |
          for run in $(seq 1 50); do
            echo "::group::run $run of 50"
            cargo test -p xtask --test ${{ matrix.test }} || { echo "run $run of 50 failed"; exit 1; }
            echo "::endgroup::"
          done
          echo "stand-in soak: 50 consecutive parallel runs passed"

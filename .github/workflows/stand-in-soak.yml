# The stand-in-executable soak (REQ-SYS-070, R-267): the tests that write a stand-in `cargo` or `gh` and run xtask
# against it, 50 consecutive runs, each test binary's tests in parallel, on ubuntu-latest, where the fork/exec race
# (ETXTBSY, "Text file busy") shows. Not per-push: it runs on a PR that changes the spawn helper or one of these
# tests, and on demand.
name: stand-in-soak

on:
  pull_request:
    paths:
      - crates/validation/src/spawn.rs
      - crates/validation/tests/stand_in.rs
      - xtask/tests/qa_TASK-M0-22.rs
      - xtask/tests/qa_TASK-M0-22_r235.rs
      - xtask/tests/ci.rs
      - xtask/tests/qa_TASK-M0-36.rs
      - xtask/tests/qa_TASK-M0-37.rs
      - .github/workflows/stand-in-soak.yml
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # R-374: every CI job builds the dev and test profiles with line tables only. Panics and backtraces still name
  # file and line; the build, link, artefacts and caches shrink (a full-debug mutants baseline filled the runner's
  # disk). Every workflow sets the same values, so rust-cache, which hashes CARGO_* into its key, computes `ci.yml`'s
  # keys here too (R-337). R-233 (debug info at the default) governs local builds only.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  # `qa_m022_ci_passes_when_every_control_trips` runs the full `xtask ci`, whose golden runner renders (R-110): Mesa's
  # lavapipe, as in the ci and xtask-ci jobs (applied per R-204, RQ-168).
  soak:
    runs-on: ubuntu-latest
    env:
      PRIN_GPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v4
      # The toolchain rust-toolchain.toml pins, with its components: rust-gpu's nightly, on which the whole workspace
      # builds (R-169).
      - name: rustup toolchain install (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: cargo-registry
          shared-key: ci
          cache-targets: "false"
          cache-bin: "false"
          # Saved only in a run on a push to `main`, which this workflow never is, so it saves nothing (R-326). It
          # restores, read-only, the key `ci.yml`'s `ci` job saves on `main`, `cargo-registry-ci-…` (R-337).
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Install Mesa (lavapipe)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: Build the stand-in tests
        run: >-
          cargo test -p xtask --no-run --test qa_TASK-M0-22 --test qa_TASK-M0-22_r235 --test ci
          --test qa_TASK-M0-36 --test qa_TASK-M0-37
      - name: 50 consecutive parallel runs
        run: |
          for run in $(seq 1 50); do
            echo "::group::run $run of 50"
            cargo test -p xtask --test qa_TASK-M0-22 --test qa_TASK-M0-22_r235 --test ci \
              --test qa_TASK-M0-36 --test qa_TASK-M0-37 || { echo "run $run of 50 failed"; exit 1; }
            echo "::endgroup::"
          done
          echo "stand-in soak: 50 consecutive parallel runs passed"

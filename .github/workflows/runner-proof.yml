# The weekly proof of the sandbox on the owner's Windows PC, `malachys-pc-rtx2080s` (the owner, 5 Nov 2026; #390): the
# PC's own `03-sandbox-proof.ps1` runs again as `gh-runner`, through the service, an hour after the PC's 04:00 update
# task. It prints counts only, the detail staying on the PC, and its exit code is the failure count. The result is a
# measurement, never a required check (R-649, R-711): the PC is sometimes off, and nothing on `main` waits for it. No
# job here is gathered, retried or read by any gate, and a red one is not main red; `xtask/tests/ci_self_hosted.rs`
# fails if that ever stops holding, or if a rule below is broken.
#
# The rules are `win-gpu.yml`'s, the conditions for having this runner at all on a public repository (R-711 items 1 and
# 5, the owner's job rules of 5 Nov 2026). Never add a `pull_request` or `pull_request_target` trigger. The job carries
# the repository and actor guard. No credential reaches it: `contents: read` and no repository secret. It uses no action
# and no checkout, so it needs neither the `.git` guard nor a record: the PC keeps the detail. With no push trigger
# there is no push for a paths filter to skip. The PC's hook runs the self-check before any step, here as in every job.
#
# What `github.actor` is on a `schedule` run is still to be read from a real run (R-711 item 6: the commit signature is
# the primary gate there, the actor check secondary). The guard is `win-gpu.yml`'s, so if it isn't Ma1achy the job is
# skipped, and the first Sunday's run shows it.
name: runner-proof

on:
  schedule:
    - cron: "0 5 * * 0"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    # As in `win-gpu.yml`: plain `shell: powershell` is refused here, and with -File a step's result comes from its
    # own exit. The script starts as a child `powershell -File`, which sets $LASTEXITCODE even if it can't load or
    # parse.
    shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}

env:
  # R-374 and the owner's CI setting (PR #394), as in every workflow. Nothing here runs cargo.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  CARGO_INCREMENTAL: "0"

jobs:
  runner-proof:
    if: github.repository == 'Ma1achy/Principia' && github.actor == 'Ma1achy'
    runs-on: [self-hosted, windows, nvidia]
    timeout-minutes: 30
    concurrency:
      group: runner-proof
      cancel-in-progress: false
    steps:
      - name: Sandbox proof
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File E:\runner-tools\setup\03-sandbox-proof.ps1 -Job
          exit $LASTEXITCODE

# `cargo xtask pr-check` (REQ-SYS-006, REQ-VAL-001, REQ-VAL-005, REQ-VAL-008): the PR description answers every
# section its labels (design, investigation, validation) make mandatory. It re-runs when the description is edited
# and when a reviewer relabels.
name: pr-check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

# A newer run on the same ref (a push, an edit or a relabel) supersedes an older one, so the older run on that ref
# is cancelled. On `main` each run has a group of its own (its run id), so no run there is ever cancelled or queued
# behind another (applied per R-369).
concurrency:
  group: pr-check-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# rust-cache hashes the environment's CARGO_* variables into its key: set as in `ci.yml`, so the `ci` job's key, which
# this workflow restores (R-337), is the key computed here.
env:
  CARGO_TERM_COLOR: always
  # R-374: every CI job builds the dev and test profiles with line tables only. Panics and backtraces still name
  # file and line; the build, link, artefacts and caches shrink (a full-debug mutants baseline filled the runner's
  # disk). Every workflow sets the same values, so rust-cache, which hashes CARGO_* into its key, computes `ci.yml`'s
  # keys here too (R-337). R-233 (debug info at the default) governs local builds only.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  # No incremental state, the owner's CI setting (PR #394), in every workflow like R-374's values. `Swatinem/rust-cache`
  # already exports CARGO_INCREMENTAL=0 to the steps after it, and before it computes its key, so its key and every
  # build after it are the same without this line. What the line adds: the value in the steps before rust-cache, where
  # no cargo build runs and `ci.yml`'s `cachekey` hashes it, and in jobs without rust-cache, where only `ci.yml`'s
  # `ci-release` runs cargo and it builds only for the release doctests, which aren't incremental by default. Local
  # builds are unaffected (R-233).
  CARGO_INCREMENTAL: "0"

jobs:
  pr-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The toolchain rust-toolchain.toml pins, with its components: rust-gpu's nightly, on which the whole workspace
      # builds (R-169).
      - name: rustup toolchain install (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: cargo-registry
          shared-key: ci
          cache-targets: "false"
          cache-bin: "false"
          # Saved only in a run on a push to `main`, which this workflow never is, so it saves nothing (R-326). It
          # restores, read-only, the key `ci.yml`'s `ci` job saves on `main`, `cargo-registry-ci-…` (R-337).
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # Every dependency without debug info, as a cargo config in the runner's CARGO_HOME; the workspace's own crates
      # keep R-374's line tables (`.github/actions/cargo-ci-config`).
      - name: Dependencies without debug info, every profile
        uses: ./.github/actions/cargo-ci-config
      - name: cargo xtask pr-check
        run: cargo xtask pr-check

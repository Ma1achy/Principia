# The v1 web skeleton's deploy to GitHub Pages (TASK-M8-86, R-627): by hand only, `gh workflow run pages.yml --ref main`,
# from `main` only, through the `github-pages` environment, until the human says v1 is ready to be found. No push,
# pull_request, schedule or other trigger; `cargo test -p xtask pages_workflow_manual` checks it (REQ-TOOL-220).
name: pages

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # R-374: every CI job builds the dev and test profiles with line tables only; every workflow sets the same values.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  # No incremental state, the owner's CI setting (PR #394), in every workflow like R-374's values. This workflow has no
  # rust-cache to export it, so this line is what sets it for `cargo xtask web-skeleton`.
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The toolchain rust-toolchain.toml pins, and the wasm target this workflow alone and `ci.yml`'s `web-skeleton` need.
      - name: rustup toolchain install (rust-toolchain.toml)
        run: rustup toolchain install && rustup target add wasm32-unknown-unknown
      # Every dependency without debug info, as a cargo config in the runner's CARGO_HOME; the workspace's own crates
      # keep R-374's line tables (`.github/actions/cargo-ci-config`).
      - name: Dependencies without debug info, every profile
        uses: ./.github/actions/cargo-ci-config
      # The version `xtask::web_skeleton::WASM_BINDGEN_VERSION` pins; a test checks the two agree.
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: wasm-bindgen-cli@0.2.129
      - name: cargo xtask web-skeleton
        run: cargo xtask web-skeleton --out _site
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

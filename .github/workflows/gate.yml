# The milestone gate (R-177, R-186; REQ-SYS-067; TASK-M0-19): dispatched by hand with the milestone, it runs every
# hosted suite, the CPU suites (the workspace's tests and `cargo xtask ci`), the GPU suites on `macos-15` (Metal) and on
# lavapipe, and `cargo xtask screenshot --all`, then writes the gate report: `cargo xtask gate-report --milestone <Mn>`
# lists every requirement in that milestone's gate block and every earlier one (`plan/MILESTONES.md`) with its result,
# and the report is uploaded as an artifact. Benchmarks and performance gates never run here: they run on the human's
# own Mac via `prin profile`, and the report marks each benchmark requirement "awaiting the human's run" until its file
# is supplied to `gate-report --bench-results <dir>` (R-186).
#
# Each requirement's result is its verification method's suites' (RQ-201, decided per R-369): a unit test, property
# test or numerical gate passes when the CPU suites pass; a golden image when both GPU suites pass; a GUI screenshot when
# the screenshot suite passes. A review-checklist requirement passes when the task that closes it has a merged PR on
# whose head every reviewer its task file names has approved (R-175, R-260), which `gate-report` reads through `gh`, so
# the gate-report job reads the repository's pull requests with the workflow's token.
#
# Runner disk and caches as in `nightly.yml`: each Linux job that builds the workspace's tests deletes the toolsets it
# does not use first (TASK-M0-49), and this workflow, never run on a push to `main`, saves no cache and restores
# `ci.yml`'s keys read-only (R-285, R-326, R-337): the cargo registry under the `ci` job's key, `cargo-registry-ci-…`,
# and the rust-gpu build under the `gpu-kernel` job's, `rust-gpu-gpu-kernel-<os>-<channel>`. rust-cache hashes the
# environment's CARGO_* variables into its key, so CARGO_TERM_COLOR is set as in `ci.yml`.
name: gate

on:
  workflow_dispatch:
    inputs:
      milestone:
        description: "The milestone whose gate to run: M0 to M8"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The CPU suites, as `ci.yml`'s `ci` job runs them.
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
          sudo docker image prune --all --force > /dev/null
          df -h /
      # The toolchain rust-toolchain.toml pins, with its components: rust-gpu's nightly, on which the whole workspace
      # builds (R-169).
      - name: rustup toolchain install (rust-toolchain.toml)
        run: rustup toolchain install
      # The cargo registry `ci.yml`'s `ci` job saves on a push to `main`, restored read-only under its key (R-337).
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: cargo-registry
          shared-key: ci
          cache-targets: "false"
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: python3 -m pip install pyyaml
      - name: Install Mesa (lavapipe)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146
      - name: cargo nextest run --workspace
        env:
          PRIN_GPU_BACKEND: vulkan
          NEXTEST_PROFILE: ci
        run: cargo nextest run --workspace
      - name: cargo test --workspace --doc
        run: cargo test --workspace --doc
      - name: cargo xtask deps
        run: cargo xtask deps

  # `cargo xtask ci`, every registered per-push runner (R-177).
  xtask-ci:
    runs-on: ubuntu-latest
    env:
      PRIN_GPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
          sudo docker image prune --all --force > /dev/null
          df -h /
      # The toolchain rust-toolchain.toml pins, with its components: rust-gpu's nightly, on which the whole workspace
      # builds (R-169).
      - name: rustup toolchain install (rust-toolchain.toml)
        id: toolchain
        run: |
          rustup toolchain install
          echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      # The cargo registry `ci.yml`'s `ci` job saves on a push to `main`, restored read-only under its key (R-337).
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: cargo-registry
          shared-key: ci
          cache-targets: "false"
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # The rust-gpu build, restored read-only under the key `ci.yml`'s `gpu-kernel` job saves it under on a push to
      # `main` (R-320, R-337; REQ-SYS-075); never saved here.
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/rust-gpu
          key: rust-gpu-gpu-kernel-${{ runner.os }}-${{ steps.toolchain.outputs.channel }}
      - name: Install Mesa (lavapipe)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: python3 -m pip install pyyaml
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146
      - name: cargo xtask ci
        run: cargo xtask ci

  # GitHub-hosted Apple silicon, paravirtual Metal: the Metal correctness suites (R-169, R-186), as in `ci.yml`.
  gpu-metal:
    runs-on: macos-15
    env:
      PRIN_GPU_BACKEND: metal
    steps:
      - uses: actions/checkout@v4
      # The toolchain rust-toolchain.toml pins, with its components: rust-gpu's nightly, on which the whole workspace
      # builds (R-169).
      - name: rustup toolchain install (rust-toolchain.toml)
        run: rustup toolchain install
      # The cargo registry `ci.yml`'s `ci` job saves on a push to `main`, restored read-only under its key (R-337).
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: cargo-registry
          shared-key: ci
          cache-targets: "false"
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146
      - name: cargo nextest run -p validation --features controls metal_hosted_probe
        run: cargo nextest run -p validation --features controls metal_hosted_probe --no-capture
      - name: cargo test -p validation --features controls metal_hosted_probe --doc
        run: cargo test -p validation --features controls metal_hosted_probe --doc
      - name: cargo nextest run -p validation --features controls gpu_harness
        run: cargo nextest run -p validation --features controls gpu_harness --no-capture
      - name: cargo test -p validation --features controls gpu_harness --doc
        run: cargo test -p validation --features controls gpu_harness --doc
      - name: cargo xtask golden --all
        run: cargo xtask golden --all
      - name: cargo nextest run -p xtask --features controls golden_halfway
        run: cargo nextest run -p xtask --features controls golden_halfway --no-capture
      - name: cargo test -p xtask --features controls golden_halfway --doc
        run: cargo test -p xtask --features controls golden_halfway --doc

  # The lavapipe GPU suites (R-110, R-169, R-186), as `nightly.yml`'s `gpu-lavapipe` job runs them.
  gpu-lavapipe:
    runs-on: ubuntu-latest
    env:
      PRIN_GPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
          sudo docker image prune --all --force > /dev/null
          df -h /
      # The toolchain rust-toolchain.toml pins, with its components: rust-gpu's nightly, on which the whole workspace
      # builds (R-169).
      - name: rustup toolchain install (rust-toolchain.toml)
        id: toolchain
        run: |
          rustup toolchain install
          echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      # The cargo registry `ci.yml`'s `ci` job saves on a push to `main`, restored read-only under its key (R-337).
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: cargo-registry
          shared-key: ci
          cache-targets: "false"
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # The rust-gpu build, restored read-only under the key `ci.yml`'s `gpu-kernel` job saves it under on a push to
      # `main` (R-320, R-337; REQ-SYS-075); never saved here.
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/rust-gpu
          key: rust-gpu-gpu-kernel-${{ runner.os }}-${{ steps.toolchain.outputs.channel }}
      - name: Install Mesa (lavapipe)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146
      - name: cargo xtask build-kernel
        run: cargo xtask build-kernel
      - name: cargo nextest run -p validation -p xtask
        env:
          NEXTEST_PROFILE: gpu-kernel
        run: cargo nextest run -p validation -p xtask
      - name: cargo test -p validation -p xtask --doc
        run: cargo test -p validation -p xtask --doc
      - name: cargo nextest run -p validation --features controls gpu_harness
        run: cargo nextest run -p validation --features controls gpu_harness --no-capture
      - name: cargo test -p validation --features controls gpu_harness --doc
        run: cargo test -p validation --features controls gpu_harness --doc
      - name: cargo xtask golden --all
        run: cargo xtask golden --all
      - name: cargo nextest run -p xtask --features controls golden_halfway
        run: cargo nextest run -p xtask --features controls golden_halfway --no-capture
      - name: cargo test -p xtask --features controls golden_halfway --doc
        run: cargo test -p xtask --features controls golden_halfway --doc

  # Every GUI screenshot suite (R-110, R-129), as `screenshot.yml` runs it, its captures uploaded.
  screenshot:
    runs-on: ubuntu-latest
    env:
      PRIN_GPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v4
      # The toolchain rust-toolchain.toml pins, with its components: rust-gpu's nightly, on which the whole workspace
      # builds (R-169).
      - name: rustup toolchain install (rust-toolchain.toml)
        run: rustup toolchain install
      # The cargo registry `ci.yml`'s `ci` job saves on a push to `main`, restored read-only under its key (R-337).
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: cargo-registry
          shared-key: ci
          cache-targets: "false"
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Install Mesa (lavapipe)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: cargo xtask screenshot --all
        run: cargo xtask screenshot --all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-screenshots
          path: target/screenshot/
          if-no-files-found: ignore

  # The gate report (R-177): after every suite, whatever their results. Each requirement's result is its verification
  # method's suites', or, for a review-checklist requirement, its closing task's merged PR's approvals (RQ-201, decided
  # per R-369); the report fails when any requirement failed or has no result, and is uploaded either way.
  gate-report:
    if: always()
    needs: [cpu, xtask-ci, gpu-metal, gpu-lavapipe, screenshot]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      # The toolchain rust-toolchain.toml pins, with its components: rust-gpu's nightly, on which the whole workspace
      # builds (R-169).
      - name: rustup toolchain install (rust-toolchain.toml)
        run: rustup toolchain install
      # The cargo registry `ci.yml`'s `ci` job saves on a push to `main`, restored read-only under its key (R-337).
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: cargo-registry
          shared-key: ci
          cache-targets: "false"
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: python3 -m pip install pyyaml
      - name: The suites' results, by requirement
        env:
          CPU: ${{ needs.cpu.result == 'success' && needs.xtask-ci.result == 'success' }}
          GPU: ${{ needs.gpu-metal.result == 'success' && needs.gpu-lavapipe.result == 'success' }}
          SCREENSHOT: ${{ needs.screenshot.result == 'success' }}
        run: |
          python3 - <<'EOF'
          import json, os, yaml
          suites = {"unit test": "CPU", "property test": "CPU", "numerical gate": "CPU",
                    "golden image": "GPU", "GUI screenshot": "SCREENSHOT"}
          results = {}
          for req in yaml.safe_load(open("plan/requirements.yaml")):
              suite = suites.get(req.get("verify", {}).get("method"))
              if suite:
                  results[req["id"]] = "pass" if os.environ[suite] == "true" else "fail"
          json.dump(results, open(os.path.join(os.environ["RUNNER_TEMP"], "results.json"), "w"), indent=1)
          EOF
      # `gh`, preinstalled on the runner, lists the PRs and reads each merged task PR's reviews with this token.
      - name: cargo xtask gate-report --milestone <Mn>
        env:
          MILESTONE: ${{ inputs.milestone }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: cargo xtask gate-report --milestone "$MILESTONE" --results "$RUNNER_TEMP/results.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-report
          path: target/gate-report/
          if-no-files-found: ignore

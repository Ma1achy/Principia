# The per-PR mutation gate (R-196, R-202, R-302; TASK-M0-23): `cargo mutants --in-diff` on each pull request's diff,
# sharded, with `mutants-check` its verdict over every shard, a required status check on `main` (R-305). It is a
# workflow of its own, which only `pull_request` runs: in `ci.yml`, which `push` runs too, the push run would report a
# skipped `mutants-check`, and GitHub counts a skipped required check as passed. The jobs keep their `if:` on the
# event, which always holds here. Caches (R-285, R-337): this workflow never runs on a push to `main`, where alone a
# cache is saved (R-326), so a key of its own would find nothing. Each job restores, read-only, a key a `ci.yml` job
# saves on `main`: the cargo registry under the `ci` job's key, `cargo-registry-ci-…`, and, in `mutants-baseline` and
# `mutants`, which build the kernel, the rust-gpu build under the `gpu-kernel` job's key,
# `rust-gpu-gpu-kernel-<os>-<channel>` (R-320).
# None saves: rust-cache's `save-if` holds only on a push to `main`, and there is no save step. rust-cache hashes the
# environment's CARGO_* variables into its key, so CARGO_TERM_COLOR below is set as in `ci.yml`.
#
# Mutants run on the merge-ready head (R-656, R-676): the baseline, the shards, the fixture and the verdict run only
# when the `merge-ready` label is put on the pull request, which the orchestrator's merge watcher does once every
# reviewer the task names has approved the head (`plan/OPERATIONS.md` § "The merge-ready label"). A push to the pull
# request takes the label off (`mutants-pending`), so the gate runs again only on a head approved again, and cancels a
# run on the head it supersedes (`concurrency` below).
#
# `mutants-check` is a job of every run of this workflow, `if: always()`, so it is never skipped (R-678). Branch
# protection counts, of each workflow's runs on a head, only the latest run's check suite, as #384 and #386 showed: a
# later run of the same workflow (a label's) supersedes an earlier run's suite and every check in it. A check run
# posted through the Checks API with a run's token joins a suite GitHub picks, not the posting run's, and counts only
# while that suite is still its workflow's latest (#384: two `mutants-check` runs passed in the push run's suite, which
# the merge-ready run's had superseded, and the merge read "expected"; #386: the one posted joined `reviews`'s suite,
# the latest of that workflow, and counted). So each run reports `mutants-check` itself, as a job:
# - the merge-ready run (the `merge-ready` label's): the verdict over every shard, success or failure;
# - a change with no `.rs` file under `crates/` (R-677: `scripts/ci_changes.sh`'s `mutants`), whose diff has no mutant
#   the gate runs: success, "not applicable", exactly the verdict the shards would reach;
# - a head that is not merge-ready (a push, which takes the label off, or a label event with the label absent): success,
#   "not applicable" (the owner, 3 Nov 2026); its merge-ready run reports the real verdict once the label goes on;
# - another label put on or taken off a merge-ready head: the verdict of that head's merge-ready run, waited for.
# Mutants run only when `crates/` source changes (R-677); xtask's own code is mutated by the nightly full run.
name: mutants

# `labeled` starts the merge-ready run; `opened`, `synchronize` and `reopened`, GitHub's defaults, run on each new head;
# `labeled` and `unlabeled` on every label change, so every run that supersedes this workflow's last one on the head
# reports `mutants-check` again (R-678). No `paths:` or `branches:` filter: every pull request reaches the gate.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

# A newer push to the same ref supersedes an older run, so the older run on that ref is cancelled: a push cancels the
# merge-ready run on the head it supersedes. On `main` each run has a group of its own (its run id), so no run there is
# ever cancelled or queued behind another (applied per R-369). A pull request's runs share one group, its merge ref's,
# but for a run started by any label other than `merge-ready`, put on or taken off, and a run started by reopening the
# pull request: such a run changes no head, only reports `mutants-check`, and has a group of its own (its run id), so it
# never cancels the merge-ready run (reopening a merge-ready pull request mid-run would otherwise cancel that run, and
# every later `mutants-check` on the head would read its cancelled verdict). Taking `merge-ready` off cancels its run.
concurrency:
  group: >-
    mutants-${{ github.event_name }}-${{ (github.ref == 'refs/heads/main'
    || github.event.action == 'reopened'
    || ((github.event.action == 'labeled' || github.event.action == 'unlabeled')
    && github.event.label.name != 'merge-ready'))
    && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # R-374: every CI job builds the dev and test profiles with line tables only. Panics and backtraces still name
  # file and line; the build, link, artefacts and caches shrink (a full-debug mutants baseline filled the runner's
  # disk). Every workflow sets the same values, so rust-cache, which hashes CARGO_* into its key, computes `ci.yml`'s
  # keys here too (R-337). R-233 (debug info at the default) governs local builds only.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  # No incremental state, the owner's CI setting (PR #394), in every workflow like R-374's values. `Swatinem/rust-cache`
  # already exports CARGO_INCREMENTAL=0 to the steps after it, and before it computes its key, so its key and every
  # build after it are the same without this line. What the line adds: the value in the steps before rust-cache, where
  # no cargo build runs and `ci.yml`'s `cachekey` hashes it, and in jobs without rust-cache, where only `ci.yml`'s
  # `ci-release` runs cargo and it builds only for the release doctests, which aren't incremental by default. Local
  # builds are unaffected (R-233).
  CARGO_INCREMENTAL: "0"

jobs:
  # A push takes the `merge-ready` label off, since the reviewers approved the head it supersedes: the gate runs again
  # only once the new head is approved and labelled again.
  merge-ready-off:
    if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - name: Take the merge-ready label off the pushed pull request
        if: >-
          github.event.action == 'synchronize'
          && contains(github.event.pull_request.labels.*.name, 'merge-ready')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        # The payload lists the labels as they were when the push fired: after two quick pushes, the second's still
        # lists the label the first's run took off, and GitHub answers 404 (`gh` prints "HTTP 404"). The label is off
        # then, which is what this step is for, so a 404 passes; any other error fails the step. This run's
        # `mutants-check` reports whatever this step ends in.
        run: |
          set -uo pipefail
          if err=$(gh api --method DELETE "repos/$GH_REPO/issues/$PR/labels/merge-ready" 2>&1 > /dev/null); then
            echo "#$PR: merge-ready taken off; the gate runs again once the new head is approved and labelled"
          elif grep -q 'HTTP 404' <<< "$err"; then
            echo "#$PR: merge-ready already off, taken off by an earlier push's run ($err)"
          else
            echo "$err" >&2
            exit 1
          fi
  # The per-PR mutation gate (R-196, R-202; TASK-M0-23): `cargo mutants --in-diff` on the PR's diff against its base, on
  # pull requests only, since `--in-diff` needs a base. The run is sharded across n parallel jobs, shard k of n each
  # (`--shard k/n`), each under its own time limit (R-302), after the one baseline `mutants-baseline`, below, measures
  # for them all; the nightly full run (TASK-M0-19) is the backstop. Every shard computes the same diff and reads the
  # same exclusions, `.cargo/mutants.toml`'s, shared with the nightly run. Each shard lists its surviving mutants and
  # fails on any not in `.cargo/mutants-equivalent.toml`; `mutants-check` below then checks every shard's report
  # together, and fails if any shard failed or was cut off by its limit. `mutants-fixture` shows, on
  # `fixtures/mutants/untested/`, that the gate can fire.
  # Every step has a limit of its own, so a stalled one fails the shard in minutes. The job has none: a job limit can't
  # tell a stall from REQ-VAL-149's 300 minutes for cargo mutants, and a stall would run to GitHub's 360 for the job.
  # The limits (applied per R-369) are about three times the longest of each step in this workflow's last 60 runs
  # (3 Nov 2026), rounded up: a checkout 10 minutes (its longest 189 s); freeing the disk 20 (359 s); the kernel's
  # build 20, from its cold build, 364 s, not its warm longest, 106 s (its comment below); a cache restore, the
  # toolchain install and every other step 5 (the longest among them 34 s, the Mesa install). The job queue's tests
  # ran in none of those runs: 10 minutes, their longest 107 s in PR #355's, the last pull request to change the queue.
  # The kernel's build is the one step here with a slow cold-cache path. A toolchain bump also misses the cargo
  # registry's cache (rust-cache's key carries the rustc version), and then each cargo step first downloads its crates:
  # the whole workspace's 248 took under 3 s in `ci.yml`'s ci job on run 36922052435, whose registry restore found
  # nothing, well inside every limit. The toolchain, the tools, Python and Mesa are fetched afresh in every run, and
  # the fixtures have no dependencies, so the times above already are their cold times.
  mutants:
    if: github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'merge-ready'
    runs-on: ubuntu-24.04
    needs: mutants-baseline
    # statuses: the heartbeat of a shard's run (`scripts/contain.sh`).
    permissions:
      contents: read
      statuses: write
    env:
      PRIN_GPU_BACKEND: vulkan
    strategy:
      # Every shard runs to its end, so the report names every survivor, not only the first shard's.
      fail-fast: false
      matrix:
        # REQ-VAL-149: n = 8 shards, k = 0..7 (cargo-mutants counts shards from 0), confirmed by the human at the M0
        # gate (R-376; R-71, R-302). A change to n changes this list and `--shard k/8` below.
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 10
        with:
          fetch-depth: 0
      # cargo-mutants mutates only Rust source, so a diff that names no `.rs` file has no mutant (cargo-mutants itself
      # then stops at once: "Diff changes no Rust source files", exit 0). Mutants run only when `crates/` source changes
      # (R-677), so a shard whose diff names no `.rs` file under `crates/`, a docs, plan or xtask-only PR's, skips its
      # setup and its run and passes, so `mutants-check` reports on it at once (R-305). A diff naming any `.rs` file
      # under `crates/`, even one cargo-mutants won't mutate, runs the shard in full, on the whole diff.
      - name: git diff origin/${{ github.base_ref }}...HEAD
        id: diff
        timeout-minutes: 5
        run: |
          git diff "origin/${{ github.base_ref }}...HEAD" > "$RUNNER_TEMP/pr.diff"
          echo "PR diff: $(wc -l < "$RUNNER_TEMP/pr.diff") lines"
          if grep -E '^\+\+\+ "?b/crates/.*\.rs"?[[:space:]]*$' "$RUNNER_TEMP/pr.diff" > /dev/null; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
            echo "cargo mutants: no mutant in this shard of the PR's diff: it changes no Rust source (.rs) under crates/"
          fi
      # Runner disk: the pinned nightly with rustc-dev and llvm-tools (R-169), the rust-gpu build, the workspace's
      # build and, when the diff mutates xtask, the baseline's fixture targets (each a wgpu build of its own under
      # target/tmp/fixture-targets) ran ubuntu-24.04 out of space in the baseline. Remove the preinstalled toolsets
      # this job does not use (.NET, Android, GHC, the hosted tool cache, the docker images), logging the free space
      # before and after, as `ci.yml`'s `ci` job does. setup-python, below, fetches its Python afresh. Test
      # infrastructure only; a shard with no Rust in its diff skips it.
      # Those left 112G free of the root disk's 145G, and PR #303's baseline still filled it (run 40581119007: every
      # shard out of space, or a link killed by SIGBUS, with 3303 tests of kernel, ledger, render, validation and xtask
      # to run). The runner has no second disk to move `target/` to (ubuntu-24.04: one 150G disk, `/mnt` on the root
      # filesystem), so the rest of what this job never uses goes too: Swift, PowerShell, Chromium, the global node
      # modules, the Azure, Google Cloud and AWS CLIs, Microsoft's and Google's /opt trees, pipx, the JVMs, Miniconda,
      # Julia, vcpkg, Firefox and Kotlin; docker's build cache and volumes with its images; and the 3G swap file, which
      # the job does not need with 16G of memory: 129G free after it, about 17 s more (measured on the image of 25 Oct).
      - name: Free runner disk
        if: steps.diff.outputs.rust == 'true'
        timeout-minutes: 20
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
          sudo rm -rf /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/node_modules \
            /opt/az /opt/microsoft /opt/google /opt/pipx /usr/lib/jvm /usr/share/miniconda /usr/local/julia* \
            /usr/local/share/vcpkg /usr/lib/google-cloud-sdk /usr/lib/firefox /usr/share/az_* /usr/local/aws-cli \
            /usr/local/aws-sam-cli /usr/share/kotlinc
          sudo docker system prune --all --force --volumes > /dev/null
          sudo swapoff -a
          sudo rm -f /swapfile
          df -h /
      # The toolchain rust-toolchain.toml pins, with its components: rust-gpu's nightly, on which the whole workspace
      # builds (R-169).
      - name: rustup toolchain install (rust-toolchain.toml)
        id: toolchain
        if: steps.diff.outputs.rust == 'true'
        timeout-minutes: 5
        run: |
          rustup toolchain install
          echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      # The cargo registry `ci.yml`'s `ci` job saves on a push to `main`, restored read-only under its key (R-337).
      - uses: Swatinem/rust-cache@v2
        if: steps.diff.outputs.rust == 'true'
        timeout-minutes: 5
        with:
          prefix-key: cargo-registry
          shared-key: ci
          cache-targets: "false"
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # Every dependency without debug info, as a cargo config in the runner's CARGO_HOME; the workspace's own crates
      # keep R-374's line tables (`.github/actions/cargo-ci-config`).
      - name: Dependencies without debug info, every profile
        if: steps.diff.outputs.rust == 'true'
        timeout-minutes: 1
        uses: ./.github/actions/cargo-ci-config
      # The rust-gpu build, the `rustc_codegen_spirv` backend cargo-gpu's installer builds into ~/.cache/rust-gpu,
      # restored read-only under the key `ci.yml`'s `gpu-kernel` job saves it under on a push to `main`: that job and the
      # channel rust-toolchain.toml pins, so a toolchain bump starts a fresh cache (R-320, R-337; REQ-SYS-075). Restored
      # in every run that builds the kernel; never saved here.
      - uses: actions/cache/restore@v4
        if: steps.diff.outputs.rust == 'true'
        with:
          path: ~/.cache/rust-gpu
          key: rust-gpu-gpu-kernel-${{ runner.os }}-${{ steps.toolchain.outputs.channel }}
        timeout-minutes: 5
      - uses: taiki-e/install-action@v2
        if: steps.diff.outputs.rust == 'true'
        timeout-minutes: 5
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest@0.9.146
      # cargo-nextest runs every mutant's tests (`test_tool` in `.cargo/mutants.toml`, R-388 item 4), and
      # `xtask/tests/nextest.rs` (R-231).
      # What the mutated packages' tests need, as in the per-push jobs: Python and PyYAML for xtask's plan_check
      # tests (TASK-M0-02), lavapipe for the GPU harness (R-169).
      - uses: actions/setup-python@v5
        if: steps.diff.outputs.rust == 'true'
        timeout-minutes: 5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        if: steps.diff.outputs.rust == 'true'
        timeout-minutes: 5
        run: python3 -m pip install pyyaml
      - name: Install Mesa (lavapipe)
        if: steps.diff.outputs.rust == 'true'
        timeout-minutes: 5
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      # Debug info: line tables only, set for the whole workflow (R-374). The baseline's full debug info filled the
      # runner: `target/` reached 110G, 75G of it the test binaries, each linking wgpu, and 22G the alias test's own
      # build, until a link in a test's child build died with SIGBUS (the linker writes its output through a memory
      # map, which a full disk faults). With line tables only the baseline peaks at 46G of `target/` and passes. Every
      # cargo a test spawns inherits the variables, so the fixture and alias builds shrink alike.
      # The linker also compresses each binary's debug sections (zlib), as `ci.yml`'s `ci-archive` does: the same line
      # tables, in fewer bytes. PR #303's baseline, rerun on its own after the free-disk step above (run 40622137981),
      # peaked at 130G of the disk's 145G used without it, 14G from full, and at 73G with it (`target/debug` 97G
      # against 44G: the tests that run cargo on the workspace build into it), at about a third more wall-clock time
      # (4536 s against 5996 s; both passed all 3303 tests).
      # Every cargo a test spawns inherits RUSTFLAGS too. It is set on each step that builds, so no step rebuilds
      # another's output, and never on the job: rust-cache, which computed its key in its own step, never sees it. An
      # environment RUSTFLAGS overrides `.cargo/config.toml`'s rustflags, so it names the native build's
      # `-Zmir-enable-passes=-GVN` itself (R-547, REQ-TOOL-188). Test infrastructure only.
      # The kernel's SPIR-V and WGSL, which the baseline's and each mutant's `toolchain_trivial_kernel` and xtask's
      # `build_kernel` tests read (TASK-M0-14): `cargo xtask build-kernel`, written as the cargo call the alias expands
      # to (.cargo/config.toml), since it is setup for the tests, like the Mesa install, not one of the gate's checks.
      # Its limit, 20 minutes, is sized on the cold build, not the warm 106 s above: a toolchain bump starts a fresh
      # rust-gpu cache (the restore's comment above), and the step then builds `rustc_codegen_spirv` from source. The
      # cold builds on record took 364 s (`ci.yml`'s gpu-kernel, run 36922052435) and 360 s (gpu-lavapipe, run
      # 37032439991); three times 364 s, rounded up. Sized on the warm case, a cold build past its limit would fail
      # every shard of the toolchain bump, and the cache is saved only on `main`, so that PR could never pass.
      - name: cargo run --quiet --package xtask -- build-kernel
        if: steps.diff.outputs.rust == 'true'
        timeout-minutes: 20
        env:
          RUSTFLAGS: -C link-arg=-Wl,--compress-debug-sections=zlib -Zmir-enable-passes=-GVN
        run: cargo run --quiet --package xtask -- build-kernel
      # Each shard runs its share of the diff's mutants, dealt round-robin so that one file's mutants, whose tests cost
      # alike, spread over the shards. It runs no baseline: `mutants-baseline` ran the tests of every package the diff
      # mutates, before any shard started, and a shard reaches here only if they passed (`--baseline=skip`). Each mutant
      # runs its own package's tests, through cargo-nextest (`.cargo/mutants.toml`, R-388 item 4). The first mutant of
      # each package also does the build the baseline used to warm: 115-194 s on PR #360, with no limit, since
      # `--timeout` binds only a mutant's tests. The limit is on this step, so the shard's partial report is still
      # uploaded when it is hit, and the step then fails.
      # The run's two caps (R-348) come from `.cargo/mutants.toml`, as the nightly run's and a local run's do; the human
      # confirmed both at the M0 gate (R-376; R-71), and the owner's order of 5 Nov 2026 (R-712, on the port) amends the
      # first:
      # - the per-mutant timeout (REQ-VAL-180), `timeout_multiplier` and `minimum_test_timeout`, applied to the measured
      #   baseline by `cargo xtask mutants-timeout` and given here as `--timeout`, since a skipped baseline leaves
      #   cargo-mutants nothing to multiply: a mutant whose tests hang is recorded as a timeout, and the shard goes on
      #   to its next mutant. A timeout counts as caught, and the verdict lists each one;
      # - the per-process memory cap (REQ-VAL-181), `prlimit --as` (core dumps off) as nextest's runner on Linux: each
      #   test process of the baseline and of every mutant runs under it, and an allocation past it kills that test,
      #   not cargo-mutants, cargo, nextest or this step.
      #
      # The run is contained, by the step's `shell` (`scripts/contain.sh`; R-658, applied per R-369): mutants of the job queue signal process
      # groups and start daemons, as the user the runner's agent runs as, and every shard of two runs in a row lost its
      # runner. The check below proves the containment on this machine, with a real `kill -9 -1`, before anything relies
      # on it. On a diff that changes the queue, its tests then run alone in their namespaces, so a harness that breaks
      # there fails in minutes, not after the baseline. Should a runner still die, the commit's status
      # `mutants-heartbeat (<shard>)` keeps its last memory, disk, task count and mutant under test.
      - name: scripts/contain.sh check
        if: steps.diff.outputs.rust == 'true'
        timeout-minutes: 5
        env:
          PRIN_CONTAIN: required
        shell: bash scripts/contain.sh check {0}
        run: echo "the containment holds"
      - name: The job queue's tests in their PID namespaces, when the diff changes the queue
        if: steps.diff.outputs.rust == 'true'
        timeout-minutes: 10
        env:
          PRIN_CONTAIN: required
          RUSTFLAGS: -C link-arg=-Wl,--compress-debug-sections=zlib -Zmir-enable-passes=-GVN
        shell: bash scripts/contain.sh run bash --noprofile --norc -eo pipefail {0}
        run: |
          if grep -q '^+++ b/xtask/src/jobq\.rs' "$RUNNER_TEMP/pr.diff"; then
            cargo nextest run --package xtask --test jobq --test qa_R-658 \
              --test qa_R-658_round2 --test qa_R-658_round3 --test qa_R-658_round4
          fi
      - name: cargo mutants --in-diff --shard ${{ matrix.shard }}/8 (REQ-VAL-149 per-shard limit, R-376)
        id: run
        if: steps.diff.outputs.rust == 'true'
        env:
          RUSTFLAGS: -C link-arg=-Wl,--compress-debug-sections=zlib -Zmir-enable-passes=-GVN
          PRIN_CONTAIN: required
          MUTANT_TIMEOUT: ${{ needs.mutants-baseline.outputs.timeout }}
          HEARTBEAT_CONTEXT: mutants-heartbeat (${{ matrix.shard }})
          HEARTBEAT_OUT: ${{ runner.temp }}/mutants.out
          HEARTBEAT_SHA: ${{ github.event.pull_request.head.sha }}
          HEARTBEAT_TOKEN: ${{ github.token }}
        shell: bash scripts/contain.sh run bash --noprofile --norc -eo pipefail {0}
        # REQ-VAL-149: 300 minutes per shard, confirmed by the human at the M0 gate (R-376; R-71, R-302): a ceiling
        # for unusually large diffs, not a target. Every PR's shards but #124's have ended in 52 minutes or less
        # (RQ-202); with each shard's setup the job stays under GitHub's 360-minute limit for a hosted job.
        timeout-minutes: 300
        run: |
          set +e
          start=$(date +%s)
          cargo mutants --in-place --in-diff "$RUNNER_TEMP/pr.diff" --baseline=skip --timeout "$MUTANT_TIMEOUT" \
            --shard ${{ matrix.shard }}/8 --sharding round-robin -o "$RUNNER_TEMP"
          code=$?
          echo "cargo mutants shard ${{ matrix.shard }}/8: per-mutant timeout $MUTANT_TIMEOUT s"
          echo "cargo mutants shard ${{ matrix.shard }}/8: exit $code, wall-clock $(( $(date +%s) - start )) s"
          # 0: none survived; 2: some survived; 3: some timed out. The check below decides (R-202). Only exit 0 may
          # mean "no mutant in this shard"; any other exit without outcomes fails the shard.
          case $code in 0|2|3) ;; *) exit "$code" ;; esac
          if [ -f "$RUNNER_TEMP/mutants.out/outcomes.json" ]; then
            echo "tested=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 0 ]; then
            echo "cargo mutants: no mutant in this shard of the PR's diff"
          else
            echo "::error::cargo mutants exited $code but wrote no outcomes.json"; exit "$code"
          fi
      # A shard cut off by its limit fails, named, with its mutants untested: never a pass.
      - name: Shard cut off or failed
        if: always() && steps.run.outcome != 'success' && steps.run.outcome != 'skipped'
        timeout-minutes: 5
        run: |
          echo "::error::mutants shard ${{ matrix.shard }}/8 did not finish: cut off by its REQ-VAL-149 limit" \
            "(300 min) or failed; its untested mutants are not a pass (R-302)"
          exit 1
      - name: cargo xtask mutants-check (R-202)
        if: steps.run.outputs.tested == 'true'
        timeout-minutes: 5
        env:
          RUSTFLAGS: -C link-arg=-Wl,--compress-debug-sections=zlib -Zmir-enable-passes=-GVN
        run: cargo xtask mutants-check "$RUNNER_TEMP/mutants.out"
      - uses: actions/upload-artifact@v4
        if: always()
        timeout-minutes: 5
        with:
          name: mutants-report-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/mutants.out
          if-no-files-found: ignore

  # The unmutated baseline, measured once for every shard (the owner's order of 5 Nov 2026, R-712, on the port: the
  # per-mutant timeout comes from the measured baseline, 3 times it, and 8 shards stay). Each shard used to run a
  # baseline of its own: on PR #360 (run 41957362447) that was 5064-5554 s of test time in seven shards of eight, of the
  # shard's 300 minutes, and those seven were cut with 135 of 676 mutants unreached; the slowest mutant took 2405 s and
  # none timed out, so a longer or shorter multiplier alone would change nothing. This job runs before the shards, on
  # the same diff, in the same setup, with the same environment and containment as theirs: each setup step is the
  # shard's of the same name, which says why. A diff with no `.rs` file under `crates/` skips the work and the job
  # passes, as the shards do. A baseline that fails fails here, named, and no shard runs: `mutants-verdict`, which runs
  # whatever the shards ended in, then fails on their result, `skipped`, and `mutants-check` reports it.
  mutants-baseline:
    if: github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'merge-ready'
    runs-on: ubuntu-24.04
    # statuses: the heartbeat of the run (`scripts/contain.sh`).
    permissions:
      contents: read
      statuses: write
    env:
      PRIN_GPU_BACKEND: vulkan
    # Empty on a diff with no `.rs` file under `crates/`, where every shard skips the step that reads them. A
    # `--timeout` with no value is a usage error in cargo-mutants, so a shard that lost this output fails.
    outputs:
      baseline-seconds: ${{ steps.timeout.outputs.baseline-seconds }}
      timeout: ${{ steps.timeout.outputs.timeout }}
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 10
        with:
          fetch-depth: 0
      - name: git diff origin/${{ github.base_ref }}...HEAD
        id: diff
        timeout-minutes: 5
        run: |
          git diff "origin/${{ github.base_ref }}...HEAD" > "$RUNNER_TEMP/pr.diff"
          echo "PR diff: $(wc -l < "$RUNNER_TEMP/pr.diff") lines"
          if grep -E '^\+\+\+ "?b/crates/.*\.rs"?[[:space:]]*$' "$RUNNER_TEMP/pr.diff" > /dev/null; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
            echo "cargo mutants: no mutant in this shard of the PR's diff: it changes no Rust source (.rs) under crates/"
          fi
      - name: Free runner disk
        if: steps.diff.outputs.rust == 'true'
        timeout-minutes: 20
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
          sudo rm -rf /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/node_modules \
            /opt/az /opt/microsoft /opt/google /opt/pipx /usr/lib/jvm /usr/share/miniconda /usr/local/julia* \
            /usr/local/share/vcpkg /usr/lib/google-cloud-sdk /usr/lib/firefox /usr/share/az_* /usr/local/aws-cli \
            /usr/local/aws-sam-cli /usr/share/kotlinc
          sudo docker system prune --all --force --volumes > /dev/null
          sudo swapoff -a
          sudo rm -f /swapfile
          df -h /
      - name: rustup toolchain install (rust-toolchain.toml)
        id: toolchain
        if: steps.diff.outputs.rust == 'true'
        timeout-minutes: 5
        run: |
          rustup toolchain install
          echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        if: steps.diff.outputs.rust == 'true'
        timeout-minutes: 5
        with:
          prefix-key: cargo-registry
          shared-key: ci
          cache-targets: "false"
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Dependencies without debug info, every profile
        if: steps.diff.outputs.rust == 'true'
        timeout-minutes: 1
        uses: ./.github/actions/cargo-ci-config
      - uses: actions/cache/restore@v4
        if: steps.diff.outputs.rust == 'true'
        with:
          path: ~/.cache/rust-gpu
          key: rust-gpu-gpu-kernel-${{ runner.os }}-${{ steps.toolchain.outputs.channel }}
        timeout-minutes: 5
      - uses: taiki-e/install-action@v2
        if: steps.diff.outputs.rust == 'true'
        timeout-minutes: 5
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest@0.9.146
      - uses: actions/setup-python@v5
        if: steps.diff.outputs.rust == 'true'
        timeout-minutes: 5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        if: steps.diff.outputs.rust == 'true'
        timeout-minutes: 5
        run: python3 -m pip install pyyaml
      - name: Install Mesa (lavapipe)
        if: steps.diff.outputs.rust == 'true'
        timeout-minutes: 5
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: cargo run --quiet --package xtask -- build-kernel
        if: steps.diff.outputs.rust == 'true'
        timeout-minutes: 20
        env:
          RUSTFLAGS: -C link-arg=-Wl,--compress-debug-sections=zlib -Zmir-enable-passes=-GVN
        run: cargo run --quiet --package xtask -- build-kernel
      - name: scripts/contain.sh check
        if: steps.diff.outputs.rust == 'true'
        timeout-minutes: 5
        env:
          PRIN_CONTAIN: required
        shell: bash scripts/contain.sh check {0}
        run: echo "the containment holds"
      - name: The job queue's tests in their PID namespaces, when the diff changes the queue
        if: steps.diff.outputs.rust == 'true'
        timeout-minutes: 10
        env:
          PRIN_CONTAIN: required
          RUSTFLAGS: -C link-arg=-Wl,--compress-debug-sections=zlib -Zmir-enable-passes=-GVN
        shell: bash scripts/contain.sh run bash --noprofile --norc -eo pipefail {0}
        run: |
          if grep -q '^+++ b/xtask/src/jobq\.rs' "$RUNNER_TEMP/pr.diff"; then
            cargo nextest run --package xtask --test jobq --test qa_R-658 \
              --test qa_R-658_round2 --test qa_R-658_round3 --test qa_R-658_round4
          fi
      # cargo-mutants has no baseline-only mode, so this is its own baseline run, stopped from going further: what it
      # measures is what it would itself have measured, on the packages `--in-diff` selects, with the test tool and test
      # arguments of `.cargo/mutants.toml`, and nothing here repeats them. `--build-timeout 0` binds only the mutants
      # (cargo-mutants gives the baseline's build no limit), so each mutant's build is stopped at its first poll and
      # recorded as a timeout, in a millisecond (measured on `fixtures/mutants/untested`), its tests unrun. Those
      # records mean nothing, and only the baseline's outcome and log are kept. So the exits differ from a shard's:
      # 3: the baseline passed, and every mutant was stopped; 0: no mutant in the diff, so no baseline ran; 4: the
      # unmutated tree fails its tests. The limit is the one the baseline ran under in a shard (REQ-VAL-149).
      - name: cargo mutants --in-diff, the unmutated baseline alone
        id: baseline
        if: steps.diff.outputs.rust == 'true'
        env:
          RUSTFLAGS: -C link-arg=-Wl,--compress-debug-sections=zlib -Zmir-enable-passes=-GVN
          PRIN_CONTAIN: required
          HEARTBEAT_CONTEXT: mutants-heartbeat (baseline)
          HEARTBEAT_OUT: ${{ runner.temp }}/mutants.out
          HEARTBEAT_SHA: ${{ github.event.pull_request.head.sha }}
          HEARTBEAT_TOKEN: ${{ github.token }}
        shell: bash scripts/contain.sh run bash --noprofile --norc -eo pipefail {0}
        timeout-minutes: 300
        run: |
          set +e
          start=$(date +%s)
          cargo mutants --in-place --in-diff "$RUNNER_TEMP/pr.diff" --build-timeout 0 -o "$RUNNER_TEMP"
          code=$?
          echo "cargo mutants baseline: exit $code, wall-clock $(( $(date +%s) - start )) s"
          case $code in
            3) echo "measured=true" >> "$GITHUB_OUTPUT" ;;
            0) echo "cargo mutants: no mutant in the PR's diff, so no baseline to measure" ;;
            4)
              echo "::error::the unmutated baseline failed its tests: no mutant is evidence, and no shard runs" \
                "(R-202); its log is log/baseline.log in the mutants-report-baseline artifact"
              exit 4
              ;;
            *) echo "::error::cargo mutants exited $code measuring the baseline"; exit "$code" ;;
          esac
      # The baseline cut off by its limit or stalled: named, with every mutant untested, never a pass.
      - name: Baseline cut off or failed
        if: always() && steps.baseline.outcome != 'success' && steps.baseline.outcome != 'skipped'
        timeout-minutes: 5
        run: |
          echo "::error::the mutants baseline did not finish: it failed, or was cut off by its limit (300 min);" \
            "no shard runs, and no mutant is a pass (R-202, R-302)"
          exit 1
      # 3 times the measured test time, floored, as `.cargo/mutants.toml` says; published to the shards, and shown here
      # and in the job's summary.
      - name: cargo xtask mutants-timeout (REQ-VAL-180)
        id: timeout
        if: steps.diff.outputs.rust == 'true'
        timeout-minutes: 5
        env:
          MEASURED: ${{ steps.baseline.outputs.measured }}
          RUSTFLAGS: -C link-arg=-Wl,--compress-debug-sections=zlib -Zmir-enable-passes=-GVN
        run: |
          out="$RUNNER_TEMP/mutants-timeout.out"
          if [ "$MEASURED" = true ]; then
            cargo xtask mutants-timeout "$RUNNER_TEMP/mutants.out" > "$out"
          else
            cargo xtask mutants-timeout --no-mutant > "$out"
          fi
          cat "$out"
          cat "$out" >> "$GITHUB_OUTPUT"
          { echo "## Measured baseline"; echo; sed 's/$/  /' "$out"; } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
      - uses: actions/upload-artifact@v4
        if: always()
        timeout-minutes: 5
        with:
          name: mutants-report-baseline
          path: |
            ${{ runner.temp }}/mutants.out/outcomes.json
            ${{ runner.temp }}/mutants.out/log/baseline.log
          if-no-files-found: ignore

  # The gate fires on the fixture (REQ-VAL-148): without its killing test the untested branch's mutants survive and
  # mutants-check fails naming them; listed, it passes; with the killing test none survives. Beside the shards. Then the
  # caps (R-348) fire on `fixtures/mutants/caps/` (REQ-VAL-179). Every step has a limit of its own, sized as the shards'
  # (applied per R-369): a checkout 10 minutes (its longest 51 s); every other step 5 (the caps' fixture 91 s, the
  # gate's 71 s, every other step under 25 s).
  mutants-fixture:
    if: github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'merge-ready'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 10
      # What this change touches (R-656, R-677): on a pull request of tier (c), docs only, every later step is skipped
      # and the job passes; the fixture shows the gate can fire, and no such change reaches the gate. Unlike the
      # shards, it does not wait for Rust under `crates/`: a change to the gate's own configuration (`.cargo/`,
      # `fixtures/mutants/`, `scripts/contain.sh`, this workflow's pins, xtask's mutants-check) is tier (a) and runs
      # it, as do the data of tier (b), as before R-677. `scripts/ci_changes.sh` decides (`tier`); any other change,
      # and a classification that says nothing, runs it in full.
      - name: scripts/ci_changes.sh detect
        id: changes
        timeout-minutes: 5
        run: scripts/ci_changes.sh detect
      # The shards' containment holds on a runner (`scripts/contain.sh`), seen in a second, not after a shard's baseline.
      - name: scripts/contain.sh check
        if: steps.changes.outputs.tier != 'docs'
        timeout-minutes: 5
        env:
          PRIN_CONTAIN: required
        shell: bash scripts/contain.sh check {0}
        run: echo "the containment holds"
      # The toolchain rust-toolchain.toml pins, with its components: rust-gpu's nightly, on which the whole workspace
      # builds (R-169).
      - name: rustup toolchain install (rust-toolchain.toml)
        if: steps.changes.outputs.tier != 'docs'
        timeout-minutes: 5
        run: rustup toolchain install
      # The cargo registry `ci.yml`'s `ci` job saves on a push to `main`, restored read-only under its key (R-337).
      - uses: Swatinem/rust-cache@v2
        if: steps.changes.outputs.tier != 'docs'
        timeout-minutes: 5
        with:
          prefix-key: cargo-registry
          shared-key: ci
          cache-targets: "false"
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # Every dependency without debug info, as a cargo config in the runner's CARGO_HOME; the workspace's own crates
      # keep R-374's line tables (`.github/actions/cargo-ci-config`).
      - name: Dependencies without debug info, every profile
        if: steps.changes.outputs.tier != 'docs'
        timeout-minutes: 1
        uses: ./.github/actions/cargo-ci-config
      # cargo-nextest: the fixtures' tests run through it, as the shards' do (`test_tool` in `.cargo/mutants.toml`,
      # R-388 item 4).
      - uses: taiki-e/install-action@v2
        if: steps.changes.outputs.tier != 'docs'
        timeout-minutes: 5
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest@0.9.146
      # Both runs read the caps and the test tool from `.cargo/mutants.toml` (REQ-VAL-179), as every `cargo mutants`
      # run does: with `--dir`, cargo-mutants would otherwise read the fixture's own `.cargo/mutants.toml`, which does
      # not exist.
      - name: The gate fires on the fixture (REQ-VAL-148)
        if: steps.changes.outputs.tier != 'docs'
        timeout-minutes: 5
        run: |
          fixture=fixtures/mutants/untested
          if cargo mutants --dir "$fixture" --in-diff "$fixture/change.diff" --config .cargo/mutants.toml \
            -o "$RUNNER_TEMP/fixture"; then
            echo "::error::without its killing test, no mutant of the untested branch survived"; exit 1
          fi
          if cargo xtask mutants-check "$RUNNER_TEMP/fixture/mutants.out"; then
            echo "::error::mutants-check passed survivors that are not listed"; exit 1
          fi
          cargo xtask mutants-check "$RUNNER_TEMP/fixture/mutants.out" --equivalent "$fixture/equivalent.toml"
          cargo mutants --dir "$fixture" --in-diff "$fixture/change.diff" --config .cargo/mutants.toml \
            --features kill -o "$RUNNER_TEMP/fixture-kill"
      # The caps fire on their fixture (REQ-VAL-179, R-348), read from `.cargo/mutants.toml` as the shards read them:
      # the per-mutant timeout (REQ-VAL-180) records the hanging mutant as a timeout, and the run goes on to the next
      # (`--no-shuffle` keeps the source order); the memory cap (REQ-VAL-181) kills the allocating mutant's test
      # process, whose allocation fails, so it is caught. The controls (R-176) bound each under its cap: a 5 s hang under
      # the 60 s floor is no timeout, and a 256 MiB allocation under the cap is caught by its assertion, not the cap.
      - name: The caps fire on their fixture (REQ-VAL-179)
        if: steps.changes.outputs.tier != 'docs'
        timeout-minutes: 5
        run: |
          fixture=fixtures/mutants/caps
          caps() {
            code=0
            cargo mutants --dir "$fixture" --in-diff "$fixture/change.diff" --config .cargo/mutants.toml \
              --no-shuffle -o "$RUNNER_TEMP/$1" || code=$?
            echo "cargo mutants ($1): exit $code"
          }
          field() {
            jq -r --arg f "$2" ".outcomes[] | select(.scenario.Mutant?.function.function_name == \$f) | .$3" \
              "$RUNNER_TEMP/$1/mutants.out/outcomes.json"
          }
          expect() {
            got=$(field "$1" "$2" summary); log="$RUNNER_TEMP/$1/mutants.out/$(field "$1" "$2" log_path)"
            echo "$1: $2: $got"
            [ "$got" = "$3" ] || { echo "::error::$1: $2's mutant is $got, not $3"; exit 1; }
            if grep -q "memory allocation of .* failed" "$log"; then killed=yes; else killed=no; fi
            [ "$killed" = "$4" ] || { echo "::error::$1: $2's test killed by the memory cap: $killed"; exit 1; }
          }
          caps caps
          expect caps settled Timeout no
          expect caps provisioned CaughtMutant yes
          cargo xtask mutants-check "$RUNNER_TEMP/caps/mutants.out" | tee "$RUNNER_TEMP/caps-check.log"
          grep -q "timed out (not a survivor): src/lib.rs:.*settled" "$RUNNER_TEMP/caps-check.log" ||
            { echo "::error::mutants-check did not list the timeout as not a survivor"; exit 1; }
          CAPS_FIXTURE_HANG_SECS=5 CAPS_FIXTURE_ALLOC_MIB=256 caps controls
          expect controls settled CaughtMutant no
          expect controls provisioned CaughtMutant no
      # The shards' path, end to end, on the same fixture (the owner's order of 5 Nov 2026, R-712, on the port), and the
      # one place a change to it runs before it reaches a pull request's shards: `mutants-baseline`'s command stops at
      # the baseline, whose time `cargo xtask mutants-timeout` turns into the floor here, and a shard's command, with
      # the baseline skipped, takes that timeout: the hanging mutant is recorded as a timeout, and the check lists it.
      - name: The measured baseline sets the shards' timeout
        if: steps.changes.outputs.tier != 'docs'
        timeout-minutes: 5
        run: |
          fixture=fixtures/mutants/caps
          code=0
          cargo mutants --dir "$fixture" --in-diff "$fixture/change.diff" --config .cargo/mutants.toml \
            --build-timeout 0 -o "$RUNNER_TEMP/measured" || code=$?
          [ "$code" = 3 ] || { echo "::error::the baseline alone exited $code, not 3"; exit 1; }
          cargo xtask mutants-timeout "$RUNNER_TEMP/measured/mutants.out" | tee "$RUNNER_TEMP/measured.out"
          MUTANT_TIMEOUT=$(sed -n 's/^timeout=//p' "$RUNNER_TEMP/measured.out")
          floor=$(sed -n 's/^minimum_test_timeout = //p' .cargo/mutants.toml)
          [ "$MUTANT_TIMEOUT" = "$floor" ] ||
            { echo "::error::the fixture's timeout is $MUTANT_TIMEOUT s, not the floor, $floor s"; exit 1; }
          code=0
          cargo mutants --dir "$fixture" --in-diff "$fixture/change.diff" --config .cargo/mutants.toml \
            --baseline=skip --timeout "$MUTANT_TIMEOUT" --no-shuffle -o "$RUNNER_TEMP/skipped" || code=$?
          [ "$code" = 3 ] || { echo "::error::the shard's command exited $code, not 3"; exit 1; }
          cargo xtask mutants-check "$RUNNER_TEMP/skipped/mutants.out" | tee "$RUNNER_TEMP/skipped-check.log"
          grep -q "^mutants-check: 1 timed out over 1 shard" "$RUNNER_TEMP/skipped-check.log" ||
            { echo "::error::mutants-check did not count the timeout"; exit 1; }
          grep -q "timed out (not a survivor): src/lib.rs:.*settled" "$RUNNER_TEMP/skipped-check.log" ||
            { echo "::error::mutants-check did not list the timeout"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        timeout-minutes: 5
        with:
          name: mutants-report-fixture
          path: |
            ${{ runner.temp }}/fixture/mutants.out
            ${{ runner.temp }}/caps/mutants.out
            ${{ runner.temp }}/controls/mutants.out
            ${{ runner.temp }}/skipped/mutants.out
          if-no-files-found: ignore

  # The sharded run's verdict (R-202, R-302): runs after every shard, whatever their result. It fails if any shard
  # failed or was cut off by its limit, and checks every shard's report together against the equivalent-mutants list,
  # listing each survivor of the whole run, and every mutant that timed out, by name, with a count, 0 included, in its
  # log and its job's summary (the owner's order of 5 Nov 2026, R-712, on the port: a timeout counts as caught, but list
  # them). `always()` makes it run on every merge-ready run, a cancelled or skipped
  # shard included (then it fails), and it passes when no shard has a mutant. `mutants-check`, below, reports its
  # result. It runs only on the merge-ready run, so it is not named `mutants-check`, which every run reports.
  # `mutants-check` waits for it, so it is bounded, a stall failing it in minutes (applied per R-369; the limits on
  # `mutants-check` below): the job 30 minutes, its longest run on 3 Nov 2026 under 2 minutes; the toolchain install 5,
  # its longest 24 s in any job here; the download of the shards' reports 5, its longest 2 s; the check over every
  # shard 5, its longest 66 s.
  mutants-verdict:
    if: always() && github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'merge-ready'
    needs: mutants
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 10
      # The toolchain rust-toolchain.toml pins, with its components: rust-gpu's nightly, on which the whole workspace
      # builds (R-169).
      - name: rustup toolchain install (rust-toolchain.toml)
        timeout-minutes: 5
        run: rustup toolchain install
      # The cargo registry `ci.yml`'s `ci` job saves on a push to `main`, restored read-only under its key (R-337).
      - uses: Swatinem/rust-cache@v2
        timeout-minutes: 5
        with:
          prefix-key: cargo-registry
          shared-key: ci
          cache-targets: "false"
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # Every dependency without debug info, as a cargo config in the runner's CARGO_HOME; the workspace's own crates
      # keep R-374's line tables (`.github/actions/cargo-ci-config`).
      - name: Dependencies without debug info, every profile
        timeout-minutes: 1
        uses: ./.github/actions/cargo-ci-config
      - uses: actions/download-artifact@v4
        timeout-minutes: 5
        with:
          pattern: mutants-report-shard-*
          path: ${{ runner.temp }}/shards
      - name: cargo xtask mutants-check over every shard (R-202, R-302)
        id: verdict
        timeout-minutes: 5
        run: |
          # No report at all is a PR whose diff has no mutant (R-305): no shard uploaded one, and this passes.
          shopt -s nullglob
          fail=0
          if [ "${{ needs.mutants.result }}" != success ]; then
            echo "::error::a mutants shard did not pass (result: ${{ needs.mutants.result }}): a survivor not" \
              "listed, or a shard failed or was cut off by its limit (R-302); skipped: mutants-baseline failed"
            fail=1
          fi
          shards=()
          for d in "$RUNNER_TEMP"/shards/mutants-report-shard-*; do
            if [ -f "$d/outcomes.json" ]; then shards+=("$d"); else echo "$(basename "$d"): no outcomes.json"; fi
          done
          echo "shard reports with outcomes: ${#shards[@]} of 8"
          report="$RUNNER_TEMP/mutants-check.log"
          if [ "${#shards[@]}" -gt 0 ]; then
            cargo xtask mutants-check "${shards[@]}" > "$report" || fail=1
          else
            echo "mutants-check: no shard tested a mutant of this PR's diff" > "$report"
            echo "mutants-check: 0 timed out over 0 shard(s)" >> "$report"
          fi
          cat "$report"
          {
            echo "## Timed-out mutants, each counted as caught"
            echo
            sed -n -e 's/^mutants-check: \([0-9]* timed out .*\)$/\1/p' \
              -e 's/^mutants-check: timed out (not a survivor): \(.*\)$/- \1/p' "$report"
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          exit "$fail"

  # `mutants-check`, the required status check on `main` (R-305), reported by every run of this workflow as a job of its
  # own run (R-678; the header above). `always()`: it runs whatever the verdict ended in, skipped included, so it is
  # never itself skipped, which GitHub counts as passed. Its report step concludes it:
  # - the merge-ready run: the verdict's result, success only if `mutants-verdict` passed;
  # - a change with no `.rs` file under `crates/` (`mutants=false`), or a head that is not merge-ready (a push, which
  #   takes the label off, or the label absent): success, "not applicable", with its reason in the job's summary;
  # - another label put on or taken off a merge-ready head: the result of `mutants-verdict` in that head's latest
  #   merge-ready run, waited for while it runs; with no such run on the head, or the head superseded, failure.
  # A classification that fails fails it; an empty one is not `mutants=false`.
  # A step before the report that fails, or stalls past its own limit, fails `mutants-check`, reported: the report is
  # then skipped and the job fails, and the step after it, which runs only then and needs nothing of the tree, says
  # which step did not finish, in the check run's error annotation and the job's summary.
  # The limits (applied per R-369), sized from this workflow's runs on 3 Nov 2026 (140 shard, 17 fixture, 16 verdict
  # and 32 report and pending checkouts): a checkout 10 minutes, its longest 189 s (a shard's full history) against a
  # median of 17 s; the classification 5 minutes, its longest 21 s; a cache restore 5 minutes, its longest 19 s. On
  # ad883784 a checkout stalled past 11 minutes (run 41702550011), which the 355 minutes below would have left
  # unreported for hours.
  mutants-check:
    if: always()
    needs: mutants-verdict
    runs-on: ubuntu-24.04
    # The wait for a merge-ready run in progress: its shards' 300 minutes (REQ-VAL-149) and their setup, under GitHub's
    # 360-minute limit for a hosted job. A merge-ready run can now outlast it, its baseline coming ahead of the shards'
    # limit: another label put on in a run's first minutes, with shards that then run near their limit, would end this
    # job at its limit, failed. Re-running this job alone, once the merge-ready run has ended, reports its verdict.
    timeout-minutes: 355
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        id: checkout
        timeout-minutes: 10
      # What this change touches (R-677): a change with no `.rs` file under `crates/` has no mutant the gate runs. The
      # merge-ready run reports its verdict whatever the change, and does not classify it.
      - name: scripts/ci_changes.sh detect
        id: changes
        if: github.event.action != 'labeled' || github.event.label.name != 'merge-ready'
        timeout-minutes: 5
        run: scripts/ci_changes.sh detect
      - name: Report mutants-check
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          READY: ${{ contains(github.event.pull_request.labels.*.name, 'merge-ready') }}
          MUTANTS: ${{ steps.changes.outputs.mutants }}
          VERDICT: ${{ needs.mutants-verdict.result }}
        run: |
          set -euo pipefail
          summary="${GITHUB_STEP_SUMMARY:-/dev/null}"
          # The notice's message is the one text the check run carries (a step summary never reaches it): the merge
          # watcher reads it among the check run's annotations, and a passed verdict's reads `no surviving mutant`.
          report() { # report <exit> <title> <why>
            echo "mutants-check on $HEAD_SHA: $2. $3"
            printf '## mutants-check: %s\n\n%s\n' "$2" "$3" >> "$summary"
            if [ "$1" = 0 ]; then
              echo "::notice title=mutants-check::$2"
            else
              echo "::error title=mutants-check::$2. $3"
            fi
            exit "$1"
          }
          verdict() { # verdict <result of mutants-verdict> <where>
            if [ "$1" = success ]; then
              report 0 "no surviving mutant" "The merge-ready run's verdict over every shard ($2)."
            fi
            report 1 "a survivor, or a shard that did not finish ($1)" "The merge-ready run's verdict ($2)."
          }
          if [ "$ACTION" = labeled ] && [ "$LABEL" = merge-ready ]; then
            verdict "$VERDICT" "this run, $RUN_ID"
          fi
          if [ "$MUTANTS" = false ]; then
            report 0 "not applicable" \
              "The change touches no Rust source under crates/: mutants run only when crates/ source changes (R-677)."
          fi
          if [ "$ACTION" = synchronize ] || [ "$READY" != true ]; then
            report 0 "not applicable" \
              "The head is not merge-ready: the gate runs once every named reviewer has approved it (R-656, R-676)."
          fi
          # A label put on or taken off a merge-ready head: the verdict of its latest merge-ready run, the one whose
          # `mutants-verdict` is not skipped, waited for while it runs.
          runs="repos/$GH_REPO/actions/workflows/mutants.yml/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=100"
          while :; do
            live=$(gh api "repos/$GH_REPO/pulls/$PR" --jq '.head.sha')
            if [ "$live" != "$HEAD_SHA" ]; then
              report 1 "superseded" "The pull request's head is now $live."
            fi
            wait=""
            ids=$(gh api "$runs" --jq '.workflow_runs[].id')
            for id in $ids; do
              [ "$id" != "$RUN_ID" ] || continue
              state=$(gh api "repos/$GH_REPO/actions/runs/$id/jobs?per_page=100" \
                --jq '.jobs[] | select(.name == "mutants-verdict") | "\(.status) \(.conclusion)"')
              case "$state" in
                "completed skipped") continue ;;
                "completed "*) verdict "${state#completed }" "run $id" ;;
                *) wait="run $id: ${state:-no jobs yet}"; break ;;
              esac
            done
            if [ -z "$wait" ]; then
              report 1 "no merge-ready run" \
                "The merge-ready label is on, but no run of it is on this head: take the label off and put it back."
            fi
            echo "waiting for the merge-ready run ($wait)"
            sleep 30
          done
      # The report skipped: a step before it failed, stalled past its own limit or was cancelled, and the job fails.
      # This says so where the report would have, its script here and needing nothing of the tree.
      - name: A step before the report did not finish
        if: always() && steps.report.outcome == 'skipped'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CHECKOUT: ${{ steps.checkout.outcome }}
          CLASSIFY: ${{ steps.changes.outcome }}
        run: |
          set -uo pipefail
          title="a step before the report did not finish"
          why="The checkout: ${CHECKOUT:-not run}; the classification: ${CLASSIFY:-not run}. A step failed, or stalled"
          why="$why past its own limit; re-run the job."
          echo "mutants-check on $HEAD_SHA: $title. $why"
          printf '## mutants-check: %s\n\n%s\n' "$title" "$why" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          echo "::error title=mutants-check::$title. $why"
          exit 1

# The per-PR mutation gate (R-196, R-202, R-302; TASK-M0-23): `cargo mutants --in-diff` on each pull request's diff,
# sharded, with `mutants-check` its verdict over every shard, a required status check on `main` (R-305). It is a
# workflow of its own, which only `pull_request` runs: in `ci.yml`, which `push` runs too, the push run would report a
# skipped `mutants-check`, and GitHub counts a skipped required check as passed. The jobs keep their `if:` on the
# event, which always holds here. Caches (R-285, R-337): this workflow never runs on a push to `main`, where alone a
# cache is saved (R-326), so a key of its own would find nothing. Each job restores, read-only, a key a `ci.yml` job
# saves on `main`: the cargo registry under the `ci` job's key, `cargo-registry-ci-…`, and, in the `mutants` job, which
# builds the kernel, the rust-gpu build under the `gpu-kernel` job's key, `rust-gpu-gpu-kernel-<os>-<channel>` (R-320).
# None saves: rust-cache's `save-if` holds only on a push to `main`, and there is no save step. rust-cache hashes the
# environment's CARGO_* variables into its key, so CARGO_TERM_COLOR below is set as in `ci.yml`.
# R-656: the gate runs on every head of a pull request and a push cancels the run on the head it supersedes
# (`concurrency` below), so it always runs on the merge-ready head, the last; a shard whose diff names no `.rs` file
# skips its run (below), and `mutants-fixture` skips its steps on a docs-only pull request (`scripts/ci_changes.sh`).
name: mutants

on:
  pull_request:

# A newer push to the same ref supersedes an older run, so the older run on that ref is cancelled. On `main` each
# run has a group of its own (its run id), so no run there is ever cancelled or queued behind another (applied per
# R-369). A pull request's runs share one group, its merge ref's, so the gate runs to its end only on the latest head:
# the merge-ready head is the one whose `mutants-check` the merge waits for (R-656).
concurrency:
  group: mutants-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # R-374: every CI job builds the dev and test profiles with line tables only. Panics and backtraces still name
  # file and line; the build, link, artefacts and caches shrink (a full-debug mutants baseline filled the runner's
  # disk). Every workflow sets the same values, so rust-cache, which hashes CARGO_* into its key, computes `ci.yml`'s
  # keys here too (R-337). R-233 (debug info at the default) governs local builds only.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  # The per-PR mutation gate (R-196, R-202; TASK-M0-23): `cargo mutants --in-diff` on the PR's diff against its base,
  # on pull requests only, since `--in-diff` needs a base. The run is sharded across n parallel jobs, shard k of n each
  # (`--shard k/n`), each under its own time limit (R-302); the nightly full run (TASK-M0-19) is the backstop. Every
  # shard computes the same diff and reads the same exclusions, `.cargo/mutants.toml`'s, shared with the nightly run.
  # Each shard lists its surviving mutants and fails on any not in `.cargo/mutants-equivalent.toml`; `mutants-check`
  # below then checks every shard's report together, and fails if any shard failed or was cut off by its limit.
  # `mutants-fixture` shows, on `fixtures/mutants/untested/`, that the gate can fire.
  mutants:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    # statuses: the heartbeat of a shard's run (`scripts/contain.sh`).
    permissions:
      contents: read
      statuses: write
    env:
      PRIN_GPU_BACKEND: vulkan
    strategy:
      # Every shard runs to its end, so the report names every survivor, not only the first shard's.
      fail-fast: false
      matrix:
        # REQ-VAL-149: n = 8 shards, k = 0..7 (cargo-mutants counts shards from 0), confirmed by the human at the M0
        # gate (R-376; R-71, R-302). A change to n changes this list and `--shard k/8` below.
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # cargo-mutants mutates only Rust source, so a diff that names no `.rs` file has no mutant (cargo-mutants itself
      # then stops at once: "Diff changes no Rust source files", exit 0). Such a shard, a docs-only or rulings PR's,
      # skips its setup and its run and passes, so `mutants-check` reports on it at once (R-305). A diff naming any
      # `.rs` file, even one cargo-mutants won't mutate, runs the shard in full.
      - name: git diff origin/${{ github.base_ref }}...HEAD
        id: diff
        run: |
          git diff "origin/${{ github.base_ref }}...HEAD" > "$RUNNER_TEMP/pr.diff"
          echo "PR diff: $(wc -l < "$RUNNER_TEMP/pr.diff") lines"
          if grep -Eq '^\+\+\+ .*\.rs"?[[:space:]]*$' "$RUNNER_TEMP/pr.diff"; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
            echo "cargo mutants: no mutant in this shard of the PR's diff: it changes no Rust source (.rs)"
          fi
      # Runner disk: the pinned nightly with rustc-dev and llvm-tools (R-169), the rust-gpu build, the workspace's
      # build and, when the diff mutates xtask, the baseline's fixture targets (each a wgpu build of its own under
      # target/tmp/fixture-targets) ran ubuntu-24.04 out of space in the baseline. Remove the preinstalled toolsets
      # this job does not use (.NET, Android, GHC, the hosted tool cache, the docker images), logging the free space
      # before and after, as `ci.yml`'s `ci` job does. setup-python, below, fetches its Python afresh. Test
      # infrastructure only; a shard with no Rust in its diff skips it.
      # Those left 112G free of the root disk's 145G, and PR #303's baseline still filled it (run 40581119007: every
      # shard out of space, or a link killed by SIGBUS, with 3303 tests of kernel, ledger, render, validation and xtask
      # to run). The runner has no second disk to move `target/` to (ubuntu-24.04: one 150G disk, `/mnt` on the root
      # filesystem), so the rest of what this job never uses goes too: Swift, PowerShell, Chromium, the global node
      # modules, the Azure, Google Cloud and AWS CLIs, Microsoft's and Google's /opt trees, pipx, the JVMs, Miniconda,
      # Julia, vcpkg, Firefox and Kotlin; docker's build cache and volumes with its images; and the 3G swap file, which
      # the job does not need with 16G of memory: 129G free after it, about 17 s more (measured on the image of 25 Oct).
      - name: Free runner disk
        if: steps.diff.outputs.rust == 'true'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
          sudo rm -rf /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/node_modules \
            /opt/az /opt/microsoft /opt/google /opt/pipx /usr/lib/jvm /usr/share/miniconda /usr/local/julia* \
            /usr/local/share/vcpkg /usr/lib/google-cloud-sdk /usr/lib/firefox /usr/share/az_* /usr/local/aws-cli \
            /usr/local/aws-sam-cli /usr/share/kotlinc
          sudo docker system prune --all --force --volumes > /dev/null
          sudo swapoff -a
          sudo rm -f /swapfile
          df -h /
      # The toolchain rust-toolchain.toml pins, with its components: rust-gpu's nightly, on which the whole workspace
      # builds (R-169).
      - name: rustup toolchain install (rust-toolchain.toml)
        id: toolchain
        if: steps.diff.outputs.rust == 'true'
        run: |
          rustup toolchain install
          echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      # The cargo registry `ci.yml`'s `ci` job saves on a push to `main`, restored read-only under its key (R-337).
      - uses: Swatinem/rust-cache@v2
        if: steps.diff.outputs.rust == 'true'
        with:
          prefix-key: cargo-registry
          shared-key: ci
          cache-targets: "false"
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # The rust-gpu build, the `rustc_codegen_spirv` backend cargo-gpu's installer builds into ~/.cache/rust-gpu,
      # restored read-only under the key `ci.yml`'s `gpu-kernel` job saves it under on a push to `main`: that job and the
      # channel rust-toolchain.toml pins, so a toolchain bump starts a fresh cache (R-320, R-337; REQ-SYS-075). Restored
      # in every run that builds the kernel; never saved here.
      - uses: actions/cache/restore@v4
        if: steps.diff.outputs.rust == 'true'
        with:
          path: ~/.cache/rust-gpu
          key: rust-gpu-gpu-kernel-${{ runner.os }}-${{ steps.toolchain.outputs.channel }}
      - uses: taiki-e/install-action@v2
        if: steps.diff.outputs.rust == 'true'
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest@0.9.146
      # cargo-nextest runs every mutant's tests (`test_tool` in `.cargo/mutants.toml`, R-388 item 4), and
      # `xtask/tests/nextest.rs` (R-231).
      # What the mutated packages' tests need, as in the per-push jobs: Python and PyYAML for xtask's plan_check
      # tests (TASK-M0-02), lavapipe for the GPU harness (R-169).
      - uses: actions/setup-python@v5
        if: steps.diff.outputs.rust == 'true'
        with:
          python-version: "3.12"
      - name: Install PyYAML
        if: steps.diff.outputs.rust == 'true'
        run: python3 -m pip install pyyaml
      - name: Install Mesa (lavapipe)
        if: steps.diff.outputs.rust == 'true'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      # Debug info: line tables only, set for the whole workflow (R-374). The baseline's full debug info filled the
      # runner: `target/` reached 110G, 75G of it the test binaries, each linking wgpu, and 22G the alias test's own
      # build, until a link in a test's child build died with SIGBUS (the linker writes its output through a memory
      # map, which a full disk faults). With line tables only the baseline peaks at 46G of `target/` and passes. Every
      # cargo a test spawns inherits the variables, so the fixture and alias builds shrink alike.
      # The linker also compresses each binary's debug sections (zlib), as `ci.yml`'s `ci-archive` does: the same line
      # tables, in fewer bytes. PR #303's baseline, rerun on its own after the free-disk step above (run 40622137981),
      # peaked at 130G of the disk's 145G used without it, 14G from full, and at 73G with it (`target/debug` 97G
      # against 44G: the tests that run cargo on the workspace build into it), at about a third more wall-clock time
      # (4536 s against 5996 s; both passed all 3303 tests).
      # Every cargo a test spawns inherits RUSTFLAGS too. It is set on each step that builds, so no step rebuilds
      # another's output, and never on the job: rust-cache, which computed its key in its own step, never sees it. An
      # environment RUSTFLAGS overrides `.cargo/config.toml`'s rustflags, so it names the native build's
      # `-Zmir-enable-passes=-GVN` itself (R-547, REQ-TOOL-188). Test infrastructure only.
      # The kernel's SPIR-V and WGSL, which the baseline's and each mutant's `toolchain_trivial_kernel` and xtask's
      # `build_kernel` tests read (TASK-M0-14): `cargo xtask build-kernel`, written as the cargo call the alias expands
      # to (.cargo/config.toml), since it is setup for the tests, like the Mesa install, not one of the gate's checks.
      - name: cargo run --quiet --package xtask -- build-kernel
        if: steps.diff.outputs.rust == 'true'
        env:
          RUSTFLAGS: -C link-arg=-Wl,--compress-debug-sections=zlib -Zmir-enable-passes=-GVN
        run: cargo run --quiet --package xtask -- build-kernel
      # Each shard rebuilds and runs the unmutated baseline, then its share of the diff's mutants, dealt round-robin
      # so that one file's mutants, whose tests cost alike, spread over the shards. The baseline runs the tests of
      # every package the shard mutates; each mutant runs its own package's tests, through cargo-nextest
      # (`.cargo/mutants.toml`, R-388 item 4). The limit is on this step, so the
      # shard's partial report is still uploaded when it is hit, and the step then fails.
      # The run's two caps (R-348) come from `.cargo/mutants.toml`, which this `cargo mutants` reads, as the nightly
      # run and a local run do; the human confirmed both at the M0 gate (R-376; R-71):
      # - the per-mutant timeout (REQ-VAL-180), cargo-mutants' `timeout_multiplier` and `minimum_test_timeout`: a
      #   mutant whose tests hang is recorded as a timeout, and the shard goes on to its next mutant;
      # - the per-process memory cap (REQ-VAL-181), `prlimit --as` (core dumps off) as nextest's runner on Linux: each
      #   test process of the baseline and of every mutant runs under it, and an allocation past it kills that test,
      #   not cargo-mutants, cargo, nextest or this step.
      #
      # The run is contained, by the step's `shell` (`scripts/contain.sh`; R-658, applied per R-369): mutants of the job queue signal process
      # groups and start daemons, as the user the runner's agent runs as, and every shard of two runs in a row lost its
      # runner. The check below proves the containment on this machine, with a real `kill -9 -1`, before anything relies
      # on it. On a diff that changes the queue, its tests then run alone in their namespaces, so a harness that breaks
      # there fails in minutes, not after the baseline. Should a runner still die, the commit's status
      # `mutants-heartbeat (<shard>)` keeps its last memory, disk, task count and mutant under test.
      - name: scripts/contain.sh check
        if: steps.diff.outputs.rust == 'true'
        env:
          PRIN_CONTAIN: required
        shell: bash scripts/contain.sh check {0}
        run: echo "the containment holds"
      - name: The job queue's tests in their PID namespaces, when the diff changes the queue
        if: steps.diff.outputs.rust == 'true'
        env:
          PRIN_CONTAIN: required
          RUSTFLAGS: -C link-arg=-Wl,--compress-debug-sections=zlib -Zmir-enable-passes=-GVN
        shell: bash scripts/contain.sh run bash --noprofile --norc -eo pipefail {0}
        run: |
          if grep -q '^+++ b/xtask/src/jobq\.rs' "$RUNNER_TEMP/pr.diff"; then
            cargo nextest run --package xtask --test jobq --test qa_R-658 \
              --test qa_R-658_round2 --test qa_R-658_round3 --test qa_R-658_round4
          fi
      - name: cargo mutants --in-diff --shard ${{ matrix.shard }}/8 (REQ-VAL-149 per-shard limit, R-376)
        id: run
        if: steps.diff.outputs.rust == 'true'
        env:
          RUSTFLAGS: -C link-arg=-Wl,--compress-debug-sections=zlib -Zmir-enable-passes=-GVN
          PRIN_CONTAIN: required
          HEARTBEAT_CONTEXT: mutants-heartbeat (${{ matrix.shard }})
          HEARTBEAT_OUT: ${{ runner.temp }}/mutants.out
          HEARTBEAT_SHA: ${{ github.event.pull_request.head.sha }}
          HEARTBEAT_TOKEN: ${{ github.token }}
        shell: bash scripts/contain.sh run bash --noprofile --norc -eo pipefail {0}
        # REQ-VAL-149: 300 minutes per shard, confirmed by the human at the M0 gate (R-376; R-71, R-302): a ceiling
        # for unusually large diffs, not a target. Every PR's shards but #124's have ended in 52 minutes or less
        # (RQ-202); with each shard's setup the job stays under GitHub's 360-minute limit for a hosted job.
        timeout-minutes: 300
        run: |
          set +e
          start=$(date +%s)
          cargo mutants --in-place --in-diff "$RUNNER_TEMP/pr.diff" \
            --shard ${{ matrix.shard }}/8 --sharding round-robin -o "$RUNNER_TEMP"
          code=$?
          echo "cargo mutants shard ${{ matrix.shard }}/8: exit $code, wall-clock $(( $(date +%s) - start )) s"
          # 0: none survived; 2: some survived; 3: some timed out. The check below decides (R-202). Only exit 0 may
          # mean "no mutant in this shard"; any other exit without outcomes fails the shard.
          case $code in 0|2|3) ;; *) exit "$code" ;; esac
          if [ -f "$RUNNER_TEMP/mutants.out/outcomes.json" ]; then
            echo "tested=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 0 ]; then
            echo "cargo mutants: no mutant in this shard of the PR's diff"
          else
            echo "::error::cargo mutants exited $code but wrote no outcomes.json"; exit "$code"
          fi
      # A shard cut off by its limit fails, named, with its mutants untested: never a pass.
      - name: Shard cut off or failed
        if: always() && steps.run.outcome != 'success' && steps.run.outcome != 'skipped'
        run: |
          echo "::error::mutants shard ${{ matrix.shard }}/8 did not finish: cut off by its REQ-VAL-149 limit" \
            "(300 min) or failed; its untested mutants are not a pass (R-302)"
          exit 1
      - name: cargo xtask mutants-check (R-202)
        if: steps.run.outputs.tested == 'true'
        env:
          RUSTFLAGS: -C link-arg=-Wl,--compress-debug-sections=zlib -Zmir-enable-passes=-GVN
        run: cargo xtask mutants-check "$RUNNER_TEMP/mutants.out"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-report-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/mutants.out
          if-no-files-found: ignore

  # The gate fires on the fixture (REQ-VAL-148): without its killing test the untested branch's mutants survive and
  # mutants-check fails naming them; listed, it passes; with the killing test none survives. Beside the shards. Then the
  # caps (R-348) fire on `fixtures/mutants/caps/` (REQ-VAL-179).
  mutants-fixture:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # What this change touches (R-656): on a docs-only pull request every later step is skipped and the job passes;
      # the fixture shows the gate can fire, and no docs-only path reaches the gate. `scripts/ci_changes.sh` holds the
      # allowlist; any other change runs it in full.
      - name: scripts/ci_changes.sh detect
        id: changes
        run: scripts/ci_changes.sh detect
      # The shards' containment holds on a runner (`scripts/contain.sh`), seen in a second, not after a shard's baseline.
      - name: scripts/contain.sh check
        if: steps.changes.outputs.docs_only != 'true'
        env:
          PRIN_CONTAIN: required
        shell: bash scripts/contain.sh check {0}
        run: echo "the containment holds"
      # The toolchain rust-toolchain.toml pins, with its components: rust-gpu's nightly, on which the whole workspace
      # builds (R-169).
      - name: rustup toolchain install (rust-toolchain.toml)
        if: steps.changes.outputs.docs_only != 'true'
        run: rustup toolchain install
      # The cargo registry `ci.yml`'s `ci` job saves on a push to `main`, restored read-only under its key (R-337).
      - uses: Swatinem/rust-cache@v2
        if: steps.changes.outputs.docs_only != 'true'
        with:
          prefix-key: cargo-registry
          shared-key: ci
          cache-targets: "false"
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # cargo-nextest: the fixtures' tests run through it, as the shards' do (`test_tool` in `.cargo/mutants.toml`,
      # R-388 item 4).
      - uses: taiki-e/install-action@v2
        if: steps.changes.outputs.docs_only != 'true'
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest@0.9.146
      # Both runs read the caps and the test tool from `.cargo/mutants.toml` (REQ-VAL-179), as every `cargo mutants`
      # run does: with `--dir`, cargo-mutants would otherwise read the fixture's own `.cargo/mutants.toml`, which does
      # not exist.
      - name: The gate fires on the fixture (REQ-VAL-148)
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          fixture=fixtures/mutants/untested
          if cargo mutants --dir "$fixture" --in-diff "$fixture/change.diff" --config .cargo/mutants.toml \
            -o "$RUNNER_TEMP/fixture"; then
            echo "::error::without its killing test, no mutant of the untested branch survived"; exit 1
          fi
          if cargo xtask mutants-check "$RUNNER_TEMP/fixture/mutants.out"; then
            echo "::error::mutants-check passed survivors that are not listed"; exit 1
          fi
          cargo xtask mutants-check "$RUNNER_TEMP/fixture/mutants.out" --equivalent "$fixture/equivalent.toml"
          cargo mutants --dir "$fixture" --in-diff "$fixture/change.diff" --config .cargo/mutants.toml \
            --features kill -o "$RUNNER_TEMP/fixture-kill"
      # The caps fire on their fixture (REQ-VAL-179, R-348), read from `.cargo/mutants.toml` as the shards read them:
      # the per-mutant timeout (REQ-VAL-180) records the hanging mutant as a timeout, and the run goes on to the next
      # (`--no-shuffle` keeps the source order); the memory cap (REQ-VAL-181) kills the allocating mutant's test
      # process, whose allocation fails, so it is caught. The controls (R-176) bound each under its cap: a 5 s hang under
      # the 60 s floor is no timeout, and a 256 MiB allocation under the cap is caught by its assertion, not the cap.
      - name: The caps fire on their fixture (REQ-VAL-179)
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          fixture=fixtures/mutants/caps
          caps() {
            code=0
            cargo mutants --dir "$fixture" --in-diff "$fixture/change.diff" --config .cargo/mutants.toml \
              --no-shuffle -o "$RUNNER_TEMP/$1" || code=$?
            echo "cargo mutants ($1): exit $code"
          }
          field() {
            jq -r --arg f "$2" ".outcomes[] | select(.scenario.Mutant?.function.function_name == \$f) | .$3" \
              "$RUNNER_TEMP/$1/mutants.out/outcomes.json"
          }
          expect() {
            got=$(field "$1" "$2" summary); log="$RUNNER_TEMP/$1/mutants.out/$(field "$1" "$2" log_path)"
            echo "$1: $2: $got"
            [ "$got" = "$3" ] || { echo "::error::$1: $2's mutant is $got, not $3"; exit 1; }
            if grep -q "memory allocation of .* failed" "$log"; then killed=yes; else killed=no; fi
            [ "$killed" = "$4" ] || { echo "::error::$1: $2's test killed by the memory cap: $killed"; exit 1; }
          }
          caps caps
          expect caps settled Timeout no
          expect caps provisioned CaughtMutant yes
          cargo xtask mutants-check "$RUNNER_TEMP/caps/mutants.out" | tee "$RUNNER_TEMP/caps-check.log"
          grep -q "timed out (not a survivor): src/lib.rs:.*settled" "$RUNNER_TEMP/caps-check.log" ||
            { echo "::error::mutants-check did not list the timeout as not a survivor"; exit 1; }
          CAPS_FIXTURE_HANG_SECS=5 CAPS_FIXTURE_ALLOC_MIB=256 caps controls
          expect controls settled CaughtMutant no
          expect controls provisioned CaughtMutant no
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-report-fixture
          path: |
            ${{ runner.temp }}/fixture/mutants.out
            ${{ runner.temp }}/caps/mutants.out
            ${{ runner.temp }}/controls/mutants.out
          if-no-files-found: ignore

  # The sharded run's verdict (R-202, R-302): runs after every shard, whatever their result. It fails if any shard
  # failed or was cut off by its limit, and checks every shard's report together against the equivalent-mutants list,
  # listing each survivor of the whole run. A required status check on `main` (R-305): `always()` makes it report on
  # every pull request, a cancelled or skipped shard included (then it fails), and it passes when no shard has a mutant.
  mutants-check:
    if: always() && github.event_name == 'pull_request'
    needs: mutants
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # The toolchain rust-toolchain.toml pins, with its components: rust-gpu's nightly, on which the whole workspace
      # builds (R-169).
      - name: rustup toolchain install (rust-toolchain.toml)
        run: rustup toolchain install
      # The cargo registry `ci.yml`'s `ci` job saves on a push to `main`, restored read-only under its key (R-337).
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: cargo-registry
          shared-key: ci
          cache-targets: "false"
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: actions/download-artifact@v4
        with:
          pattern: mutants-report-shard-*
          path: ${{ runner.temp }}/shards
      - name: cargo xtask mutants-check over every shard (R-202, R-302)
        run: |
          # No report at all is a PR whose diff has no mutant (R-305): no shard uploaded one, and this passes.
          shopt -s nullglob
          fail=0
          if [ "${{ needs.mutants.result }}" != success ]; then
            echo "::error::a mutants shard did not pass (result: ${{ needs.mutants.result }}): a survivor not" \
              "listed, or a shard failed or was cut off by its limit (R-302)"
            fail=1
          fi
          shards=()
          for d in "$RUNNER_TEMP"/shards/mutants-report-shard-*; do
            if [ -f "$d/outcomes.json" ]; then shards+=("$d"); else echo "$(basename "$d"): no outcomes.json"; fi
          done
          echo "shard reports with outcomes: ${#shards[@]} of 8"
          if [ "${#shards[@]}" -gt 0 ]; then
            cargo xtask mutants-check "${shards[@]}" || fail=1
          else
            echo "mutants-check: no shard tested a mutant of this PR's diff"
          fi
          exit "$fail"

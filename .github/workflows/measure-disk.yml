name: measure-disk
on: push
jobs:
  up:
    runs-on: ubuntu-24.04
    outputs:
      bytes: ${{ steps.size.outputs.bytes }}
    steps:
      - run: head -c 300000000 /dev/urandom | zstd -q -o "$RUNNER_TEMP/nextest-ci.tar.zst"
      - id: size
        run: echo "bytes=$(stat -c %s "$RUNNER_TEMP/nextest-ci.tar.zst")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: nextest-ci
          path: ${{ runner.temp }}/nextest-ci.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
  down:
    needs: up
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    strategy:
      matrix:
        truncate: [no, yes]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nextest-ci
          path: ${{ runner.temp }}
      - if: matrix.truncate == 'yes'
        run: truncate -s 1000000 "$RUNNER_TEMP/nextest-ci.tar.zst"; ls -l "$RUNNER_TEMP"
      - name: Check the archive downloaded whole
        env:
          WANT: ${{ needs.up.outputs.bytes }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          archive="$RUNNER_TEMP/nextest-ci.tar.zst"
          got=$(stat -c %s "$archive" 2>/dev/null || echo 0)
          if [ "$got" != "$WANT" ]; then
            echo "::warning::nextest-ci: downloaded $got of $WANT bytes; downloading it again"
            rm -f "$archive"
            gh run download "$GITHUB_RUN_ID" --name nextest-ci --dir "$RUNNER_TEMP"
            got=$(stat -c %s "$archive" 2>/dev/null || echo 0)
            if [ "$got" != "$WANT" ]; then
              echo "::error::nextest-ci: downloaded $got of $WANT bytes, twice"; exit 1
            fi
          fi
      - run: ls -l "$RUNNER_TEMP"; zstd -tq "$RUNNER_TEMP/nextest-ci.tar.zst" && echo archive-whole

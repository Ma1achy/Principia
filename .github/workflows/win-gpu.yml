# Measurements on the owner's Windows PC, `malachys-pc-rtx2080s`, RTX 2080 SUPER (R-711 item 1, which amends R-186 and
# R-656 for this one runner): the Vulkan GPU suites, nightly and on `main`; the Windows build and tests, nightly; and
# a nightly self-check, the only daily re-proof of the setup, since `schedule` fires only from `main`; and, dispatched by
# hand alone, the proof of Windows containment (`win-contain`, below). Every result
# here is a measurement, never a required check (R-649): the PC is sometimes off, and nothing on `main` waits for it.
# No job here is gathered or read by any gate, and a red one is not main red. A job here that stops on a runner-level
# fault is re-run once, automatically, by the hosted job `win-retry` (`win-retry.yml`, R-988), the one reader of this
# workflow, which logs every such stop and every hang; nothing else retries a job here. `xtask/tests/ci_self_hosted.rs`
# fails if that ever stops holding, or if a rule below is broken. DX12 waits for its opt-in (R-711 item 2). No
# benchmarks or soak run here, and no mutants outside the WSL2 distro's `wsl-cpu` (below), which is off.
#
# The repository is public and this runner is a real PC, so these are the conditions for having it at all (R-711 items
# 1 and 5, the owner's job rules of 5 Nov 2026). Never add a `pull_request` or `pull_request_target` trigger: only push
# to `main`, schedule and workflow_dispatch, which is also the only way to run this on a branch. Every job carries the
# repository and actor guard. No credential reaches a job: `contents: read`, no repository secret, and checkout with
# `persist-credentials: false`. Every action is pinned to a full commit SHA, its version in a comment. The hook on the PC
# enforces the same triggers from outside the repository, whatever this file says.
#
# `.env` on the runner sets CARGO_HOME, RUSTUP_HOME, CARGO_TARGET_DIR, TEMP and TMP on E:, so this file sets none of them
# and never runs `cargo clean`: a job can change what's in the target folder, not remove it. `core.autocrlf false` is in
# the account's read-only gitconfig. `.github/actions/cargo-ci-config` isn't used here: it writes a config into
# CARGO_HOME, which is read-only to the account and outlives the job, so dependencies keep their default debug info on
# this one runner.
#
# Every suite's output goes through `.github/scripts/win_measure.ps1`, which keeps the full output and labels the result
# `possibly faulty hardware (owner-reported)`, with the commit and driver version, in the job's summary and artifact. A
# recorded run can serve Paper 2's non-Metal parity evidence (R-711 item 4), and an artifact lasts 90 days at most, so
# copy one that's cited. A step after a failed suite still runs, so one failure doesn't hide the rest; the job ends red.
#
# Concurrency: a group per job, each holding only that job's runs. The runner is one machine and takes one job at a time,
# so the GPU is never shared whatever the groups; they bound the queue, and being per job, a push can't displace a
# nightly's `win-tests` or `win-self-check`, which pushes never run. `win-vulkan`, the 85-minute run, cancels in
# progress (R-986, the owner's ruling of 12 Nov 2026: "merges to main, nightly and dispatch only, with a newer run
# cancelling an older one; never branch pushes"): a newer run of it, from a merge, the schedule or a dispatch, cancels an
# older one still running, on `main` too, so the PC always works on the newest commit. Every other job keeps
# `cancel-in-progress: false`: a running measurement finishes. GitHub keeps at most one run waiting in a group and
# cancels the older waiting one, so with the PC off at most two of each job wait, the holder and the newest, and no queue
# can pile up; a job a runner hasn't taken after 24 to 48 hours is cancelled by GitHub. A cancelled run is no failure,
# and `win-retry` re-runs none.
#
# Time limits (R-988): every job here on the runner, and every step that builds or runs tests (each step started
# through `win_measure.ps1 run`), carries `timeout-minutes` of 1.5 times its measured time, rounded up to a whole
# minute: the slowest of its last five completed runs on the PC, in `.github/win-times.md` with their run ids, written
# before the limits were set (R-649). A job or step with no completed run on record keeps its present limit. A step or
# job at its limit is a hang: it ends there, `win-retry` logs it, and nothing re-runs it.
#
# The checkout is kept between runs, since a full clone took 11.2 of 18.3 minutes on this PC's hard drive (the owner, 5 Nov
# 2026): `fetch-depth: 1` and `clean: true`, explicit. No job here needs history: they run the suites hosted jobs run at
# checkout's default depth of 1. A job that did would state its own depth and why. A job can write to that folder, so
# each job's second step is `.github/scripts/git_guard.ps1`, before anything runs git there. It's fetched at the job's own
# commit, since a copy in the kept folder is what it distrusts, and on a first run there is none. If it fires it logs to
# WIN_REFUSAL_LOG, on the PC, empties the checkout and fails the job. If it passes it writes an empty `.git/index` and
# detaches HEAD at an empty tree, so `clean: true` clears the tree and checkout writes it again, keeping `.git` and the
# fetch's saving. The PC's hook runs a guard of its own before any step; this one is the second layer.
#
# Every script here is started as a child `powershell -File`, which sets $LASTEXITCODE even if the script can't load or
# parse. `& script` wouldn't: the step would go on, and `exit $null` is a green step with nothing run.
#
# The schedule, 05:17 UTC: Windows may restart for updates from 23:00 to 05:00 on this PC.
#
# The WSL2 distro `principia-wsl` (RQ-751 option (c), built in parallel to replace (b) and never blocking; the owner's
# words of 9 Nov 2026), dispatched by hand alone, each job by `only` naming it, never on a push, the schedule or `all`:
# - `wsl-register` imports the image of this commit's recipe to E:\wsl\principia-wsl\, as gh-runner: `gh workflow run
#   win-gpu.yml --ref main -f only=wsl-register`, with `-f replace=true` to replace a registered one. The image comes
#   from the PC's cache, E:\runner-tools\wsl-cache\, when it holds one of this recipe, and otherwise from this run's
#   hosted `wsl-image` job (`scripts/wsl/build-image.sh`), downloaded and cached (below). It refuses an image whose
#   manifest isn't the one pinned in `scripts/wsl/manifest.sha256`, and so refuses every image until a reviewed PR pins
#   one.
# - `wsl-proofs` runs the six proofs, each reported PASS or FAIL with its evidence in its log and in `wsl-proofs.txt` in
#   its artifact: `gh workflow run win-gpu.yml --ref main -f only=wsl-proofs`. Proof 5 compares this run's rebuild, and
#   proof 6 this run's hosted `wsl-parity`, with what is in the distro.
# - `wsl-cpu` runs the CPU tests and the job queue's mutants inside the distro, through `scripts/contain.sh` in its
#   unprivileged mode, and refuses unless `.github/wsl-cpu-enabled` exists; a reviewed PR adds it once all six proofs
#   have passed: `gh workflow run win-gpu.yml --ref main -f only=wsl-cpu`.
# The image can't come from another run: a run's artifact downloads only with a token, and no job here holds one. So
# each of the first two jobs needs a hosted job of the same run, the only hosted jobs in this file. They carry the
# runner's guard, run only when dispatched, and build no kernel.
# Each download of their artifacts has its own time limit and runs a second time if the first failed, hung or didn't
# finish, and the job then fails naming it if neither did: download-artifact v4.3.0 can stall mid-stream and still end
# with exit 0, its step green over part of a file (run 43128608743's image), or hang with no output (run 43146846084's),
# and it sets `download-path` only once a download has finished. The image is checked after each try, its length and
# SHA-256 against those built (`wsl.ps1 check-image`), and tried again if it isn't whole. Those artifacts' names
# carry the run but not the attempt, so a re-run of the failed jobs alone finds the first attempt's; their uploads
# overwrite, so a re-run of the hosted job replaces them. `wsl.ps1 register` still checks the image's length and hash.
#
# The image cache (the owner's words of 12 Nov 2026: "stop moving the image every run"). The image's bytes differ from
# build to build (run 43312851701: tar order, times, logs), so `wsl-register` files it on the PC by its recipe, the
# SHA-256 of `build-image.sh`, the files of the repository it reads and the manifest's pin (`wsl.ps1`'s
# `Get-RecipeKey`), in E:\runner-tools\wsl-cache\<recipe key>\ with the length and SHA-256 it had when built. The
# owner makes that folder, writable by gh-runner; if it isn't there, the job's first step after the checkout's record
# fails, naming it, and nothing is written anywhere else. On a hit the job downloads nothing; on a miss it downloads as
# above, and `register` checks the download and moves it into the cache. Either way the cache's copy is checked, its
# length and SHA-256 against those recorded, before it is imported: never trusted by its name. The cache keeps this
# image and the one used before it, no more. The hosted job still builds on every `wsl-register` dispatch: it can't
# learn what the PC holds (no job may wait on a self-hosted one, `ci_self_hosted.rs`: never gathered; and a run reads
# another's artifacts only with a token), and keeping its own build in the Actions cache waits on RQ-807, as R-285 and
# R-326 don't allow that cache. `wsl-proofs` builds as before: proof 5 is this run's rebuild.
#
# The paths: what `scripts/ci_changes.sh` calls a GPU path, written as a filter, less R-692's five paths of `gui`. Docs-only
# pushes run nothing (R-711 item 5); nor do `gui` and `prin`, which no job here builds. `schedule` and
# `workflow_dispatch` ignore the filter.
name: win-gpu

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "!crates/gui/**"
      - "!crates/prin/**"
      - "xtask/**"
      - "fixtures/**"
      - "plan/requirements.yaml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".config/**"
      - ".github/workflows/win-gpu.yml"
      - ".github/scripts/win_measure.ps1"
      - ".github/scripts/git_guard.ps1"
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: Run one job of this workflow
        type: choice
        default: all
        options:
          - all
          - win-vulkan
          - win-tests
          - win-self-check
          - win-contain
          - wsl-register
          - wsl-proofs
          - wsl-cpu
      replace:
        description: wsl-register replaces a registered principia-wsl
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    # Plain `shell: powershell` is refused here: the account's execution policy doesn't allow script files. With -File, a
    # step's result comes from its own exit, so each step ends in an explicit one.
    shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}

env:
  PRIN_GPU_BACKEND: vulkan
  CARGO_TERM_COLOR: never
  WIN_REFUSAL_LOG: E:\runner-tools\refusal-log\refusals.log
  # R-374 and the owner's CI setting (PR #394), as in every workflow.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  CARGO_INCREMENTAL: "0"
  # Proof 6's commit: `main` when the WSL2 work was built, whose rust-toolchain.toml is the image's.
  WSL_PARITY_COMMIT: 2a69136e3a45caafa494857200693ccb01abc4b9

jobs:
  # The GPU suites `ci.yml`'s `gpu-kernel`, `gpu-metal` and `gpu-lavapipe` run, on this card under Vulkan. Phase 1 of #390
  # took about 2.6 hours for these on this PC, warm; a cold build adds about 20 minutes.
  win-vulkan:
    if: github.repository == 'Ma1achy/Principia' && github.actor == 'Ma1achy' && (inputs.only == '' || inputs.only == 'all' || inputs.only == 'win-vulkan')
    runs-on: [self-hosted, windows, nvidia]
    timeout-minutes: 156
    concurrency:
      group: win-vulkan
      cancel-in-progress: true
    steps:
      - name: Self-check, first step
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File E:\runner-tools\checks\self-check.ps1
          exit $LASTEXITCODE
      - name: Guard the kept checkout
        run: |
          $guard = Join-Path $env:RUNNER_TEMP 'git_guard.ps1'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          try { Invoke-WebRequest -UseBasicParsing -OutFile $guard -Uri "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/.github/scripts/git_guard.ps1" } catch { "could not fetch the guard: $_"; exit 1 }
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $guard
          exit $LASTEXITCODE
      - name: Toolchain on PATH
        run: |
          Add-Content -LiteralPath $env:GITHUB_PATH -Value 'E:\runner-tools\cargo\bin'
          exit 0
      - name: Clean checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          clean: true
      - name: Record the commit, driver and toolchain
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\win_measure.ps1 start
          exit $LASTEXITCODE
      - name: cargo xtask build-kernel
        id: kernel
        timeout-minutes: 3
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\win_measure.ps1 run build-kernel cargo xtask build-kernel
          exit $LASTEXITCODE
      # The suites below are worth nothing on any other adapter, so they run only if this one shows the card's name.
      - name: The harness runs on the RTX 2080 SUPER
        id: adapter
        if: ${{ !cancelled() && steps.kernel.outcome == 'success' }}
        env:
          WIN_MEASURE_EXPECT: "adapter: NVIDIA GeForce RTX 2080 SUPER"
        timeout-minutes: 12
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\win_measure.ps1 run adapter cargo nextest run -p validation --features controls --no-capture --no-fail-fast --retries 0 -E 'test(=gpu::tests::gpu_harness_identity_round_trip)'
          exit $LASTEXITCODE
      - name: cargo nextest run -p validation -p xtask -p engine
        if: ${{ !cancelled() && steps.adapter.outcome == 'success' }}
        env:
          NEXTEST_PROFILE: gpu-kernel
        timeout-minutes: 44
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\win_measure.ps1 run gpu-kernel cargo nextest run -p validation -p xtask -p engine --no-fail-fast --retries 0
          exit $LASTEXITCODE
      - name: cargo test -p validation -p xtask -p engine --doc
        if: ${{ !cancelled() && steps.adapter.outcome == 'success' }}
        timeout-minutes: 1
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\win_measure.ps1 run gpu-kernel-doc cargo test -p validation -p xtask -p engine --doc
          exit $LASTEXITCODE
      - name: cargo nextest run -p validation --features controls gpu_harness
        if: ${{ !cancelled() && steps.adapter.outcome == 'success' }}
        timeout-minutes: 1
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\win_measure.ps1 run gpu_harness cargo nextest run -p validation --features controls gpu_harness --no-capture --no-fail-fast --retries 0
          exit $LASTEXITCODE
      - name: cargo nextest run -p validation --features controls compute_fast_math
        if: ${{ !cancelled() && steps.adapter.outcome == 'success' }}
        timeout-minutes: 1
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\win_measure.ps1 run compute_fast_math cargo nextest run -p validation --features controls compute_fast_math --no-capture --no-fail-fast --retries 0
          exit $LASTEXITCODE
      - name: cargo nextest run -p engine --features controls compute_entry
        if: ${{ !cancelled() && steps.adapter.outcome == 'success' }}
        timeout-minutes: 8
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\win_measure.ps1 run compute_entry cargo nextest run -p engine --features controls compute_entry --no-capture --no-fail-fast --retries 0
          exit $LASTEXITCODE
      - name: cargo nextest run -p engine --features controls decode_
        if: ${{ !cancelled() && steps.adapter.outcome == 'success' }}
        timeout-minutes: 22
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\win_measure.ps1 run decode cargo nextest run -p engine --features controls decode_ --no-capture --no-fail-fast --retries 0
          exit $LASTEXITCODE
      - name: cargo nextest run -p engine --features controls invariant_
        if: ${{ !cancelled() && steps.adapter.outcome == 'success' }}
        timeout-minutes: 2
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\win_measure.ps1 run invariant cargo nextest run -p engine --features controls invariant_ --no-capture --no-fail-fast --retries 0
          exit $LASTEXITCODE
      - name: cargo nextest run -p engine --features controls qa_m206_
        if: ${{ !cancelled() && steps.adapter.outcome == 'success' }}
        timeout-minutes: 5
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\win_measure.ps1 run qa_m206 cargo nextest run -p engine --features controls qa_m206_ --no-capture --no-fail-fast --retries 0
          exit $LASTEXITCODE
      - name: cargo nextest run -p engine --features controls canonicaliser_
        if: ${{ !cancelled() && steps.adapter.outcome == 'success' }}
        timeout-minutes: 14
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\win_measure.ps1 run canonicaliser cargo nextest run -p engine --features controls canonicaliser_ --no-capture --no-fail-fast --retries 0
          exit $LASTEXITCODE
      - name: cargo nextest run -p engine --features controls encode_
        if: ${{ !cancelled() && steps.adapter.outcome == 'success' }}
        timeout-minutes: 4
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\win_measure.ps1 run encode cargo nextest run -p engine --features controls encode_ --no-capture --no-fail-fast --retries 0
          exit $LASTEXITCODE
      - name: cargo xtask gate decode-agreement
        if: ${{ !cancelled() && steps.adapter.outcome == 'success' }}
        timeout-minutes: 26
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\win_measure.ps1 run decode-agreement cargo xtask gate decode-agreement
          exit $LASTEXITCODE
      - name: cargo nextest run -p validation --features controls codegen_selftest
        if: ${{ !cancelled() && steps.adapter.outcome == 'success' }}
        timeout-minutes: 2
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\win_measure.ps1 run codegen_selftest cargo nextest run -p validation --features controls codegen_selftest --no-capture --no-fail-fast --retries 0
          exit $LASTEXITCODE
      - name: cargo xtask golden --all
        if: ${{ !cancelled() && steps.adapter.outcome == 'success' }}
        timeout-minutes: 2
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\win_measure.ps1 run golden cargo xtask golden --all
          exit $LASTEXITCODE
      - name: cargo nextest run -p xtask --features controls golden_halfway
        if: ${{ !cancelled() && steps.adapter.outcome == 'success' }}
        timeout-minutes: 15
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\win_measure.ps1 run golden_halfway cargo nextest run -p xtask --features controls golden_halfway --no-capture --no-fail-fast --retries 0
          exit $LASTEXITCODE
      - name: Label the result in the summary
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\win_measure.ps1 finish
          exit $LASTEXITCODE
      - name: Keep the full output
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: win-vulkan-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/win-measure
          retention-days: 90

  # `nightly.yml`'s CPU suites on Windows: the `ci` profile, and the two the `ci-workspace` profile adds there. Some of
  # these tests need bash or PyYAML, which this PC's account isn't known to have, so a failure here is read by its cause.
  win-tests:
    if: github.repository == 'Ma1achy/Principia' && github.actor == 'Ma1achy' && github.event_name != 'push' && (inputs.only == '' || inputs.only == 'all' || inputs.only == 'win-tests')
    runs-on: [self-hosted, windows, nvidia]
    timeout-minutes: 147
    concurrency:
      group: win-tests
      cancel-in-progress: false
    steps:
      - name: Self-check, first step
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File E:\runner-tools\checks\self-check.ps1
          exit $LASTEXITCODE
      - name: Guard the kept checkout
        run: |
          $guard = Join-Path $env:RUNNER_TEMP 'git_guard.ps1'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          try { Invoke-WebRequest -UseBasicParsing -OutFile $guard -Uri "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/.github/scripts/git_guard.ps1" } catch { "could not fetch the guard: $_"; exit 1 }
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $guard
          exit $LASTEXITCODE
      - name: Toolchain on PATH
        run: |
          Add-Content -LiteralPath $env:GITHUB_PATH -Value 'E:\runner-tools\cargo\bin'
          exit 0
      - name: Clean checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          clean: true
      - name: Record the commit, driver and toolchain
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\win_measure.ps1 start
          exit $LASTEXITCODE
      - name: cargo build --workspace --all-targets
        id: build
        timeout-minutes: 82
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\win_measure.ps1 run build cargo build --workspace --all-targets --keep-going
          exit $LASTEXITCODE
      - name: cargo nextest run --workspace
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          NEXTEST_PROFILE: ci
        timeout-minutes: 44
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\win_measure.ps1 run workspace cargo nextest run --workspace --no-fail-fast --retries 0
          exit $LASTEXITCODE
      - name: cargo nextest run -p validation --test qa_TASK-M0-24
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          NEXTEST_PROFILE: ci-workspace
        timeout-minutes: 39
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\win_measure.ps1 run qa_TASK-M0-24 cargo nextest run -p validation --test qa_TASK-M0-24 --no-fail-fast --retries 0
          exit $LASTEXITCODE
      - name: cargo nextest run -p xtask --test qa_TASK-M0-06_list
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          NEXTEST_PROFILE: ci-workspace
        timeout-minutes: 21
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\win_measure.ps1 run qa_TASK-M0-06_list cargo nextest run -p xtask --test qa_TASK-M0-06_list --no-fail-fast --retries 0
          exit $LASTEXITCODE
      - name: cargo test --workspace --doc
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 1
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\win_measure.ps1 run doc cargo test --workspace --doc
          exit $LASTEXITCODE
      - name: cargo xtask deps
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 3
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\win_measure.ps1 run deps cargo xtask deps
          exit $LASTEXITCODE
      - name: Label the result in the summary
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\win_measure.ps1 finish
          exit $LASTEXITCODE
      - name: Keep the full output
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: win-tests-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/win-measure
          retention-days: 90

  # The only daily re-proof of the setup: this job's first step, and the PC's hook before it. The guard test runs here too
  # (the hand-over on #390 asks for it), its controls with it, on the PC it protects; it reads the workflows with a YAML
  # crate, not PyYAML, so that it needs nothing the account doesn't have.
  win-self-check:
    if: github.repository == 'Ma1achy/Principia' && github.actor == 'Ma1achy' && github.event_name != 'push' && (inputs.only == '' || inputs.only == 'all' || inputs.only == 'win-self-check')
    runs-on: [self-hosted, windows, nvidia]
    timeout-minutes: 17
    concurrency:
      group: win-self-check
      cancel-in-progress: false
    steps:
      - name: Self-check, first step
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File E:\runner-tools\checks\self-check.ps1
          exit $LASTEXITCODE
      - name: Guard the kept checkout
        run: |
          $guard = Join-Path $env:RUNNER_TEMP 'git_guard.ps1'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          try { Invoke-WebRequest -UseBasicParsing -OutFile $guard -Uri "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/.github/scripts/git_guard.ps1" } catch { "could not fetch the guard: $_"; exit 1 }
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $guard
          exit $LASTEXITCODE
      - name: Toolchain on PATH
        run: |
          Add-Content -LiteralPath $env:GITHUB_PATH -Value 'E:\runner-tools\cargo\bin'
          exit 0
      - name: Clean checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          clean: true
      - name: Record the commit, driver and toolchain
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\win_measure.ps1 start
          exit $LASTEXITCODE
      - name: No CRLF and no token left in the checkout
        run: |
          $files = @(git ls-files --eol)
          $status = $LASTEXITCODE
          if ($status -ne 0 -or -not $files.Count) { "git ls-files read nothing, status $status"; exit 1 }
          $crlf = @($files | Select-String 'i/lf\s+w/(crlf|mixed)').Count
          "tracked LF files with CRLF in the tree: $crlf"
          try { $tok = @(Select-String -LiteralPath '.git\config' -Pattern 'extraheader|x-access-token' -ErrorAction Stop).Count } catch { "could not read .git\config: $_"; exit 1 }
          "token lines in .git\config: $tok"
          if ($crlf -or $tok) { exit 1 }
          exit 0
      - name: The guard on this workflow
        timeout-minutes: 5
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\win_measure.ps1 run guard cargo nextest run -p xtask --features controls --test ci_self_hosted --no-fail-fast --retries 0
          exit $LASTEXITCODE
      - name: Label the result in the summary
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\win_measure.ps1 finish
          exit $LASTEXITCODE
      - name: Keep the full output
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: win-self-check-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/win-measure
          retention-days: 90

  # The proof of Windows containment (the owner's CI shape order of 8 Nov 2026, step 1):
  # `.github/scripts/win_contain.ps1 check`, the scenarios of `scripts/contain.sh check` against a Job Object with
  # kill-on-close, a process limit and REQ-VAL-181's 8 GiB per-process cap. "Containment, memory cap and the 36 h no-run
  # alert are prerequisites for any job placed on Windows": until this passes here, mutants of `xtask/src/jobq.rs` and
  # every job that would be placed on Windows stay on GitHub-hosted runners. By `workflow_dispatch` with `only` set to it
  # alone, never on a push, the schedule or `all`, until the proof has passed (`xtask/tests/win_contain.rs` pins that):
  # `gh workflow run win-gpu.yml --ref main -f only=win-contain`. The step "Containment check" ends
  # `win_contain.ps1 check: contained: ...` and exit 0 when every Job Object scenario held. It runs no cargo.
  win-contain:
    if: github.repository == 'Ma1achy/Principia' && github.actor == 'Ma1achy' && github.event_name == 'workflow_dispatch' && inputs.only == 'win-contain'
    runs-on: [self-hosted, windows, nvidia]
    timeout-minutes: 30
    concurrency:
      group: win-contain
      cancel-in-progress: false
    steps:
      - name: Self-check, first step
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File E:\runner-tools\checks\self-check.ps1
          exit $LASTEXITCODE
      - name: Guard the kept checkout
        run: |
          $guard = Join-Path $env:RUNNER_TEMP 'git_guard.ps1'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          try { Invoke-WebRequest -UseBasicParsing -OutFile $guard -Uri "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/.github/scripts/git_guard.ps1" } catch { "could not fetch the guard: $_"; exit 1 }
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $guard
          exit $LASTEXITCODE
      - name: Toolchain on PATH
        run: |
          Add-Content -LiteralPath $env:GITHUB_PATH -Value 'E:\runner-tools\cargo\bin'
          exit 0
      - name: Clean checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          clean: true
      - name: Record the commit, driver and toolchain
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\win_measure.ps1 start
          exit $LASTEXITCODE
      - name: Containment check
        env:
          PRIN_CONTAIN: required
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\win_measure.ps1 run contain-check powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\win_contain.ps1 check
          exit $LASTEXITCODE
      - name: Label the result in the summary
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\win_measure.ps1 finish
          exit $LASTEXITCODE
      - name: Keep the full output
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: win-contain-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/win-measure
          retention-days: 90

  # The WSL2 image, built on a hosted runner from `scripts/wsl/build-image.sh` for this run's `wsl-register` or
  # `wsl-proofs` (proof 5's rebuild): the image, and its manifest alone, as this run's artifacts. Hosted, so the
  # shell is bash; it prints the manifest's hash against the pin, and fails if a pin is set and differs.
  wsl-image:
    if: github.repository == 'Ma1achy/Principia' && github.actor == 'Ma1achy' && github.event_name == 'workflow_dispatch' && (inputs.only == 'wsl-register' || inputs.only == 'wsl-proofs')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: scripts/wsl/build-image.sh
        run: scripts/wsl/build-image.sh "$RUNNER_TEMP/wsl-image"
      - name: The image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wsl-image-${{ github.run_id }}
          path: ${{ runner.temp }}/wsl-image
          retention-days: 7
          compression-level: 0
          overwrite: true
      - name: The manifest alone
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wsl-manifest-${{ github.run_id }}
          path: ${{ runner.temp }}/wsl-image/manifest.txt
          retention-days: 90
          overwrite: true

  # Proof 6's hosted side: at WSL_PARITY_COMMIT, `cargo nextest run -p kernel --profile ci`, as `scripts/wsl/inside.sh
  # parity` runs it in the distro, its per-test results as this run's artifact. Kernel's tests: CPU only, deterministic,
  # needing neither bash nor PyYAML of the test machine, and enough of them to compare one by one.
  wsl-parity:
    if: github.repository == 'Ma1achy/Principia' && github.actor == 'Ma1achy' && github.event_name == 'workflow_dispatch' && inputs.only == 'wsl-proofs'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Dependencies without debug info, as in the image
        uses: ./.github/actions/cargo-ci-config
      - name: rustup toolchain install (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-nextest@0.9.146
      - name: Proof 6, the hosted side
        run: |
          mkdir -p "$RUNNER_TEMP/wsl-parity"
          bash scripts/wsl/inside.sh parity "$WSL_PARITY_COMMIT" > "$RUNNER_TEMP/wsl-parity/hosted.tsv"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wsl-parity-${{ github.run_id }}
          path: ${{ runner.temp }}/wsl-parity
          retention-days: 90
          overwrite: true

  # Registers `principia-wsl` from the cached image of this commit's recipe (`.github/scripts/wsl.ps1 register`), as
  # gh-runner, its disk under E:\wsl\principia-wsl\, never C:. The step ends `registered principia-wsl: ...` and exit
  # 0, or exit 125 naming why it refused. Its log says `cache hit` or `cache miss`.
  #
  # The image's download gets 25 minutes a try: 1.5 times the slower of the two whole downloads of it on the PC, 15 min
  # 51.5 s (run 42944409475) and 16 min 27.8 s (run 42954587933), each about 982.8 MB, rounded up to the minute. One
  # try ended short after 31 min 13 s (run 43128608743) and one hung until the job's limit, 57 min 49 s (run
  # 43146846084). Run 43312851701's took 12 min 56 s; the limit stays on the slower until the cache's misses time more.
  # The job's limit is R-988's, 1.5 times its slowest completed run on the PC (`.github/win-times.md`, runs from before
  # the cache), not a budget of its steps: the cache lookup's 5 and the two tries' 50 end inside it, so the step that
  # names a download that never finished runs, but a first try that hangs to its limit leaves the second try less than
  # its own, and the job's limit then ends it, a hang `win-retry` logs. (Was, until R-988: 95 minutes, the 4 to reach
  # the download, the cache lookup's 5, the two tries' 50, 5 for the two checks' SHA-256 and 31 for the registration,
  # the move into the cache and its check.)
  wsl-register:
    if: github.repository == 'Ma1achy/Principia' && github.actor == 'Ma1achy' && github.event_name == 'workflow_dispatch' && inputs.only == 'wsl-register'
    needs: [wsl-image]
    runs-on: [self-hosted, windows, nvidia]
    timeout-minutes: 51
    concurrency:
      group: wsl-register
      cancel-in-progress: false
    steps:
      - name: Self-check, first step
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File E:\runner-tools\checks\self-check.ps1
          exit $LASTEXITCODE
      - name: Guard the kept checkout
        run: |
          $guard = Join-Path $env:RUNNER_TEMP 'git_guard.ps1'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          try { Invoke-WebRequest -UseBasicParsing -OutFile $guard -Uri "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/.github/scripts/git_guard.ps1" } catch { "could not fetch the guard: $_"; exit 1 }
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $guard
          exit $LASTEXITCODE
      - name: Toolchain on PATH
        run: |
          Add-Content -LiteralPath $env:GITHUB_PATH -Value 'E:\runner-tools\cargo\bin'
          exit 0
      - name: Clean checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          clean: true
      - name: Record the commit, driver and toolchain
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\win_measure.ps1 start
          exit $LASTEXITCODE
      - name: The image cache on E:, there and writable
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\wsl.ps1 cache-ready
          exit $LASTEXITCODE
      - name: This run's recipe, its image in the cache and whole
        id: cache
        timeout-minutes: 5
        continue-on-error: true
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\wsl.ps1 cache-lookup
          exit $LASTEXITCODE
      - name: This run's image
        id: image
        timeout-minutes: 25
        if: steps.cache.outcome != 'success'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wsl-image-${{ github.run_id }}
          path: ${{ runner.temp }}/wsl-image
      - name: Check this run's image
        id: image-check
        if: steps.image.outputs.download-path != ''
        continue-on-error: true
        env:
          WSL_IMAGE: ${{ runner.temp }}/wsl-image
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\wsl.ps1 check-image
          exit $LASTEXITCODE
      - name: This run's image, again if the first download didn't finish whole
        id: image-again
        if: steps.image-check.outcome != 'success'
          && steps.cache.outcome != 'success'
        timeout-minutes: 25
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wsl-image-${{ github.run_id }}
          path: ${{ runner.temp }}/wsl-image
      - name: Check this run's image again
        id: image-check-again
        if: steps.image-again.outputs.download-path != ''
        continue-on-error: true
        env:
          WSL_IMAGE: ${{ runner.temp }}/wsl-image
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\wsl.ps1 check-image
          exit $LASTEXITCODE
      - name: This run's image, never downloaded whole
        if: steps.image-check.outcome != 'success' && steps.image-check-again.outcome != 'success' && steps.cache.outcome != 'success'
        run: |
          Write-Output '::error::download-artifact failed, hung or ended short twice (the image): neither attempt gave an image of the length and SHA-256 built'
          exit 1
      - name: Register principia-wsl
        env:
          WSL_IMAGE: ${{ runner.temp }}/wsl-image
          WSL_CACHE_HIT: ${{ steps.cache.outcome }}
          WSL_REPLACE: ${{ inputs.replace }}
        timeout-minutes: 1
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\win_measure.ps1 run wsl-register powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\wsl.ps1 register
          exit $LASTEXITCODE
      - name: Label the result in the summary
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\win_measure.ps1 finish
          exit $LASTEXITCODE
      - name: Keep the full output
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wsl-register-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/win-measure
          retention-days: 90

  # The six proofs (`.github/scripts/wsl.ps1 proofs`). The step's log, and `wsl-proofs.txt` in the artifact, end with
  # one line per proof, `proof <n>: PASS|FAIL: <evidence>`, and the job passes only if all six do.
  wsl-proofs:
    if: github.repository == 'Ma1achy/Principia' && github.actor == 'Ma1achy' && github.event_name == 'workflow_dispatch' && inputs.only == 'wsl-proofs'
    needs: [wsl-image, wsl-parity]
    runs-on: [self-hosted, windows, nvidia]
    timeout-minutes: 180
    concurrency:
      group: wsl-proofs
      cancel-in-progress: false
    steps:
      - name: Self-check, first step
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File E:\runner-tools\checks\self-check.ps1
          exit $LASTEXITCODE
      - name: Guard the kept checkout
        run: |
          $guard = Join-Path $env:RUNNER_TEMP 'git_guard.ps1'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          try { Invoke-WebRequest -UseBasicParsing -OutFile $guard -Uri "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/.github/scripts/git_guard.ps1" } catch { "could not fetch the guard: $_"; exit 1 }
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $guard
          exit $LASTEXITCODE
      - name: Toolchain on PATH
        run: |
          Add-Content -LiteralPath $env:GITHUB_PATH -Value 'E:\runner-tools\cargo\bin'
          exit 0
      - name: Clean checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          clean: true
      - name: Record the commit, driver and toolchain
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\win_measure.ps1 start
          exit $LASTEXITCODE
      - name: This run's rebuilt manifest
        id: manifest
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wsl-manifest-${{ github.run_id }}
          path: ${{ runner.temp }}/wsl-image
      - name: This run's rebuilt manifest, again if the first download didn't finish
        id: manifest-again
        if: steps.manifest.outputs.download-path == ''
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wsl-manifest-${{ github.run_id }}
          path: ${{ runner.temp }}/wsl-image
      - name: This run's rebuilt manifest, never downloaded
        if: steps.manifest.outputs.download-path == '' && steps.manifest-again.outputs.download-path == ''
        run: |
          Write-Output '::error::download-artifact failed, hung or ended short twice (the rebuilt manifest): neither attempt set download-path'
          exit 1
      - name: The hosted runner's parity results
        id: parity
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wsl-parity-${{ github.run_id }}
          path: ${{ runner.temp }}/wsl-parity
      - name: The hosted runner's parity results, again if the first download didn't finish
        id: parity-again
        if: steps.parity.outputs.download-path == ''
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wsl-parity-${{ github.run_id }}
          path: ${{ runner.temp }}/wsl-parity
      - name: The hosted runner's parity results, never downloaded
        if: steps.parity.outputs.download-path == '' && steps.parity-again.outputs.download-path == ''
        run: |
          Write-Output '::error::download-artifact failed, hung or ended short twice (the parity results): neither attempt set download-path'
          exit 1
      - name: The six proofs
        env:
          WSL_IMAGE: ${{ runner.temp }}/wsl-image
          WSL_HOSTED_PARITY: ${{ runner.temp }}/wsl-parity/hosted.tsv
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\win_measure.ps1 run wsl-proofs powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\wsl.ps1 proofs
          exit $LASTEXITCODE
      - name: Label the result in the summary
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\win_measure.ps1 finish
          exit $LASTEXITCODE
      - name: Keep the full output
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wsl-proofs-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/win-measure
          retention-days: 90

  # CPU tests and the job queue's mutants inside the distro (`.github/scripts/wsl.ps1 cpu`), through
  # `scripts/contain.sh` in its unprivileged mode; their results come out as a tar stream into the artifact. Off: it
  # refuses unless `.github/wsl-cpu-enabled` exists, which this file's tests require absent until a reviewed PR adds it.
  wsl-cpu:
    if: github.repository == 'Ma1achy/Principia' && github.actor == 'Ma1achy' && github.event_name == 'workflow_dispatch' && inputs.only == 'wsl-cpu'
    runs-on: [self-hosted, windows, nvidia]
    timeout-minutes: 330
    concurrency:
      group: wsl-cpu
      cancel-in-progress: false
    steps:
      - name: Self-check, first step
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File E:\runner-tools\checks\self-check.ps1
          exit $LASTEXITCODE
      - name: Guard the kept checkout
        run: |
          $guard = Join-Path $env:RUNNER_TEMP 'git_guard.ps1'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          try { Invoke-WebRequest -UseBasicParsing -OutFile $guard -Uri "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/.github/scripts/git_guard.ps1" } catch { "could not fetch the guard: $_"; exit 1 }
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $guard
          exit $LASTEXITCODE
      - name: Toolchain on PATH
        run: |
          Add-Content -LiteralPath $env:GITHUB_PATH -Value 'E:\runner-tools\cargo\bin'
          exit 0
      - name: Clean checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          clean: true
      - name: Record the commit, driver and toolchain
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\win_measure.ps1 start
          exit $LASTEXITCODE
      - name: CPU tests and the job queue's mutants in WSL
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\win_measure.ps1 run wsl-cpu powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\wsl.ps1 cpu
          exit $LASTEXITCODE
      - name: Label the result in the summary
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\win_measure.ps1 finish
          exit $LASTEXITCODE
      - name: Keep the full output
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wsl-cpu-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/win-measure
          retention-days: 90

  # The only daily re-proof of the setup: this job's first step, and the PC's hook before it. The guard test runs here too
  # (the hand-over on #390 asks for it), its controls with it, on the PC it protects; it reads the workflows with a YAML
  # crate, not PyYAML, so that it needs nothing the account doesn't have. So does the check that no launcher naming no
  # distro reaches one (#390, 14 Nov 2026; TASK-M0-72): a setting of the runner's account, which a hand or a `wsl
  # --import` can change, re-proved each night here rather than in `wsl-proofs`, which runs only when dispatched and
  # reports the six proofs RQ-751 (c) needs, no more. Its control, four simulated open routes the verdict must call open,
  # runs with it.
  win-self-check:
    # The persistent compile cache on E:\ci-cache is safe only because this runner runs trusted code: push to `main`,
    # schedule and workflow_dispatch, with the repository and actor guard on every job; if that guard ever loosens, the
    # persistent cache goes too.
    if: github.repository == 'Ma1achy/Principia' && github.actor == 'Ma1achy' && github.event_name != 'push' && (inputs.only == '' || inputs.only == 'all' || inputs.only == 'win-self-check')
    runs-on: [self-hosted, windows, nvidia]
    timeout-minutes: 17
    concurrency:
      group: win-self-check
      cancel-in-progress: false
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: E:\ci-cache\sccache
      SCCACHE_CACHE_SIZE: 50G
      CARGO_TARGET_DIR: E:\ci-cache\target\win-self-check-m89
    steps:
      - name: Self-check, first step
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File E:\runner-tools\checks\self-check.ps1
          exit $LASTEXITCODE
      - name: Guard the kept checkout
        run: |
          $guard = Join-Path $env:RUNNER_TEMP 'git_guard.ps1'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          try { Invoke-WebRequest -UseBasicParsing -OutFile $guard -Uri "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/.github/scripts/git_guard.ps1" } catch { "could not fetch the guard: $_"; exit 1 }
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $guard
          exit $LASTEXITCODE
      - name: E has 30 GB free
        run: |
          try { $free = ([System.IO.DriveInfo]::new('E')).AvailableFreeSpace } catch { "::error::could not read the free space on E: $_"; exit 1 }
          "E: has $([math]::Floor($free / 1GB)) GB free"
          if ($free -lt 30GB) { '::error::E: has under 30 GB free, which the compile cache needs: free space on E: or trim E:\ci-cache (TASK-M0-77)'; exit 1 }
          exit 0
      - name: Toolchain on PATH
        run: |
          Add-Content -LiteralPath $env:GITHUB_PATH -Value 'E:\runner-tools\cargo\bin'
          exit 0
      - name: Clean checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          clean: true
      # Unchanged sources get back the mtimes the last run left them (TASK-M0-89): see the header.
      - name: Unchanged sources keep their mtimes
        timeout-minutes: 5
        run: |
          $restore = Join-Path $env:RUNNER_TEMP 'mtime_restore.ps1'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          try { Invoke-WebRequest -UseBasicParsing -OutFile $restore -Uri "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/.github/scripts/mtime_restore.ps1" } catch { "could not fetch the mtime restore: $_"; exit 1 }
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $restore $env:GITHUB_WORKSPACE "${env:CARGO_TARGET_DIR}.mtimes.txt"
          exit $LASTEXITCODE
      - name: Record the commit, driver and toolchain
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\win_measure.ps1 start
          exit $LASTEXITCODE
      - name: No CRLF and no token left in the checkout
        run: |
          $files = @(git ls-files --eol)
          $status = $LASTEXITCODE
          if ($status -ne 0 -or -not $files.Count) { "git ls-files read nothing, status $status"; exit 1 }
          $crlf = @($files | Select-String 'i/lf\s+w/(crlf|mixed)').Count
          "tracked LF files with CRLF in the tree: $crlf"
          try { $tok = @(Select-String -LiteralPath '.git\config' -Pattern 'extraheader|x-access-token' -ErrorAction Stop).Count } catch { "could not read .git\config: $_"; exit 1 }
          "token lines in .git\config: $tok"
          if ($crlf -or $tok) { exit 1 }
          exit 0
      - name: No bash or wsl naming no distro reaches one
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\wsl_route.ps1
          exit $LASTEXITCODE
      - name: sccache on PATH, its stats zeroed
        id: sccache
        run: |
          $null = where.exe sccache 2>&1
          if ($LASTEXITCODE -ne 0) { '::error::sccache is not on the runner''s PATH: install it in E:\runner-tools\cargo\bin as the PC steps of TASK-M0-77''s PR say; a job never downloads it'; exit 1 }
          sccache --zero-stats
          exit $LASTEXITCODE
      - name: The guard on this workflow
        timeout-minutes: 5
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\win_measure.ps1 run guard cargo nextest run -p xtask --features controls --test runner_security --no-fail-fast --retries 0
          exit $LASTEXITCODE
      - name: sccache's stats
        if: ${{ always() && steps.sccache.outcome == 'success' }}
        run: |
          sccache --show-stats
          exit $LASTEXITCODE
      - name: Label the result in the summary
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\win_measure.ps1 finish
          exit $LASTEXITCODE
      - name: Keep the full output
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: win-self-check-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/win-measure
          retention-days: 90

  # The proof of Windows containment (the owner's CI shape order of 8 Nov 2026, step 1):
  # `.github/scripts/win_contain.ps1 check`, the scenarios of `scripts/contain.sh check` against a Job Object with
  # kill-on-close, a process limit and REQ-VAL-181's 8 GiB per-process cap. "Containment, memory cap and the 36 h no-run
  # alert are prerequisites for any job placed on Windows": until this passes here, mutants of `xtask/src/jobq.rs` and
  # every job that would be placed on Windows stay on GitHub-hosted runners. By `workflow_dispatch` with `only` set to it
  # alone, never on a push, the schedule or `all`, until the proof has passed (`xtask/tests/win_contain.rs` pins that):
  # `gh workflow run win-gpu.yml --ref main -f only=win-contain`. The step "Containment check" ends
  # `win_contain.ps1 check: contained: ...` and exit 0 when every Job Object scenario held. It runs no cargo.
  win-contain:
    if: github.repository == 'Ma1achy/Principia' && github.actor == 'Ma1achy' && github.event_name == 'workflow_dispatch' && inputs.only == 'win-contain'
    runs-on: [self-hosted, windows, nvidia]
    timeout-minutes: 30
    concurrency:
      group: win-contain
      cancel-in-progress: false
    steps:
      - name: Self-check, first step
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File E:\runner-tools\checks\self-check.ps1
          exit $LASTEXITCODE
      - name: Guard the kept checkout
        run: |
          $guard = Join-Path $env:RUNNER_TEMP 'git_guard.ps1'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          try { Invoke-WebRequest -UseBasicParsing -OutFile $guard -Uri "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/.github/scripts/git_guard.ps1" } catch { "could not fetch the guard: $_"; exit 1 }
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $guard
          exit $LASTEXITCODE
      - name: Toolchain on PATH
        run: |
          Add-Content -LiteralPath $env:GITHUB_PATH -Value 'E:\runner-tools\cargo\bin'
          exit 0
      - name: Clean checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          clean: true
      - name: Record the commit, driver and toolchain
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\win_measure.ps1 start
          exit $LASTEXITCODE
      - name: Containment check
        env:
          PRIN_CONTAIN: required
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\win_measure.ps1 run contain-check powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\win_contain.ps1 check
          exit $LASTEXITCODE
      - name: Label the result in the summary
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\win_measure.ps1 finish
          exit $LASTEXITCODE
      - name: Keep the full output
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: win-contain-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/win-measure
          retention-days: 90

  # The WSL2 image, built on a hosted runner from `scripts/wsl/build-image.sh` for this run's `wsl-register` or
  # `wsl-proofs` (proof 5's rebuild): the image, and its manifest alone, as this run's artifacts. Hosted, so the
  # shell is bash; the build prints the manifest's hash against the pin, and fails if a pin is set and differs.
  #
  # The Actions cache (R-1004): the key is `wsl-image-` and the recipe key, computed as `wsl.ps1`'s `Get-RecipeKey`
  # computes it, from the same files in the same order, so a recipe has one key here and on the PC. The step restores in
  # every run, with no restore keys, since another recipe's image is never this one's. On a hit the build is skipped,
  # except for `wsl-proofs`, which always builds (proof 5, R-1004's (i)); a hit was saved by a build of this recipe, its
  # pin included, which passed the pin's check. The save runs only on a miss in a `wsl-register` dispatch on `main`,
  # after the build passed, never on a pull request (no trigger here has one) or a push. The cache needs no permission
  # beyond the workflow's `contents: read`.
  wsl-image:
    if: github.repository == 'Ma1achy/Principia' && github.actor == 'Ma1achy' && github.event_name == 'workflow_dispatch' && (inputs.only == 'wsl-register' || inputs.only == 'wsl-proofs')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: The recipe key
        id: recipe
        run: |
          files=(scripts/wsl/build-image.sh scripts/wsl/manifest.sh scripts/wsl/wsl.conf scripts/wsl/manifest.sha256 rust-toolchain.toml)
          key=$({ echo 'principia-wsl recipe 1'; for f in "${files[@]}"; do echo "$f $(sha256sum "$f" | cut -d ' ' -f 1)"; done; } | sha256sum | cut -d ' ' -f 1)
          echo "recipe key: $key"
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: The image, from the Actions cache
        id: cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/wsl-image
          key: wsl-image-${{ steps.recipe.outputs.key }}
      - name: scripts/wsl/build-image.sh
        if: steps.cache.outputs.cache-hit != 'true' || inputs.only == 'wsl-proofs'
        run: |
          rm -rf "$RUNNER_TEMP/wsl-image"
          scripts/wsl/build-image.sh "$RUNNER_TEMP/wsl-image"
      - name: Keep the build in the Actions cache
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.only == 'wsl-register' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/wsl-image
          key: wsl-image-${{ steps.recipe.outputs.key }}
      - name: The image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wsl-image-${{ github.run_id }}
          path: ${{ runner.temp }}/wsl-image
          retention-days: 7
          compression-level: 0
          overwrite: true
      - name: The manifest alone
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wsl-manifest-${{ github.run_id }}
          path: ${{ runner.temp }}/wsl-image/manifest.txt
          retention-days: 90
          overwrite: true

  # Proof 6's hosted side: at WSL_PARITY_COMMIT, `cargo nextest run -p kernel --profile ci`, as `scripts/wsl/inside.sh
  # parity` runs it in the distro, its per-test results as this run's artifact. Kernel's tests: deterministic, needing
  # neither bash nor PyYAML of the test machine, and enough of them to compare one by one. Not CPU only: its GPU harness
  # tests run on Vulkan, which `inside.sh` selects on both sides, so this job installs lavapipe as `ci.yml`'s test jobs
  # do and the image does (run 43418528499: without it, 13 GPU tests failed here and passed in the distro).
  wsl-parity:
    if: github.repository == 'Ma1achy/Principia' && github.actor == 'Ma1achy' && github.event_name == 'workflow_dispatch' && inputs.only == 'wsl-proofs'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Dependencies without debug info, as in the image
        uses: ./.github/actions/cargo-ci-config
      - name: rustup toolchain install (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-nextest@0.9.146
      - name: Restore the Mesa packages
        id: mesa
        timeout-minutes: 8
        uses: ./.github/actions/mesa-debs
        with:
          packages: mesa-vulkan-drivers
      - name: Install Mesa (lavapipe)
        if: steps.mesa.outputs.installed != 'true'
        timeout-minutes: 8
        run: bounded() { limit=$1; shift; for attempt in 1 2 3; do sudo timeout -k 10 "$limit" "$@" && return; echo "attempt $attempt of 3 failed or ran past $limit s, $*"; done; return 1; }; bounded 90 apt-get update && bounded 420 apt-get install -y mesa-vulkan-drivers -oDPkg::Lock::Timeout=60
      - name: Proof 6, the hosted side
        run: |
          mkdir -p "$RUNNER_TEMP/wsl-parity"
          bash scripts/wsl/inside.sh parity "$WSL_PARITY_COMMIT" > "$RUNNER_TEMP/wsl-parity/hosted.tsv"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wsl-parity-${{ github.run_id }}
          path: ${{ runner.temp }}/wsl-parity
          retention-days: 90
          overwrite: true

  # Registers `principia-wsl` from the cached image of this commit's recipe (`.github/scripts/wsl.ps1 register`), as
  # gh-runner, its disk under E:\wsl\principia-wsl\, never C:. The step ends `registered principia-wsl: ...` and exit
  # 0, or exit 125 naming why it refused. Its log says `cache hit` or `cache miss`.
  #
  # The image's download gets 25 minutes a try: 1.5 times the slower of the two whole downloads of it on the PC, 15 min
  # 51.5 s (run 42944409475) and 16 min 27.8 s (run 42954587933), each about 982.8 MB, rounded up to the minute. One
  # try ended short after 31 min 13 s (run 43128608743) and one hung until the job's limit, 57 min 49 s (run
  # 43146846084). Run 43312851701's took 12 min 56 s; the limit stays on the slower until the cache's misses time more.
  # The job's 95 minutes: the 4 minutes the PC has taken to reach the download (3 min 59 s at most), the cache lookup's
  # 5, the two tries' 50, 5 for the two checks' SHA-256 of the image, and the 31 the old limit of 60 left the
  # registration after a 25-minute download, which now holds the move into the cache and its check as well. R-988
  # keeps it, and the registration step's want of a limit of its own, until the job has a completed run: no run on the
  # PC has yet registered the image, every registration having refused within 2 s or never been reached
  # (`.github/win-times.md`).
  wsl-register:
    if: github.repository == 'Ma1achy/Principia' && github.actor == 'Ma1achy' && github.event_name == 'workflow_dispatch' && inputs.only == 'wsl-register'
    needs: [wsl-image]
    runs-on: [self-hosted, windows, nvidia]
    timeout-minutes: 95
    concurrency:
      group: wsl-register
      cancel-in-progress: false
    steps:
      - name: Self-check, first step
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File E:\runner-tools\checks\self-check.ps1
          exit $LASTEXITCODE
      - name: Guard the kept checkout
        run: |
          $guard = Join-Path $env:RUNNER_TEMP 'git_guard.ps1'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          try { Invoke-WebRequest -UseBasicParsing -OutFile $guard -Uri "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/.github/scripts/git_guard.ps1" } catch { "could not fetch the guard: $_"; exit 1 }
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $guard
          exit $LASTEXITCODE
      - name: Toolchain on PATH
        run: |
          Add-Content -LiteralPath $env:GITHUB_PATH -Value 'E:\runner-tools\cargo\bin'
          exit 0
      - name: Clean checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          clean: true
      - name: Record the commit, driver and toolchain
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\win_measure.ps1 start
          exit $LASTEXITCODE
      - name: The image cache on E:, there and writable
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\wsl.ps1 cache-ready
          exit $LASTEXITCODE
      - name: This run's recipe, its image in the cache and whole
        id: cache
        timeout-minutes: 5
        continue-on-error: true
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\wsl.ps1 cache-lookup
          exit $LASTEXITCODE
      - name: This run's image
        id: image
        timeout-minutes: 25
        if: steps.cache.outcome != 'success'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wsl-image-${{ github.run_id }}
          path: ${{ runner.temp }}/wsl-image
      - name: Check this run's image
        id: image-check
        if: steps.image.outputs.download-path != ''
        continue-on-error: true
        env:
          WSL_IMAGE: ${{ runner.temp }}/wsl-image
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\wsl.ps1 check-image
          exit $LASTEXITCODE
      - name: This run's image, again if the first download didn't finish whole
        id: image-again
        if: steps.image-check.outcome != 'success'
          && steps.cache.outcome != 'success'
        timeout-minutes: 25
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wsl-image-${{ github.run_id }}
          path: ${{ runner.temp }}/wsl-image
      - name: Check this run's image again
        id: image-check-again
        if: steps.image-again.outputs.download-path != ''
        continue-on-error: true
        env:
          WSL_IMAGE: ${{ runner.temp }}/wsl-image
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\wsl.ps1 check-image
          exit $LASTEXITCODE
      - name: This run's image, never downloaded whole
        if: steps.image-check.outcome != 'success' && steps.image-check-again.outcome != 'success' && steps.cache.outcome != 'success'
        run: |
          Write-Output '::error::download-artifact failed, hung or ended short twice (the image): neither attempt gave an image of the length and SHA-256 built'
          exit 1
      - name: Register principia-wsl
        env:
          WSL_IMAGE: ${{ runner.temp }}/wsl-image
          WSL_CACHE_HIT: ${{ steps.cache.outcome }}
          WSL_REPLACE: ${{ inputs.replace }}
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\win_measure.ps1 run wsl-register powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\wsl.ps1 register
          exit $LASTEXITCODE
      - name: Label the result in the summary
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\win_measure.ps1 finish
          exit $LASTEXITCODE
      - name: Keep the full output
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wsl-register-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/win-measure
          retention-days: 90

  # The six proofs (`.github/scripts/wsl.ps1 proofs`). The step's log, and `wsl-proofs.txt` in the artifact, end with
  # one line per proof, `proof <n>: PASS|FAIL: <evidence>`, and the job passes only if all six do.
  wsl-proofs:
    if: github.repository == 'Ma1achy/Principia' && github.actor == 'Ma1achy' && github.event_name == 'workflow_dispatch' && inputs.only == 'wsl-proofs'
    needs: [wsl-image, wsl-parity]
    runs-on: [self-hosted, windows, nvidia]
    timeout-minutes: 180
    concurrency:
      group: wsl-proofs
      cancel-in-progress: false
    steps:
      - name: Self-check, first step
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File E:\runner-tools\checks\self-check.ps1
          exit $LASTEXITCODE
      - name: Guard the kept checkout
        run: |
          $guard = Join-Path $env:RUNNER_TEMP 'git_guard.ps1'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          try { Invoke-WebRequest -UseBasicParsing -OutFile $guard -Uri "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/.github/scripts/git_guard.ps1" } catch { "could not fetch the guard: $_"; exit 1 }
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $guard
          exit $LASTEXITCODE
      - name: Toolchain on PATH
        run: |
          Add-Content -LiteralPath $env:GITHUB_PATH -Value 'E:\runner-tools\cargo\bin'
          exit 0
      - name: Clean checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          clean: true
      - name: Record the commit, driver and toolchain
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\win_measure.ps1 start
          exit $LASTEXITCODE
      - name: This run's rebuilt manifest
        id: manifest
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wsl-manifest-${{ github.run_id }}
          path: ${{ runner.temp }}/wsl-image
      - name: This run's rebuilt manifest, again if the first download didn't finish
        id: manifest-again
        if: steps.manifest.outputs.download-path == ''
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wsl-manifest-${{ github.run_id }}
          path: ${{ runner.temp }}/wsl-image
      - name: This run's rebuilt manifest, never downloaded
        if: steps.manifest.outputs.download-path == '' && steps.manifest-again.outputs.download-path == ''
        run: |
          Write-Output '::error::download-artifact failed, hung or ended short twice (the rebuilt manifest): neither attempt set download-path'
          exit 1
      - name: The hosted runner's parity results
        id: parity
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wsl-parity-${{ github.run_id }}
          path: ${{ runner.temp }}/wsl-parity
      - name: The hosted runner's parity results, again if the first download didn't finish
        id: parity-again
        if: steps.parity.outputs.download-path == ''
        timeout-minutes: 5
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wsl-parity-${{ github.run_id }}
          path: ${{ runner.temp }}/wsl-parity
      - name: The hosted runner's parity results, never downloaded
        if: steps.parity.outputs.download-path == '' && steps.parity-again.outputs.download-path == ''
        run: |
          Write-Output '::error::download-artifact failed, hung or ended short twice (the parity results): neither attempt set download-path'
          exit 1
      - name: The six proofs
        env:
          WSL_IMAGE: ${{ runner.temp }}/wsl-image
          WSL_HOSTED_PARITY: ${{ runner.temp }}/wsl-parity/hosted.tsv
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\win_measure.ps1 run wsl-proofs powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\wsl.ps1 proofs
          exit $LASTEXITCODE
      - name: Label the result in the summary
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\win_measure.ps1 finish
          exit $LASTEXITCODE
      - name: Keep the full output
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wsl-proofs-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/win-measure
          retention-days: 90

  # One named mutation workload inside the distro (`.github/scripts/wsl.ps1 cpu`, `scripts/wsl/inside.sh mutants`),
  # through `scripts/contain.sh` in its unprivileged mode; its results come out as a tar stream into the artifact. CPU
  # only: the distro's GPU share is off (`[gpu] enabled=false`), so its Vulkan is lavapipe. It refuses unless
  # `.github/wsl-cpu-enabled` exists, unless the dispatch names the workload in full, and unless the workload's commits
  # are the owner's, signed with the pinned key (`inside.sh trust`).
  wsl-cpu:
    if: github.repository == 'Ma1achy/Principia' && github.actor == 'Ma1achy' && github.event_name == 'workflow_dispatch' && inputs.only == 'wsl-cpu'
    runs-on: [self-hosted, windows, nvidia]
    timeout-minutes: 330
    concurrency:
      group: wsl-cpu
      cancel-in-progress: false
    steps:
      - name: Self-check, first step
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File E:\runner-tools\checks\self-check.ps1
          exit $LASTEXITCODE
      - name: Guard the kept checkout
        run: |
          $guard = Join-Path $env:RUNNER_TEMP 'git_guard.ps1'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          try { Invoke-WebRequest -UseBasicParsing -OutFile $guard -Uri "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/.github/scripts/git_guard.ps1" } catch { "could not fetch the guard: $_"; exit 1 }
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $guard
          exit $LASTEXITCODE
      - name: Toolchain on PATH
        run: |
          Add-Content -LiteralPath $env:GITHUB_PATH -Value 'E:\runner-tools\cargo\bin'
          exit 0
      - name: Clean checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          clean: true
      - name: Record the commit, driver and toolchain
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\win_measure.ps1 start
          exit $LASTEXITCODE
      - name: The named mutation workload in WSL
        env:
          WSL_MUTANTS_COMMIT: ${{ inputs.mutants_commit }}
          WSL_MUTANTS_BASE: ${{ inputs.mutants_base }}
          WSL_MUTANTS_PACKAGES: ${{ inputs.mutants_packages }}
          WSL_MUTANTS_TIMEOUT: ${{ inputs.mutants_timeout }}
          WSL_MUTANTS_FILTER: ${{ inputs.mutants_filter }}
          WSL_MUTANTS_JOBS: ${{ inputs.mutants_jobs }}
          WSL_MUTANTS_SHARD: ${{ inputs.mutants_shard }}
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\win_measure.ps1 run wsl-cpu powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\wsl.ps1 cpu
          exit $LASTEXITCODE
      - name: Label the result in the summary
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\win_measure.ps1 finish
          exit $LASTEXITCODE
      - name: Keep the full output
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wsl-cpu-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/win-measure
          retention-days: 90

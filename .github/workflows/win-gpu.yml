# Measurements on the owner's Windows PC, `malachys-pc-rtx2080s`, RTX 2080 SUPER (R-711 item 1, which amends R-186 and
# R-656 for this one runner; R-859, which says what it may run from the anchor move, each a named measurement reporting
# under its own name and never a required check, `xtask/tests/runner_security.rs` holding every self-hosted job to that
# list by name; gpu-idle and the weekly proof are `runner-proof.yml`'s): the Vulkan GPU suites, nightly and on `main`; a
# nightly self-check, the only daily
# re-proof of the setup, since `schedule` fires only from `main`; and, dispatched by hand alone, the proof of Windows
# containment (`win-contain`, below). Every result
# here is a measurement, never a required check (R-649): the PC is sometimes off, and nothing on `main` waits for it.
# No job here is gathered or read by any gate, and a red one is not main red. A job here that stops on a runner-level
# fault is re-run once, automatically, by the hosted job `win-retry` (`win-retry.yml`, R-988), the one reader of this
# workflow, which logs every such stop and every hang; nothing else retries a job here. `xtask/tests/runner_security.rs`
# fails if that ever stops holding, or if a rule below is broken. DX12 waits for its opt-in (R-711 item 2). No
# benchmarks or soak run here, and no mutants outside the WSL2 distro's `wsl-cpu` (below), which runs one named mutation
# workload when dispatched with it and nothing else.
#
# The PC runs the GPU suites only (the owner, 14 Nov 2026: "The PC runs the GPU suites only. Tests that fail there for
# lack of Unix tools ... are excluded on Windows with a stated reason (they run on hosted Linux already), not fixed";
# TASK-M0-71). The nightly Windows build and CPU tests, `win-tests`, are gone: they ran xtask's tests that start a bare
# `bash`, which on this runner's account resolves to C:\Windows\System32\bash.exe, WSL's launcher, and so ran inside
# the default distro and wrote to it (run 43593938536). No test a job here runs may start a bare `bash` or `wsl`:
# `xtask/tests/ci_win_no_wsl.rs` reads every cargo command of the jobs on the runner and fails if a test it can reach
# does, unless that test's file is excluded on Windows with its reason. The route itself is closed too: gh-runner's
# default WSL distribution names no distro (the PC's setting of 14 Nov 2026, #390), `wsl.ps1 register` closes it again
# after each `wsl --import`, which reopens it, and `win-self-check` proves it each night: as gh-runner, System32's
# `bash.exe -c true` and `wsl.exe -e true` must fail and leave every distro's state as it was (`wsl_route.ps1`).
#
# The repository is public and this runner is a real PC, so these are the conditions for having it at all (R-711 items
# 1 and 5, the owner's job rules of 5 Nov 2026). Never add a `pull_request` or `pull_request_target` trigger: only push
# to `main`, schedule and workflow_dispatch, which is also the only way to run this on a branch. Every job carries the
# repository and actor guard. No credential reaches a job: `contents: read`, no repository secret, and checkout with
# `persist-credentials: false`. Every action is pinned to a full commit SHA, its version in a comment. The hook on the PC
# enforces the same triggers from outside the repository, whatever this file says.
#
# `.env` on the runner sets CARGO_HOME, RUSTUP_HOME, CARGO_TARGET_DIR, TEMP and TMP on E:, so this file sets none of them
# but CARGO_TARGET_DIR, which each job that compiles moves to a folder of its own on E: (the compile cache, below), and
# never runs `cargo clean`: a job can change what's in its target folder, not remove it. `core.autocrlf false` is in
# the account's read-only gitconfig. `.github/actions/cargo-ci-config` isn't used here: it writes a config into
# CARGO_HOME, which is read-only to the account and outlives the job, so dependencies keep their default debug info on
# this one runner.
#
# Every suite's output goes through `.github/scripts/win_measure.ps1`, which keeps the full output and labels the result
# `possibly faulty hardware (owner-reported)`, with the commit and driver version, in the job's summary and artifact. A
# recorded run can serve Paper 2's non-Metal parity evidence (R-711 item 4), and an artifact lasts 90 days at most, so
# copy one that's cited. A step after a failed suite still runs, so one failure doesn't hide the rest; the job ends red.
#
# Reported, not asserted (TASK-M0-88, the orchestrator's call ahead of TASK-M4-30 and TASK-M4-31, which scope these
# in the code): on this card, a driver other than CI's Metal and lavapipe, twelve tests and the golden suite `quantise` are
# run and their result recorded, but never fail the job. R-694: `compute_fast_math` is a measurement on gpu-metal and
# gpu-lavapipe, and "On any other driver it is reported"; R-695: near-tie golden cases are "held only on CI's
# backends; elsewhere reported, not compared to pass"; `qa_compute_fast_math_header_is_the_dispatch` assumes an adapter
# `session_adapter` refuses on a discrete GPU (RQ-201); `build_kernel_runs_in_ci` is not a GPU test, and the hosted
# gpu-kernel job runs it. The asserting steps leave them out through `.config/nextest.toml`'s `win-asserted` and
# `win-gpu-kernel` profiles, and the golden suites run one step each, `quantise` aside; each reporting step runs
# exactly them, under `win-reported`, with WIN_MEASURE_REPORT in its own env, which makes `win_measure.ps1 run` write
# the counts and key lines to the job's summary and exit 0. WIN_MEASURE_REPORT is set on those steps alone, so it can't
# hide a failure anywhere else. `xtask/tests/runner_security.rs` holds all of this. The hosted gpu-metal and
# gpu-lavapipe jobs still assert every one of them.
#
# Concurrency: a group per job, each holding only that job's runs. The runner is one machine and takes one job at a time,
# so the GPU is never shared whatever the groups; they bound the queue, and being per job, a push can't displace a
# nightly's `win-self-check`, which pushes never run. `win-vulkan`, the 85-minute run, cancels in
# progress for merges and dispatches: a newer one cancels an older one still running, so the PC works on the newest
# commit. The nightly's `win-vulkan` is in a group of its own and is never cancelled by them: it is the Windows check, and
# merges come often enough to cancel it every day. Every other job keeps
# `cancel-in-progress: false`: a running measurement finishes. GitHub keeps at most one run waiting in a group and
# cancels the older waiting one, so with the PC off at most two of each job wait, the holder and the newest, and no queue
# can pile up; a job a runner hasn't taken after 24 to 48 hours is cancelled by GitHub. A cancelled run is no failure,
# and `win-retry` re-runs none.
#
# Time limits (R-988): every job here on the runner, and every step that builds or runs tests (each step started
# through `win_measure.ps1 run`), carries `timeout-minutes` of 1.5 times its measured time, rounded up to a whole
# minute: the slowest of its last five completed runs on the PC, in `.github/win-times.md` with their run ids, written
# before the limits were set (R-649). A job or step with no completed run on record keeps its present limit. A step or
# job at its limit is a hang: it ends there, `win-retry` logs it, and nothing re-runs it.
#
# The checkout is kept between runs, since a full clone took 11.2 of 18.3 minutes on this PC's hard drive (the owner, 5 Nov
# 2026): `fetch-depth: 1` and `clean: true`, explicit. No job here needs history: they run the suites hosted jobs run at
# checkout's default depth of 1. A job that did would state its own depth and why. A job can write to that folder, so
# each job's second step is `.github/scripts/git_guard.ps1`, before anything runs git there. It's fetched at the job's own
# commit, since a copy in the kept folder is what it distrusts, and on a first run there is none. If it fires it logs to
# WIN_REFUSAL_LOG, on the PC, empties the checkout and fails the job. If it passes it writes an empty `.git/index` and
# detaches HEAD at an empty tree, so `clean: true` clears the tree and checkout writes it again, keeping `.git` and the
# fetch's saving. The PC's hook runs a guard of its own before any step; this one is the second layer.
#
# The compile cache (TASK-M0-77, the owner's order of 17 Nov 2026), on the PC's own disk and never uploaded. Each job
# that compiles on the runner itself, `win-vulkan` and `win-self-check` (the WSL2 jobs compile inside the distro, which
# keeps its own cache), sets in its own env RUSTC_WRAPPER=sccache, SCCACHE_DIR=E:\ci-cache\sccache and a 50G cap, and
# CARGO_TARGET_DIR=E:\ci-cache\target\<its job id>-m89 (the suffix is TASK-M0-89's: see below), outside the checkout,
# so `clean: true` never empties it, and no two jobs share one: each job's folder is its own, and the runner's one slot
# runs one job at a time. CARGO_HOME stays on E: from `.env`, so the registry isn't downloaded again. sccache must be on
# the runner's PATH, in E:\runner-tools\cargo\bin, installed by hand (TASK-M0-77's PR gives the steps): a job never
# downloads it, and fails naming that step if it isn't there. Its stats are zeroed before the job's first build and
# shown at its end, pass or fail, the hit rate in the log, whenever that zeroing step succeeded, so a failed guard or
# free-space check isn't followed by a second error.
# `win-vulkan` takes the kernel from E:\ci-cache\kernel\<source hash> when that entry is whole (PRIN_KERNEL_CACHE in
# its env; the hash is `kernel-src-hash`'s, the one the hosted jobs and the Mac use). Before its checkout each such
# job fails if E: has under 30 GB free. On Sunday (UTC) the scheduled `win-vulkan` trims the cache after its suites
# (`ci-cache-trim`): the target folders, oldest last write first, until they hold 150 GB at most, never its own, and the
# kernel entries to the newest 5; sccache trims its own folder to its cap.
# Warm rebuilds (TASK-M0-89, the orchestrator's call under R-1033): the guard's empty index has `clean: true` delete and
# write every tracked file, so each source gets a mtime newer than cargo's fingerprints and unchanged crates rebuild. In
# each job that compiles, the step after the checkout, `.github/scripts/mtime_restore.ps1`, fetched at the job's own
# commit as the guard is and never run from the checkout, gives each tracked file whose git blob id is the one the job's
# last run recorded the mtime it had then, and keeps a changed or new file's fresh mtime. Its record is the file beside
# the job's target folder, <CARGO_TARGET_DIR>.mtimes.txt, outside the checkout; the trim removes folders only, so it
# never removes a record, and a record whose folder it removed restores mtimes onto an empty target: a full build. A
# missing, unreadable or malformed record, or a changed `.gitattributes`, restores nothing: a full rebuild, never a
# stale one. A run that builds without the step can't leave a record that no longer describes its target: the jobs
# that carry the step build into target folders named `<job id>-m89`, which no workflow before this step names, so a
# dispatch of an older ref builds into the old `<job id>` folders, and a revert of the step reverts the folder's name
# with it. One case stays open: a build step that rewrites a tracked file with other bytes after the restore leaves a
# record naming the checkout's blob for those bytes; no step does so. It changes no test and no suite;
# `xtask/tests/ci_win_mtimes.rs` holds it.
# The persistent compile cache on E:\ci-cache is safe only because this runner runs trusted code: push to `main`,
# schedule and workflow_dispatch, with the repository and actor guard on every job; if that guard ever loosens, the
# persistent cache goes too.
#
# Every script here is started as a child `powershell -File`, which sets $LASTEXITCODE even if the script can't load or
# parse. `& script` wouldn't: the step would go on, and `exit $null` is a green step with nothing run.
#
# The schedule, 05:17 UTC: Windows may restart for updates from 23:00 to 05:00 on this PC.
#
# The WSL2 distro `principia-wsl` (RQ-751 option (c), built in parallel to replace (b) and never blocking; the owner's
# words of 9 Nov 2026), dispatched by hand alone, each job by `only` naming it, never on a push, the schedule or `all`:
# - `wsl-register` imports the image of this commit's recipe to E:\wsl\principia-wsl\, as gh-runner: `gh workflow run
#   win-gpu.yml --ref main -f only=wsl-register`, with `-f replace=true` to replace a registered one. The image comes
#   from the PC's cache, E:\runner-tools\wsl-cache\, when it holds one of this recipe, and otherwise from this run's
#   hosted `wsl-image` job (`scripts/wsl/build-image.sh`), downloaded and cached (below). It refuses an image whose
#   manifest isn't the one pinned in `scripts/wsl/manifest.sha256`, and so refuses every image until a reviewed PR pins
#   one.
# - `wsl-proofs` runs the six proofs, each reported PASS or FAIL with its evidence in its log and in `wsl-proofs.txt` in
#   its artifact: `gh workflow run win-gpu.yml --ref main -f only=wsl-proofs`. Proof 5 compares this run's rebuild, and
#   proof 6 this run's hosted `wsl-parity`, with what is in the distro.
# - `wsl-cpu` runs one named mutation workload inside the distro, through `scripts/contain.sh` in its unprivileged
#   mode, and nothing else (the owner's answer to RQ-825 (closed by R-1029), 16 Nov 2026: "yes move mutation runs onto the PC (if they are
#   faster there, measure first)"; and on 17 Nov 2026, R-1017, "i'd move them", to be made faster there): `cargo mutants
#   --in-diff <base..commit> --package <each> -j <jobs> [--shard <k/n>] --timeout <s> -- -E <filterset>` at the commit,
#   nextest's `mutants` profile, every value from the dispatch's `mutants_*` inputs and each checked inside before
#   anything runs (`scripts/wsl/inside.sh mutants`): `gh workflow run win-gpu.yml --ref main -f only=wsl-cpu -f
#   mutants_commit=<sha> -f mutants_base=<its merge base with main> -f mutants_packages='<crate> ...' -f
#   mutants_timeout=<s> -f mutants_filter='<filterset>'`, with `-f mutants_jobs=<1 to 4>` (1 by default; more than 1
#   only where the distro's memory is at least 8 GiB a job, an allowance, and the drive has 12 GiB a job) and `-f mutants_shard=<k/n>` for a
#   workload past the job's 330 minutes, each shard dispatched only once the one before has finished (a run waiting
#   in the group is cancelled by the next). At -j 1 the run builds in a cache kept in the distro between dispatches,
#   keyed on the commit's toolchain and lockfile, cleared past 24 GiB; at more, each job's copy builds a target of its
#   own. An out-of-memory kill during the run fails it (`scripts/contain.sh`). Nothing builds unless the commit is on
#   one of origin's branches (never `refs/pull`), the base is on main, and every commit between them is signed with the owner's key
#   pinned in `.github/allowed_signers` (`inside.sh trust`; R-711 item 6). Its artifact holds mutants.out/, the diff, the log, the
#   wall time and the host's CPU model and cores. The CPU tests and the job queue's mutants stay off the PC (R-1014,
#   R-912). It refuses unless `.github/wsl-cpu-enabled` exists, added once all six proofs had passed (run 43756345312,
#   15 Nov 2026).
# The PC takes the image from this run alone: a run's artifact downloads only with a token, and no job here holds one
# (the owner's answer to RQ-807, R-1004: "No credential on the PC"). So each of the first two jobs needs a hosted job of
# the same run, the only hosted jobs in this file. They carry the runner's guard, run only when dispatched, and build no
# kernel. The hosted `wsl-image` keeps its build in the Actions cache under `wsl-image-<recipe key>`, the key the PC's
# cache uses (below; R-1004: "(3) + (4), and (i)"): restored in every run, built only on a miss, or for `wsl-proofs`,
# whose proof 5 is this run's rebuild (i), and uploaded as before. It is saved only from a `wsl-register` dispatch on
# `main`, the one cache saved outside a push to `main` (R-326's exception, amended by R-1004).
# Each download of their artifacts has its own time limit and runs a second time if the first failed, hung or didn't
# finish, and the job then fails naming it if neither did: download-artifact v4.3.0 can stall mid-stream and still end
# with exit 0, its step green over part of a file (run 43128608743's image), or hang with no output (run 43146846084's),
# and it sets `download-path` only once a download has finished. The image is checked after each try, its length and
# SHA-256 against those built (`wsl.ps1 check-image`), and tried again if it isn't whole. Those artifacts' names
# carry the run but not the attempt, so a re-run of the failed jobs alone finds the first attempt's; their uploads
# overwrite, so a re-run of the hosted job replaces them. `wsl.ps1 register` still checks the image's length and hash.
#
# The image cache (the owner's words of 12 Nov 2026: "stop moving the image every run"). The image's bytes differ from
# build to build (run 43312851701: tar order, times, logs), so `wsl-register` files it on the PC by its recipe, the
# SHA-256 of `build-image.sh`, the files of the repository it reads and the manifest's pin (`wsl.ps1`'s
# `Get-RecipeKey`), in E:\runner-tools\wsl-cache\<recipe key>\ with the length and SHA-256 it had when built. The
# owner makes that folder, writable by gh-runner; if it isn't there, the job's first step after the checkout's record
# fails, naming it, and nothing is written anywhere else. On a hit the job downloads nothing; on a miss it downloads as
# above, and `register` checks the download and moves it into the cache. Either way the cache's copy is checked, its
# length and SHA-256 against those recorded, before it is imported: never trusted by its name. The cache keeps this
# image and the one used before it, no more, and stays as built (R-1004's (3)). The hosted job still uploads the image
# on every `wsl-register` dispatch, restored from the Actions cache or built: it can't learn what the PC holds (no job
# may wait on a self-hosted one, `runner_security.rs`: never gathered; and a run reads another's artifacts only with a
# token). The Actions cache's entry, about 1 GB of the repository's 10 GB, goes after 7 days unused or when newer
# entries evict it; whether it survives between dispatches is reported, a measurement, never tuned. `wsl-proofs` builds
# as before: proof 5 is this run's rebuild.
#
# The paths: what `scripts/ci_changes.sh` calls a GPU path, written as a filter, less R-692's five paths of `gui`. Docs-only
# pushes run nothing (R-711 item 5); nor do `gui` and `prin`, which no job here builds. `schedule` and
# `workflow_dispatch` ignore the filter.
name: win-gpu

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "!crates/gui/**"
      - "!crates/prin/**"
      - "xtask/**"
      - "fixtures/**"
      - "plan/requirements.yaml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - ".config/**"
      - ".github/workflows/win-gpu.yml"
      - ".github/scripts/win_measure.ps1"
      - ".github/scripts/git_guard.ps1"
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: Run one job of this workflow
        type: choice
        default: all
        options:
          - all
          - win-vulkan
          - win-self-check
          - win-contain
          - wsl-register
          - wsl-proofs
          - wsl-cpu
      replace:
        description: wsl-register replaces a registered principia-wsl
        type: boolean
        default: false
      # wsl-cpu's one mutation workload; each reaches the distro as an environment variable of one step, never as text
      # in a script, and `inside.sh mutants` checks it before anything runs.
      mutants_commit:
        description: wsl-cpu, the commit whose diff is mutated (a full commit id)
        type: string
        default: ""
      mutants_base:
        description: wsl-cpu, the diff's base, an ancestor of the commit (a full commit id)
        type: string
        default: ""
      mutants_packages:
        description: wsl-cpu, the packages, space-separated, each a crate under crates/
        type: string
        default: ""
      mutants_timeout:
        description: wsl-cpu, cargo mutants' --timeout in seconds
        type: string
        default: ""
      mutants_filter:
        description: wsl-cpu, the nextest filterset after -E
        type: string
        default: ""
      # Two optional ones: cargo mutants' jobs, and its shard for a run past the job's time limit.
      mutants_jobs:
        description: wsl-cpu, cargo mutants' -j, 1 to 4
        type: choice
        default: "1"
        options:
          - "1"
          - "2"
          - "3"
          - "4"
      mutants_shard:
        description: wsl-cpu, cargo mutants' --shard k/n, k from 0 to n-1 (empty for none)
        type: string
        default: ""

permissions:
  contents: read

defaults:
  run:
    # Plain `shell: powershell` is refused here: the account's execution policy doesn't allow script files. With -File, a
    # step's result comes from its own exit, so each step ends in an explicit one.
    shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}

env:
  PRIN_GPU_BACKEND: vulkan
  CARGO_TERM_COLOR: never
  WIN_REFUSAL_LOG: E:\runner-tools\refusal-log\refusals.log
  # R-374 and the owner's CI setting (PR #394), as in every workflow.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  CARGO_INCREMENTAL: "0"
  # Proof 6's commit: `main` when the WSL2 work was built, whose rust-toolchain.toml is the image's.
  WSL_PARITY_COMMIT: 2a69136e3a45caafa494857200693ccb01abc4b9

jobs:
  # The GPU suites `ci.yml`'s `gpu-kernel`, `gpu-metal` and `gpu-lavapipe` run, on this card under Vulkan. Phase 1 of #390
  # took about 2.6 hours for these on this PC, warm; a cold build adds about 20 minutes.
  win-vulkan:
    # The persistent compile cache on E:\ci-cache is safe only because this runner runs trusted code: push to `main`,
    # schedule and workflow_dispatch, with the repository and actor guard on every job; if that guard ever loosens, the
    # persistent cache goes too.
    if: github.repository == 'Ma1achy/Principia' && github.actor == 'Ma1achy' && (inputs.only == '' || inputs.only == 'all' || inputs.only == 'win-vulkan')
    runs-on: [self-hosted, windows, nvidia]
    timeout-minutes: 156
    concurrency:
      group: ${{ github.event_name == 'schedule' && 'win-vulkan-nightly' || 'win-vulkan' }}
      cancel-in-progress: ${{ github.event_name != 'schedule' }}
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_DIR: E:\ci-cache\sccache
      SCCACHE_CACHE_SIZE: 50G
      CARGO_TARGET_DIR: E:\ci-cache\target\win-vulkan-m89
      PRIN_KERNEL_CACHE: E:\ci-cache\kernel
    steps:
      - name: Self-check, first step
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File E:\runner-tools\checks\self-check.ps1
          exit $LASTEXITCODE
      - name: Guard the kept checkout
        run: |
          $guard = Join-Path $env:RUNNER_TEMP 'git_guard.ps1'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          try { Invoke-WebRequest -UseBasicParsing -OutFile $guard -Uri "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/.github/scripts/git_guard.ps1" } catch { "could not fetch the guard: $_"; exit 1 }
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $guard
          exit $LASTEXITCODE
      - name: E has 30 GB free
        run: |
          try { $free = ([System.IO.DriveInfo]::new('E')).AvailableFreeSpace } catch { "::error::could not read the free space on E: $_"; exit 1 }
          "E: has $([math]::Floor($free / 1GB)) GB free"
          if ($free -lt 30GB) { '::error::E: has under 30 GB free, which the compile cache needs: free space on E: or trim E:\ci-cache (TASK-M0-77)'; exit 1 }
          exit 0
      - name: Toolchain on PATH
        run: |
          Add-Content -LiteralPath $env:GITHUB_PATH -Value 'E:\runner-tools\cargo\bin'
          exit 0
      - name: Clean checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
          clean: true
      # Unchanged sources get back the mtimes the last run left them (TASK-M0-89): see the header.
      - name: Unchanged sources keep their mtimes
        timeout-minutes: 5
        run: |
          $restore = Join-Path $env:RUNNER_TEMP 'mtime_restore.ps1'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          try { Invoke-WebRequest -UseBasicParsing -OutFile $restore -Uri "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/.github/scripts/mtime_restore.ps1" } catch { "could not fetch the mtime restore: $_"; exit 1 }
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $restore $env:GITHUB_WORKSPACE "${env:CARGO_TARGET_DIR}.mtimes.txt"
          exit $LASTEXITCODE
      - name: Record the commit, driver and toolchain
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\win_measure.ps1 start
          exit $LASTEXITCODE
      - name: sccache on PATH, its stats zeroed
        id: sccache
        run: |
          $null = where.exe sccache 2>&1
          if ($LASTEXITCODE -ne 0) { '::error::sccache is not on the runner''s PATH: install it in E:\runner-tools\cargo\bin as the PC steps of TASK-M0-77''s PR say; a job never downloads it'; exit 1 }
          sccache --zero-stats
          exit $LASTEXITCODE
      - name: cargo xtask build-kernel
        id: kernel
        timeout-minutes: 3
        run: |
          powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .github\scripts\win_measure.ps1 run build-kernel cargo xtask build-kernel
          exit $LASTEXITCODE
      # The suites below are worth nothing on any other adapter, so they run only if this one shows the card's name.
      - name: The harness runs on the RTX 2080 SUPER
        id: adapter
        if: ${{ !cancelled() && steps.kernel.outcome == 'success' }}
        env:
          WIN_MEASURE_EXPECT: "adapter: NVIDIA GeForce RTX 2080 SUPER"
        timeout-minutes: 12
        run: |

# The README's build-progress grid: after every push to `main` (each merged PR), `scripts/progress_banner.py` draws a
# square per task of `plan/tasks.yaml` by milestone (ink merged, ochre with an open PR, a pencil outline not started),
# in the README's style and in two themes: `progress-light.svg` (dark ink, for a light page) and `progress-dark.svg`
# (pale ink, for a dark page). `rsvg-convert` renders each to PNG at 2x, and this job force-pushes them as the single
# commit of the orphan branch `progress`, with `progress.svg` and `progress.png`, copies of the light pair, which the
# README before the light and dark pair still shows. The README shows the PNGs from raw.githubusercontent.com in a
# <picture> that picks the theme, because the GitHub mobile app does not render SVG images in a README. Applied per
# R-369.
#
# The plan data and history are always main's: a task is done when main has its PR's merge commit. A manual run
# (workflow_dispatch) from another branch draws main's data with that branch's script and this workflow as that
# branch has it, so a change to the grid can be published, and seen in its PR, before it merges; the next push to
# main redraws it with main's.
#
# It never commits to `main`, so it needs no review and starts no CI: a push made with the workflow's GITHUB_TOKEN
# triggers no workflow run, so the push to `progress` starts neither `ci.yml` nor any other. It runs on no pull request,
# so it adds no check to a PR and cannot hold or satisfy a required one. Runs cancel each other: only the latest
# run's grid matters.
name: progress

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: progress
  cancel-in-progress: true

# Set as in every workflow (R-374); this workflow builds nothing.
env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  progress:
    runs-on: ubuntu-24.04
    steps:
      # main's full history: a task is done when main has its PR's merge commit (`git log --merges`).
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      # The generator needs Python and PyYAML, as plan/check_plan.py does.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: python3 -m pip install pyyaml
      # Open PRs, whose `task/<TASK-id>` heads draw their tasks amber; the generator skips PRs from forks
      # (`isCrossRepository`), since anyone can open one from a branch of that name.
      - name: List open PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr list --state open --limit 500 --json headRefName,isCrossRepository > "$RUNNER_TEMP/open-prs.json"
      # The script from the commit this run is for (main's head on a push; the dispatched branch's otherwise), run on
      # main's tasks.yaml, MILESTONES.md and merge history; on a push to main the two are the same commit.
      - name: Draw the grid, light and dark
        run: |
          set -euo pipefail
          git show "$GITHUB_SHA:scripts/progress_banner.py" > "$RUNNER_TEMP/progress_banner.py"
          git log --merges --format=%s > "$RUNNER_TEMP/merges.txt"
          for theme in light dark; do
            python3 "$RUNNER_TEMP/progress_banner.py" -o "$RUNNER_TEMP/progress-$theme.svg" --theme "$theme" \
              --tasks plan/tasks.yaml --milestones plan/MILESTONES.md --merges "$RUNNER_TEMP/merges.txt" \
              --commit "$(git rev-parse --short HEAD)" --open-prs "$RUNNER_TEMP/open-prs.json"
          done
      # librsvg, from the runner's own Ubuntu archive, renders the SVGs to PNG; the SVGs' font list falls back from
      # `Helvetica Neue` through `Arial`, `Liberation Sans` and `DejaVu Sans` to `sans-serif`, so the runner's fonts take
      # over. The log lists which of the list's families the runner has (librsvg takes the first it finds).
      - name: Install rsvg-convert
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin
          fc-list : family | grep -E "Helvetica|Arial|Liberation Sans|Arimo|Nimbus Sans|DejaVu Sans" | sort -u || true
      - name: Render the PNGs
        run: |
          set -euo pipefail
          for theme in light dark; do
            rsvg-convert --zoom 2 --format png -o "$RUNNER_TEMP/progress-$theme.png" "$RUNNER_TEMP/progress-$theme.svg"
          done
      # `progress` holds one commit, the latest grid in both themes as SVG and PNG, replaced on every run.
      - name: Publish to the progress branch
        run: |
          set -euo pipefail
          sha=$(git rev-parse --short HEAD)
          git switch --orphan progress
          for theme in light dark; do
            cp "$RUNNER_TEMP/progress-$theme.svg" "progress-$theme.svg"
            cp "$RUNNER_TEMP/progress-$theme.png" "progress-$theme.png"
          done
          cp progress-light.svg progress.svg
          cp progress-light.png progress.png
          git add progress-light.svg progress-light.png progress-dark.svg progress-dark.png progress.svg progress.png
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit --quiet --message "progress: main @ $sha"
          git push --force origin HEAD:refs/heads/progress

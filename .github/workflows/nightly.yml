# Nightly (R-177, R-186; REQ-SYS-067, REQ-VAL-150; TASK-M0-19): scheduled daily, and by hand. It runs the CPU suites
# (the workspace's tests and `cargo xtask ci`) and the lavapipe GPU suites, and the full `cargo mutants` run over the
# workspace (R-196, R-198, R-302), in as many shards as fit GitHub's job limit (R-402), whose report it uploads. The
# aggregate survey joins it at M8 (R-134, R-177). No benchmark runs here, nor in any hosted workflow: benchmarks run on
# the human's own Mac via `prin profile`, at milestone gates and on demand (R-186).
#
# Runner disk: one full workspace test build on ubuntu-24.04 writes about 88 GB, which ran out of disk until the
# runner's preinstalled toolsets were deleted first (TASK-M0-49). Every job here that builds the workspace's tests
# starts by deleting the toolsets it does not use, `ci.yml`'s list and the hosted tool cache (setup-python then fetches
# its Python afresh), logging the free space before and after. Test infrastructure only.
#
# Caches (R-285, R-326, R-337): this workflow never runs on a push to `main`, where alone a cache is saved, so it saves
# nothing and restores, read-only, the keys `ci.yml`'s jobs save on `main`: the cargo registry under the `ci` job's key,
# `cargo-registry-ci-…`, and the rust-gpu build under the `gpu-kernel` job's, `rust-gpu-gpu-kernel-<os>-<channel>`.
# rust-cache hashes the environment's CARGO_* variables into its key, so CARGO_TERM_COLOR is set as in `ci.yml`.
name: nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

# Two nightlies never run at once (R-402): one started while another is still running waits for it, rather than
# cancelling it, since a cancelled run's report is incomplete.
concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # R-374: every CI job builds the dev and test profiles with line tables only. Panics and backtraces still name
  # file and line; the build, link, artefacts and caches shrink (a full-debug mutants baseline filled the runner's
  # disk). Every workflow sets the same values, so rust-cache, which hashes CARGO_* into its key, computes `ci.yml`'s
  # keys here too (R-337). R-233 (debug info at the default) governs local builds only.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  # The CPU suites, as `ci.yml`'s `ci` job runs them: every workspace test but the kernel's (the `ci` nextest profile),
  # the doctests, and the crate-graph check. The GPU harness's self-tests among them run on lavapipe (R-169).
  cpu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
          sudo docker image prune --all --force > /dev/null
          df -h /
      # The toolchain rust-toolchain.toml pins, with its components: rust-gpu's nightly, on which the whole workspace
      # builds (R-169).
      - name: rustup toolchain install (rust-toolchain.toml)
        run: rustup toolchain install
      # The cargo registry `ci.yml`'s `ci` job saves on a push to `main`, restored read-only under its key (R-337).
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: cargo-registry
          shared-key: ci
          cache-targets: "false"
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # xtask's plan_check tests run plan/check_plan.py, which needs Python and PyYAML (TASK-M0-02).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: python3 -m pip install pyyaml
      - name: Install Mesa (lavapipe)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146
      - name: cargo nextest run --workspace
        env:
          PRIN_GPU_BACKEND: vulkan
          NEXTEST_PROFILE: ci
        run: cargo nextest run --workspace
      - name: cargo test --workspace --doc
        run: cargo test --workspace --doc
      - name: cargo xtask deps
        run: cargo xtask deps

  # `cargo xtask ci`, every registered per-push runner (R-177), in a job of its own as in `ci.yml` (R-235): plan-check,
  # the kernel build, every control (on lavapipe for the GPU harness's), the lints, the gates and the golden suites.
  xtask-ci:
    runs-on: ubuntu-24.04
    env:
      PRIN_GPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
          sudo docker image prune --all --force > /dev/null
          df -h /
      # The toolchain rust-toolchain.toml pins, with its components: rust-gpu's nightly, on which the whole workspace
      # builds (R-169).
      - name: rustup toolchain install (rust-toolchain.toml)
        id: toolchain
        run: |
          rustup toolchain install
          echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      # The cargo registry `ci.yml`'s `ci` job saves on a push to `main`, restored read-only under its key (R-337).
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: cargo-registry
          shared-key: ci
          cache-targets: "false"
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # The rust-gpu build, restored read-only under the key `ci.yml`'s `gpu-kernel` job saves it under on a push to
      # `main` (R-320, R-337; REQ-SYS-075); never saved here.
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/rust-gpu
          key: rust-gpu-gpu-kernel-${{ runner.os }}-${{ steps.toolchain.outputs.channel }}
      - name: Install Mesa (lavapipe)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: python3 -m pip install pyyaml
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146
      - name: cargo xtask ci
        run: cargo xtask ci

  # The lavapipe GPU suites (R-110, R-169, R-186), as `ci.yml`'s `gpu-kernel` and `gpu-lavapipe` jobs run them: the
  # kernel build and the tests that need it (the `gpu-kernel` nextest profile), the GPU harness's self-tests with their
  # controls, every golden suite, and R-269's half-way fixture.
  gpu-lavapipe:
    runs-on: ubuntu-24.04
    env:
      PRIN_GPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
          sudo docker image prune --all --force > /dev/null
          df -h /
      # The toolchain rust-toolchain.toml pins, with its components: rust-gpu's nightly, on which the whole workspace
      # builds (R-169).
      - name: rustup toolchain install (rust-toolchain.toml)
        id: toolchain
        run: |
          rustup toolchain install
          echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      # The cargo registry `ci.yml`'s `ci` job saves on a push to `main`, restored read-only under its key (R-337).
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: cargo-registry
          shared-key: ci
          cache-targets: "false"
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # The rust-gpu build, restored read-only under the key `ci.yml`'s `gpu-kernel` job saves it under on a push to
      # `main` (R-320, R-337; REQ-SYS-075); never saved here.
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/rust-gpu
          key: rust-gpu-gpu-kernel-${{ runner.os }}-${{ steps.toolchain.outputs.channel }}
      - name: Install Mesa (lavapipe)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146
      - name: cargo xtask build-kernel
        run: cargo xtask build-kernel
      - name: cargo nextest run -p validation -p xtask
        env:
          NEXTEST_PROFILE: gpu-kernel
        run: cargo nextest run -p validation -p xtask
      - name: cargo test -p validation -p xtask --doc
        run: cargo test -p validation -p xtask --doc
      - name: cargo nextest run -p validation --features controls gpu_harness
        run: cargo nextest run -p validation --features controls gpu_harness --no-capture
      - name: cargo test -p validation --features controls gpu_harness --doc
        run: cargo test -p validation --features controls gpu_harness --doc
      - name: cargo xtask golden --all
        run: cargo xtask golden --all
      - name: cargo nextest run -p xtask --features controls golden_halfway
        run: cargo nextest run -p xtask --features controls golden_halfway --no-capture
      - name: cargo test -p xtask --features controls golden_halfway --doc
        run: cargo test -p xtask --features controls golden_halfway --doc

  # How the full mutants run is sharded (R-402; REQ-VAL-150): the workspace's mutants at this commit, listed under
  # `.cargo/mutants.toml` as the shards will test them (a listing builds nothing), counted by package, and each
  # package's dealt round-robin into shards of at most its `PER_SHARD` mutants. A shard mutates one package, so its
  # baseline runs that package's tests alone, and the per-mutant timeout, set from the baseline (REQ-VAL-180), is the
  # package's own. Round-robin within a package spreads a file's mutants across its shards, so a file with many
  # survivors (each one running the package's whole suite) cannot pile into one shard. The sizes are set on the
  # measured cost of each package's mutants, with survivors and timeouts assumed above their observed rates (R-402
  # gives the evidence): the slowest shard, xtask's, is estimated at about 205 minutes with setup and baseline, against
  # the run step's 330-minute limit. A package not in the table takes xtask's size, the most cautious. A matrix holds at
  # most 256 jobs, so past that this job fails, naming R-402, rather than cut the run short.
  mutants-plan:
    runs-on: ubuntu-24.04
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
      total: ${{ steps.plan.outputs.total }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      # The toolchain rust-toolchain.toml pins: the listing reads the workspace's metadata with it (R-169).
      - name: rustup toolchain install (rust-toolchain.toml)
        run: rustup toolchain install
      # The cargo registry `ci.yml`'s `ci` job saves on a push to `main`, restored read-only under its key (R-337).
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: cargo-registry
          shared-key: ci
          cache-targets: "false"
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - name: cargo mutants --list (the full run's mutants, dealt into shards by package)
        id: plan
        env:
          # Mutants per shard, by package (R-402).
          PER_SHARD: '{"xtask": 25, "render": 200, "validation": 300, "ledger": 400, "engine": 400, "kernel": 400,
            "gui": 400, "prin": 400}'
          PER_SHARD_DEFAULT: "25"
        run: |
          cargo mutants --list --json > "$RUNNER_TEMP/mutants.json"
          python3 - "$RUNNER_TEMP/mutants.json" <<'PY'
          import collections, json, math, os, sys
          mutants = json.load(open(sys.argv[1]))
          per = json.loads(os.environ["PER_SHARD"])
          default = int(os.environ["PER_SHARD_DEFAULT"])
          count = collections.Counter(m["package"] for m in mutants)
          include = []
          for package in sorted(count):
              n = math.ceil(count[package] / per.get(package, default))
              include += [{"package": package, "k": k, "n": n} for k in range(n)]
              print(f"{package}: {count[package]} mutants, {n} shards of at most {per.get(package, default)}")
          print(f"the workspace has {len(mutants)} mutants in {len(include)} shards (R-402)")
          if not mutants:
              print("::error::cargo mutants listed no mutants over the workspace")
              sys.exit(1)
          if len(include) > 256:
              print(f"::error::{len(include)} shards, past a matrix's 256 jobs: revisit R-402's sizing")
              sys.exit(1)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"jobs={len(include)}\ntotal={len(mutants)}\n")
              out.write("matrix=" + json.dumps({"include": include}, separators=(",", ":")) + "\n")
          PY

  # The full `cargo mutants` run over the workspace (R-196, R-198; REQ-VAL-150): every mutant, not only a diff's, in
  # the shards `mutants-plan` deals (R-402): each job runs shard k of n of one package's mutants, round-robin, and the
  # jobs together cover every package `mutants-plan` listed, which `mutants-report` checks. Its exclusions are the
  # per-PR job's, the one list in `.cargo/mutants.toml`, which `cargo mutants` reads from the workspace root; so are its
  # two caps (R-348; REQ-VAL-179): the per-mutant timeout (REQ-VAL-180) and the per-process memory cap on the test
  # processes (REQ-VAL-181), confirmed by the human at the M0 gate (R-376; R-71). Each shard uploads its
  # `mutants.out`; `mutants-report` joins them. The nightly run is a report, not a gate (R-196): a survivor here is
  # listed, and the job passes once every shard finished. REQ-VAL-149's 8 shards and 300-minute limit (R-376) size the
  # per-PR `--in-diff` run only. Here the run's step stops at 330 minutes, so a shard that would overrun GitHub's
  # 360-minute job limit still uploads what it tested, and fails (R-402). At most 12 shards run at once, leaving the
  # account's other runners to per-push and per-PR CI; the run, about 225 runner-hours, then ends within about 19 to
  # 22 hours of its 03:00 UTC start, before the next (R-402).
  mutants:
    runs-on: ubuntu-24.04
    needs: mutants-plan
    env:
      PRIN_GPU_BACKEND: vulkan
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.mutants-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache
          sudo docker image prune --all --force > /dev/null
          df -h /
      # The toolchain rust-toolchain.toml pins, with its components: rust-gpu's nightly, on which the whole workspace
      # builds (R-169).
      - name: rustup toolchain install (rust-toolchain.toml)
        id: toolchain
        run: |
          rustup toolchain install
          echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      # The cargo registry `ci.yml`'s `ci` job saves on a push to `main`, restored read-only under its key (R-337).
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: cargo-registry
          shared-key: ci
          cache-targets: "false"
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # The rust-gpu build, restored read-only under the key `ci.yml`'s `gpu-kernel` job saves it under on a push to
      # `main` (R-320, R-337; REQ-SYS-075); never saved here.
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/rust-gpu
          key: rust-gpu-gpu-kernel-${{ runner.os }}-${{ steps.toolchain.outputs.channel }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest@0.9.146
      # What the mutated packages' tests need, as in `mutants.yml`: Python and PyYAML, lavapipe, and the kernel's SPIR-V
      # and WGSL, built as the cargo call the alias expands to (setup for the tests, not one of the checks).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: python3 -m pip install pyyaml
      - name: Install Mesa (lavapipe)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      # Debug info: line tables only, set for the whole workflow (R-374); `mutants.yml`'s note gives why.
      - name: cargo run --quiet --package xtask -- build-kernel
        run: cargo run --quiet --package xtask -- build-kernel
      # This shard's share of its package's mutants, under `.cargo/mutants.toml`'s exclusions and caps. Exit 0: none
      # survived; 2: some survived; 3: some timed out; all three are a finished run, reported. The step stops at 330
      # minutes (R-402), so that the upload below still runs inside the job's 360; a stopped step fails the shard, and
      # `mutants-report` with it. The free disk is logged at the end: on 7 Oct 2026 (run 37604801520) most shards ran
      # out of disk part-way through a long-running mutant.
      - name: cargo mutants --package ${{ matrix.package }} --shard ${{ matrix.k }}/${{ matrix.n }} (the full run)
        timeout-minutes: 330
        env:
          PACKAGE: ${{ matrix.package }}
          SHARD: ${{ matrix.k }}/${{ matrix.n }}
        run: |
          set +e
          start=$(date +%s)
          cargo mutants --in-place --package "$PACKAGE" --shard "$SHARD" --sharding round-robin -o "$RUNNER_TEMP"
          code=$?
          echo "cargo mutants $PACKAGE shard $SHARD: exit $code, wall-clock $(( $(date +%s) - start )) s"
          df -h /
          case $code in 0|2|3) ;; *) exit "$code" ;; esac
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-nightly-shard-${{ matrix.package }}-${{ matrix.k }}
          path: ${{ runner.temp }}/mutants.out
          if-no-files-found: ignore

  # The full run's report (REQ-VAL-150): every shard's caught, missed, unviable and timed-out mutants, as cargo-mutants
  # lists them in each shard's `caught.txt`, `missed.txt`, `unviable.txt` and `timeout.txt`, joined into one file and
  # uploaded beside the shards' own reports. It fails when a shard did not finish, when fewer shards uploaded a report
  # than `mutants-plan` dealt, or when the shards' own mutant lists (`mutants.json`) do not add up to the workspace's
  # count (R-402), so a cut-off or partial run is never read as complete.
  mutants-report:
    if: always()
    needs: [mutants-plan, mutants]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mutants-nightly-shard-*
          path: ${{ runner.temp }}/shards
      - name: Join the shards' lists
        run: |
          report="$RUNNER_TEMP/mutants-report.txt"
          for kind in caught missed unviable timeout; do
            cat "$RUNNER_TEMP"/shards/*/"$kind.txt" 2>/dev/null | sort > "$RUNNER_TEMP/$kind.all"
            echo "$kind: $(wc -l < "$RUNNER_TEMP/$kind.all")" | tee -a "$report.head"
          done
          expected="${{ needs.mutants-plan.outputs.jobs }}"
          total="${{ needs.mutants-plan.outputs.total }}"
          mkdir -p "$RUNNER_TEMP/shards"
          uploaded=0
          dealt=0
          for d in "$RUNNER_TEMP"/shards/mutants-nightly-shard-*/; do
            [ -f "$d/mutants.json" ] || continue
            uploaded=$(( uploaded + 1 ))
            dealt=$(( dealt + $(jq length "$d/mutants.json") ))
          done
          {
            echo "cargo mutants, full workspace run (nightly), every shard"
            echo "shards: $uploaded of ${expected:-?} uploaded a report, listing $dealt of ${total:-?} mutants"
            cat "$report.head"
            for kind in caught missed unviable timeout; do
              echo
              echo "== $kind"
              cat "$RUNNER_TEMP/$kind.all"
            done
          } > "$report"
          if [ "${{ needs.mutants.result }}" != success ]; then
            echo "::error::a nightly mutants shard did not finish (result: ${{ needs.mutants.result }})"
            exit 1
          fi
          if [ -z "$expected" ] || [ "$uploaded" -ne "$expected" ] || [ -z "$total" ] || [ "$dealt" -ne "$total" ]; then
            echo "::error::$uploaded of ${expected:-?} shards reported, $dealt of ${total:-?} mutants (R-402)"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-nightly-report
          path: |
            ${{ runner.temp }}/mutants-report.txt
            ${{ runner.temp }}/shards
          if-no-files-found: ignore

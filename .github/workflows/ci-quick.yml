# The quick tier (R-684): what a code pull-request head runs until it carries `merge-ready`. fmt, clippy and the build, over
# the workspace, as `ci.yml`'s `ci-checks` runs them; then, built here, not from an archive, the tests of the changed
# crates and their reverse dependencies under the `ci` nextest profile, their doctests, and, when those crates include
# xtask, the `ci-workspace` profile's tests beside them. The kernel's tests (the `gpu-kernel` profile), the controls, the
# release profile and the GPU suites are full CI's.
#
# `ci.yml` calls it, one job, once its `changes` job has said quick and named the packages
# (`.github/scripts/ci_tier.sh`). It is a workflow of its own because no run of it is ever on `main`: it saves nothing,
# and restores, read-only, the keys `ci.yml`'s jobs save on `main`, `ci-checks`'s cargo registry and `ci`'s fixture pool
# (R-337).
# rust-cache hashes the environment's CARGO_* variables into its key, and a called workflow inherits no `env:`, so each is
# set here as in `ci.yml`.
name: ci-quick

on:
  workflow_call:
    inputs:
      # The tests' packages, as cargo arguments: `-p gui -p prin`, or `--workspace`.
      packages:
        required: true
        type: string
      # "true" when those packages hold tests of the `ci-workspace` profile.
      workspace_tests:
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  # R-374: every CI job builds the dev and test profiles with line tables only. Panics and backtraces still name
  # file and line; the build, link, artefacts and caches shrink (a full-debug mutants baseline filled the runner's
  # disk). Every workflow sets the same values, so rust-cache, which hashes CARGO_* into its key, computes `ci.yml`'s
  # keys here too (R-337). R-233 (debug info at the default) governs local builds only.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  # No incremental state, the owner's CI setting (PR #394), in every workflow like R-374's values. `Swatinem/rust-cache`
  # already exports CARGO_INCREMENTAL=0 to the steps after it, and before it computes its key, so its key and every
  # build after it are the same without this line. What the line adds: the value in the steps before rust-cache, where
  # no cargo build runs and `ci.yml`'s `cachekey` hashes it, and in jobs without rust-cache, where only `ci.yml`'s
  # `ci-release` runs cargo and it builds only for the release doctests, which aren't incremental by default. Local
  # builds are unaffected (R-233).
  CARGO_INCREMENTAL: "0"

jobs:
  ci-quick:
    runs-on: ubuntu-24.04
    env:
      PRIN_GPU_BACKEND: vulkan
      RUNNER_DISK_TMPFS: /dev/shm
    steps:
      - uses: actions/checkout@v4
      # Runner disk, as in `ci-archive` (the same list, copied): before the toolchain and the cache restores, logging
      # the free space before and after. Test infrastructure only.
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/lib/jvm /opt/hostedtoolcache/Java_* /usr/share/swift \
            /usr/local/share/chromium /opt/google /opt/microsoft /usr/local/share/powershell /usr/local/share/boost \
            /usr/share/miniconda /usr/local/julia* /usr/local/lib/node_modules \
            /opt/hostedtoolcache/go /opt/hostedtoolcache/node /opt/hostedtoolcache/PyPy /opt/hostedtoolcache/Ruby \
            /usr/lib/google-cloud-sdk /usr/local/aws-cli /usr/local/aws-sam-cli /opt/az /usr/share/az_*
          sudo docker image prune --all --force > /dev/null
          df -h /
      # The toolchain rust-toolchain.toml pins, with its components: rust-gpu's nightly, on which the whole workspace
      # builds (R-169). The tests run cargo themselves, on the fixtures and on the workspace.
      - name: rustup toolchain install (rust-toolchain.toml)
        id: toolchain
        run: |
          rustup toolchain install
          echo "cachekey=$({ rustc --version --verbose; env | grep -E '^CARGO_(INCREMENTAL|PROFILE)' | sort; cat .github/actions/cargo-ci-config/config.sh; } | sha256sum | cut -c1-20)" >> "$GITHUB_OUTPUT"
      # Saved only in a run on a push to `main`, which this workflow never is, so it saves nothing (R-326). It restores,
      # read-only, the key `ci.yml`'s `ci-checks` job saves on `main`, `cargo-registry-ci-checks-…`, the job whose build
      # this one repeats (R-337).
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: cargo-registry
          shared-key: ci-checks
          cache-targets: "false"
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # Every dependency without debug info, as a cargo config in the runner's CARGO_HOME; the workspace's own crates
      # keep R-374's line tables (`.github/actions/cargo-ci-config`).
      - name: Dependencies without debug info, every profile
        uses: ./.github/actions/cargo-ci-config
      # The fixture pool `ci.yml`'s `ci` job saves, restored only, under its key, `fixture-pool-ci-…` (R-270, R-285,
      # R-337).
      - uses: actions/cache/restore@v4
        with:
          path: target/tmp/fixture-targets
          key: fixture-pool-ci-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock', 'fixtures/**/Cargo.toml', 'xtask/tests/fixtures/**/Cargo.toml') }}
          restore-keys: fixture-pool-ci-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-
      # xtask's plan_check tests run plan/check_plan.py, which needs Python and PyYAML (TASK-M0-02).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: python3 -m pip install pyyaml
      - name: Install Mesa (lavapipe)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146
      - name: cargo fmt --all --check
        run: cargo fmt --all --check
      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo build --workspace
        run: cargo build --workspace
      # Under the disk sampler (`.github/scripts/disk_sampler.sh`), as the `ci` shards' run is: a measurement, read by no
      # gate. `--no-tests pass`: a package set can hold no test of a profile's filter.
      - name: cargo nextest run (the changed crates and their reverse dependencies)
        env:
          NEXTEST_PROFILE: ci
          PACKAGES: ${{ inputs.packages }}
        run: cargo nextest run $PACKAGES --no-tests pass
        shell: bash .github/scripts/disk_sampler.sh {0}
      - name: cargo test --doc (the changed crates and their reverse dependencies)
        env:
          PACKAGES: ${{ inputs.packages }}
        run: cargo test $PACKAGES --doc
        shell: bash .github/scripts/disk_sampler.sh {0}
      # The `ci-workspace` profile's tests, on this job's own build, which they need (R-372), the profile's filter
      # choosing among the packages.
      - name: cargo nextest run (the ci-workspace profile's tests of those crates)
        if: inputs.workspace_tests == 'true'
        env:
          NEXTEST_PROFILE: ci-workspace
          PACKAGES: ${{ inputs.packages }}
        run: cargo nextest run $PACKAGES --no-tests pass
        shell: bash .github/scripts/disk_sampler.sh {0}
      - name: Runner disk after the tests
        if: always()
        run: df -h /
      # The kernel's log, on a failure, and the samples, whatever the job ended in, as in `ci.yml`'s `xtask-ci`:
      # `runner-disk.log`, and from the tmpfs `runner-pressure.log`, written beside the steps under the disk sampler
      # (RUNNER_DISK_TMPFS), and this step's copy of the kernel's log. Measurements, read by no gate: `sudo` refused, a
      # full disk or a failed upload fails nothing.
      - name: Kernel log on a failure
        if: failure()
        continue-on-error: true
        timeout-minutes: 1
        run: sudo -n dmesg --ctime | tail -n 200 | tee "$RUNNER_DISK_TMPFS/runner-dmesg.log" || true
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        with:
          name: runner-disk-ci-quick
          path: |
            ${{ runner.temp }}/runner-disk.log
            /dev/shm/runner-pressure.log
            /dev/shm/runner-dmesg.log
          if-no-files-found: warn
          retention-days: 14
          overwrite: true

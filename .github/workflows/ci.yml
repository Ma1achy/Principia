# Per-push CI (R-177): formatting and lints (R-195), build, test, the crate-graph check (REQ-SYS-004) and, in a job
# of its own beside them (R-235), `cargo xtask ci`, the single per-push entry point every later per-commit runner
# registers into. On pull requests only, the `mutants` job runs the per-PR mutation gate (R-196, R-202); the per-push
# jobs are unchanged by it (R-177). Bench runs nightly and screenshots
# on GUI PRs, in their own workflows (R-177). GitHub-hosted runners (R-186); the GPU jobs are GitHub-hosted too, so
# R-174's same-repository guard stays dormant until a self-hosted job is added (R-186).
name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --all --check
        run: cargo fmt --all --check
      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo build --workspace
        run: cargo build --workspace
      # The workspace tests include the GPU harness self-tests, which need an adapter and PRIN_GPU_BACKEND (R-169):
      # here they run on lavapipe; metal_hosted_probe is ignored off macOS.
      - name: Install Mesa (lavapipe)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: cargo test --workspace
        env:
          PRIN_GPU_BACKEND: vulkan
        run: cargo test --workspace
      - name: cargo xtask deps
        run: cargo xtask deps

  # `cargo xtask ci` in a job of its own, beside the tests (R-235): it runs `cargo xtask controls`, every control,
  # failing on any finding (R-198, R-226). The GPU harness's controls run on lavapipe, as its tests do.
  xtask-ci:
    runs-on: ubuntu-latest
    env:
      PRIN_GPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Mesa (lavapipe)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: cargo xtask ci
        run: cargo xtask ci

  # GitHub-hosted Apple silicon, paravirtual Metal: the Metal correctness suites only (R-169, R-186).
  gpu-metal:
    runs-on: macos-15
    env:
      PRIN_GPU_BACKEND: metal
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test -p validation --features controls metal_hosted_probe
        run: cargo test -p validation --features controls metal_hosted_probe -- --nocapture
      - name: cargo test -p validation --features controls gpu_harness
        run: cargo test -p validation --features controls gpu_harness -- --nocapture

  # lavapipe, Mesa's software Vulkan: the second backend on every commit (R-110, R-169, R-186).
  gpu-lavapipe:
    runs-on: ubuntu-latest
    env:
      PRIN_GPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Mesa (lavapipe)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: cargo test -p validation --features controls gpu_harness
        run: cargo test -p validation --features controls gpu_harness -- --nocapture

  # The per-PR mutation gate (R-196, R-202; TASK-M0-23): `cargo mutants --in-diff` on the PR's diff against its base,
  # on pull requests only, since `--in-diff` needs a base. Exclusions are `.cargo/mutants.toml`'s, shared with the
  # nightly full run (TASK-M0-19). Every surviving mutant is listed in the log, and the job fails on any not in
  # `.cargo/mutants-equivalent.toml`. It first shows, on `fixtures/mutants/untested/`, that the gate can fire.
  mutants:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      PRIN_GPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - name: Install Mesa (lavapipe)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: The gate fires on the fixture (REQ-VAL-148)
        run: |
          fixture=fixtures/mutants/untested
          if cargo mutants --dir "$fixture" --in-diff "$fixture/change.diff" -o "$RUNNER_TEMP/fixture"; then
            echo "::error::without its killing test, no mutant of the untested branch survived"; exit 1
          fi
          if cargo xtask mutants-check "$RUNNER_TEMP/fixture/mutants.out"; then
            echo "::error::mutants-check passed survivors that are not listed"; exit 1
          fi
          cargo xtask mutants-check "$RUNNER_TEMP/fixture/mutants.out" --equivalent "$fixture/equivalent.toml"
          cargo mutants --dir "$fixture" --in-diff "$fixture/change.diff" --features kill -o "$RUNNER_TEMP/fixture-kill"
      - name: git diff origin/${{ github.base_ref }}...HEAD
        run: |
          git diff "origin/${{ github.base_ref }}...HEAD" > "$RUNNER_TEMP/pr.diff"
          echo "PR diff: $(wc -l < "$RUNNER_TEMP/pr.diff") lines"
      # The per-PR time limit is REQ-VAL-149, a calibration (R-71), provisional until the M0 gate confirms it (R-182).
      # No value is set yet: it waits for its ubuntu-latest measurements over the merged PRs' diffs (TASK-M0-23's PR).
      # Until then GitHub's 360-minute job maximum is the only bound.
      - name: cargo mutants --in-diff (REQ-VAL-149 time limit pending)
        id: run
        run: |
          set +e
          start=$(date +%s)
          cargo mutants --in-place --in-diff "$RUNNER_TEMP/pr.diff" -o "$RUNNER_TEMP"
          code=$?
          echo "cargo mutants: exit $code, wall-clock $(( $(date +%s) - start )) s"
          # 0: none survived; 2: some survived; 3: some timed out. The check below decides (R-202). Only exit 0 may
          # mean "no mutant in the diff"; any other exit without outcomes fails the job.
          case $code in 0|2|3) ;; *) exit "$code" ;; esac
          if [ -f "$RUNNER_TEMP/mutants.out/outcomes.json" ]; then
            echo "tested=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 0 ]; then
            echo "cargo mutants: no mutant in this PR's diff"
          else
            echo "::error::cargo mutants exited $code but wrote no outcomes.json"; exit "$code"
          fi
      - name: cargo xtask mutants-check (R-202)
        if: steps.run.outputs.tested == 'true'
        run: cargo xtask mutants-check "$RUNNER_TEMP/mutants.out"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-report
          path: |
            ${{ runner.temp }}/mutants.out
            ${{ runner.temp }}/fixture/mutants.out
          if-no-files-found: ignore

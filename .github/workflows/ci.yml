# Per-push CI (R-177): formatting and lints (R-195), build, test, the crate-graph check (REQ-SYS-004) and, in jobs
# of their own beside them (R-235), `cargo xtask ci`, the single per-push entry point every later per-commit runner
# registers into. The GPU kernel build, `cargo xtask build-kernel`, and the tests that need the built kernel run in a
# job of their own, `gpu-kernel`, in parallel with `ci` (R-325, REQ-SYS-076); each CI job's warm wall-clock time is
# targeted at ~10.5 min (R-270, R-325). The tests run through cargo-nextest, pinned, and doctests, which nextest does
# not run, through `cargo test --doc` (R-231); `xtask/tests/nextest.rs` checks that together they list every test
# `cargo test` did. `ci`, `ci-workspace` and `gpu-kernel` split the workspace's tests between them by nextest profile
# (`.config/nextest.toml`), each step's NEXTEST_PROFILE: `gpu-kernel` runs the kernel's, `ci-workspace` the xtask
# tests that run cargo on the workspace's own target directory and validation's `qa_TASK-M0-24`, and `ci` every other
# test. `ci-release` runs the `ci`
# profile's tests again, at the release profile, as 2 shards from a release archive `ci-release-archive` builds once
# (R-547, REQ-TOOL-189; R-325, REQ-SYS-078).
# Sharding (R-336, R-360, R-366, REQ-SYS-077): `ci` runs its nextest run as 4 parallel shards, a matrix, each running
# nextest's `--partition hash:<k>/4`, which together run every test the unsharded run did; formatting, lints, the
# docs (R-387), the build and the crate-graph check run once, beside them, in `ci-checks`. `xtask-ci` runs
# `cargo xtask ci --partition <k>/4` as 4 parallel shards, which together run every control exactly once
# (`xtask/src/controls.rs`), but for the three that list the workspace in its default feature set: `ci-workspace`, which
# has that build, runs those once, in a step of their own (`controls::IN_CI_WORKSPACE`).
# The shards share one test build (R-372, REQ-SYS-078): `ci-archive` builds the workspace's tests once, as a nextest
# archive, and every `ci` shard runs its slice from that archive (`--archive-file`); no step of a shard builds the
# workspace or compiles a test binary, but shard 1's doctests, which nextest does not run. The xtask tests that run
# cargo on the workspace's own target directory, which from the archive would rebuild it in their shard while holding
# every test thread, run beside the shards in `ci-workspace`, on a build of its own, under a nextest profile of their
# own (`.config/nextest.toml`).
# Branch protection requires the checks `ci` and `xtask-ci` (R-266): a matrix job's checks are named for its shards
# (`ci (1)` … `ci (4)`), so the jobs `ci-gate` and `xtask-ci-gate`, named `ci` and `xtask-ci`, pass only when every
# job they gather passed, whatever the others ended in.
# The per-PR mutation gate runs on pull requests only, in its own workflow, `mutants.yml` (R-196, R-202, R-302, R-305);
# the per-push jobs are unchanged by it (R-177). Bench runs nightly and screenshots on GUI PRs, in their own workflows
# (R-177).
# GitHub-hosted runners (R-186), the GPU jobs too. The one self-hosted runner runs measurements only, in `win-gpu.yml`
# and `runner-proof.yml`, never here (R-711 item 1). That wakes R-174, with a stricter rule in place of its PR allowance:
# no `pull_request` or `pull_request_target` trigger on any self-hosted job, only push to `main`, schedule and
# workflow_dispatch, from Ma1achy on Ma1achy/Principia.
#
# What runs when (R-656). A push runs this workflow only on `main` (and on a `measure/` branch, which never has a pull
# request, R-272); a pull request's pushes run it through `pull_request`, once each, never twice. Every run on `main`
# runs every job. On a pull request, the `changes` job classifies the change with `scripts/ci_changes.sh` (its merge
# commit against the base it merges onto) into three tiers (R-677), a change touching several taking the highest:
# - code (tier a): `crates/`, `xtask/`, `fixtures/`, the Cargo files, the toolchain, `.github/`, `.cargo/`, the data
#   only full CI reads (`plan/requirements.yaml` when a field code reads changes, or a requirement is added or
#   removed), the classifier and its field check, `scripts/contain.sh` and any path the script's allowlist doesn't
#   name: every job runs;
# - data (tier b): the plan's task data (`plan/tasks/`, `plan/tasks.yaml`, `plan/MILESTONES.md`, and
#   `plan/requirements.yaml` when only fields no code reads change, `scripts/ci_req_fields.py` deciding) or the GUI's
#   artboards and references (`docs/gui/design/`, `docs/gui/reference/`), with docs beside them or not: `ci-workspace`
#   runs the cheap checks and the tests that read what changed, in place of its own tests;
# - docs (tier c; R-662, R-790): the rest of `docs/`, `plan/` (its prose and Python), `scripts/`, `workbench/`,
#   `.claude/` and the root's markdown: `ci-workspace` runs only the cheap checks, the plan checks and the vocabulary
#   lint (`no-atlas-params.yml`, the atlas guard, runs on every pull request).
# A data or docs change (`docs_only`, its name R-656's) skips `ci-archive` and the `ci` shards, `ci-checks`,
# `web-skeleton`, `ci-release-archive` and its shards, and `xtask-ci`'s shards; it and a code change to no GPU-path
# file (only `crates/prin/` and `crates/gui/` beside data and docs, but for the five paths of `crates/gui/` that
# `gpu-metal`'s `lattice_` step reads, R-692, `scripts/ci_changes.sh`'s `is_not_gpu`) skip the GPU suites' jobs,
# `gpu-kernel`, `gpu-metal` and `gpu-lavapipe`.
# Where a code head runs, CI's two code tiers (R-684). R-677's classifier applies first, so a data or docs head runs
# neither. A code pull request's head runs the quick tier: one job, `ci-quick`, running fmt, clippy, the build, and the
# tests of the changed crates and their reverse dependencies (`.github/scripts/ci_quick_crates.py`). It runs full CI, the
# jobs above and the GPU suites where the GPU-path rule applies, once it carries the `merge-ready` label, the trigger
# mutants uses (R-676), and every push to `main` does. This workflow runs on no label change: of each workflow's runs on
# a head, branch protection counts only the latest run's check suite (R-678), so another label's run would supersede the
# suite holding the required checks. `ci-full.yml` re-runs the head's run when `merge-ready` goes on, a new attempt of
# the same run, in the same suite, on the same merge commit, and the `changes` job of that attempt, reading the live
# label, says full (`.github/scripts/ci_tier.sh`). On a quick run `changes` passes on `docs_only` true, which R-677 reads
# "runs no full CI", and `gpu` false, so every full-only job skips exactly as on a docs head, and `quick` true, on which
# `ci-workspace` and the gates skip too; `ci-quick` runs that tier's `ci-workspace` tests itself.
# A quick run reports no required check that only the full tier reports (`ci`, `xtask-ci` and the three GPU gates), so a
# skip cannot pass one: each gate is named by a one-value matrix, `${{ matrix.check }}`, and a job skipped at job level
# never expands its `name:`. A name that is wholly an expression reports that expression, `matrix.check` (run
# 41972273540: five of `matrix.check|skipped`); a mixed one stays raw (run 41828315009:
# `xtask-ci (${{ matrix.shard }})|skipped`). Until the full tier runs, branch protection reads each as expected, and `changes` also posts each pending as a commit status
# on the head, which `ci-status` closes when the full tier ends. So no pull request merges until the full suite has
# passed on its exact head. R-684's rationale: since R-676 a fix round is verified locally through the job queue, so
# full CI on intermediate heads duplicated that work; the guarantee that `main` only receives fully-tested heads stands.
#
# On a full, data or docs run the required checks still report, under their own names, and conclude success: each is a
# gate that runs whatever the jobs it gathers ended in (`ci`, `xtask-ci`, and the GPU suites' gates, which carry the names `gpu-kernel`,
# `gpu-metal` and `gpu-lavapipe`, the suites' jobs being named `<id> suites`), and passes a gathered job that was
# skipped only when the classification ran and skipped it. A matrix job is named `<id> (<shard>)`, so a skipped one
# never reports a bare required name.
#
# Caches (R-285), in every workflow: the cargo registry and git directories, through rust-cache with its target cache
# and ~/.cargo/bin cache off, and the fixture pool, saved by the `ci` job alone. Never a whole target directory, so the
# repository's Actions cache stays well under GitHub's 10 GB limit. Every key names its job: rust-cache's `shared-key`
# is the job id (its key reads `cargo-registry-<job>-…`), and the pool's key names `ci`, the job that saves it. A
# matrix job's shards are one job, sharing its keys; each saves on `main`, and the first save of a key stands. The
# `cargo-registry` prefix keeps these keys apart from the old `v0-rust-…` ones, which held target directories.
# Every job that builds the kernel also caches the rust-gpu build, ~/.cache/rust-gpu, under a key naming its job and
# the pinned toolchain channel (R-320, amending R-285).
# Every cache restores in every run and is saved only in a run on a push to `main` (R-326, REQ-SYS-073, REQ-SYS-075):
# rust-cache through its `save-if`, the others as an `actions/cache/restore` step and an `actions/cache/save` step,
# each under the condition below. A pull-request run, or a push to any other branch, restores what `main` saved and
# never saves.
# The workflows that never run on a push to `main` (mutants.yml, pr-check.yml, reviews.yml, screenshot.yml,
# stand-in-soak.yml) save nothing, and restore, read-only, the keys this workflow's jobs save on `main`: the cargo
# registry under the `ci` job's key, and the rust-gpu build under the `gpu-kernel` job's (R-337). rust-cache hashes the
# environment's CARGO_* variables into its key, so each of them sets CARGO_TERM_COLOR as this workflow does.
name: ci

on:
  push:
    branches: [main, "measure/**"]
  pull_request:

# A newer push to the same ref supersedes an older run, so the older run on that ref is cancelled. On `main` each
# run has a group of its own (its run id), so no run there is ever cancelled or queued behind another (applied per
# R-369). A pull request's runs are all `pull_request` runs on its merge ref, `refs/pull/<n>/merge`: one group per pull
# request, so a push to it cancels the run on the head it supersedes (R-656).
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # R-374: every CI job builds the dev and test profiles with line tables only. Panics and backtraces still name
  # file and line; the build, link, artefacts and caches shrink (a full-debug mutants baseline filled the runner's
  # disk). Every workflow sets the same values, so rust-cache, which hashes CARGO_* into its key, computes `ci.yml`'s
  # keys here too (R-337). R-233 (debug info at the default) governs local builds only.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  # No incremental state, the owner's CI setting (PR #394), in every workflow like R-374's values. `Swatinem/rust-cache`
  # already exports CARGO_INCREMENTAL=0 to the steps after it, and before it computes its key, so its key and every
  # build after it are the same without this line. What the line adds: the value in the steps before rust-cache, where
  # no cargo build runs and `ci.yml`'s `cachekey` hashes it, and in jobs without rust-cache, where two run cargo:
  # `ci.yml`'s `ci-release`, which builds only for the release doctests, which aren't incremental by default, and
  # `pages.yml`'s `build`, where it turns off incremental state for the dev-profile build of xtask that `cargo xtask
  # web-skeleton` starts. Local builds are unaffected (R-233).
  CARGO_INCREMENTAL: "0"

jobs:
  # What a pull request's change touches (R-656, R-662, R-677): its `tier`, code, data or docs; `docs_only`, true on a
  # data or docs change, which runs no full CI; `gpu`, false when no changed path is a GPU path; and `plan_data` and
  # `gui_data`, which of tier (b)'s data it changes (`scripts/ci_changes.sh`, which holds the lists).
  # Every other run, on `main` among them, is code: everything runs. The jobs below skip on its verdict, and the
  # gates read it. Then the code tier of this run (R-684; `.github/scripts/ci_tier.sh decide`): `quick`, true on a code
  # pull-request head that is not merge-ready, with `packages`, the `-p` arguments of its tests, `doc_packages`, those
  # with a library, and `workspace_tests`, whether those include the `ci-workspace` profile's; `docs_only` and `gpu`, the
  # classifier's, or true and false on a quick run, which runs no full CI; and `report`, whether `ci-status` closes the
  # commit statuses this job opened.
  # `pull-requests: read` for the live label, `statuses: write` for those statuses.
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      tier: ${{ steps.changes.outputs.tier }}
      docs_only: ${{ steps.tier.outputs.docs_only }}
      gpu: ${{ steps.tier.outputs.gpu }}
      plan_data: ${{ steps.changes.outputs.plan_data }}
      gui_data: ${{ steps.changes.outputs.gui_data }}
      quick: ${{ steps.tier.outputs.quick }}
      packages: ${{ steps.tier.outputs.packages }}
      doc_packages: ${{ steps.tier.outputs.doc_packages }}
      workspace_tests: ${{ steps.tier.outputs.workspace_tests }}
      report: ${{ steps.tier.outputs.report }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The field check of `plan/requirements.yaml` (`scripts/ci_req_fields.py`) parses it with PyYAML; without it the
      # check fails, and the file runs full CI.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: python3 -m pip install pyyaml
      - name: scripts/ci_changes.sh detect
        id: changes
        run: scripts/ci_changes.sh detect
      - name: .github/scripts/ci_tier.sh decide
        id: tier
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ACTION: ${{ github.event.action }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TIER: ${{ steps.changes.outputs.tier }}
          DOCS_ONLY: ${{ steps.changes.outputs.docs_only }}
          GPU: ${{ steps.changes.outputs.gpu }}
        run: .github/scripts/ci_tier.sh decide

  # The quick tier, one job (R-684): the whole of what a code pull-request head runs before `merge-ready`, beside
  # `changes`, so that head asks for as few jobs as the ruling allows. A workflow of its own, called here, because it never
  # runs on a push to `main`, so it saves no cache and restores the keys this workflow's jobs save (R-337).
  ci-quick:
    needs: changes
    if: needs.changes.outputs.quick == 'true'
    uses: ./.github/workflows/ci-quick.yml
    with:
      packages: ${{ needs.changes.outputs.packages }}
      doc_packages: ${{ needs.changes.outputs.doc_packages }}
      workspace_tests: ${{ needs.changes.outputs.workspace_tests }}

  # The workspace's tests, built once for the `ci` shards (R-372, REQ-SYS-078): `cargo nextest archive` builds every
  # test binary of the one feature set the shards run, the default, and writes them, with what running them needs (the
  # build scripts' output, the standard library, the workspace's metadata), to one archive, which this job uploads as
  # the workflow artifact `nextest-ci`. NEXTEST_PROFILE names the `ci` profile the shards run under
  # (`.config/nextest.toml`).
  # Skipped on a data or docs pull request (R-656, R-677), and with it the `ci` shards, which need its archive.
  ci-archive:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    outputs:
      bytes: ${{ steps.size.outputs.bytes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Runner disk: GitHub guarantees an ubuntu-24.04 runner only 14 GB free, and some start with about 11 GB. On such
      # runners this job, the `ci` shards and `gpu-kernel` ran out of space ("No space left on device") 43–72 s in, six
      # times from 31 Oct to 2 Nov (jobs 124655047195, 124714602351, 124749797258, 124824660636, 125205921995,
      # 125295816707). So each of the three frees the disk as `xtask-ci` does, with its list, copied (no step is shared
      # between jobs here), before the toolchain and the cache restore, logging the free space before and after. Test
      # infrastructure only.
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/lib/jvm /opt/hostedtoolcache/Java_* /usr/share/swift \
            /usr/local/share/chromium /opt/google /opt/microsoft /usr/local/share/powershell /usr/local/share/boost \
            /usr/share/miniconda /usr/local/julia* /usr/local/lib/node_modules \
            /opt/hostedtoolcache/go /opt/hostedtoolcache/node /opt/hostedtoolcache/PyPy /opt/hostedtoolcache/Ruby \
            /usr/lib/google-cloud-sdk /usr/local/aws-cli /usr/local/aws-sam-cli /opt/az /usr/share/az_*
          sudo docker image prune --all --force > /dev/null
          df -h /
      # The toolchain rust-toolchain.toml pins, with its components: rust-gpu's nightly, on which the whole workspace
      # builds (R-169).
      - name: rustup toolchain install (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: cargo-registry
          shared-key: ci-archive
          cache-targets: "false"
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-nextest@0.9.146
      # The archive's test binaries carry line tables for the workspace's own crates only (the owner's CI plan, 2 Nov
      # 2026, item 3): every dependency is built without debug info, so the ~600 test binaries, each linking its
      # dependencies whole, stop carrying their line tables. A panic message still names file and line (from the
      # panic's location, not debug info), and a backtrace still names every frame, with file and line for the
      # workspace's own (R-374); a frame inside a dependency is named without them. As every job that runs cargo does
      # (`.github/actions/cargo-ci-config`), for the one profile this job builds in: a cargo
      # config in the runner's CARGO_HOME, where the archive step reads it, never in the repository (R-233 governs
      # local builds), and outside rust-cache's key, which hashes the CARGO_* environment (R-337). A package override
      # has no environment form, and the archive step's command line is pinned (R-372), so it is a file.
      - name: Dependencies without debug info
        run: printf '[profile.test.package."*"]\ndebug = false\n' >> "${CARGO_HOME:-$HOME/.cargo}/config.toml"
      # The linker compresses each binary's debug sections (zlib): the same line tables (R-374), stored in fewer bytes,
      # so each shard extracts the archive in 4–8 s rather than 13–28 s (PR #126's measurements, with line tables
      # only). Test infrastructure only. RUSTFLAGS is this step's alone: rust-cache's key, computed in its own step,
      # never sees it, and nothing else is built with it. An environment RUSTFLAGS overrides `.cargo/config.toml`'s
      # rustflags, so it names the native build's `-Zmir-enable-passes=-GVN` itself (R-547, REQ-TOOL-188).
      - name: cargo nextest archive --workspace
        env:
          NEXTEST_PROFILE: ci
          RUSTFLAGS: -C link-arg=-Wl,--compress-debug-sections=zlib -Zmir-enable-passes=-GVN
        run: cargo nextest archive --workspace --archive-file $RUNNER_TEMP/nextest-ci.tar.zst
      # The archive's size in bytes, a job output each shard checks its download against: a download can end short
      # without failing its step (below).
      - name: The archive's size
        id: size
        run: echo "bytes=$(stat -c %s "$RUNNER_TEMP/nextest-ci.tar.zst")" >> "$GITHUB_OUTPUT"
      # Already zstd-compressed, so uploaded as it is; kept a day, the run's own.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nextest-ci
          path: ${{ runner.temp }}/nextest-ci.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  # The workspace's tests, as 4 parallel shards (R-336, R-366, REQ-SYS-077): nextest's `--partition hash:<k>/4` puts
  # each test in the shard its name hashes to, a stable assignment, so together they run every test the unsharded run
  # did, once. Each runs its slice from `ci-archive`'s archive (R-372, REQ-SYS-078): no step of its own builds the
  # workspace or compiles a test binary, but shard 1's doctests. Tests that run cargo themselves still build what they
  # run. With no workspace build here the shards need little disk, but GitHub guarantees an ubuntu-24.04 runner only
  # 14 GB free (some have far more, others start with about 11 GB), so they free it as `ci-archive` does, and their
  # heavy steps run under the disk sampler, as `cargo xtask ci` does in `xtask-ci`.
  ci:
    needs: ci-archive
    runs-on: ubuntu-24.04
    name: ci (${{ matrix.shard }})
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Runner disk, as in `ci-archive` (the same list, copied): before the toolchain and the cache restore, logging
      # the free space before and after. Test infrastructure only.
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/lib/jvm /opt/hostedtoolcache/Java_* /usr/share/swift \
            /usr/local/share/chromium /opt/google /opt/microsoft /usr/local/share/powershell /usr/local/share/boost \
            /usr/share/miniconda /usr/local/julia* /usr/local/lib/node_modules \
            /opt/hostedtoolcache/go /opt/hostedtoolcache/node /opt/hostedtoolcache/PyPy /opt/hostedtoolcache/Ruby \
            /usr/lib/google-cloud-sdk /usr/local/aws-cli /usr/local/aws-sam-cli /opt/az /usr/share/az_*
          sudo docker image prune --all --force > /dev/null
          df -h /
      # What the two disks hold, for moving the build to `/mnt` (the owner's candidate 1, 4 Nov 2026). It only measures,
      # and nothing it finds can fail the job.
      - name: Runner disks
        run: |
          df -h / /mnt || true
          lsblk || true
      # The toolchain rust-toolchain.toml pins, with its components: rust-gpu's nightly (R-169). The tests run cargo
      # themselves, on the fixtures and on the workspace.
      - name: rustup toolchain install (rust-toolchain.toml)
        id: toolchain
        run: |
          rustup toolchain install
          echo "cachekey=$({ rustc --version --verbose; env | grep -E '^CARGO_(INCREMENTAL|PROFILE)' | sort; cat .github/actions/cargo-ci-config/config.sh; } | sha256sum | cut -c1-20)" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: cargo-registry
          shared-key: ci
          cache-targets: "false"
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # Every dependency without debug info, as a cargo config in the runner's CARGO_HOME; the workspace's own crates
      # keep R-374's line tables (`.github/actions/cargo-ci-config`).
      - name: Dependencies without debug info, every profile
        uses: ./.github/actions/cargo-ci-config
      # The fixture pool, one build directory per fixture type, kept between runs (R-270): cargo rebuilds in it only
      # what changed. Keyed on what invalidates its builds: the runner, the toolchain and the CI build settings, all in
      # `cachekey`, for a pool built under other settings is rebuilt whole beside itself, and the lockfile and the
      # fixtures' manifests; a new key starts from the latest pool of the same `cachekey`. Restored here in every run;
      # saved by the step after the tests, only on a push to `main` (R-326) and only when the job passes, so a run cut
      # short by a failing test never saves a pool half built. Its key names this job, the only one that saves it
      # (R-285).
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: target/tmp/fixture-targets
          key: fixture-pool-ci-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock', 'fixtures/**/Cargo.toml', 'xtask/tests/fixtures/**/Cargo.toml') }}
          restore-keys: fixture-pool-ci-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-
      # xtask's plan_check tests run plan/check_plan.py, which needs Python and PyYAML (TASK-M0-02).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: python3 -m pip install pyyaml
      # The workspace tests include the GPU harness self-tests, which need an adapter and PRIN_GPU_BACKEND (R-169):
      # here they run on lavapipe; metal_hosted_probe is ignored off macOS.
      - name: Install Mesa (lavapipe)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-nextest@0.9.146
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nextest-ci
          path: ${{ runner.temp }}
      # A download that stalls can end short and still pass its step: twice a `ci` shard's download of `nextest-ci`
      # ran 7–9 minutes, against about 1 minute in its sibling shards, and logged no digest and no completion; the
      # truncated archive then failed extraction ("incomplete frame", runs 40581119144 and 40504808071, `ci (4)`). So
      # the downloaded archive's size is checked against the one `ci-archive` uploaded, and a short archive is
      # downloaded once more, by `gh`, preinstalled on the runner, with this job's token (hence `actions: read`), then
      # checked again: one that is still short fails the shard, named. Test infrastructure only; the tests that run are
      # the same.
      - name: Check the archive downloaded whole
        env:
          WANT: ${{ needs.ci-archive.outputs.bytes }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          archive="$RUNNER_TEMP/nextest-ci.tar.zst"
          got=$(stat -c %s "$archive" 2>/dev/null || echo 0)
          if [ "$got" != "$WANT" ]; then
            echo "::warning::nextest-ci: downloaded $got of $WANT bytes; downloading it again"
            rm -f "$archive"
            gh run download "$GITHUB_RUN_ID" --name nextest-ci --dir "$RUNNER_TEMP"
            got=$(stat -c %s "$archive" 2>/dev/null || echo 0)
            if [ "$got" != "$WANT" ]; then
              echo "::error::nextest-ci: downloaded $got of $WANT bytes, twice"; exit 1
            fi
          fi
      # This shard's slice of every workspace test but those that need the built kernel, which `gpu-kernel` runs
      # (R-325), and those that run cargo on the workspace's own target directory, which `ci-workspace` runs (R-372):
      # the `ci` profile's default filter (`.config/nextest.toml`), chosen by NEXTEST_PROFILE. From the archive
      # (R-372, REQ-SYS-078): its target directory is extracted into this checkout's `target`, where `ci-archive` built
      # it, beside the fixture pool restored there, so the paths compiled into the tests (`CARGO_BIN_EXE_*`,
      # `CARGO_TARGET_TMPDIR`) hold here as they did there. Under the disk sampler (`.github/scripts/disk_sampler.sh`),
      # as `cargo xtask ci` is in `xtask-ci`: a measurement, read by no gate; each such step's log notes the job's lowest free so far.
      - name: cargo nextest run --archive-file … --partition hash:${{ matrix.shard }}/4
        env:
          PRIN_GPU_BACKEND: vulkan
          NEXTEST_PROFILE: ci
        run: cargo nextest run --archive-file $RUNNER_TEMP/nextest-ci.tar.zst --extract-to . --extract-overwrite --partition hash:${{ matrix.shard }}/4
        shell: bash .github/scripts/disk_sampler.sh {0}
      # The doctests, once, in the first shard (R-231). nextest does not run them, so the archive holds none: this step
      # compiles them, the shards' one compile. Under the disk sampler too.
      - name: cargo test --workspace --doc
        if: matrix.shard == 1
        run: cargo test --workspace --doc
        shell: bash .github/scripts/disk_sampler.sh {0}
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: target/tmp/fixture-targets
          key: fixture-pool-ci-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock', 'fixtures/**/Cargo.toml', 'xtask/tests/fixtures/**/Cargo.toml') }}

  # The tests that run cargo on the workspace's own target directory (`.config/nextest.toml`'s `ci-workspace`
  # profile), beside the `ci` shards and on a build of their own (R-372, REQ-SYS-078): run from the shards' archive,
  # which carries no cargo build state, each would rebuild the workspace in its shard while holding every test thread.
  # On a data or docs pull request (R-656, R-662, R-677) it runs the cheap checks in their place, the one test job such
  # a pull request runs: the plan checks and the vocabulary lint, and on a data one the tests that read what it changed.
  # It passes the classification on to the gate `ci`. Skipped on a quick run (R-684), whose `ci-quick` runs these tests.
  ci-workspace:
    runs-on: ubuntu-24.04
    env:
      PRIN_GPU_BACKEND: vulkan
      RUNNER_DISK_TMPFS: /dev/shm
    needs: changes
    if: needs.changes.outputs.quick != 'true'
    outputs:
      docs_only: ${{ needs.changes.outputs.docs_only }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Runner disk: the xtask build and its tests' own cargo runs on the workspace, `cargo xtask controls` and `cargo
      # xtask ci` among them, build much of what `xtask-ci` builds, which ran out of space on PRs #251 and #252
      # (`gate.yml`'s twin of this job frees it too). Remove the preinstalled toolsets it does not use, as `xtask-ci`
      # does, logging the free space before and after. Test infrastructure only.
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null
          df -h /
      # The toolchain rust-toolchain.toml pins, with its components: rust-gpu's nightly, on which the whole workspace
      # builds (R-169).
      - name: rustup toolchain install (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: cargo-registry
          shared-key: ci-workspace
          cache-targets: "false"
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # qa02's `cargo xtask ci` runs `cargo xtask plan-check`, which needs Python and PyYAML (REQ-SYS-007).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: python3 -m pip install pyyaml
      - name: Install Mesa (lavapipe)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-nextest@0.9.146
      # Runner disk, again: each test here builds the workspace on its one target, in several configurations (the
      # alias test's `cargo xtask ci --list` with `--features controls`, controls, qa02's `xtask ci`, nextest, the
      # screenshot runner), and with 109 GB free after the step above the job sat at the limit: a pull request that
      # only added xtask test files ran it out of space ("No space left on device", run 41513956938). Every dependency
      # is built without debug info, in both profiles those builds use, `dev` (`cargo build`, `cargo run`, the alias)
      # and `test` (`cargo test`, nextest); the workspace's own crates keep R-374's line tables, so a panic still names
      # file and line and a backtrace still names every frame, with file and line for the workspace's own. As
      # `ci-archive`'s step: a cargo config in the runner's CARGO_HOME, read by every cargo the job runs, the tests'
      # child runs among them, never in the repository (R-233 governs local builds), and outside rust-cache's key,
      # which hashes the CARGO_* environment (R-337). A package override has no environment form, so it is a file.
      # Test infrastructure only.
      - name: Dependencies without debug info, dev and test
        run: printf '[profile.dev.package."*"]\ndebug = false\n[profile.test.package."*"]\ndebug = false\n' >> "${CARGO_HOME:-$HOME/.cargo}/config.toml"
      # Under the disk sampler (`.github/scripts/disk_sampler.sh`), as the `ci` shards' run is: a measurement, read by
      # no gate; the step's log notes the job's lowest free, and the next step its free space at the end.
      - name: cargo nextest run -p xtask
        if: needs.changes.outputs.docs_only != 'true'
        env:
          NEXTEST_PROFILE: ci-workspace
        run: cargo nextest run -p xtask
        shell: bash .github/scripts/disk_sampler.sh {0}
      # Validation's `qa_TASK-M0-24`: it runs `cargo xtask controls --list`, whose build the step above has made, and from
      # the shards' archive it rebuilt that in its shard (`.config/nextest.toml`'s `ci-workspace` profile).
      - name: cargo nextest run -p validation --test qa_TASK-M0-24
        if: needs.changes.outputs.docs_only != 'true'
        env:
          NEXTEST_PROFILE: ci-workspace
        run: cargo nextest run -p validation --test qa_TASK-M0-24
        shell: bash .github/scripts/disk_sampler.sh {0}
      # The three controls of `xtask/tests/nextest.rs` that list the workspace in its default feature set, which the
      # `xtask-ci` shards leave here (`controls::IN_CI_WORKSPACE`, which `tests/nextest.rs` checks against this line).
      # `cargo nextest run -p xtask`, two steps up, has just built everything they list, for the tests they fault; in a
      # shard they cost a second whole build of the workspace's tests (run 41756812074: 48 GB, shards 2 and 4). A control
      # that does not make its test fail fails this step, as it fails `cargo xtask controls`. Applied per R-369.
      - name: cargo nextest run --features controls (the default-feature listing's controls)
        if: needs.changes.outputs.docs_only != 'true'
        env:
          NEXTEST_PROFILE: ci-workspace
        run: cargo nextest run -p xtask --features controls --test nextest nextest_ci_steps_list_every_test_cargo_test_listed_without_features::negative_control nextest_ci_shards_together_list_every_test::negative_control nextest_ci_steps_list_every_test_under_their_profiles::negative_control
        shell: bash .github/scripts/disk_sampler.sh {0}
      - name: Runner disk after the tests
        if: needs.changes.outputs.docs_only != 'true'
        run: df -h /
      - name: cargo test -p xtask --doc
        if: needs.changes.outputs.docs_only != 'true'
        run: cargo test -p xtask --doc
      # The cheap checks, on a data or docs pull request only (R-656, R-662, R-677).
      - name: python3 plan/check_plan.py
        if: needs.changes.outputs.docs_only == 'true'
        run: python3 plan/check_plan.py
      - name: python3 plan/tools/current_rules.py --check
        if: needs.changes.outputs.docs_only == 'true'
        run: python3 plan/tools/current_rules.py --check
      - name: cargo xtask lint vocab
        if: needs.changes.outputs.docs_only == 'true'
        run: cargo xtask lint vocab
      # Tier (b), the plan's task data (R-677): the tests of the code that reads it, in place of the full suite, each
      # building only its own test binary: in xtask, `cargo xtask gate-report`'s and `gate-provisional`'s (the gate
      # blocks, the closing tasks), `cargo xtask reviews-check`'s (every task file's Reviewers field), the plan checks'
      # and the progress banner's, and the print-graph coverage; in validation, the Part 6 catalogue, which walks the
      # task files. `scripts/ci_changes.sh` (`plan_data`) names each reader, and `xtask/tests/ci_changes.rs` checks that
      # every one the sources show is here. A `plan/requirements.yaml` change in tier (b) runs these too: the print-graph
      # coverage reads its statements, and `xtask/tests/ci_changes.rs` checks that any test reading a field outside
      # `scripts/ci_req_fields.py`'s CODE_FIELDS is among them. Under the `ci` profile, so the one test among them that
      # runs `cargo xtask ci` on the workspace (`qa02_a_failing_plan_check_turns_xtask_ci_red`) stays with full CI.
      - name: cargo nextest run -p xtask (the plan's task data's readers)
        if: needs.changes.outputs.tier == 'data' && needs.changes.outputs.plan_data == 'true'
        env:
          NEXTEST_PROFILE: ci
        run: cargo nextest run -p xtask --test gate_provisional --test gate_report --test plan_check --test progress_banner --test qa_R-485_print_graph_coverage --test qa_TASK-M0-02 --test qa_TASK-M0-19 --test qa_TASK-M0-36 --test qa_TASK-M0-53 --test reviews_check
      - name: cargo nextest run -p validation (the plan's task data's readers)
        if: needs.changes.outputs.tier == 'data' && needs.changes.outputs.plan_data == 'true'
        env:
          NEXTEST_PROFILE: ci
        run: cargo nextest run -p validation --test part6_catalogue
      # Tier (b), the GUI's artboards and references (R-677): the screenshot tests and the tests comparing with a
      # reference, in place of the full suite: xtask's screenshot tests, the gui ones among them, which copy an artboard
      # (under the default profile, which keeps them), its screenshot-case checks and the print-graph coverage;
      # kernel's initial-conditions inspector and render's colour explorer, each against its HTML reference.
      # `screenshot.yml` runs every screenshot suite on such a pull request (`cargo xtask screenshot --all`). No golden
      # reads these: the compass golden's references are fixtures.
      - name: cargo nextest run -p xtask (the GUI's artboards' and references' readers)
        if: needs.changes.outputs.tier == 'data' && needs.changes.outputs.gui_data == 'true'
        run: cargo nextest run -p xtask --test qa_R-485_print_graph_coverage --test qa_TASK-M6-24 --test screenshot
      - name: cargo nextest run -p kernel (the GUI's references' readers)
        if: needs.changes.outputs.tier == 'data' && needs.changes.outputs.gui_data == 'true'
        run: cargo nextest run -p kernel --test qa_TASK-M2-08
      - name: cargo nextest run -p render (the GUI's references' readers)
        if: needs.changes.outputs.tier == 'data' && needs.changes.outputs.gui_data == 'true'
        run: cargo nextest run -p render --test qa_TASK-M1-03
      # The kernel's log, on a failure, and the samples, whatever the job ended in, as in `xtask-ci`: `runner-disk.log`,
      # and from the tmpfs `runner-pressure.log`, written beside the steps under the disk sampler (RUNNER_DISK_TMPFS),
      # and this step's copy of the kernel's log. Each file's own path, so a disk that filled up costs none of the tmpfs
      # files. Measurements, read by no gate: `sudo` refused, a full disk or a failed upload fails nothing.
      - name: Kernel log on a failure
        if: failure()
        continue-on-error: true
        timeout-minutes: 1
        run: sudo -n dmesg --ctime | tail -n 200 | tee "$RUNNER_DISK_TMPFS/runner-dmesg.log" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && needs.changes.outputs.docs_only != 'true'
        continue-on-error: true
        timeout-minutes: 5
        with:
          name: runner-disk-ci-workspace
          path: |
            ${{ runner.temp }}/runner-disk.log
            /dev/shm/runner-pressure.log
            /dev/shm/runner-dmesg.log
          if-no-files-found: warn
          retention-days: 14
          overwrite: true

  # Formatting, lints, the docs, the build and the crate-graph check, once, beside the test shards (R-195, R-387,
  # REQ-SYS-004). Skipped on a data or docs pull request (R-656, R-677): no such path is compiled.
  ci-checks:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Runner disk: the pinned nightly with rustc-dev and llvm-tools (R-169), the workspace's build and the fixture
      # pool left this job with 11–24 MB free on ubuntu-24.04. Remove the preinstalled toolsets it does not use (.NET,
      # Android, GHC, CodeQL, the docker images), logging the free space before and after. Test infrastructure only.
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null
          df -h /
      # The toolchain rust-toolchain.toml pins, with its components: rust-gpu's nightly, on which the whole workspace
      # builds (R-169).
      - name: rustup toolchain install (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: cargo-registry
          shared-key: ci-checks
          cache-targets: "false"
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # Every dependency without debug info, as a cargo config in the runner's CARGO_HOME; the workspace's own crates
      # keep R-374's line tables (`.github/actions/cargo-ci-config`).
      - name: Dependencies without debug info, every profile
        uses: ./.github/actions/cargo-ci-config
      - name: cargo fmt --all --check
        run: cargo fmt --all --check
      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings
      # The workspace's own docs, every rustdoc warning an error (R-387): a broken or private intra-doc link, an
      # unclosed HTML tag. `--no-deps`: only the workspace's crates are documented, the dependencies only checked, so
      # the step adds little to the runner's disk. RUSTDOCFLAGS is this step's alone: rustdoc reads it and rustc
      # never does, and rust-cache's key, computed in its own step, never sees it.
      - name: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps
      - name: cargo build --workspace
        run: cargo build --workspace
      - name: cargo xtask deps
        run: cargo xtask deps

  # The v1 web skeleton's wasm build, build only, so a later change that breaks it is seen (TASK-M8-86, applied per
  # R-369): the command `cargo xtask web-skeleton` builds with, in its debug profile; the wasm-bindgen step and the deploy
  # are pages.yml's, by hand (R-627). Not gathered by the required check `ci`, as `gpu-kernel` is not. Skipped on a
  # data or docs pull request (R-656, R-677).
  web-skeleton:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: rustup toolchain install (rust-toolchain.toml)
        run: rustup toolchain install && rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: cargo-registry
          shared-key: web-skeleton
          cache-targets: "false"
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # Every dependency without debug info, as a cargo config in the runner's CARGO_HOME; the workspace's own crates
      # keep R-374's line tables (`.github/actions/cargo-ci-config`).
      - name: Dependencies without debug info, every profile
        uses: ./.github/actions/cargo-ci-config
      - name: cargo rustc -p gui (wasm32, the web feature)
        run: cargo rustc -p gui --lib --locked --target wasm32-unknown-unknown --features web --crate-type cdylib

  # The required check `ci` (R-266): every `ci` shard, `ci-checks` and `ci-workspace` passed. It runs whatever they
  # ended in (`always()`), so a failed or cancelled job turns it red rather than skipping it. R-656: a skipped job
  # passes only on a data or docs pull request (R-677), which `ci-workspace`, having run its checks, passes on
  # (DOCS_ONLY); if the classification failed, `ci-workspace` was skipped and passes nothing on, so the skips turn it
  # red.
  # On a quick run this gate and the four below skip (R-684), so that run asks for none of them, and each is named by a
  # one-value matrix: skipped at job level, GitHub reports it as `matrix.check` (run 41972273540), never under a required
  # name, so a skip here cannot read as a pass. It needs `changes` for that `if:`; `quick` reads empty if the
  # classification failed, and the gate runs and fails.
  ci-gate:
    name: ${{ matrix.check }}
    needs: [ci, ci-checks, ci-workspace, changes]
    if: always() && needs.changes.outputs.quick != 'true'
    strategy:
      matrix:
        check: [ci]
    runs-on: ubuntu-24.04
    steps:
      - name: every job it gathers passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          DOCS_ONLY: ${{ needs.ci-workspace.outputs.docs_only }}
        run: for r in $RESULTS; do [ "$r" = success ] || { [ "$r" = skipped ] && [ "$DOCS_ONLY" = true ]; } || { echo "a job ci gathers ended $r"; exit 1; }; done

  # The native tests at the release profile, on every push (R-547, REQ-TOOL-189): the pinned nightly miscompiled plain
  # Rust above opt-level 0 in rustc's MIR GVN pass (RQ-299), which the other jobs, building the tests at opt-level 0,
  # do not see. `ci-release-archive` builds the workspace's tests once at `--release`, as a nextest archive, on the
  # host target with the workspace's flags, `.cargo/config.toml`'s `-Zmir-enable-passes=-GVN` among them, so no step
  # sets RUSTFLAGS; `ci-release` runs it as 2 shards (`--partition hash:<k>/2`), so each job stays within ~10.5 min
  # (R-325; REQ-SYS-078 allows one archive job per build profile, applied per R-369). Under the `ci` profile
  # (`.config/nextest.toml`): every native test but those that need the built kernel, which `gpu-kernel` runs, and
  # those that run cargo on the workspace's own target directory, which `ci-workspace` runs. Not gathered by the
  # required check `ci`, as `gpu-kernel` is not (applied per R-369). The archive job frees the runner's disk as
  # `ci-checks` does.
  # Skipped on a data or docs pull request (R-656, R-677), and with it `ci-release`, which needs its archive; neither is
  # gathered by a required check.
  ci-release-archive:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    outputs:
      bytes: ${{ steps.size.outputs.bytes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Runner disk: the workspace's release build. Remove the preinstalled toolsets it does not use, as `ci-checks`
      # does, logging the free space before and after. Test infrastructure only.
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null
          df -h /
      # The toolchain rust-toolchain.toml pins, with its components: rust-gpu's nightly, on which the whole workspace
      # builds (R-169), and whose MIR GVN fault this job is for (R-547).
      - name: rustup toolchain install (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: cargo-registry
          shared-key: ci-release-archive
          cache-targets: "false"
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # Every dependency without debug info, as a cargo config in the runner's CARGO_HOME; the workspace's own crates
      # keep R-374's line tables (`.github/actions/cargo-ci-config`).
      - name: Dependencies without debug info, every profile
        uses: ./.github/actions/cargo-ci-config
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-nextest@0.9.146
      - name: cargo nextest archive --workspace --release
        env:
          NEXTEST_PROFILE: ci
        run: cargo nextest archive --workspace --release --archive-file $RUNNER_TEMP/nextest-release.tar.zst
      # The archive's size in bytes, a job output each shard checks its download against: a download can end short
      # without failing its step (below).
      - name: The archive's size
        id: size
        run: echo "bytes=$(stat -c %s "$RUNNER_TEMP/nextest-release.tar.zst")" >> "$GITHUB_OUTPUT"
      # Already zstd-compressed, so uploaded as it is; kept a day, the run's own.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nextest-release
          path: ${{ runner.temp }}/nextest-release.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  # The release archive's tests as 2 shards, each running its `hash:` slice from `ci-release-archive`'s archive, with
  # no build or test compile of its own but shard 1's doctests at the same profile (R-231). `--no-fail-fast`: every
  # test that fails at the release profile is shown, not only the first. The GPU harness self-tests among them run on
  # lavapipe, as in `ci`. Its heavy steps run under the disk sampler (`.github/scripts/disk_sampler.sh`), as the `ci`
  # shards' do: a measurement, read by no gate.
  ci-release:
    needs: ci-release-archive
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    env:
      PRIN_GPU_BACKEND: vulkan
      RUNNER_DISK_TMPFS: /dev/shm
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Runner disk, as in the `ci` shards (the same list, copied): before the toolchain and the download, logging the
      # free space before and after. The runner starts at about 60 GB used whatever its size, so a 72 GB runner has 12 GB
      # free here, and both shards have run out of it ("No space left on device": `ci-release (1)` of run 41791726904,
      # `ci-release (2)` on PR #394). Test infrastructure only.
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/lib/jvm /opt/hostedtoolcache/Java_* /usr/share/swift \
            /usr/local/share/chromium /opt/google /opt/microsoft /usr/local/share/powershell /usr/local/share/boost \
            /usr/share/miniconda /usr/local/julia* /usr/local/lib/node_modules \
            /opt/hostedtoolcache/go /opt/hostedtoolcache/node /opt/hostedtoolcache/PyPy /opt/hostedtoolcache/Ruby \
            /usr/lib/google-cloud-sdk /usr/local/aws-cli /usr/local/aws-sam-cli /opt/az /usr/share/az_*
          sudo docker image prune --all --force > /dev/null
          df -h /
      # What the two disks hold, for moving the build to `/mnt` (the owner's candidate 1, 4 Nov 2026). It only measures,
      # and nothing it finds can fail the job.
      - name: Runner disks
        run: |
          df -h / /mnt || true
          lsblk || true
      # The toolchain rust-toolchain.toml pins (R-169): the tests run cargo themselves, on the fixtures.
      - name: rustup toolchain install (rust-toolchain.toml)
        run: rustup toolchain install
      # Every dependency without debug info, as a cargo config in the runner's CARGO_HOME; the workspace's own crates
      # keep R-374's line tables (`.github/actions/cargo-ci-config`).
      - name: Dependencies without debug info, every profile
        uses: ./.github/actions/cargo-ci-config
      # xtask's plan_check tests run plan/check_plan.py, which needs Python and PyYAML (TASK-M0-02).
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: python3 -m pip install pyyaml
      - name: Install Mesa (lavapipe)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-nextest@0.9.146
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nextest-release
          path: ${{ runner.temp }}
      # The downloaded archive's size checked against the one `ci-release-archive` uploaded, with one more download of
      # a short archive, as in `ci`: a stalled download can end short and still pass its step.
      - name: Check the archive downloaded whole
        env:
          WANT: ${{ needs.ci-release-archive.outputs.bytes }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          archive="$RUNNER_TEMP/nextest-release.tar.zst"
          got=$(stat -c %s "$archive" 2>/dev/null || echo 0)
          if [ "$got" != "$WANT" ]; then
            echo "::warning::nextest-release: downloaded $got of $WANT bytes; downloading it again"
            rm -f "$archive"
            gh run download "$GITHUB_RUN_ID" --name nextest-release --dir "$RUNNER_TEMP"
            got=$(stat -c %s "$archive" 2>/dev/null || echo 0)
            if [ "$got" != "$WANT" ]; then
              echo "::error::nextest-release: downloaded $got of $WANT bytes, twice"; exit 1
            fi
          fi
      - name: cargo nextest run --archive-file … --partition hash:${{ matrix.shard }}/2
        env:
          NEXTEST_PROFILE: ci
        run: cargo nextest run --archive-file $RUNNER_TEMP/nextest-release.tar.zst --extract-to . --extract-overwrite --no-fail-fast --partition hash:${{ matrix.shard }}/2
        shell: bash .github/scripts/disk_sampler.sh {0}
      # The workspace's doctests at the release profile, once, in shard 1, which nextest does not run (R-231). Under the
      # disk sampler too: this step is the job's one compile.
      - name: cargo test --workspace --release --no-fail-fast --doc
        if: matrix.shard == 1
        run: cargo test --workspace --release --no-fail-fast --doc
        shell: bash .github/scripts/disk_sampler.sh {0}
      # The kernel's log, on a failure, and the samples, whatever the job ended in, as in `xtask-ci`: `runner-disk.log`,
      # and from the tmpfs `runner-pressure.log`, written beside the steps under the disk sampler (RUNNER_DISK_TMPFS),
      # and this step's copy of the kernel's log. Each file's own path, so a disk that filled up costs none of the tmpfs
      # files. Measurements, read by no gate: `sudo` refused, a full disk or a failed upload fails nothing.
      - name: Kernel log on a failure
        if: failure()
        continue-on-error: true
        timeout-minutes: 1
        run: sudo -n dmesg --ctime | tail -n 200 | tee "$RUNNER_DISK_TMPFS/runner-dmesg.log" || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        with:
          name: runner-disk-ci-release-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/runner-disk.log
            /dev/shm/runner-pressure.log
            /dev/shm/runner-dmesg.log
          if-no-files-found: warn
          retention-days: 14
          overwrite: true

  # The GPU kernel build and the tests that need the built kernel, in a job of their own beside `ci` (R-325,
  # REQ-SYS-076): `cargo xtask build-kernel` compiles the kernel to the GPU, rust-gpu → SPIR-V → naga → WGSL
  # (canonical_spec §1 item 2; TASK-M0-14), then the `gpu-kernel` profile runs the tests that read
  # `target/spirv/kernel.spv` or `kernel.wgsl`: validation's `toolchain_trivial_kernel` dispatches the WGSL on lavapipe
  # (R-169), xtask's `build_kernel` tests check the SPIR-V and its translation.
  gpu-kernel:
    runs-on: ubuntu-24.04
    env:
      PRIN_GPU_BACKEND: vulkan
    name: gpu-kernel suites
    needs: changes
    if: needs.changes.outputs.gpu == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Runner disk, as in `ci-archive` (the same list, copied): before the toolchain and the cache restores, logging
      # the free space before and after. Test infrastructure only.
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/lib/jvm /opt/hostedtoolcache/Java_* /usr/share/swift \
            /usr/local/share/chromium /opt/google /opt/microsoft /usr/local/share/powershell /usr/local/share/boost \
            /usr/share/miniconda /usr/local/julia* /usr/local/lib/node_modules \
            /opt/hostedtoolcache/go /opt/hostedtoolcache/node /opt/hostedtoolcache/PyPy /opt/hostedtoolcache/Ruby \
            /usr/lib/google-cloud-sdk /usr/local/aws-cli /usr/local/aws-sam-cli /opt/az /usr/share/az_*
          sudo docker image prune --all --force > /dev/null
          df -h /
      # What the two disks hold, for moving the build to `/mnt` (the owner's candidate 1, 4 Nov 2026). It only measures,
      # and nothing it finds can fail the job.
      - name: Runner disks
        run: |
          df -h / /mnt || true
          lsblk || true
      # The toolchain rust-toolchain.toml pins, with its components: rust-gpu's nightly, on which the whole workspace
      # builds (R-169).
      - name: rustup toolchain install (rust-toolchain.toml)
        id: toolchain
        run: |
          rustup toolchain install
          echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: cargo-registry
          shared-key: gpu-kernel
          cache-targets: "false"
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # Every dependency without debug info, as a cargo config in the runner's CARGO_HOME; the workspace's own crates
      # keep R-374's line tables (`.github/actions/cargo-ci-config`).
      - name: Dependencies without debug info, every profile
        uses: ./.github/actions/cargo-ci-config
      # The rust-gpu build, the `rustc_codegen_spirv` backend cargo-gpu's installer builds into ~/.cache/rust-gpu, kept
      # between runs (R-320): keyed on this job and the channel rust-toolchain.toml pins, so a toolchain bump starts a
      # fresh cache (REQ-SYS-075; per-job keys, R-285, REQ-SYS-073). Restored in every run, saved after the build only
      # on a push to `main` (R-326).
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/rust-gpu
          key: rust-gpu-gpu-kernel-${{ runner.os }}-${{ steps.toolchain.outputs.channel }}
      - name: Install Mesa (lavapipe)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-nextest@0.9.146
      # The build and the tests run under the disk sampler (`.github/scripts/disk_sampler.sh`), as `cargo xtask ci` is
      # in `xtask-ci`: a measurement, read by no gate; each such step's log notes the job's lowest free so far.
      - name: cargo xtask build-kernel
        run: cargo xtask build-kernel
        shell: bash .github/scripts/disk_sampler.sh {0}
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: ~/.cache/rust-gpu
          key: rust-gpu-gpu-kernel-${{ runner.os }}-${{ steps.toolchain.outputs.channel }}
      # The tests that need the built kernel, in validation, xtask and engine (the decode stage's, TASK-M2-06): the
      # `gpu-kernel` profile's default filter (`.config/nextest.toml`), chosen by NEXTEST_PROFILE. Their packages'
      # doctests beside them, as beside every nextest step (R-231).
      - name: cargo nextest run -p validation -p xtask -p engine
        env:
          NEXTEST_PROFILE: gpu-kernel
        run: cargo nextest run -p validation -p xtask -p engine
        shell: bash .github/scripts/disk_sampler.sh {0}
      - name: cargo test -p validation -p xtask -p engine --doc
        run: cargo test -p validation -p xtask -p engine --doc
        shell: bash .github/scripts/disk_sampler.sh {0}

  # The required check `gpu-kernel` (R-656): `gpu-kernel`'s suites passed, or were skipped because the
  # classification found no GPU-path file in the pull request's change. It runs whatever they ended in (`always()`).
  gpu-kernel-gate:
    name: ${{ matrix.check }}
    needs: [changes, gpu-kernel]
    if: always() && needs.changes.outputs.quick != 'true'
    strategy:
      matrix:
        check: [gpu-kernel]
    runs-on: ubuntu-24.04
    steps:
      - name: the suites passed, or the change has no GPU-path file
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          NO_GPU: ${{ needs.changes.result == 'success' && needs.changes.outputs.gpu == 'false' }}
        run: for r in $RESULTS; do [ "$r" = success ] || { [ "$r" = skipped ] && [ "$NO_GPU" = true ]; } || { echo "a job gpu-kernel gathers ended $r"; exit 1; }; done

  # `cargo xtask ci` in jobs of their own, beside the tests (R-235), as 4 parallel shards (R-360, REQ-SYS-077):
  # `cargo xtask ci --partition <k>/4` runs `cargo xtask build-kernel`, whose WGSL the kernel tests' controls dispatch,
  # in every shard; then `cargo xtask controls` on the controls whose names fall in slice k of 4, failing on any finding
  # (R-198, R-226); and, in shard 1 only, the other runners, among them `cargo xtask plan-check`, which needs Python
  # and PyYAML (REQ-SYS-007). Together the 4 shards run every control exactly once, but for the three `ci-workspace`
  # runs (`controls::IN_CI_WORKSPACE`). The GPU harness's controls run on lavapipe, as its tests do.
  # `xtask/tests/nextest.rs`'s other controls list tests through the pinned cargo-nextest (R-231). The kernel build stays here, as a runner `cargo xtask ci` registers: the kernel tests' controls read its
  # output (R-325 moves it out of `ci`, not out of this job).
  xtask-ci:
    runs-on: ubuntu-24.04
    env:
      PRIN_GPU_BACKEND: vulkan
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # R-656: skipped on a data or docs pull request (R-677), whose plan-check and vocabulary lint `ci-workspace` runs
    # then; the gate `xtask-ci` passes the skip only on that verdict. It waits on the classification alone (R-235).
    name: xtask-ci (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Runner disk: on PRs #251 and #252, shard 2 ran out of space 25–30 min into `cargo xtask ci` ("No space left on
      # device", run 39420000947): the kernel build, the controls' `--features controls` builds and the fixture pool,
      # beside the pinned nightly with rustc-dev and llvm-tools (R-169). Remove the preinstalled toolsets it does not
      # use (.NET, Android, GHC, CodeQL, the docker images), as `ci-checks` does, logging the free space before and
      # after. Test infrastructure only.
      # Still too little: job 124915235110 had 109G free after this step and the runner warned "Free space left: 63 MB"
      # 38 min later, with 36G still in use here. So the rest goes too: none of this job's steps, `cargo xtask ci` nor
      # its tests run a JVM, Swift, a browser, PowerShell, Boost, Conda, Node or a cloud CLI (the actions' Node is the
      # runner's own, under its `externals`). Kept: the tool cache's Python, for setup-python, and the system's
      # compilers, linker and LLVM, for the toolchain's builds and Mesa.
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/lib/jvm /opt/hostedtoolcache/Java_* /usr/share/swift \
            /usr/local/share/chromium /opt/google /opt/microsoft /usr/local/share/powershell /usr/local/share/boost \
            /usr/share/miniconda /usr/local/julia* /usr/local/lib/node_modules \
            /opt/hostedtoolcache/go /opt/hostedtoolcache/node /opt/hostedtoolcache/PyPy /opt/hostedtoolcache/Ruby \
            /usr/lib/google-cloud-sdk /usr/local/aws-cli /usr/local/aws-sam-cli /opt/az /usr/share/az_*
          sudo docker image prune --all --force > /dev/null
          df -h /
      # What the two disks hold, for moving the build to `/mnt` (the owner's candidate 1, 4 Nov 2026). It only measures,
      # and nothing it finds can fail the job.
      - name: Runner disks
        run: |
          df -h / /mnt || true
          lsblk || true
      # The toolchain rust-toolchain.toml pins, with its components: rust-gpu's nightly, on which the whole workspace
      # builds (R-169).
      - name: rustup toolchain install (rust-toolchain.toml)
        id: toolchain
        run: |
          rustup toolchain install
          echo "cachekey=$({ rustc --version --verbose; env | grep -E '^CARGO_(INCREMENTAL|PROFILE)' | sort; cat .github/actions/cargo-ci-config/config.sh; } | sha256sum | cut -c1-20)" >> "$GITHUB_OUTPUT"
          echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: cargo-registry
          shared-key: xtask-ci
          cache-targets: "false"
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # Every dependency without debug info, as a cargo config in the runner's CARGO_HOME; the workspace's own crates
      # keep R-374's line tables (`.github/actions/cargo-ci-config`).
      - name: Dependencies without debug info, every profile
        uses: ./.github/actions/cargo-ci-config
      # The fixture pool the `ci` job saves, restored only, under its key: `cargo xtask controls` runs the fixture tests'
      # controls (R-270, R-285).
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: target/tmp/fixture-targets
          key: fixture-pool-ci-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock', 'fixtures/**/Cargo.toml', 'xtask/tests/fixtures/**/Cargo.toml') }}
          restore-keys: fixture-pool-ci-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-
      # The rust-gpu build, the `rustc_codegen_spirv` backend cargo-gpu's installer builds into ~/.cache/rust-gpu, kept
      # between runs (R-320): keyed on this job and the channel rust-toolchain.toml pins, so a toolchain bump starts a
      # fresh cache (REQ-SYS-075; per-job keys, R-285, REQ-SYS-073). Restored in every run, saved after `cargo xtask ci`
      # only on a push to `main` (R-326).
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/rust-gpu
          key: rust-gpu-xtask-ci-${{ runner.os }}-${{ steps.toolchain.outputs.channel }}
      - name: Install Mesa (lavapipe)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: python3 -m pip install pyyaml
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-nextest@0.9.146
      # The disk beside the run, as no check does: `cargo xtask ci` under a shell that samples it and exits with its
      # status (`.github/scripts/disk_sampler.sh`), then a last `df` and the samples, on a failure too. A measurement,
      # read by no gate; a green run shows little, and the "Free space left" warning and the sampler's lowest free are
      # what say how close it came.
      - name: cargo xtask ci --partition ${{ matrix.shard }}/4
        shell: bash .github/scripts/disk_sampler.sh {0}
        run: cargo xtask ci --partition ${{ matrix.shard }}/4
      - name: Runner disk after cargo xtask ci
        if: always()
        run: df -h /
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: runner-disk-xtask-ci-${{ matrix.shard }}
          path: ${{ runner.temp }}/runner-disk.log
          if-no-files-found: warn
          retention-days: 14
          overwrite: true
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: ~/.cache/rust-gpu
          key: rust-gpu-xtask-ci-${{ runner.os }}-${{ steps.toolchain.outputs.channel }}

  # The required check `xtask-ci` (R-266): every `xtask-ci` shard passed, as `ci-gate` gathers `ci`'s. R-656: the
  # shards may be skipped only when the classification ran and found a data or docs pull request (DOCS_ONLY, R-677).
  xtask-ci-gate:
    name: ${{ matrix.check }}
    needs: [xtask-ci, changes]
    if: always() && needs.changes.outputs.quick != 'true'
    strategy:
      matrix:
        check: [xtask-ci]
    runs-on: ubuntu-24.04
    steps:
      - name: every job it gathers passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          DOCS_ONLY: ${{ needs.changes.result == 'success' && needs.changes.outputs.docs_only == 'true' }}
        run: for r in $RESULTS; do [ "$r" = success ] || { [ "$r" = skipped ] && [ "$DOCS_ONLY" = true ]; } || { echo "a job xtask-ci gathers ended $r"; exit 1; }; done

  # GitHub-hosted Apple silicon, paravirtual Metal: the Metal correctness suites only (R-169, R-186).
  gpu-metal:
    runs-on: macos-15
    env:
      PRIN_GPU_BACKEND: metal
    name: gpu-metal suites
    needs: changes
    if: needs.changes.outputs.gpu == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The toolchain rust-toolchain.toml pins, with its components: rust-gpu's nightly, on which the whole workspace
      # builds (R-169).
      - name: rustup toolchain install (rust-toolchain.toml)
        id: toolchain
        run: |
          rustup toolchain install
          echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: cargo-registry
          shared-key: gpu-metal
          cache-targets: "false"
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # Every dependency without debug info, as a cargo config in the runner's CARGO_HOME; the workspace's own crates
      # keep R-374's line tables (`.github/actions/cargo-ci-config`).
      - name: Dependencies without debug info, every profile
        uses: ./.github/actions/cargo-ci-config
      # The rust-gpu build, kept between runs as in `gpu-kernel` (R-320, R-326), under this job's key, at
      # ~/.cache/rust-gpu. On macOS cargo-gpu's installer builds into ~/Library/Caches/rust-gpu, so that is linked to
      # it first.
      - name: Link rust-gpu's macOS cache to ~/.cache/rust-gpu
        run: mkdir -p ~/.cache/rust-gpu ~/Library/Caches && ln -sfn ~/.cache/rust-gpu ~/Library/Caches/rust-gpu
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/rust-gpu
          key: rust-gpu-gpu-metal-${{ runner.os }}-${{ steps.toolchain.outputs.channel }}
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-nextest@0.9.146
      # The codegen self-test (TASK-M0-15) dispatches the kernel's WGSL, so the kernel is built first (R-110, R-186).
      - name: cargo xtask build-kernel
        run: cargo xtask build-kernel
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: ~/.cache/rust-gpu
          key: rust-gpu-gpu-metal-${{ runner.os }}-${{ steps.toolchain.outputs.channel }}
      - name: cargo nextest run -p validation --features controls metal_hosted_probe
        run: cargo nextest run -p validation --features controls metal_hosted_probe --no-capture
      - name: cargo test -p validation --features controls metal_hosted_probe --doc
        run: cargo test -p validation --features controls metal_hosted_probe --doc
      - name: cargo nextest run -p validation --features controls gpu_harness
        run: cargo nextest run -p validation --features controls gpu_harness --no-capture
      - name: cargo test -p validation --features controls gpu_harness --doc
        run: cargo test -p validation --features controls gpu_harness --doc
      # The compute fast-math probe on Metal, its controls included: with the setting off, the passthrough's MSL
      # divides as the CPU does; on, it differs (R-297; REQ-SYS-074; TASK-M0-44). Then the compute entry point's own
      # tests, its passthrough path among them.
      - name: cargo nextest run -p validation --features controls compute_fast_math
        run: cargo nextest run -p validation --features controls compute_fast_math --no-capture
      - name: cargo test -p validation --features controls compute_fast_math --doc
        run: cargo test -p validation --features controls compute_fast_math --doc
      - name: cargo nextest run -p engine --features controls compute_entry
        run: cargo nextest run -p engine --features controls compute_entry --no-capture
      - name: cargo test -p engine --features controls compute_entry --doc
        run: cargo test -p engine --features controls compute_entry --doc
      # The decode stage on Metal, its controls included (TASK-M2-06): Metal's GPU `tanh` fails from 43.671875, 0 and
      # then NaN, which no other backend CI runs shows, so only here does removing the operator's `tanh_sat` clamp fail
      # a test (R-186; dd_generation_root §3.9). `decode_` selects `decode_stage_gpu`'s tests (and `decode_dispatch`'s),
      # `qa_m206_` qa's `qa_TASK-M2-06_gpu`; each has its doctest step over the same filter.
      - name: cargo nextest run -p engine --features controls decode_
        run: cargo nextest run -p engine --features controls decode_ --no-capture
      - name: cargo test -p engine --features controls decode_ --doc
        run: cargo test -p engine --features controls decode_ --doc
      # The invariant-momentum construction's branches on Metal, its controls included (TASK-M2-09): the GPU takes the
      # exact branch of `2·I·K* < L_z²` that CPU-f32 and CPU-f64 take, the tiny triples whose unnormalised limb products
      # a flushing GPU would drop among them, and CPU-f64's seed, decided on `z_α`. `invariant_` selects `invariant_gpu`'s
      # tests.
      - name: cargo nextest run -p engine --features controls invariant_
        run: cargo nextest run -p engine --features controls invariant_ --no-capture
      - name: cargo test -p engine --features controls invariant_ --doc
        run: cargo test -p engine --features controls invariant_ --doc
      - name: cargo nextest run -p engine --features controls qa_m206_
        run: cargo nextest run -p engine --features controls qa_m206_ --no-capture
      - name: cargo test -p engine --features controls qa_m206_ --doc
        run: cargo test -p engine --features controls qa_m206_ --doc
      # Canonicalisation `C` on Metal, its controls included (TASK-M2-07): the mirror tie at `±δ_λ`, the order, the
      # coincident inner pair at `ρ = (±0, ±0)`, the seam sweep's branches against the CPU's and the no-op on Metal's
      # own decodes. `canonicaliser_` selects
      # `canon_gpu`'s tests and qa's `qa_TASK-M2-07_gpu`; its doctest step runs over the same filter.
      - name: cargo nextest run -p engine --features controls canonicaliser_
        run: cargo nextest run -p engine --features controls canonicaliser_ --no-capture
      - name: cargo test -p engine --features controls canonicaliser_ --doc
        run: cargo test -p engine --features controls canonicaliser_ --doc
      # Encode `E` on Metal, its controls included (TASK-M2-15): `β`'s selects on the `−x` half-axis and at the pole,
      # `±0` operands included, and the exact `α`-poles' encode, against CPU-f32 and CPU-f64. `encode_` selects
      # `encode_gpu`'s tests, qa's `qa_TASK-M2-15_gpu` and `encode_dispatch`'s host-side check; its doctest step runs
      # over the same filter.
      - name: cargo nextest run -p engine --features controls encode_
        run: cargo nextest run -p engine --features controls encode_ --no-capture
      - name: cargo test -p engine --features controls encode_ --doc
        run: cargo test -p engine --features controls encode_ --doc
      # The agreement presets' tolerance on Metal (REQ-COL-060; R-297; TASK-M2-29): the fragment compiled as Metal
      # compiles it, with fast-math, against the kernel decode stage compiled with compute fast-math off, every M2
      # chart's measured |E − E₀| written to the gate report; the dispatch scramble still fails it.
      - name: cargo xtask gate decode-agreement
        run: cargo xtask gate decode-agreement
      # The codegen self-test on Metal, its controls included (debug_tooling_plan §H; TASK-M0-15).
      - name: cargo nextest run -p validation --features controls codegen_selftest
        run: cargo nextest run -p validation --features controls codegen_selftest --no-capture
      - name: cargo test -p validation --features controls codegen_selftest --doc
        run: cargo test -p validation --features controls codegen_selftest --doc
      # The mock noise's shared lattice corners on Metal, its controls included (REQ-GUI-412; R-685's "on every backend",
      # R-692); the `ci` shards run them on lavapipe. They claim nothing of the real kernel (ADR-0001 § "Must not claim").
      - name: cargo nextest run -p gui lattice_
        run: cargo nextest run -p gui lattice_ --no-capture
      # Every golden suite on Metal (R-186's first Metal check, TASK-M0-06), each case against its one reference
      # across backends, or its Metal one where it keeps one per backend (R-269, R-287, R-296; TASK-M0-43).
      - name: cargo xtask golden --all
        run: cargo xtask golden --all
      # R-269's half-way fixture on Metal: the quantise pass's levels are the fragment's f32 output rounded half to
      # even, exact ties included, printed as REQ-VAL-176's evidence (R-296; TASK-M0-43).
      - name: cargo nextest run -p xtask --features controls golden_halfway
        run: cargo nextest run -p xtask --features controls golden_halfway --no-capture
      - name: cargo test -p xtask --features controls golden_halfway --doc
        run: cargo test -p xtask --features controls golden_halfway --doc

  # The required check `gpu-metal` (R-656): `gpu-metal`'s suites passed, or were skipped because the
  # classification found no GPU-path file in the pull request's change. It runs whatever they ended in (`always()`).
  gpu-metal-gate:
    name: ${{ matrix.check }}
    needs: [changes, gpu-metal]
    if: always() && needs.changes.outputs.quick != 'true'
    strategy:
      matrix:
        check: [gpu-metal]
    runs-on: ubuntu-24.04
    steps:
      - name: the suites passed, or the change has no GPU-path file
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          NO_GPU: ${{ needs.changes.result == 'success' && needs.changes.outputs.gpu == 'false' }}
        run: for r in $RESULTS; do [ "$r" = success ] || { [ "$r" = skipped ] && [ "$NO_GPU" = true ]; } || { echo "a job gpu-metal gathers ended $r"; exit 1; }; done

  # lavapipe, Mesa's software Vulkan: the second backend on every commit (R-110, R-169, R-186).
  gpu-lavapipe:
    runs-on: ubuntu-24.04
    env:
      PRIN_GPU_BACKEND: vulkan
    name: gpu-lavapipe suites
    needs: changes
    if: needs.changes.outputs.gpu == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Runner disk: the kernel build, then validation, engine and xtask built once per `--features controls` suite and
      # the golden suites, as in `xtask-ci`, which ran out of space on PRs #251 and #252 (`nightly.yml`'s twin of this
      # job frees it too). Remove the preinstalled toolsets it does not use, as `xtask-ci` does, logging the free space
      # before and after. Test infrastructure only.
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null
          df -h /
      # What the two disks hold, for moving the build to `/mnt` (the owner's candidate 1, 4 Nov 2026). It only measures,
      # and nothing it finds can fail the job.
      - name: Runner disks
        run: |
          df -h / /mnt || true
          lsblk || true
      # The toolchain rust-toolchain.toml pins, with its components: rust-gpu's nightly, on which the whole workspace
      # builds (R-169).
      - name: rustup toolchain install (rust-toolchain.toml)
        id: toolchain
        run: |
          rustup toolchain install
          echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: cargo-registry
          shared-key: gpu-lavapipe
          cache-targets: "false"
          cache-bin: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      # Every dependency without debug info, as a cargo config in the runner's CARGO_HOME; the workspace's own crates
      # keep R-374's line tables (`.github/actions/cargo-ci-config`).
      - name: Dependencies without debug info, every profile
        uses: ./.github/actions/cargo-ci-config
      # The rust-gpu build, kept between runs as in `gpu-kernel` (R-320, R-326), under this job's key.
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/rust-gpu
          key: rust-gpu-gpu-lavapipe-${{ runner.os }}-${{ steps.toolchain.outputs.channel }}
      - name: Install Mesa (lavapipe)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-nextest@0.9.146
      # The codegen self-test (TASK-M0-15) dispatches the kernel's WGSL, so the kernel is built first (R-110, R-186).
      - name: cargo xtask build-kernel
        run: cargo xtask build-kernel
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: ~/.cache/rust-gpu
          key: rust-gpu-gpu-lavapipe-${{ runner.os }}-${{ steps.toolchain.outputs.channel }}
      - name: cargo nextest run -p validation --features controls gpu_harness
        run: cargo nextest run -p validation --features controls gpu_harness --no-capture
      - name: cargo test -p validation --features controls gpu_harness --doc
        run: cargo test -p validation --features controls gpu_harness --doc
      # The compute fast-math probe on lavapipe, its controls included: Vulkan compiles without fast-math, so the
      # divisions are the CPU's whatever the setting (R-297; REQ-SYS-074; TASK-M0-44).
      - name: cargo nextest run -p validation --features controls compute_fast_math
        run: cargo nextest run -p validation --features controls compute_fast_math --no-capture
      - name: cargo test -p validation --features controls compute_fast_math --doc
        run: cargo test -p validation --features controls compute_fast_math --doc
      # The agreement presets' tolerance on lavapipe (REQ-COL-060; R-297; TASK-M2-29): the fragment compiled as
      # Vulkan compiles it against the kernel decode stage compiled with compute fast-math off, every M2 chart's
      # measured |E − E₀| written to the gate report; the dispatch scramble still fails it.
      - name: cargo xtask gate decode-agreement
        run: cargo xtask gate decode-agreement
      # The codegen self-test on lavapipe, its controls included (debug_tooling_plan §H; TASK-M0-15).
      - name: cargo nextest run -p validation --features controls codegen_selftest
        run: cargo nextest run -p validation --features controls codegen_selftest --no-capture
      - name: cargo test -p validation --features controls codegen_selftest --doc
        run: cargo test -p validation --features controls codegen_selftest --doc
      # Canonicalisation `C` on lavapipe, its controls included (TASK-M2-07; applied per R-369): the mirror decision's
      # integer-exponent form, which uses no `fma` and rounds no subnormal, against CPU-f32's on identical inputs, the
      # hierarchical states among them (RQ-298). `canonicaliser_` selects `canon_gpu`'s tests and qa's
      # `qa_TASK-M2-07_gpu`; `gpu-kernel` runs both on lavapipe too, without the controls.
      - name: cargo nextest run -p engine --features controls canonicaliser_
        run: cargo nextest run -p engine --features controls canonicaliser_ --no-capture
      - name: cargo test -p engine --features controls canonicaliser_ --doc
        run: cargo test -p engine --features controls canonicaliser_ --doc
      # Encode `E` on lavapipe, its controls included (TASK-M2-15; applied per R-369): `β`'s selects, where Vulkan
      # without `SignedZeroInfNanPreserve` may ignore a zero's sign through `atan2` (R-438), and the exact `α`-poles.
      # `encode_` selects `encode_gpu`'s tests, qa's `qa_TASK-M2-15_gpu` and `encode_dispatch`'s; `gpu-kernel` runs
      # `encode_gpu` and `qa_TASK-M2-15_gpu` on lavapipe too, without the controls.
      - name: cargo nextest run -p engine --features controls encode_
        run: cargo nextest run -p engine --features controls encode_ --no-capture
      - name: cargo test -p engine --features controls encode_ --doc
        run: cargo test -p engine --features controls encode_ --doc
      # Every golden suite on lavapipe, each case against its one reference across backends, or its Vulkan one where it
      # keeps one per backend (R-269, R-287, R-296; TASK-M0-43).
      - name: cargo xtask golden --all
        run: cargo xtask golden --all
      # R-269's half-way fixture on lavapipe: the quantise pass's levels are the fragment's f32 output rounded half to
      # even, exact ties included, and equal its automatic ones, printed as REQ-VAL-176's evidence (R-296; TASK-M0-43).
      - name: cargo nextest run -p xtask --features controls golden_halfway
        run: cargo nextest run -p xtask --features controls golden_halfway --no-capture
      - name: cargo test -p xtask --features controls golden_halfway --doc
        run: cargo test -p xtask --features controls golden_halfway --doc

  # The required check `gpu-lavapipe` (R-656): `gpu-lavapipe`'s suites passed, or were skipped because the
  # classification found no GPU-path file in the pull request's change. It runs whatever they ended in (`always()`).
  gpu-lavapipe-gate:
    name: ${{ matrix.check }}
    needs: [changes, gpu-lavapipe]
    if: always() && needs.changes.outputs.quick != 'true'
    strategy:
      matrix:
        check: [gpu-lavapipe]
    runs-on: ubuntu-24.04
    steps:
      - name: the suites passed, or the change has no GPU-path file
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          NO_GPU: ${{ needs.changes.result == 'success' && needs.changes.outputs.gpu == 'false' }}
        run: for r in $RESULTS; do [ "$r" = success ] || { [ "$r" = skipped ] && [ "$NO_GPU" = true ]; } || { echo "a job gpu-lavapipe gathers ended $r"; exit 1; }; done

  # The commit statuses `changes` opened on a code pull-request head, closed from the five gates' results (R-684), on the
  # full tier only. A required check and a commit status of one name are both required, so this runs whatever the gates
  # ended in. Never on a quick run, whose statuses stay pending, or a docs or data head, which has none.
  ci-status:
    needs: [changes, ci-gate, xtask-ci-gate, gpu-kernel-gate, gpu-metal-gate, gpu-lavapipe-gate]
    if: always() && needs.changes.outputs.report == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: .github/scripts/ci_tier.sh report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RESULT_ci: ${{ needs.ci-gate.result }}
          RESULT_xtask_ci: ${{ needs.xtask-ci-gate.result }}
          RESULT_gpu_kernel: ${{ needs.gpu-kernel-gate.result }}
          RESULT_gpu_metal: ${{ needs.gpu-metal-gate.result }}
          RESULT_gpu_lavapipe: ${{ needs.gpu-lavapipe-gate.result }}
        run: .github/scripts/ci_tier.sh report

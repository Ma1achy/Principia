# Per-push CI (R-177): formatting and lints (R-195), build, test, the crate-graph check (REQ-SYS-004) and, in a job
# of its own beside them (R-235), `cargo xtask ci`, the single per-push entry point every later per-commit runner
# registers into. The tests run through cargo-nextest, pinned, and doctests, which nextest does not run, through
# `cargo test --doc` (R-231); `xtask/tests/nextest.rs` checks that together they list every test `cargo test` did.
# Bench runs nightly and screenshots
# on GUI PRs, in their own workflows (R-177). GitHub-hosted runners (R-186); the GPU jobs are GitHub-hosted too, so
# R-174's same-repository guard stays dormant until a self-hosted job is added (R-186).
name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        id: toolchain
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The fixture pool, one build directory per fixture type, kept between runs (R-270): cargo rebuilds in it only
      # what changed. Keyed on what invalidates its dependencies' builds: the runner, the toolchain and the lockfile.
      # Listed after rust-cache, so its save runs before rust-cache's post-step clean-up of `target`.
      - uses: actions/cache@v4
        with:
          path: target/tmp/fixture-targets
          key: fixture-pool-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}
      - name: cargo fmt --all --check
        run: cargo fmt --all --check
      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo build --workspace
        run: cargo build --workspace
      # xtask's plan_check tests run plan/check_plan.py, which needs Python and PyYAML (TASK-M0-02).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: python3 -m pip install pyyaml
      # The workspace tests include the GPU harness self-tests, which need an adapter and PRIN_GPU_BACKEND (R-169):
      # here they run on lavapipe; metal_hosted_probe is ignored off macOS.
      - name: Install Mesa (lavapipe)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146
      - name: cargo nextest run --workspace
        env:
          PRIN_GPU_BACKEND: vulkan
        run: cargo nextest run --workspace
      - name: cargo test --workspace --doc
        run: cargo test --workspace --doc
      - name: cargo xtask deps
        run: cargo xtask deps

  # `cargo xtask ci` in a job of its own, beside the tests (R-235): it runs `cargo xtask plan-check`, which needs
  # Python and PyYAML (REQ-SYS-007), then `cargo xtask controls`, every control, failing on any finding (R-198,
  # R-226). The GPU harness's controls run on lavapipe, as its tests do. `xtask/tests/nextest.rs`'s control lists
  # tests through the pinned cargo-nextest (R-231).
  xtask-ci:
    runs-on: ubuntu-latest
    env:
      PRIN_GPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        id: toolchain
      - uses: Swatinem/rust-cache@v2
      # The fixture pool, as in the `ci` job: `cargo xtask controls` runs the fixture tests' controls (R-270).
      - uses: actions/cache@v4
        with:
          path: target/tmp/fixture-targets
          key: fixture-pool-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock') }}
      - name: Install Mesa (lavapipe)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: python3 -m pip install pyyaml
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146
      - name: cargo xtask ci
        run: cargo xtask ci

  # GitHub-hosted Apple silicon, paravirtual Metal: the Metal correctness suites only (R-169, R-186).
  gpu-metal:
    runs-on: macos-15
    env:
      PRIN_GPU_BACKEND: metal
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146
      - name: cargo nextest run -p validation --features controls metal_hosted_probe
        run: cargo nextest run -p validation --features controls metal_hosted_probe --no-capture
      - name: cargo test -p validation --features controls metal_hosted_probe --doc
        run: cargo test -p validation --features controls metal_hosted_probe --doc
      - name: cargo nextest run -p validation --features controls gpu_harness
        run: cargo nextest run -p validation --features controls gpu_harness --no-capture
      - name: cargo test -p validation --features controls gpu_harness --doc
        run: cargo test -p validation --features controls gpu_harness --doc
      # The golden half of R-186's first Metal check: the self-test within REQ-VAL-138's tolerance (TASK-M0-06). On
      # ubuntu-latest (lavapipe) it runs in `cargo xtask ci`, as `golden --all`.
      - name: cargo xtask golden selftest
        run: cargo xtask golden selftest

  # lavapipe, Mesa's software Vulkan: the second backend on every commit (R-110, R-169, R-186).
  gpu-lavapipe:
    runs-on: ubuntu-latest
    env:
      PRIN_GPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Mesa (lavapipe)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146
      - name: cargo nextest run -p validation --features controls gpu_harness
        run: cargo nextest run -p validation --features controls gpu_harness --no-capture
      - name: cargo test -p validation --features controls gpu_harness --doc
        run: cargo test -p validation --features controls gpu_harness --doc

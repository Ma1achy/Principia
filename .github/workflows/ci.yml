# CI. Required on every PR: fmt, clippy, checks, test (3 shards). Aim: under 10 minutes.
# After a merge to main, and nightly: test-workspace (the tests that run cargo on the workspace) and gpu-kernel (the
# GPU-kernel suites, every negative control and the golden renders, in shards). gpu-kernel also runs, not required, on a
# PR that touches the kernel, and with the render controls' shard alone on one that touches only crates/render
# (gpu_touch.sh). Caches are saved from main only; PR runs restore them.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/cargo-ci-config
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: No atlas-params.json in any form (licence)
        run: bash scripts/check_no_atlas_params.sh
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: checks
          cache-targets: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/cargo-ci-config
      - run: cargo xtask deps
      - run: cargo xtask lint vocab
      - run: cargo xtask lint constants
      - run: cargo xtask lint wgsl
      - run: cargo xtask lint compute-pipelines
      - run: cargo xtask lint no-alloc
      - name: Every test has a registered negative control
        run: cargo xtask controls --list
      # A struct field gated on the kernel's `controls` feature must not break a crate built with that feature on
      # and its own off: cargo unifies the kernel's features, which is how main's gpu-kernel controls step went red.
      - name: The engine builds with the kernel's controls on and its own off
        run: cargo check -p engine --lib --locked --features kernel/controls

  test:
    name: test (${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    # Hosted machines differ twofold in speed: the same shard takes 23 to 60 minutes.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      PRIN_GPU_BACKEND: vulkan
      NEXTEST_PROFILE: ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/cargo-ci-config
      - name: Restore the Mesa packages
        id: mesa
        timeout-minutes: 8
        uses: ./.github/actions/mesa-debs
        with:
          packages: mesa-vulkan-drivers
      - name: Install Mesa (lavapipe)
        if: steps.mesa.outputs.installed != 'true'
        timeout-minutes: 8
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers -oDPkg::Lock::Timeout=60
      - name: Keep the Mesa packages
        if: matrix.shard == 1 && github.ref == 'refs/heads/main' && steps.mesa.outputs.installed != 'true'
        timeout-minutes: 5
        uses: ./.github/actions/mesa-debs
        with:
          packages: mesa-vulkan-drivers
          save: "true"
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-nextest@0.9.146
      - run: cargo nextest run --workspace --locked --partition hash:${{ matrix.shard }}/3

  test-workspace:
    # The tests that run cargo on the workspace itself: slow by nature, so after the merge, not on the PR.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NEXTEST_PROFILE: ci-workspace
      PRIN_GPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test-workspace
          cache-targets: "false"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: ./.github/actions/cargo-ci-config
      # The GUI's screenshot test spawns a capture that needs a Vulkan adapter: lavapipe, as the test shards have.
      - name: Restore the Mesa packages
        id: mesa
        timeout-minutes: 8
        uses: ./.github/actions/mesa-debs
        with:
          packages: mesa-vulkan-drivers
      - name: Install Mesa (lavapipe)
        if: steps.mesa.outputs.installed != 'true'
        timeout-minutes: 8
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers -oDPkg::Lock::Timeout=60
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-nextest@0.9.146
      - run: cargo nextest run -p xtask -p validation --locked

  kernel-wgsl:
    # On a PR that touches the kernel or the checked-in WGSL: the rust-gpu kernel build alone, which fails when
    # crates/render/wgsl no longer matches the kernel's translation, in a few minutes, ahead of gpu-kernel's shards.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Does this PR touch the kernel or the WGSL?
        id: touch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash .github/scripts/gpu_touch.sh >> "$GITHUB_OUTPUT"
      - name: Free runner disk
        if: steps.touch.outputs.kernel == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/lib/jvm /usr/share/swift /usr/local/share/chromium /opt/google /opt/microsoft \
            /usr/local/share/powershell /usr/local/share/boost /usr/share/miniconda /usr/local/julia* \
            /usr/local/lib/node_modules /opt/hostedtoolcache/go /opt/hostedtoolcache/node /opt/az
      - name: rustup toolchain install
        if: steps.touch.outputs.kernel == 'true'
        id: toolchain
        run: |
          rustup toolchain install
          echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.touch.outputs.kernel == 'true'
        with:
          shared-key: gpu-kernel
          cache-targets: "false"
          save-if: "false"
      - uses: ./.github/actions/cargo-ci-config
        if: steps.touch.outputs.kernel == 'true'
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: steps.touch.outputs.kernel == 'true'
        with:
          path: ~/.cache/rust-gpu
          key: rust-gpu-${{ runner.os }}-${{ steps.toolchain.outputs.channel }}
      - name: The kernel builds and its WGSL translation is current
        if: steps.touch.outputs.kernel == 'true'
        run: cargo xtask build-kernel

  gpu-touch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.touch.outputs.run }}
      shards: ${{ steps.touch.outputs.shards }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Which GPU shards does this run need?
        id: touch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash .github/scripts/gpu_touch.sh >> "$GITHUB_OUTPUT"

  gpu-shard:
    # The rust-gpu kernel build and, shard by shard, its suites on lavapipe, every negative control and the golden
    # renders. gpu_touch.sh lists the shards and picks the ones this run needs. The controls are split by package, not by
    # hash, so each package's tests are built once.
    needs: gpu-touch
    if: needs.gpu-touch.outputs.run == 'true'
    name: gpu-shard (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.gpu-touch.outputs.shards) }}
    env:
      PRIN_GPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
            /usr/lib/jvm /usr/share/swift /usr/local/share/chromium /opt/google /opt/microsoft \
            /usr/local/share/powershell /usr/local/share/boost /usr/share/miniconda /usr/local/julia* \
            /usr/local/lib/node_modules /opt/hostedtoolcache/go /opt/hostedtoolcache/node /opt/az
          df -h /
      - name: rustup toolchain install
        id: toolchain
        run: |
          rustup toolchain install
          echo "channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: gpu-kernel
          cache-targets: "false"
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.save == true }}
      - uses: ./.github/actions/cargo-ci-config
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/rust-gpu
          key: rust-gpu-${{ runner.os }}-${{ steps.toolchain.outputs.channel }}
      - name: Restore the Mesa packages
        id: mesa
        timeout-minutes: 8
        uses: ./.github/actions/mesa-debs
        with:
          packages: mesa-vulkan-drivers
      - name: Install Mesa (lavapipe)
        if: steps.mesa.outputs.installed != 'true'
        timeout-minutes: 8
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers -oDPkg::Lock::Timeout=60
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-nextest@0.9.146
      - name: The kernel's source hash
        id: kernel-src
        run: |
          hash=$(cargo xtask kernel-src-hash)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          echo "PRIN_KERNEL_CACHE=$HOME/.cache/principia-spirv" >> "$GITHUB_ENV"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/principia-spirv
          key: spirv-${{ runner.os }}-${{ steps.kernel-src.outputs.hash }}
      - run: cargo xtask build-kernel
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: github.ref == 'refs/heads/main' && matrix.save == true
        with:
          path: ~/.cache/rust-gpu
          key: rust-gpu-${{ runner.os }}-${{ steps.toolchain.outputs.channel }}
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: github.ref == 'refs/heads/main' && matrix.save == true
        with:
          path: ~/.cache/principia-spirv
          key: spirv-${{ runner.os }}-${{ steps.kernel-src.outputs.hash }}
      - name: GPU-kernel suites
        if: matrix.slice
        env:
          NEXTEST_PROFILE: gpu-kernel
        run: cargo nextest run -p validation -p xtask -p engine --partition hash:${{ matrix.slice }}/2
      - name: Every negative control fires
        if: ${{ !cancelled() && matrix.controls }}
        run: cargo xtask controls --package ${{ matrix.controls }}
      - name: Golden renders
        if: ${{ !cancelled() && matrix.golden == true }}
        run: cargo xtask golden --all

  gpu-kernel:
    # Passes only when every shard gpu-touch asked for did: all of them when the kernel changed. Skipped only when
    # gpu-touch said no: a gpu-touch that failed says neither, and fails this job. `always()`, as without it a failed or
    # cancelled shard would skip this job.
    needs: [gpu-touch, gpu-shard]
    if: always() && needs.gpu-touch.outputs.run != 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in ${RESULTS:-none}; do [ "$result" = success ] || exit 1; done

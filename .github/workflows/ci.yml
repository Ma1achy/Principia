# Per-push CI (R-177): formatting and lints (R-195), build, test, the crate-graph check (REQ-SYS-004) and, in a job
# of its own beside them (R-235), `cargo xtask ci`, the single per-push entry point every later per-commit runner
# registers into. The tests run through cargo-nextest, pinned, and doctests, which nextest does not run, through
# `cargo test --doc` (R-231); `xtask/tests/nextest.rs` checks that together they list every test `cargo test` did.
# On pull requests only, the `mutants` jobs run the per-PR mutation gate, sharded (R-196, R-202, R-302); the per-push
# jobs are unchanged by them (R-177). Bench runs nightly and screenshots on GUI PRs, in their own workflows (R-177).
# GitHub-hosted runners (R-186); the GPU jobs are GitHub-hosted too, so R-174's same-repository guard stays dormant
# until a self-hosted job is added (R-186).
#
# Caches (R-285), in every workflow: the cargo registry and git directories, through rust-cache with its target cache
# and ~/.cargo/bin cache off, and the fixture pool, saved by the `ci` job alone. Never a whole target directory, so the
# repository's Actions cache stays well under GitHub's 10 GB limit. Every key names its job: rust-cache's `shared-key`
# is the job id (its key reads `cargo-registry-<job>-…`), and the pool's key names `ci`, the job that saves it. The
# `cargo-registry` prefix keeps these keys apart from the old `v0-rust-…` ones, which held target directories.
name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        id: toolchain
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: cargo-registry
          shared-key: ci
          cache-targets: "false"
          cache-bin: "false"
      # The fixture pool, one build directory per fixture type, kept between runs (R-270): cargo rebuilds in it only
      # what changed. Keyed on what invalidates its builds: the runner, the toolchain, the lockfile and the fixtures'
      # manifests; a new key starts from the latest pool of the same toolchain. Saved only when the job passes, so a
      # run cut short by a failing test never saves a pool half built. Its key names this job, the only one that
      # saves it (R-285).
      - uses: actions/cache@v4
        with:
          path: target/tmp/fixture-targets
          key: fixture-pool-ci-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock', 'fixtures/**/Cargo.toml', 'xtask/tests/fixtures/**/Cargo.toml') }}
          restore-keys: fixture-pool-ci-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-
      - name: cargo fmt --all --check
        run: cargo fmt --all --check
      - name: cargo clippy --workspace --all-targets -- -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo build --workspace
        run: cargo build --workspace
      # xtask's plan_check tests run plan/check_plan.py, which needs Python and PyYAML (TASK-M0-02).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: python3 -m pip install pyyaml
      # The workspace tests include the GPU harness self-tests, which need an adapter and PRIN_GPU_BACKEND (R-169):
      # here they run on lavapipe; metal_hosted_probe is ignored off macOS.
      - name: Install Mesa (lavapipe)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146
      - name: cargo nextest run --workspace
        env:
          PRIN_GPU_BACKEND: vulkan
        run: cargo nextest run --workspace
      - name: cargo test --workspace --doc
        run: cargo test --workspace --doc
      - name: cargo xtask deps
        run: cargo xtask deps

  # `cargo xtask ci` in a job of its own, beside the tests (R-235): it runs `cargo xtask plan-check`, which needs
  # Python and PyYAML (REQ-SYS-007), then `cargo xtask controls`, every control, failing on any finding (R-198,
  # R-226). The GPU harness's controls run on lavapipe, as its tests do. `xtask/tests/nextest.rs`'s control lists
  # tests through the pinned cargo-nextest (R-231).
  xtask-ci:
    runs-on: ubuntu-latest
    env:
      PRIN_GPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        id: toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: cargo-registry
          shared-key: xtask-ci
          cache-targets: "false"
          cache-bin: "false"
      # The fixture pool the `ci` job saves, restored only, under its key: `cargo xtask controls` runs the fixture tests'
      # controls (R-270, R-285).
      - uses: actions/cache/restore@v4
        with:
          path: target/tmp/fixture-targets
          key: fixture-pool-ci-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('Cargo.lock', 'fixtures/**/Cargo.toml', 'xtask/tests/fixtures/**/Cargo.toml') }}
          restore-keys: fixture-pool-ci-${{ runner.os }}-${{ steps.toolchain.outputs.cachekey }}-
      - name: Install Mesa (lavapipe)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: python3 -m pip install pyyaml
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146
      - name: cargo xtask ci
        run: cargo xtask ci

  # GitHub-hosted Apple silicon, paravirtual Metal: the Metal correctness suites only (R-169, R-186).
  gpu-metal:
    runs-on: macos-15
    env:
      PRIN_GPU_BACKEND: metal
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: cargo-registry
          shared-key: gpu-metal
          cache-targets: "false"
          cache-bin: "false"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146
      - name: cargo nextest run -p validation --features controls metal_hosted_probe
        run: cargo nextest run -p validation --features controls metal_hosted_probe --no-capture
      - name: cargo test -p validation --features controls metal_hosted_probe --doc
        run: cargo test -p validation --features controls metal_hosted_probe --doc
      - name: cargo nextest run -p validation --features controls gpu_harness
        run: cargo nextest run -p validation --features controls gpu_harness --no-capture
      - name: cargo test -p validation --features controls gpu_harness --doc
        run: cargo test -p validation --features controls gpu_harness --doc
      # The golden half of R-186's first Metal check: the self-test within REQ-VAL-138's tolerance (TASK-M0-06). On
      # ubuntu-latest (lavapipe) it runs in `cargo xtask ci`, as `golden --all`.
      - name: cargo xtask golden selftest
        run: cargo xtask golden selftest

  # lavapipe, Mesa's software Vulkan: the second backend on every commit (R-110, R-169, R-186).
  gpu-lavapipe:
    runs-on: ubuntu-latest
    env:
      PRIN_GPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: cargo-registry
          shared-key: gpu-lavapipe
          cache-targets: "false"
          cache-bin: "false"
      - name: Install Mesa (lavapipe)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146
      - name: cargo nextest run -p validation --features controls gpu_harness
        run: cargo nextest run -p validation --features controls gpu_harness --no-capture
      - name: cargo test -p validation --features controls gpu_harness --doc
        run: cargo test -p validation --features controls gpu_harness --doc

  # The per-PR mutation gate (R-196, R-202; TASK-M0-23): `cargo mutants --in-diff` on the PR's diff against its base,
  # on pull requests only, since `--in-diff` needs a base. The run is sharded across n parallel jobs, shard k of n each
  # (`--shard k/n`), each under its own time limit (R-302); the nightly full run (TASK-M0-19) is the backstop. Every
  # shard computes the same diff and reads the same exclusions, `.cargo/mutants.toml`'s, shared with the nightly run.
  # Each shard lists its surviving mutants and fails on any not in `.cargo/mutants-equivalent.toml`; `mutants-check`
  # below then checks every shard's report together, and fails if any shard failed or was cut off by its limit.
  # `mutants-fixture` shows, on `fixtures/mutants/untested/`, that the gate can fire.
  mutants:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      PRIN_GPU_BACKEND: vulkan
    strategy:
      # Every shard runs to its end, so the report names every survivor, not only the first shard's.
      fail-fast: false
      matrix:
        # REQ-VAL-149: n = 8 shards, k = 0..7 (cargo-mutants counts shards from 0), provisional until the human
        # confirms it at the M0 gate (R-71, R-182, R-302). A change to n changes this list and `--shard k/8` below.
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: cargo-registry
          shared-key: mutants
          cache-targets: "false"
          cache-bin: "false"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest@0.9.146
      # What the mutated packages' tests need, as in the per-push jobs: Python and PyYAML for xtask's plan_check
      # tests (TASK-M0-02), cargo-nextest for `xtask/tests/nextest.rs` (R-231), lavapipe for the GPU harness (R-169).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: python3 -m pip install pyyaml
      - name: Install Mesa (lavapipe)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: git diff origin/${{ github.base_ref }}...HEAD
        run: |
          git diff "origin/${{ github.base_ref }}...HEAD" > "$RUNNER_TEMP/pr.diff"
          echo "PR diff: $(wc -l < "$RUNNER_TEMP/pr.diff") lines"
      # Each shard rebuilds and runs the unmutated baseline, then its share of the diff's mutants, dealt round-robin
      # so that one file's mutants, whose tests cost alike, spread over the shards. The limit is on this step, so the
      # shard's partial report is still uploaded when it is hit, and the step then fails.
      - name: cargo mutants --in-diff --shard ${{ matrix.shard }}/8 (REQ-VAL-149 per-shard limit, provisional)
        id: run
        # REQ-VAL-149: 120 minutes per shard, provisional until the human confirms it at the M0 gate (R-71, R-182,
        # R-302).
        timeout-minutes: 120
        run: |
          set +e
          start=$(date +%s)
          cargo mutants --in-place --in-diff "$RUNNER_TEMP/pr.diff" \
            --shard ${{ matrix.shard }}/8 --sharding round-robin -o "$RUNNER_TEMP"
          code=$?
          echo "cargo mutants shard ${{ matrix.shard }}/8: exit $code, wall-clock $(( $(date +%s) - start )) s"
          # 0: none survived; 2: some survived; 3: some timed out. The check below decides (R-202). Only exit 0 may
          # mean "no mutant in this shard"; any other exit without outcomes fails the shard.
          case $code in 0|2|3) ;; *) exit "$code" ;; esac
          if [ -f "$RUNNER_TEMP/mutants.out/outcomes.json" ]; then
            echo "tested=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 0 ]; then
            echo "cargo mutants: no mutant in this shard of the PR's diff"
          else
            echo "::error::cargo mutants exited $code but wrote no outcomes.json"; exit "$code"
          fi
      # A shard cut off by its limit fails, named, with its mutants untested: never a pass.
      - name: Shard cut off or failed
        if: always() && steps.run.outcome != 'success' && steps.run.outcome != 'skipped'
        run: |
          echo "::error::mutants shard ${{ matrix.shard }}/8 did not finish: cut off by its REQ-VAL-149 limit" \
            "(120 min) or failed; its untested mutants are not a pass (R-302)"
          exit 1
      - name: cargo xtask mutants-check (R-202)
        if: steps.run.outputs.tested == 'true'
        run: cargo xtask mutants-check "$RUNNER_TEMP/mutants.out"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-report-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/mutants.out
          if-no-files-found: ignore

  # The gate fires on the fixture (REQ-VAL-148): without its killing test the untested branch's mutants survive and
  # mutants-check fails naming them; listed, it passes; with the killing test none survives. Beside the shards.
  mutants-fixture:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: cargo-registry
          shared-key: mutants-fixture
          cache-targets: "false"
          cache-bin: "false"
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - name: The gate fires on the fixture (REQ-VAL-148)
        run: |
          fixture=fixtures/mutants/untested
          if cargo mutants --dir "$fixture" --in-diff "$fixture/change.diff" -o "$RUNNER_TEMP/fixture"; then
            echo "::error::without its killing test, no mutant of the untested branch survived"; exit 1
          fi
          if cargo xtask mutants-check "$RUNNER_TEMP/fixture/mutants.out"; then
            echo "::error::mutants-check passed survivors that are not listed"; exit 1
          fi
          cargo xtask mutants-check "$RUNNER_TEMP/fixture/mutants.out" --equivalent "$fixture/equivalent.toml"
          cargo mutants --dir "$fixture" --in-diff "$fixture/change.diff" --features kill -o "$RUNNER_TEMP/fixture-kill"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-report-fixture
          path: ${{ runner.temp }}/fixture/mutants.out
          if-no-files-found: ignore

  # The sharded run's verdict (R-202, R-302): runs after every shard, whatever their result. It fails if any shard
  # failed or was cut off by its limit, and checks every shard's report together against the equivalent-mutants list,
  # listing each survivor of the whole run.
  mutants-check:
    if: always() && github.event_name == 'pull_request'
    needs: mutants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: cargo-registry
          shared-key: mutants-check
          cache-targets: "false"
          cache-bin: "false"
      - uses: actions/download-artifact@v4
        with:
          pattern: mutants-report-shard-*
          path: ${{ runner.temp }}/shards
      - name: cargo xtask mutants-check over every shard (R-202, R-302)
        run: |
          fail=0
          if [ "${{ needs.mutants.result }}" != success ]; then
            echo "::error::a mutants shard did not pass (result: ${{ needs.mutants.result }}): a survivor not" \
              "listed, or a shard failed or was cut off by its limit (R-302)"
            fail=1
          fi
          shards=()
          for d in "$RUNNER_TEMP"/shards/mutants-report-shard-*; do
            if [ -f "$d/outcomes.json" ]; then shards+=("$d"); else echo "$(basename "$d"): no outcomes.json"; fi
          done
          echo "shard reports with outcomes: ${#shards[@]} of 8"
          if [ "${#shards[@]}" -gt 0 ]; then
            cargo xtask mutants-check "${shards[@]}" || fail=1
          else
            echo "mutants-check: no shard tested a mutant of this PR's diff"
          fi
          exit "$fail"

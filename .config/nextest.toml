# The GPU smoke set (R-909, the owner's CI model, item 1: "lavapipe GPU smoke set; Metal smoke set on
# GPU-path PRs"): one fast test of each GPU stage of the in-depth GPU tests, which `ci.yml`'s `gpu-lavapipe` runs on
# lavapipe and `gpu-metal` on Metal, each after `cargo xtask build-kernel`, on a pull request with a GPU-path file
# (`scripts/ci_changes.sh`'s `gpu`). Each is its stage's fastest test that dispatches the stage on the GPU, by the
# lavapipe and Metal times of `main`'s run 42536974219 (8 Nov 2026), lavapipe's first:
# - the kernel toolchain, rust-gpu to SPIR-V to naga's WGSL, dispatched: `toolchain_trivial_kernel` (11.2 s, Metal not run);
# - the bring-up mode's readback of the SPIR-V build: `bringup_pattern_spirv` (5.4 s, Metal not run);
# - the payload's pack and unpack through the generated WGSL on the GPU: `codegen_selftest_pack_unpack_wgsl_gpu`
#   (7.9 s, 6.8 s);
# - the decode stage D, through the `tanh_sat` window Metal's own `tanh` fails without its clamp:
#   `decode_stage_tanh_range` (9.4 s, 8.6 s);
# - canonicalisation C, its seam sweep's branches against the CPU's: `canonicaliser_seam_sweep` (5.4 s, 4.1 s);
# - encode E, `β`'s selects on signed zeros, where Vulkan may drop a zero's sign through `atan2` (R-438):
#   `encode_beta_signed_zero` (5.4 s, 4.5 s);
# - the invariant-momentum construction, CPU-f64's seed on the GPU: `invariant_seed_parity` (5.7 s, 5.5 s);
# - the per-pixel mass decode, its one test: `per_pixel_mass_garbage_uniform` (25.9 s, Metal not run);
# - the lock's locked-against-free render: `lock_kernel_uniform_identical_gpu` (10.8 s, Metal not run);
# - the kernel's own f32 `atan2` as the backend compiles it (RQ-628), its one test: `arctan_gpu_is_cpu` (26.6 s, Metal
#   not run);
# - the agreement preset's fragment decode against the kernel decode stage: `agreement_preset_twin` (6.6 s, Metal not
#   run);
# - decoder test 12 across backends at the M0/M1 crossings: `decode_parity_m01_crossings` (5.8 s, 4.5 s).
# About 126 s of test time on lavapipe, under a minute of the job's wall time on its four test threads. Beside them, the
# kernel build's own checks, which read the kernel the job has just built and take under a second: xtask's
# `build_kernel` tests but its two slow-tier ones, which `cargo xtask build-kernel` itself covers, `fragment_wgsl` and
# `qa_TASK-M0-14`. `gpu-metal` runs the six with a Metal time, the stages the Metal suites ran before, by `--test`; the
# ones Metal did not run stay lavapipe's, so the smoke set asks nothing of Metal its suites never did. Beside them on
# Metal, the GPU harness's, the compute fast-math probe's and the hosted-Metal probe's unit tests in validation, and the
# compute entry point's in engine (R-297), each under a second. On both, the mock noise's shared-lattice-corner tests in
# gui's library, `tests::mock_lattice::lattice_` but the three `#[ignore]`d reports, which REQ-GUI-412 has block on
# "CI's lavapipe and Metal" (R-685, R-692): a GPU-path change to gui (`scripts/ci_changes.sh`'s five paths) runs them
# here, and the pull request's path keeps them blocking. Applied per R-369/R-812.
[profile.gpu-smoke]
default-filter = """
    (binary_id(=validation::toolchain) & test(=toolchain_trivial_kernel))
    | (binary_id(=validation::bringup) & test(=bringup_pattern_spirv))
    | (binary_id(=validation::codegen_selftest) & test(=codegen_selftest_pack_unpack_wgsl_gpu))
    | (binary_id(=engine::decode_stage_gpu) & test(=decode_stage_tanh_range))
    | (binary_id(=engine::canon_gpu) & test(=canonicaliser_seam_sweep))
    | (binary_id(=engine::encode_gpu) & test(=encode_beta_signed_zero))

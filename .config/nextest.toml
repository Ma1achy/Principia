# The PR tier (R-909, the owner's CI model, item 1; R-907, R-908): a pull request's product tests, on the changed
# crates and their reverse dependencies (`.github/scripts/ci_tier.sh`), in `ci.yml`'s `tests` job. Every test but:
# - the process tests, the split's process class (`process` below), which run only when a pull request changes the
#   machinery (`scripts/ci_changes.sh`'s `process`);
# - the in-depth GPU tests, the `gpu-kernel` profile's, which need the built kernel: `ci.yml`'s `gpu-lavapipe` and
#   `gpu-metal` run one fast test of each GPU stage of them (`gpu-smoke` below), and every one runs on `main`;
# - the golden runner over every suite and the screenshot runner's self-test, product correctness the owner moved to
#   each merge (R-909; 9 Nov 2026: "per merge, never retired");
# - the slow tier (R-904, R-908): each test measured over 60 s (the per-test times of 8 Nov 2026, the longer of PR
#   #431's run and the second measurement), named below with its time, which runs on `main`. A product-tooling test
#   among them is covered on the pull request by its command, run directly in `ci.yml`'s `build` and `gpu-lavapipe` jobs
#   (`cargo xtask lint wgsl`, `cargo xtask build-kernel`). Beside xtask's tests and the in-depth GPU tests, the slow
#   tier holds 34 physics, validation and render tests (4,981 s measured) of kernel, ledger, render and validation
#   outside the `gpu-kernel` profile, by the owner's ruling of 9 Nov 2026, verbatim: "1: move them." It answers R-904's
#   "moving any physics or validation test into the slow tier comes to me first" for exactly those 34, which run on each
#   merge to `main`. No other physics, validation or render test enters the slow tier without a ruling;
#   `xtask/tests/ci_pr_tier.rs` pins the list.
# `xtask/tests/ci_pr_tier.rs` checks this table against the filter, and the process binaries here against `process`'s.
# Applied per R-369/R-812, but for the 34, the owner's.
# The slow tier (seconds, binary, test):

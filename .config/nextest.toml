[[profile.gpu-kernel.overrides]]
filter = "binary_id(=engine::cos_half_pi_gpu) & test(=gpu_cos_near_half_pi)"
success-output = "immediate"

# The parity harness's differences between the GPU, the CPU at f32 and the CPU at f64, which its tests print and never
# assert on, shown on success so each backend's numbers stay in its log.
[[profile.gpu-kernel.overrides]]
filter = "binary_id(=validation::parity_harness_gpu)"
success-output = "immediate"

# The Windows runner's `win-vulkan` (`.github/workflows/win-gpu.yml`, TASK-M0-88). Twelve tests are reported there, not
# asserted, on the RTX 2080 SUPER, a driver other than CI's Metal and lavapipe: the compute fast-math probe's (R-694: "On
# any other driver it is reported"), the near-tie golden cases' (R-695: "elsewhere reported, not compared to pass"),
# `qa_compute_fast_math_header_is_the_dispatch`, which assumes an adapter `session_adapter` refuses on a discrete GPU
# (RQ-201), and `build_kernel_runs_in_ci`, not a GPU test, which runs the real `xtask ci` and which the hosted gpu-kernel
# job runs. `win-asserted` is every test but those twelve, for the job's asserting steps; `win-reported` is those twelve
# alone, for its reporting steps, whose result never fails the job. Each step names its packages and a name filter or
# target besides, which the default filter narrows. The two lists are the same twelve names, which
# `xtask/tests/ci_self_hosted.rs` checks. TASK-M4-30 and TASK-M4-31 scope the first two groups in the code; when they
# land, the tests their scoping makes pass go back to asserting. The hosted gpu-metal and gpu-lavapipe jobs assert all of
# them. The orchestrator's call, logged in `plan/DECISIONS-LOG.md` (TASK-M0-88).
[profile.win-asserted]
fail-fast = false
default-filter = """
    not (
        test(=build_kernel_runs_in_ci)
        | test(=gpu::tests::compute_fast_math_off_is_correctly_rounded)
        | test(=gpu::tests::compute_fast_math_switch_acts)
        | test(=qa_compute_fast_math_default_off)
        | test(=qa_compute_fast_math_header_is_the_dispatch)
        | test(=qa_compute_fast_math_off_fuzzed_exact)
        | test(=qa_compute_fast_math_off_halfway_exact)
        | test(=qa_compute_fast_math_off_halfway_exact::negative_control)
        | test(=qa_compute_fast_math_switch_per_backend)
        | test(=golden_halfway_automatic_matches_backend_reference)
        | test(=golden_halfway_quantised_matches_backend_reference)
        | test(=golden_halfway_quantised_matches_backend_reference::negative_control)
    )
"""

[profile.win-reported]
fail-fast = false
default-filter = """
    test(=build_kernel_runs_in_ci)
    | test(=gpu::tests::compute_fast_math_off_is_correctly_rounded)
    | test(=gpu::tests::compute_fast_math_switch_acts)
    | test(=qa_compute_fast_math_default_off)
    | test(=qa_compute_fast_math_header_is_the_dispatch)
    | test(=qa_compute_fast_math_off_fuzzed_exact)
    | test(=qa_compute_fast_math_off_halfway_exact)
    | test(=qa_compute_fast_math_off_halfway_exact::negative_control)
    | test(=qa_compute_fast_math_switch_per_backend)
    | test(=golden_halfway_automatic_matches_backend_reference)
    | test(=golden_halfway_quantised_matches_backend_reference)
    | test(=golden_halfway_quantised_matches_backend_reference::negative_control)
"""

# `win-vulkan`'s gpu-kernel step: the `gpu-kernel` profile's list less `xtask::build_kernel`, whose one reported test
# (above) can't be left out of a list of whole binaries; the job runs that binary's other tests in a step of their own,
# under `win-asserted`. One binary is added: `engine::builtin_trig_gpu` needs no kernel build, so `ci` runs it on
# lavapipe, and the card's Vulkan reaches it only here.
[profile.win-gpu-kernel]
fail-fast = false
default-filter = """
    binary_id(=validation::toolchain)
    | binary_id(=validation::qa_TASK-M0-14)
    | binary_id(=validation::codegen_selftest)
    | binary_id(=validation::bringup)
    | binary_id(=engine::decode_stage_gpu)
    | binary_id(=engine::qa_TASK-M2-06_gpu)
    | binary_id(=engine::canon_gpu)
    | binary_id(=engine::qa_TASK-M2-07_gpu)
    | binary_id(=engine::qa_TASK-M2-47_gpu)
    | binary_id(=engine::invariant_gpu)
    | binary_id(=engine::encode_gpu)
    | binary_id(=engine::qa_TASK-M2-15_gpu)
    | binary_id(=engine::per_pixel_mass_gpu)
    | binary_id(=engine::decode_cross_backend)
    | binary_id(=engine::qa_TASK-M2-24_gpu)
    | binary_id(=engine::lock_gpu)
    | binary_id(=engine::arctan_gpu)
    | binary_id(=engine::cos_half_pi_gpu)
    | binary_id(=engine::builtin_trig_gpu)
    | binary_id(=engine::branch_read_gpu)
    | binary_id(=engine::first_slice_gpu)
    | binary_id(=validation::cross_backend_gpu)
    | binary_id(=validation::decode_f32_eps_gpu)
    | binary_id(=validation::invariant_gradient_gpu)
    | binary_id(=validation::agreement_preset_gpu)
    | binary_id(=validation::qa_TASK-M2-25_gpu)
    | binary_id(=validation::parity_harness_gpu)
    | binary_id(=xtask::qa_TASK-M0-14)
    | binary_id(=xtask::fragment_wgsl)
    | binary_id(=engine::path_bitwise)
"""
# Beyond gpu-kernel's list, `engine::path_bitwise`, no GPU test: the chart path's digests bit for bit against the
# baseline recorded on Linux, so the same bits are checked on Windows too; the `ci` profile runs it on Linux.

# The measurements gpu-kernel shows on success, shown here too, so the card's numbers stay in its log.
[[profile.win-gpu-kernel.overrides]]
filter = "binary_id(=engine::decode_cross_backend) & test(=decode_cross_backend_continuous)"
success-output = "immediate"

[[profile.win-gpu-kernel.overrides]]
filter = "binary_id(=engine::qa_TASK-M2-24_gpu) & test(=qa_m224_gpu_canon_turn)"
success-output = "immediate"

[[profile.win-gpu-kernel.overrides]]
filter = "binary_id(=engine::arctan_gpu) & test(=arctan_gpu_is_cpu)"
success-output = "immediate"

[[profile.win-gpu-kernel.overrides]]
filter = "binary_id(=engine::cos_half_pi_gpu) & test(=gpu_cos_near_half_pi)"
success-output = "immediate"

[[profile.win-gpu-kernel.overrides]]
filter = "binary_id(=engine::builtin_trig_gpu)"
success-output = "immediate"

[[profile.win-gpu-kernel.overrides]]
filter = "binary_id(=validation::parity_harness_gpu)"
success-output = "immediate"

# The GPU smoke set (R-909, the owner's CI model, item 1: "lavapipe GPU smoke set; Metal smoke set on
# GPU-path PRs"): one fast test of each GPU stage of the in-depth GPU tests, which `ci.yml`'s `gpu-lavapipe` runs on
# lavapipe and `gpu-metal` on Metal, each after `cargo xtask build-kernel`, on a pull request with a GPU-path file
# (`scripts/ci_changes.sh`'s `gpu`). Each is its stage's fastest test that dispatches the stage on the GPU, by the
# lavapipe and Metal times of `main`'s run 42536974219 (8 Nov 2026), lavapipe's first:
# - the kernel toolchain, rust-gpu to SPIR-V to naga's WGSL, dispatched: `toolchain_trivial_kernel` (11.2 s, Metal not run);
# - the bring-up mode's readback of the SPIR-V build: `bringup_pattern_spirv` (5.4 s, Metal not run);
# - the payload's pack and unpack through the generated WGSL on the GPU: `codegen_selftest_pack_unpack_wgsl_gpu`
#   (7.9 s, 6.8 s);
# - the decode stage D, through the `tanh_sat` window Metal's own `tanh` fails without its clamp:
#   `decode_stage_tanh_range` (9.4 s, 8.6 s);
# - canonicalisation C, its seam sweep's branches against the CPU's: `canonicaliser_seam_sweep` (5.4 s, 4.1 s);
# - encode E, `β`'s selects on signed zeros, where Vulkan may drop a zero's sign through `atan2` (R-438):
#   `encode_beta_signed_zero` (5.4 s, 4.5 s);
# - the invariant-momentum construction, CPU-f64's seed on the GPU: `invariant_seed_parity` (5.7 s, 5.5 s);
# - the per-pixel mass decode, its one test: `per_pixel_mass_garbage_uniform` (25.9 s, Metal not run);
# - the lock's locked-against-free render: `lock_kernel_uniform_identical_gpu` (10.8 s, Metal not run);
# - the kernel's own f32 `atan2` as the backend compiles it (RQ-628), its one test: `arctan_gpu_is_cpu` (26.6 s, Metal
#   not run);
# - the agreement preset's fragment decode against the kernel decode stage: `agreement_preset_twin` (6.6 s, Metal not
#   run);
# - decoder test 12 across backends at the M0/M1 crossings: `decode_parity_m01_crossings` (5.8 s, 4.5 s);
# - the parity harness's entries, the three body pairs summed on the GPU: `three_pairs_hamiltonian` (lavapipe and Metal
#   not timed).
# About 126 s of test time on lavapipe, under a minute of the job's wall time on its four test threads. Beside them, the
# kernel build's own checks, which read the kernel the job has just built and take under a second: xtask's
# `build_kernel` tests but its two slow-tier ones, which `cargo xtask build-kernel` itself covers, `fragment_wgsl` and
# `qa_TASK-M0-14`. `gpu-metal` runs the six with a Metal time, the stages the Metal suites ran before, by `--test`; the
# ones Metal did not run stay lavapipe's, so the smoke set asks nothing of Metal its suites never did. Beside them on
# Metal, the GPU harness's, the compute fast-math probe's and the hosted-Metal probe's unit tests in validation, and the
# compute entry point's in engine (R-297), each under a second. On both, the mock noise's shared-lattice-corner tests in
# gui's library, `tests::mock_lattice::lattice_` but the three `#[ignore]`d reports, which REQ-GUI-412 has block on
# "CI's lavapipe and Metal" (R-685, R-692): a GPU-path change to gui (`scripts/ci_changes.sh`'s five paths) runs them
# here, and the pull request's path keeps them blocking. Applied per R-369/R-812.
[profile.gpu-smoke]
default-filter = """
    (binary_id(=validation::toolchain) & test(=toolchain_trivial_kernel))
    | (binary_id(=validation::bringup) & test(=bringup_pattern_spirv))
    | (binary_id(=validation::codegen_selftest) & test(=codegen_selftest_pack_unpack_wgsl_gpu))
    | (binary_id(=engine::decode_stage_gpu) & test(=decode_stage_tanh_range))
    | (binary_id(=engine::canon_gpu) & test(=canonicaliser_seam_sweep))
    | (binary_id(=engine::encode_gpu) & test(=encode_beta_signed_zero))
    | (binary_id(=engine::invariant_gpu) & test(=invariant_seed_parity))
    | (binary_id(=engine::per_pixel_mass_gpu) & test(=per_pixel_mass_garbage_uniform))
    | (binary_id(=engine::lock_gpu) & test(=lock_kernel_uniform_identical_gpu))
    | (binary_id(=engine::arctan_gpu) & test(=arctan_gpu_is_cpu))
    | (binary_id(=validation::agreement_preset_gpu) & test(=agreement_preset_twin))
    | (binary_id(=engine::decode_cross_backend) & test(=decode_parity_m01_crossings))
    | (binary_id(=validation::parity_harness_gpu) & test(=three_pairs_hamiltonian))
    | (binary_id(=xtask::build_kernel) & not test(=build_kernel_runs_in_ci) & not test(=build_kernel_listed_in_ci))
    | binary_id(=xtask::fragment_wgsl)
    | binary_id(=xtask::qa_TASK-M0-14)
    | (binary_id(=validation) & test(/^gpu::tests::(metal_hosted_probe|compute_fast_math_|gpu_harness_)/))
    | (binary_id(=engine) & test(/^compute::tests::compute_entry_/))
    | (binary_id(=gui) & test(/^tests::mock_lattice::lattice_/))
"""

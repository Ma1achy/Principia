slow-timeout = { period = "50s", terminate-after = 3 }

[[profile.mutants.overrides]]
filter = "package(engine) & test(=branch_read_gpu_every_variant_has_its_entry)"
slow-timeout = { period = "40s", terminate-after = 3 }

[[profile.mutants.overrides]]
filter = "binary_id(=engine::canon_gpu) & test(=canonicaliser_coincident_inner_pair)"
slow-timeout = { period = "70s", terminate-after = 3 }

[[profile.mutants.overrides]]
filter = "binary_id(=engine::canon_gpu) & test(=canonicaliser_hierarchy)"
slow-timeout = { period = "180s", terminate-after = 3 }

[[profile.mutants.overrides]]
filter = "binary_id(=engine::canon_gpu) & test(=canonicaliser_hierarchy_edge)"
slow-timeout = { period = "80s", terminate-after = 3 }


"""

# Decoder test 12's measurements on lavapipe (TASK-M2-24, physics review F3): `decode_cross_backend_continuous` prints
# each domain's worst difference against f64 and against the native f32 decode, and the gpu-kernel job shows it on
# success, so REQ-DEC-043's proposal record (`validation::decode_f32_eps`) can cite the backend's numbers. Applied per
# R-369.
[[profile.gpu-kernel.overrides]]
filter = "binary_id(=engine::decode_cross_backend) & test(=decode_cross_backend_continuous)"
success-output = "immediate"

# The same for qa's `qa_m224_gpu_canon_turn` (`engine/tests/qa_TASK-M2-24_gpu.rs`), which prints `C`'s worst against f64
# on the job's backend: REQ-DEC-043's record cites lavapipe's value for that domain too (physics review 5599301723 F1).
# It changes only what is shown; the test and its filter are as before. Applied per R-369.
[[profile.gpu-kernel.overrides]]
filter = "binary_id(=engine::qa_TASK-M2-24_gpu) & test(=qa_m224_gpu_canon_turn)"
success-output = "immediate"

# The kernel's own f32 `atan2` on the job's backend (RQ-628): `arctan_gpu_is_cpu` prints the GPU's accuracy against f64
# `atan2` on each sweep, shown on success, so lavapipe's run records it. It changes only what is shown. Applied per
# R-369.
[[profile.gpu-kernel.overrides]]
filter = "binary_id(=engine::arctan_gpu) & test(=arctan_gpu_is_cpu)"
success-output = "immediate"

# The mutants profile (the owner's order of 8 Nov 2026, amending R-712's basis, not its multiplier): per-test kill
# limits for mutation test runs. A hung mutant is stopped in minutes, not at cargo-mutants' per-mutant timeout (R-712: 3
# times the whole baseline's test time, past the 300-minute shard limit on #431's diff, where three hung mutants cut off
# their shards). Each test is ended at `terminate-after` periods: nextest reports it `TMT`, the run fails (exit 100),
# and cargo-mutants counts the mutant caught, as a timeout is counted today; `cargo xtask mutants-check` lists it as
# timed out, not a survivor, naming the test. With `--retries=2` (`.cargo/mutants.toml`) a hung test costs 3 times its
# limit and nextest's 10 s grace. cargo-mutants' own per-mutant timeout stays, an outer backstop.
#
# Selected by NEXTEST_PROFILE=mutants (cargo-mutants' `--profile` is cargo's, and `.cargo/mutants.toml`'s test arguments
# reach the fixtures' runs too, which have no such profile), on mutation test runs only: the per-PR shards
# (`mutants.yml`), the nightly full run (`nightly.yml`) and a local run (`plan/OPERATIONS.md` § "Reviewers", its
# **Mutants** item). Each of those runs measures its baseline first, alone, with no kill limit, under the default
# profile, so its times are whole (cargo-mutants gives a baseline its mutants' environment, so a run is two invocations:
# the baseline alone, then the mutants with `--baseline=skip`): `cargo xtask mutants-limits` fails when a test there
# used more than half its limit, naming it with a regenerated value.
#
# The limits: 3 times each test's largest baseline time over 13 runs' logs, the period rounded up to 10 s and
# `terminate-after = 3` (`slow-timeout`); a test under 20 s takes the profile's 60 s, R-376's floor (REQ-VAL-180).
# nextest takes each setting from the first override that matches and sets it, this profile's before the default
# profile's, so the job queue's 120 s x 3 (above) still binds its tests; it is restated here all the same.
# A test that only #431's or #360's branch adds is named by package and test name: nextest refuses a `binary_id()` that
# matches no binary, on every run.
#
# Excluded from per-mutant runs (the owner, 8 Nov 2026: "The qa control-inventory tests (qa_TASK-M0-22/24/25 and
# similar, which inspect the whole workspace) run once per CI run as a step, not inside per-mutant test runs"), each
# already run once in every CI run by `ci.yml` and the nightly `cpu` job, so coverage is unchanged:
# - validation's `qa_TASK-M0-24`, every test: lists every workspace test (`cargo test -- --list`), every registered
#   control (`cargo xtask controls --list`) and the workspace's metadata; `ci-workspace` runs it, in `ci.yml` and the
#   nightly `cpu` job;
# - validation's `qa_TASK-M0-25`, its two inventories: lists every test of `validation` and `prin` under and without
#   `controls`, to pair each merged qa test with its control; the `ci` shards and the nightly `cpu` job run them;
# - xtask's `qa_TASK-M0-22`, its three `xtask ci` runs: every check `xtask ci` makes over the workspace, the golden step
#   through the real cargo, and the controls' inventory from the stand-in's listing; the `ci` shards and the nightly run
#   them;
# - xtask's `qa_TASK-M0-22_r235`, its `xtask ci --list` run: the same checks over the workspace, listing only; the `ci`
#   shards and the nightly run it;
# - xtask's `nextest`, every test: lists every workspace test under each CI profile (up to 657 s), and reads only CI's
#   configuration, no xtask source but a constant; `ci-workspace` runs it, in `ci.yml` and the nightly `cpu` job;
# - xtask's `controls_on_this_workspace_skips_gui`: lists every control in the workspace through `xtask controls --list`
#   (up to 320 s); `ci-workspace` runs it, in `ci.yml` and the nightly `cpu` job;
# - xtask's `controls_runs_on_this_workspace_bare_and_in_ci`: runs `xtask controls` over the workspace (up to 163 s); the
#   `ci` shards and the nightly `cpu` job run it. `controls.rs`'s tests on fixture crates stay, and catch its mutants.
[profile.mutants]
default-filter = """
    not (
        binary_id(=validation::qa_TASK-M0-24)
        | (binary_id(=validation::qa_TASK-M0-25) & test(=qa_m0_25_every_merged_qa_test_has_a_control_and_no_child_body_is_a_test))
        | (binary_id(=validation::qa_TASK-M0-25) & test(=qa_m0_25_prin_every_merged_qa_test_has_a_control_and_no_child_body_is_a_test))
        | (binary_id(=xtask::qa_TASK-M0-22) & test(=qa_m022_ci_fails_on_a_control_that_leaves_its_test_passing))
        | (binary_id(=xtask::qa_TASK-M0-22) & test(=qa_m022_ci_fails_on_a_test_without_control))
        | (binary_id(=xtask::qa_TASK-M0-22) & test(=qa_m022_ci_passes_when_every_control_trips))
        | (binary_id(=xtask::qa_TASK-M0-22_r235) & test(=qa_r235_ci_list_fails_on_a_test_without_control))
        | binary_id(=xtask::nextest)
        | (binary_id(=xtask::controls) & test(/^controls_on_this_workspace_skips_gui/))
        | (binary_id(=xtask::controls) & test(=controls_runs_on_this_workspace_bare_and_in_ci))
    )
"""
slow-timeout = { period = "20s", terminate-after = 3 }

# The job queue's own limit, the default profile's override above, restated.
[[profile.mutants.overrides]]
filter = "binary_id(=xtask::jobq) | binary_id(/^xtask::qa_R-658/)"
slow-timeout = { period = "120s", terminate-after = 3 }

# Each test with a measured baseline of 20 s or more: 3 times its largest, the period rounded up to 10 s.

[[profile.mutants.overrides]]

# Wrapper scripts are experimental in nextest 0.9.146, the version CI pins: the queue's tests' PID namespaces, below.
experimental = ["wrapper-scripts"]

# cargo-nextest's configuration: CI and the documented local run test through nextest (R-231, REQ-VAL-165).
#
# nextest runs each test in a process of its own, and tests from every binary at once. A cargo run into the
# workspace's own target directory replaces the binaries uplifted there (`CARGO_BIN_EXE_xtask`, `qa_child`, `gate`)
# even when nothing is rebuilt, while other tests spawn them (REQ-VAL-164). Under `cargo test` those runs were kept
# apart by in-process locks (`WORKSPACE_TARGET` in xtask's `tests/controls.rs`, `WORKSPACE_RUN` in validation's
# `tests/qa_TASK-M0-24.rs`) and by test binaries running one after another; here each test that runs cargo, or an
# xtask command that runs cargo, on the workspace's own target directory takes every test thread, so it runs alone.
# Among them is the alias test (TASK-M0-01), whose `cargo xtask` is `cargo run -p xtask` and whose `cargo xtask ci
# --list` reuses the workspace's `--features controls` build: in a target directory of its own, cold in every run, that
# build alone outlasted the 600 s timer on its child (R-214; gate.yml run 38598243202, 699 s). Applied per R-369.
[[profile.default.overrides]]
filter = """
    binary_id(validation::qa_TASK-M0-24)
    | (binary_id(xtask::controls) & test(/^controls_on_this_workspace_skips_gui/))
    | (binary_id(xtask::qa_TASK-M0-01) & test(=qa_cargo_xtask_alias_runs_deps))
    | (binary_id(xtask::qa_TASK-M0-02) & test(/^qa02_a_failing_plan_check_turns_xtask_ci_red/))
    | binary_id(xtask::nextest)
    | (binary_id(xtask::screenshot) & test(/^screenshot_gui_surface/))
"""
threads-required = "num-test-threads"

# The xtask tests that run cargo, and a full golden run through it, without taking every test thread (but for `xtask ci
# --list`, which the next override also gives every one): `xtask ci --list` (TASK-M0-06), which builds the workspace's
# tests with `--features controls`; the `ci` golden runner (TASK-M0-06);
# `xtask ci` against the stand-in cargo, whose golden step renders every harness case through the real one (TASK-M0-22);
# and `xtask golden m1-outcome` through a wrapper of the real cargo (the golden harness's CI check,
# `qa_ops_golden_harness_ci`). On a cold target, as in a `ci` shard run from the archive, side by side they share the
# test threads' CPUs and cargo's build lock, and the listing's build outlasts the test's 600 s timer on its xtask child
# (PR #179). In the group `xtask-cargo` they run one at a time, beside the other tests. The `ci` profile inherits this
# override; the `ci-workspace` profile, which inherits it too, selects only `xtask ci --list`'s test, and `gpu-kernel`
# none of them. Applied per R-369.
# `xtask screenshot --all` (TASK-M0-20) joins them: its `gui` suites run gui's capture mode through `cargo run -p gui
# --features mock` on the workspace's target, building there and taking its build lock, with no timer of its own.
# Applied per R-369.
[[profile.default.overrides]]
filter = """
    (binary_id(=xtask::qa_TASK-M0-06_list) & test(=qa_m006_ci_list_lists_golden_cases_without_a_device))
    | (binary_id(=xtask::qa_TASK-M0-06_runner) & test(=qa_m006_ci_golden_runner_renders))
    | (binary_id(=xtask::qa_TASK-M0-22) & test(/^qa_m022_ci_(passes_when_every_control_trips|fails_on_)/))
    | (binary_id(=xtask::qa_ops_golden_harness_ci) & test(=qa_ops_gh_real_cargo_builds_once))
    | (binary_id(=xtask::qa_TASK-M0-20) & test(=qa_cli_screenshot_all_runs_selftest))
"""
test-group = "xtask-cargo"

# `xtask ci --list` in that group also takes every test thread, so it runs alone. In a `ci` shard, where it no longer
# runs (`ci-workspace`, below), it was a cold build of nearly every test target, whose time follows the runner's speed:
# slow runners took 553-600 s against the 600 s limit on its xtask child (R-214), with the shard's 3 other test threads
# running beside it. On any other cold target it still is. nextest takes each setting from
# the first override that matches and sets it, so the test keeps its group from the override above, and this override
# stays after that one, whose filter the negative controls in `qa_ops_nextest_cargo_group` edit at the binary's first
# mention. Applied per R-369.
[[profile.default.overrides]]
filter = "binary_id(=xtask::qa_TASK-M0-06_list) & test(=qa_m006_ci_list_lists_golden_cases_without_a_device)"
threads-required = "num-test-threads"

# The tests that exercise TASK-M2-26's own source run first in any run that selects them, ahead of their packages'
# slower tests. A run's result is unchanged: priority only orders the schedule. It is for the mutants gate (R-302;
# REQ-VAL-149, R-376): a mutant runs its package's tests in the name order until one fails (`.cargo/mutants.toml`), so a
# mutant only `roundtrip_preset` catches sat behind about 500 s of render's tests and 1300 s of validation's, for each
# of 142 mutants, and 8 shards of 300 min could not hold them (run 41098815668: 103 of 714 never ran). These tests
# themselves take under a minute. Applied per R-369.
[[profile.default.overrides]]
filter = """
    binary_id(=render::roundtrip_preset)
    | binary_id(=validation::roundtrip_preset)
    | binary_id(=validation::roundtrip_preset_golden)
    | binary_id(=validation::qa_TASK-M2-26)
    | binary_id(=validation::qa_TASK-M2-26_fragment)
    | binary_id(=xtask::fragment_wgsl)
"""
priority = 50

# The job queue's live tests (R-658) start runners and jobs in process groups of their own. A hung one is ended by this
# timer rather than holding a test thread: `slow-timeout` 120 s, ended at the third period, past their 45 s per xtask
# call. The `ci` profile inherits this override. Applied per R-369.
#
# `priority`: they run before the rest of xtask's tests. They take about 1 min of a 25-60 min package; a mutant of the
# queue fails one of them and stops the run there (`--max-fail=1:immediate`, `.cargo/mutants.toml`), and in nextest's
# default order 264 tests, cargo builds among them, ran first: 7.5 min per caught mutant, 368 mutants, every shard cut
# off at 300 min (run 41195456800). The tests run are the same, and a survivor still runs every one. Applied per R-369.
[[profile.default.overrides]]
filter = "binary_id(=xtask::jobq) | binary_id(/^xtask::qa_R-658/)"
slow-timeout = { period = "120s", terminate-after = 3 }
priority = 100

# The tests that catch the mutants of TASK-M3-05's source run first, ahead of the slow GPU suites. It is for the mutants
# gate again (R-302; REQ-VAL-149, R-376): a mutant runs its package's tests in priority and then name order until one
# fails, and `--max-fail=1:immediate` (`.cargo/mutants.toml`) stops the run there at once. On PR #360 (run 42131013368,
# 661 of its 676 mutants reported) the catching test took about 0.01 s and started some 350 s in, behind
# `agreement_preset_gpu` and `codegen_selftest`, 63% of the test time spent before a catch in validation, and two
# mutants caught by `qa_look_*` waited 2750 s; three of the eight shards stood cut at 300 min in its last attempt, and
# six were cut in one attempt or another. The tests named here take 163 s of test time in all. On the same tree and
# shards, run 42268889165: the 323 mutants with a reference came out the same, mutant for mutant, and the caught ones'
# test time fell from 1067 min to 34.
# It is `test()`, not `binary_id()`: nextest refuses a config whose `binary_id()` matches no binary, on every run, and
# most of these binaries came with that PR.
# Only the schedule changes: the same tests, under the same limits, and a survivor still runs every one. Owner-approved
# 6 Nov 2026, outside the rulings report.
[[profile.default.overrides]]
filter = """
    test(/^projection_parity_/)
    | test(/^drift_/)
    | test(/^golden_scene_/)
    | test(/^qa_look_/)
    | test(/^com_projection_/)
    | test(/^close_encounter_drift_/)
    | test(/^invariant_monitor_/)
    | test(/^fixtures_/)
    | test(/^stored_values_no_nan/)
"""
priority = 75

# Each of the job queue's test processes in a PID namespace of its own during a mutants run (`scripts/contain.sh test`;
# a pass-through unless the run sets PRIN_TEST_PIDNS): nothing a mutant of the queue starts outlives its test, and nothing
# it signals is outside it. `within-wrapper`: the memory cap, the target runner `.cargo/mutants.toml` sets, stays around
# the test. Applied per R-369.
[scripts.wrapper.queue-pidns]
command = { command-line = "scripts/contain.sh test", relative-to = "workspace-root" }
target-runner = "within-wrapper"

[[profile.default.scripts]]
filter = "binary_id(=xtask::jobq) | binary_id(/^xtask::qa_R-658/)"
run-wrapper = "queue-pidns"

[test-groups]
xtask-cargo = { max-threads = 1 }

# The CI split (R-325, REQ-SYS-076): the tests that need the built kernel, `target/spirv/kernel.spv` and `kernel.wgsl`,
# which `cargo xtask build-kernel` writes, run in CI's `gpu-kernel` job under the `gpu-kernel` profile, the codegen
# self-test (TASK-M0-15), the bring-up mode's GPU readback (TASK-M1-11, RQ-222) and the decode stage's and its gate's
# GPU tests (`engine`'s `decode_stage_gpu` and `qa_TASK-M2-06_gpu`, validation's `decode_f32_eps_gpu`, TASK-M2-06),
# canonicalisation's (`engine`'s `canon_gpu`, `qa_TASK-M2-07_gpu` and `qa_TASK-M2-47_gpu`, TASK-M2-07 and
# TASK-M2-47), the invariant-momentum construction's
# (`engine`'s `invariant_gpu`, TASK-M2-09), the invariant charts' gradient gate's (validation's
# `invariant_gradient_gpu`, TASK-M2-12) and encode's (`engine`'s `encode_gpu` and `qa_TASK-M2-15_gpu`, TASK-M2-15) among
# them, the per-pixel mass decode's (`engine`'s `per_pixel_mass_gpu`, TASK-M2-13) and decoder test 12 across backends
# (`engine`'s `decode_cross_backend` and `qa_TASK-M2-24_gpu`, TASK-M2-24), the lock's locked-against-free render
# (`engine`'s `lock_gpu`, TASK-M2-23), the kernel's own f32 `atan2` as the backend compiles it (`engine`'s `arctan_gpu`,
# RQ-628), and the agreement preset's against the decode stage (validation's
# `agreement_preset_gpu` and `qa_TASK-M2-25_gpu`) and the fragment snippets' check against the kernel's translation
# (xtask's `fragment_wgsl`, TASK-M2-25); the xtask tests that run cargo on
# the workspace's own target directory, and validation's `qa_TASK-M0-24`, run in the `ci-workspace` job under the `ci-workspace` profile (R-372,
# REQ-SYS-078; below); every other test runs in the `ci` job under the `ci` profile. Each CI step names its profile in
# NEXTEST_PROFILE. The three filters are disjoint and together select every test, so the jobs run every test once, as
# `xtask/tests/nextest.rs` checks. Locally, the default profile runs them all. The `ci` job runs its profile as 4
# parallel shards, each with `--partition hash:<k>/4`, which together run every test the profile selects, once (R-336,
# R-366, REQ-SYS-077); `xtask/tests/nextest.rs` lists each shard.
[profile.ci]
default-filter = """
    not (
        binary_id(=validation::toolchain)
        | binary_id(=validation::qa_TASK-M0-14)
        | binary_id(=validation::codegen_selftest)
        | binary_id(=validation::bringup)
        | binary_id(=engine::decode_stage_gpu)
        | binary_id(=engine::qa_TASK-M2-06_gpu)
        | binary_id(=engine::canon_gpu)
        | binary_id(=engine::qa_TASK-M2-07_gpu)
        | binary_id(=engine::qa_TASK-M2-47_gpu)
        | binary_id(=engine::invariant_gpu)
        | binary_id(=engine::encode_gpu)
        | binary_id(=engine::qa_TASK-M2-15_gpu)
        | binary_id(=engine::per_pixel_mass_gpu)
        | binary_id(=engine::decode_cross_backend)
        | binary_id(=engine::qa_TASK-M2-24_gpu)
        | binary_id(=engine::lock_gpu)
        | binary_id(=engine::arctan_gpu)
        | binary_id(=validation::decode_f32_eps_gpu)
        | binary_id(=validation::invariant_gradient_gpu)
        | binary_id(=validation::agreement_preset_gpu)
        | binary_id(=validation::qa_TASK-M2-25_gpu)
        | binary_id(=xtask::build_kernel)
        | binary_id(=xtask::qa_TASK-M0-14)
        | binary_id(=xtask::fragment_wgsl)
        | binary_id(=xtask::nextest)
        | binary_id(=validation::qa_TASK-M0-24)
        | (binary_id(=xtask::controls) & test(/^controls_on_this_workspace_skips_gui/))
        | (binary_id(=xtask::qa_TASK-M0-01) & test(=qa_cargo_xtask_alias_runs_deps))
        | (binary_id(=xtask::qa_TASK-M0-02) & test(/^qa02_a_failing_plan_check_turns_xtask_ci_red/))
        | (binary_id(=xtask::qa_TASK-M0-06_list) & test(=qa_m006_ci_list_lists_golden_cases_without_a_device))
        | (binary_id(=xtask::screenshot) & test(/^screenshot_gui_surface/))
    )
"""

# The tests that run cargo on the workspace's own target directory from xtask (the override above), among them the
# screenshot runner's `gui` surface tests, which run gui's capture mode through `cargo run` (RQ-252), which CI's
# `ci-workspace` job runs on a build of its own, beside the `ci` shards (R-372, REQ-SYS-078): the shards run from an
# archive, which carries no cargo build state, so in a shard each would rebuild the workspace while holding every
# test thread. Validation's `qa_TASK-M0-24` joins them: it runs `cargo test` on the workspace and `cargo xtask controls
# --list`, the same `--features controls` build the alias test's `cargo xtask ci --list` makes here; in a `ci` shard
# that rebuild left `ci (4)` 13 MiB free on a 72 GB runner (run 41756812074). It is not in xtask, so each job that runs
# this profile has a step that names validation. `xtask ci --list`'s test in `qa_TASK-M0-06_list` joins them, that one
# test, as its binary's others build nothing: the same listing in a `ci` shard took `ci (3)`'s `target/debug/deps` from
# 17 GB to 42 GB (run 41775231980). Applied per R-369.
[profile.ci-workspace]
default-filter = """
    binary_id(=xtask::nextest)
    | binary_id(=validation::qa_TASK-M0-24)
    | (binary_id(=xtask::controls) & test(/^controls_on_this_workspace_skips_gui/))
    | (binary_id(=xtask::qa_TASK-M0-01) & test(=qa_cargo_xtask_alias_runs_deps))
    | (binary_id(=xtask::qa_TASK-M0-02) & test(/^qa02_a_failing_plan_check_turns_xtask_ci_red/))
    | (binary_id(=xtask::qa_TASK-M0-06_list) & test(=qa_m006_ci_list_lists_golden_cases_without_a_device))
    | (binary_id(=xtask::screenshot) & test(/^screenshot_gui_surface/))
"""

[profile.gpu-kernel]
default-filter = """
    binary_id(=validation::toolchain)
    | binary_id(=validation::qa_TASK-M0-14)
    | binary_id(=validation::codegen_selftest)
    | binary_id(=validation::bringup)
    | binary_id(=engine::decode_stage_gpu)
    | binary_id(=engine::qa_TASK-M2-06_gpu)
    | binary_id(=engine::canon_gpu)
    | binary_id(=engine::qa_TASK-M2-07_gpu)
    | binary_id(=engine::qa_TASK-M2-47_gpu)
    | binary_id(=engine::invariant_gpu)
    | binary_id(=engine::encode_gpu)
    | binary_id(=engine::qa_TASK-M2-15_gpu)
    | binary_id(=engine::per_pixel_mass_gpu)
    | binary_id(=engine::decode_cross_backend)
    | binary_id(=engine::qa_TASK-M2-24_gpu)
    | binary_id(=engine::lock_gpu)
    | binary_id(=engine::arctan_gpu)
    | binary_id(=validation::decode_f32_eps_gpu)
    | binary_id(=validation::invariant_gradient_gpu)
    | binary_id(=validation::agreement_preset_gpu)
    | binary_id(=validation::qa_TASK-M2-25_gpu)

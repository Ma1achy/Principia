<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Axes on the line system</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:#7fb6e0}a:hover{color:#a9cff0}
</style>
</helmet>
<div style="width: 1240px; height: 760px; box-sizing: border-box; background: #1b1c1e; color: #e4e2dc; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 13px; padding: 26px 28px; display: flex; flex-direction: column; gap: 16px;">
  <div style="display: flex; align-items: baseline; gap: 14px;">
    <h1 style="margin: 0; font-size: 22px; font-weight: 500;">Axes are lines and labels too</h1>
    <span style="color: #b9b6ad;">Frame, ticks and tick labels take styles from the same library.</span>
  </div>
  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px;">
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px;">
      <div style="position: relative; width: 560px; height: 530px;">
        <img src="/_blob/f61f8a299c09c5a1ca83e66f8ffe2ad8" alt="The figure with screen-style axes: small grey ticks outside, monospaced values" style="position: absolute; left: 64px; top: 40px; width: 440px; height: 440px; image-rendering: pixelated;">
        <svg width="560" height="530" style="position: absolute; left: 0; top: 0;" aria-hidden="true">
          <g stroke="#9b998f" stroke-width="1">
            <line x1="64" y1="480" x2="64" y2="487"></line><line x1="174" y1="480" x2="174" y2="487"></line><line x1="284" y1="480" x2="284" y2="487"></line><line x1="394" y1="480" x2="394" y2="487"></line><line x1="504" y1="480" x2="504" y2="487"></line>
            <line x1="57" y1="40" x2="64" y2="40"></line><line x1="57" y1="150" x2="64" y2="150"></line><line x1="57" y1="260" x2="64" y2="260"></line><line x1="57" y1="370" x2="64" y2="370"></line><line x1="57" y1="480" x2="64" y2="480"></line>
          </g>
          <g fill="#b9b6ad" font-family="IBM Plex Mono, monospace" font-size="11" text-anchor="middle">
            <text x="64" y="502">−1.0</text><text x="174" y="502">−0.5</text><text x="284" y="502">0</text><text x="394" y="502">0.5</text><text x="504" y="502">1.0</text>
          </g>
          <g fill="#b9b6ad" font-family="IBM Plex Mono, monospace" font-size="11" text-anchor="end">
            <text x="52" y="44">1.0</text><text x="52" y="154">0.5</text><text x="52" y="264">0</text><text x="52" y="374">−0.5</text><text x="52" y="484">−1.0</text>
          </g>
          <text x="284" y="524" fill="#e4e2dc" font-family="IBM Plex Mono, monospace" font-size="12" text-anchor="middle">z_α</text>
          <text x="16" y="264" fill="#e4e2dc" font-family="IBM Plex Mono, monospace" font-size="12" text-anchor="middle" transform="rotate(-90 16 264)">z_β</text>
        </svg>
      </div>
      <figcaption style="display: flex; flex-direction: column; gap: 4px;">
        <span style="font-weight: 500;">Screen (the dev default)</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: #b9b6ad;">no frame · major ticks out 7 px · mono labels · latent units</span>
      </figcaption>
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px;">
      <div style="position: relative; width: 560px; height: 530px; background: #f4f2ec; border-radius: 3px;">
        <img src="/_blob/f61f8a299c09c5a1ca83e66f8ffe2ad8" alt="The same figure with print-style axes on paper: a frame, inward ticks, minor ticks, and a second scale in shape angles" style="position: absolute; left: 64px; top: 40px; width: 440px; height: 440px; image-rendering: pixelated;">
        <svg width="560" height="530" style="position: absolute; left: 0; top: 0;" aria-hidden="true">
          <rect x="64" y="40" width="440" height="440" fill="none" stroke="#1c1c1f" stroke-width="1.2"></rect>
          <g stroke="#f4f2ec" stroke-width="2.4">
            <line x1="174" y1="480" x2="174" y2="472"></line><line x1="284" y1="480" x2="284" y2="472"></line><line x1="394" y1="480" x2="394" y2="472"></line>
            <line x1="64" y1="150" x2="72" y2="150"></line><line x1="64" y1="260" x2="72" y2="260"></line><line x1="64" y1="370" x2="72" y2="370"></line>
          </g>
          <g stroke="#1c1c1f" stroke-width="1">
            <line x1="174" y1="480" x2="174" y2="472"></line><line x1="284" y1="480" x2="284" y2="472"></line><line x1="394" y1="480" x2="394" y2="472"></line>
            <line x1="64" y1="150" x2="72" y2="150"></line><line x1="64" y1="260" x2="72" y2="260"></line><line x1="64" y1="370" x2="72" y2="370"></line>
            <line x1="120.2" y1="40" x2="120.2" y2="47"></line><line x1="231.5" y1="40" x2="231.5" y2="47"></line><line x1="336.5" y1="40" x2="336.5" y2="47"></line><line x1="447.8" y1="40" x2="447.8" y2="47"></line>
            <line x1="504" y1="412.5" x2="497" y2="412.5"></line><line x1="504" y1="260" x2="497" y2="260"></line><line x1="504" y1="107.5" x2="497" y2="107.5"></line>
          </g>
          <g stroke="#1c1c1f" stroke-width="0.8">
            <line x1="86" y1="480" x2="86" y2="476"></line><line x1="108" y1="480" x2="108" y2="476"></line><line x1="130" y1="480" x2="130" y2="476"></line><line x1="152" y1="480" x2="152" y2="476"></line><line x1="196" y1="480" x2="196" y2="476"></line><line x1="218" y1="480" x2="218" y2="476"></line><line x1="240" y1="480" x2="240" y2="476"></line><line x1="262" y1="480" x2="262" y2="476"></line><line x1="306" y1="480" x2="306" y2="476"></line><line x1="328" y1="480" x2="328" y2="476"></line><line x1="350" y1="480" x2="350" y2="476"></line><line x1="372" y1="480" x2="372" y2="476"></line><line x1="416" y1="480" x2="416" y2="476"></line><line x1="438" y1="480" x2="438" y2="476"></line><line x1="460" y1="480" x2="460" y2="476"></line><line x1="482" y1="480" x2="482" y2="476"></line>
          </g>
          <g fill="#1c1c1f" font-family="IBM Plex Sans, sans-serif" font-size="11" text-anchor="middle">
            <text x="64" y="497">−1</text><text x="174" y="497">−0.5</text><text x="284" y="497">0</text><text x="394" y="497">0.5</text><text x="504" y="497">1</text>
            <text x="120.2" y="33">30°</text><text x="231.5" y="33">40°</text><text x="336.5" y="33">50°</text><text x="447.8" y="33">60°</text>
          </g>
          <g fill="#1c1c1f" font-family="IBM Plex Sans, sans-serif" font-size="11" text-anchor="end">
            <text x="58" y="44">1</text><text x="58" y="154">0.5</text><text x="58" y="264">0</text><text x="58" y="374">−0.5</text><text x="58" y="484">−1</text>
          </g>
          <g fill="#1c1c1f" font-family="IBM Plex Sans, sans-serif" font-size="11" text-anchor="start">
            <text x="510" y="416">60°</text><text x="510" y="264">90°</text><text x="510" y="111">120°</text>
          </g>
          <text x="284" y="519" fill="#1c1c1f" font-family="IBM Plex Sans, sans-serif" font-size="12" font-style="italic" text-anchor="middle">z_α</text>
          <text x="284" y="16" fill="#1c1c1f" font-family="IBM Plex Sans, sans-serif" font-size="12" font-style="italic" text-anchor="middle">α, shape angle</text>
          <text x="22" y="264" fill="#1c1c1f" font-family="IBM Plex Sans, sans-serif" font-size="12" font-style="italic" text-anchor="middle" transform="rotate(-90 22 264)">z_β</text>
          <text x="546" y="264" fill="#1c1c1f" font-family="IBM Plex Sans, sans-serif" font-size="12" font-style="italic" text-anchor="middle" transform="rotate(90 546 264)">β, shape angle</text>
        </svg>
      </div>
      <figcaption style="display: flex; flex-direction: column; gap: 4px;">
        <span style="font-weight: 500;">Print</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: #b9b6ad;">frame · ticks in, minor every 0.1 · paper halo on ticks · second scale: α and β in degrees, unevenly spaced because the link is a sigmoid</span>
      </figcaption>
    </figure>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1240,"height":760}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>

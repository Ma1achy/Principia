<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Principia — GUI mock</title>
<style>
  :root{
    --bg:#1b1d21; --panel:#232629; --panel2:#2b2f33; --widget:#34393e; --widgetH:#3e444a;
    --ink:#d7dbdf; --muted:#8b9297; --faint:#5c6469; --rule:#3a3f45;
    --accent:#46b8a6; --accent-dim:#2f6b63; --warn:#e0a24a; --sim:#c77b52;
    --mono:"SF Mono",ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    --b0:#e8a84a; --b1:#46b8a6; --b2:#c16eb4;   /* body / channel colours */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;user-select:none}
  canvas#render{display:block;position:fixed;inset:0;z-index:0;cursor:crosshair}

  #status{padding:6px 12px;border-bottom:1px solid var(--rule);background:var(--panel);display:flex;flex-wrap:wrap;gap:3px 14px;font-family:var(--mono);font-size:10.5px;color:var(--ink)}
  #status .k{color:var(--faint)} #status .march{color:var(--accent)}

  #hint{position:fixed;bottom:0;left:0;right:0;z-index:20;padding:5px 12px;font-family:var(--mono);font-size:10.5px;color:var(--faint);background:linear-gradient(0deg,rgba(20,22,25,.6),transparent);pointer-events:none;display:flex;gap:16px}
  #hint b{color:var(--muted);font-weight:600}
  #hint .re{color:var(--sim);opacity:0;transition:opacity .25s} #hint .re.on{opacity:1}

  #menu{position:fixed;top:0;bottom:0;left:0;z-index:15;width:340px;background:var(--panel);border-right:1px solid var(--rule);display:flex;flex-direction:column;overflow:hidden;box-shadow:2px 0 24px rgba(0,0,0,.35);transition:transform .16s ease}
  #menu.hidden{transform:translateX(-100%)}
  .menu-head{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--rule);background:var(--panel2)}
  .menu-head .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 7px var(--accent)}
  .menu-head .title{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.03em}
  .menu-head .f3{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--faint);border:1px solid var(--rule);border-radius:3px;padding:1px 5px}
  .menu-scroll{flex:1;overflow-y:auto;overflow-x:hidden}
  .menu-scroll::-webkit-scrollbar{width:9px}.menu-scroll::-webkit-scrollbar-thumb{background:#3a3f45;border-radius:5px;border:2px solid var(--panel)}

  .sec{border-bottom:1px solid var(--rule)}
  .sec>.hd{display:flex;align-items:center;gap:6px;padding:7px 12px;cursor:pointer;font-size:12px;font-weight:600;color:var(--ink);background:var(--panel)}
  .sec>.hd:hover{background:var(--panel2)}
  .sec>.hd .tri{font-size:9px;color:var(--muted);width:9px;transition:transform .12s}
  .sec.collapsed>.hd .tri{transform:rotate(-90deg)}
  .sec>.hd .tag{margin-left:auto;font-family:var(--mono);font-size:9px;padding:1px 5px;border-radius:3px}
  .tag.sim{color:var(--sim);border:1px solid #6b4636;background:rgba(199,123,82,.08)}
  .tag.rnd{color:var(--accent);border:1px solid var(--accent-dim);background:rgba(70,184,166,.07)}
  .sec>.body{padding:5px 12px 11px} .sec.collapsed>.body{display:none}
  .subhd{font-family:var(--mono);font-size:9.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;margin:8px 0 3px;padding-bottom:2px;border-bottom:1px solid var(--rule)}
  .subhd:first-child{margin-top:2px}

  .row{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:11.5px}
  .row .lbl{color:var(--muted);width:92px;flex-shrink:0;font-size:11px}
  .row .lbl.w{width:112px}.row .lbl.n{width:64px}
  .row .ctl{flex:1;display:flex;align-items:center;gap:7px;min-width:0}

  .sld{flex:1;height:15px;position:relative;cursor:ew-resize;min-width:0}
  .sld .trk{position:absolute;top:6px;left:0;right:0;height:3px;background:var(--widget);border-radius:2px}
  .sld .fil{position:absolute;top:6px;left:0;height:3px;background:var(--accent-dim);border-radius:2px}
  .sld .hnd{position:absolute;top:2px;width:5px;height:11px;background:var(--accent);border-radius:2px;transform:translateX(-50%);box-shadow:0 0 0 1px rgba(0,0,0,.3)}
  .num{font-family:var(--mono);font-size:11px;color:var(--ink);background:var(--widget);border-radius:3px;padding:2px 6px;width:54px;text-align:right;cursor:ew-resize}
  .num:hover{background:var(--widgetH)}

  select.cmb{flex:1;min-width:0;font-family:var(--mono);font-size:11px;color:var(--ink);background:var(--widget);border:1px solid var(--rule);border-radius:3px;padding:3px 6px;cursor:pointer;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 13px) 7px,calc(100% - 9px) 7px;background-size:4px 4px;background-repeat:no-repeat}
  select.cmb.sm{font-size:10px;padding:2px 5px}
  select.cmb:hover{background-color:var(--widgetH)}
  select.cmb optgroup{background:var(--panel);color:var(--muted)} select.cmb option{background:var(--panel2);color:var(--ink)}

  .chk{display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-size:11px;color:var(--ink)}
  .chk .box{width:14px;height:14px;border-radius:3px;background:var(--widget);border:1px solid var(--rule);display:grid;place-items:center;font-size:10px;color:var(--bg)}
  .chk.on .box{background:var(--accent);border-color:var(--accent)}
  .seg{display:flex;border:1px solid var(--rule);border-radius:4px;overflow:hidden;flex:1}
  .seg button{flex:1;font-family:var(--mono);font-size:10px;padding:3px 2px;background:var(--widget);color:var(--muted);border:none;border-right:1px solid var(--rule);cursor:pointer}
  .seg button:last-child{border-right:none}.seg button.on{background:var(--accent-dim);color:#eafffb}
  .btn{font-family:var(--mono);font-size:10px;padding:4px 9px;background:var(--widget);color:var(--ink);border:1px solid var(--rule);border-radius:4px;cursor:pointer}
  .btn:hover{background:var(--widgetH)} .btn.pri{background:var(--accent-dim);border-color:var(--accent);color:#eafffb}
  .note{font-family:var(--mono);font-size:9.5px;color:var(--faint);padding:3px 0;line-height:1.45}
  .note.w{color:var(--warn)}

  /* slot rows for the colour pipeline */
  .slot{background:var(--panel2);border:1px solid var(--rule);border-radius:5px;padding:6px 8px;margin:4px 0}
  .slot .st{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;margin-bottom:4px}
  .slot .st .nm{color:var(--accent);font-weight:600;width:66px}
  .slot .st .sig{color:var(--faint);margin-left:auto}
  .slot .st .cst{font-size:9px;color:var(--muted);border:1px solid var(--rule);border-radius:3px;padding:1px 4px;cursor:pointer}
  .slot .st .cst.on{color:var(--accent);border-color:var(--accent-dim)}
  .slot .ln{display:flex;gap:6px;margin-top:3px} .slot .ln>*{flex:1}
  .cstatus{display:inline-block;width:6px;height:6px;border-radius:50%;background:#5ac37a;margin-left:4px}

  /* z0 coordinate grid */
  .z0grid{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px}
  .zc{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px}
  .zc .zn{color:var(--muted);width:30px}.zc.ax .zn{color:var(--accent)}
  .zc input{flex:1}
  .zc .mini{-webkit-appearance:none;appearance:none;height:3px;background:var(--widget);border-radius:2px;outline:none}
  .zc .mini::-webkit-slider-thumb{-webkit-appearance:none;width:8px;height:8px;border-radius:50%;background:var(--accent);cursor:pointer}
  .zc .mini::-moz-range-thumb{width:8px;height:8px;border:none;border-radius:50%;background:var(--accent);cursor:pointer}

  /* profiler */
  .frameGraph{width:100%;height:46px;background:var(--panel2);border:1px solid var(--rule);border-radius:4px;display:block;margin:3px 0 6px}
  .pgrid{display:grid;grid-template-columns:1fr 1fr;gap:1px 14px;font-family:var(--mono);font-size:10px;margin-bottom:6px}
  .pgrid .k{color:var(--muted)}.pgrid .v{color:var(--ink);text-align:right}
  .stack{display:flex;height:16px;border-radius:3px;overflow:hidden;border:1px solid var(--rule);margin:2px 0 5px}
  .stack i{height:100%;position:relative}
  .legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-family:var(--mono);font-size:9.5px;color:var(--muted)}
  .legend span::before{content:'';display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:-1px;background:var(--c)}

  /* inspector */
  #inspEmpty{font-size:11px;color:var(--faint);font-style:italic;padding:8px 0;line-height:1.6}
  .fate{font-family:var(--mono);font-size:11px;font-weight:600;padding:5px 8px;border-radius:4px;margin:4px 0 6px;text-align:center}
  .panes{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .pane{background:#15171a;border:1px solid var(--rule);border-radius:5px;overflow:hidden}
  .pane .cap{font-family:var(--mono);font-size:9px;color:var(--muted);padding:3px 6px;border-bottom:1px solid var(--rule);background:var(--panel2)}
  .pane canvas{display:block;width:100%}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:1px 10px;font-family:var(--mono);font-size:10px;padding:1px 0}
  .kv .k{color:var(--muted)}.kv .v{color:var(--ink);text-align:right}
  .cursorRow{display:flex;align-items:center;gap:8px;margin:6px 0 2px;font-family:var(--mono);font-size:10px;color:var(--muted)}
  .cursorRow input{flex:1}
  @media (max-width:760px){#menu{width:92vw}}

  /* pipeline node editor */
  #pipeEditor{position:fixed;inset:0;z-index:40;background:rgba(12,13,15,.9);backdrop-filter:blur(3px);display:flex;flex-direction:column}
  #pipeEditor.hidden{display:none}
  .pe-head{display:flex;align-items:center;gap:9px;padding:10px 16px;border-bottom:1px solid var(--rule);background:var(--panel2);font-family:var(--mono);font-size:13px;font-weight:600}
  .pe-head .d{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 7px var(--accent)}
  .pe-head .x{margin-left:auto;cursor:pointer;color:var(--muted);font-size:15px;padding:0 6px}
  .pe-head .x:hover{color:var(--ink)}
  .pe-body{flex:1;display:flex;min-height:0}
  .pe-graph{flex:1;position:relative;overflow:hidden;background:radial-gradient(circle at 1px 1px,#262a2e 1px,transparent 0);background-size:22px 22px}
  .pe-wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  .pnode{position:absolute;background:var(--panel);border:1px solid var(--rule);border-radius:6px;box-shadow:0 3px 12px rgba(0,0,0,.45);min-height:50px;user-select:none}
  .pnode.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 3px 14px rgba(0,0,0,.5)}
  .pnode .ph{font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--ink);padding:4px 9px;border-bottom:1px solid var(--rule);border-radius:6px 6px 0 0;cursor:grab}
  .pnode .pbody{font-family:var(--mono);font-size:9px;color:var(--muted);padding:5px 9px;line-height:1.45;word-break:break-word}
  .port{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--widget);border:1.5px solid var(--accent-dim);transform:translate(-50%,-50%);z-index:2}
  .pe-side{width:322px;border-left:1px solid var(--rule);background:var(--panel);overflow-y:auto;padding:12px}
  .pe-side>canvas{display:block;margin:0 auto 4px}
  #pe-params .lbl{width:78px}
</style>
</head>
<body>
<canvas id="render"></canvas>
<div id="menu"><div class="menu-head"><span class="dot"></span><span class="title">debug · dev</span><span class="f3">F3</span></div>
<div id="status">
  <span><span class="k">t</span> <span class="march" id="hudT">0.00</span> ▶</span>
  <span><span class="k">fps</span> <span id="hudFps">—</span></span>
  <span><span class="k">chart</span> <span id="hudChart">z_α × z_β</span></span>
  <span><span class="k">zoom</span> <span id="hudZoom">1.0×</span></span>
  <span><span class="k">cursor</span> <span id="hudCur">—</span></span>
</div>
<div class="menu-scroll" id="menuScroll"></div></div>
<div id="hint"><span><b>F3</b> menu</span><span><b>drag</b> pan (z₀)</span><span><b>scroll</b> zoom</span><span><b>click</b> inspect</span><span class="re" id="reFlag">● re-integrating (sim-key changed)</span></div>

<div id="pipeEditor" class="hidden">
  <div class="pe-head"><span class="d"></span>Colour pipeline · node graph<span class="x" id="pe-close">✕</span></div>
  <div class="pe-body">
    <div class="pe-graph" id="pe-graph"><svg class="pe-wires" id="pe-wires"></svg></div>
    <div class="pe-side">
      <canvas id="pe-sphere" width="180" height="180" style="border-radius:50%;background:#0f1114;border:1px solid var(--rule)"></canvas>
      <div class="note" style="text-align:center">shape sphere</div>
      <canvas id="pe-equirect" width="290" height="145" style="border-radius:3px;background:#0f1114;border:1px solid var(--rule);width:290px"></canvas>
      <div class="note" style="text-align:center;margin-bottom:8px">equirectangular unwrap</div>
      <div id="pe-params"></div>
    </div>
  </div>
</div>

<script>
"use strict";
/* Principia GUI mock v2.
   The full-screen render is a PLACEHOLDER (a Newton basin fractal — right visual
   grammar, wrong physics; flagged as such). Everything else is modelled on the
   real docs: navigation = editing the chart triple (z₀,q₁,q₂) [chart §4], the
   4-slot colour pipeline post(combine(colour,brightness)) [gui §4-5 / dd_colouring §3],
   and a genuinely-integrated 3-body trajectory inspector [trajectory §4]. */

const cv=document.getElementById('render'), ctx=cv.getContext('2d',{alpha:false});
let W=innerWidth,H=innerHeight;

// ---------- quantity menu (the axis / direction menu) --------------------
const QGROUPS=[
  ['latent (8)',[['z_a','z_α'],['z_b','z_β'],['z_q0','z_q0'],['z_q1','z_q1'],['z_q2','z_q2'],['z_q3','z_q3'],['z_m1','z_μ1'],['z_m2','z_μ2']]],
  ['canonical Cartesian',[['x0','x₀'],['y0','y₀'],['px0','px₀'],['py0','py₀'],['x1','x₁'],['y1','y₁'],['x2','x₂'],['y2','y₂']]],
  ['invariants',[['E','E'],['KE','KE'],['PE','PE'],['Lz','L_z']]],
  ['inter-body angles',[['a01','θ₀₁'],['a02','θ₀₂'],['a12','θ₁₂']]],
  ['coupled curve',[['nu','ν (Burrau/Euclid)']]],
];
const QLABEL={}; QGROUPS.forEach(([,it])=>it.forEach(([k,l])=>QLABEL[k]=l));
const KIND=(q)=>{ if(['E','KE','PE','Lz'].includes(q))return{k:'invariant',t:'inv',c:'w'};
  if(q==='nu')return{k:'coupled',t:'coupled',c:'w'};
  if(/^(x|y|px|py|a\d)/.test(q))return{k:'derived',t:'derived',c:''};
  return{k:'raw',t:'raw',c:''}; };
const ZC=[['z_a','z_α'],['z_b','z_β'],['z_q0','z_q0'],['z_q1','z_q1'],['z_q2','z_q2'],['z_q3','z_q3'],['z_m1','z_μ1'],['z_m2','z_μ2']];
const SPHEREMODES=[
 ['colour maps',[['vmf_full','VMF OKLAB (6-pole blend)'],['vmf_oi','VMF Okabe–Ito'],['viridis','Viridis · LUT sphere'],['cividis','Cividis · LUT sphere'],['plasma','Plasma · LUT sphere'],['magma','Magma · LUT sphere'],['turbo_s','Turbo · LUT sphere'],['inferno','Inferno · LUT sphere'],['twilight','Twilight · cyclic LUT sphere'],['coolwarm_s','Cool–warm · LUT sphere'],['principia_s','Principia · LUT sphere'],['cubehelix_s','Cubehelix · LUT sphere'],['dircos','Direction cosines']]],
 ['patterns',[['octant','Octant (8)'],['voronoi6','Voronoi 6'],['hemispheres','Hemispheres'],['icosa','Icosahedral (12)'],['fibonacci','Fibonacci lattice'],['soft_voronoi','Soft Voronoi'],['checker','Checkerboard'],['lat_stripes','Latitude stripes'],['lon_stripes','Longitude stripes'],['truchet','Truchet mosaic'],['dot_lattice','Dot lattice']]],
 ['overlays',[['grid','Grid over VMF'],['contours','Iso-hue contours'],['checker_vmf','Checker + VMF'],['gradient_mag','Gradient magnitude'],['perlin','Perlin noise']]],
 ['special',[['harmonics','Spherical harmonics Yℓm'],['turing','Turing standing waves'],['custom_vmf','Custom N-pole VMF'],['basin_blend','Basin blend']]],
];
const PALETTES=[['golden','golden-angle (137.5°)'],['okabe','Okabe–Ito cycle'],['gradient','gradient A→B'],['cubehelix','Cubehelix'],['fixed','fixed swatches']];
const SOURCES=[
 ['shape · vector → sphere map',[['shape_n','shape n̂ (S², vector)'],['shape_mag','‖n̂‖'],['shape_nz','n_z'],['stability','stability (BC distance)']]],
 ['energy & dynamics · scalar',[['E','E total'],['KE','kinetic K₀'],['PE','potential V₀'],['Lz','L_z'],['virial','virial ratio'],['edrift','energy error'],['lzdrift','L_z error']]],
 ['mass & geometry · scalar',[['mu12','mass ratio μ₁₂'],['mu13','mass ratio μ₁₃'],['qmass','mass fraction'],['rho1','Jacobi ρ₁ mag'],['rho2','Jacobi ρ₂ mag'],['rhoratio','Jacobi ρ ratio'],['rhoangle','Jacobi ρ angle'],['rmin','min pair dist']]],
 ['chaos & outcome',[['ftle','FTLE'],['diffusion','diffusion'],['dmin','d_min'],['state','outcome state'],['word','encounter word']]],
];
const SCALARPAL=[['coolwarm','Cool–warm · diverging'],['Viridis','Viridis · sequential'],['Magma','Magma · sequential'],['Cividis','Cividis · CB-safe'],['turbo','Turbo'],['cubehelix','Cubehelix'],['Twilight','Twilight · cyclic'],['okabe','Okabe–Ito · categorical']];
const COMPACTS=[['lin','lin'],['log','log'],['symlog','symlog (signed)'],['cyclic','cyclic (phase)']];
const FIELDREC={E:['coolwarm','symlog'],KE:['Viridis','lin'],PE:['Magma','lin'],Lz:['coolwarm','symlog'],virial:['coolwarm','lin'],edrift:['coolwarm','symlog'],lzdrift:['coolwarm','symlog'],mu12:['coolwarm','lin'],mu13:['coolwarm','lin'],qmass:['Viridis','lin'],rho1:['Viridis','log'],rho2:['Viridis','log'],rhoratio:['coolwarm','symlog'],rhoangle:['Twilight','cyclic'],rmin:['Magma','log'],ftle:['Viridis','lin'],diffusion:['Cividis','lin'],dmin:['Magma','log'],state:['okabe','lin'],word:['okabe','lin']};
const SRCLABEL={}; SOURCES.forEach(g=>g[1].forEach(o=>SRCLABEL[o[0]]=o[1]));
const DEBUGCAT=[
 ['kernel modes (§A)',[['NORMAL','NORMAL (pipeline)'],['UV','UV_PASSTHROUGH'],['DECODE','DECODE_PASSTHROUGH'],['ROUNDTRIP','ROUNDTRIP']]],
 ['payload field views (§B–E)',[['f_state','state · 6-class'],['f_ftle','ftle'],['f_edrift','energy_drift · diverging'],['f_diff','diffusion · −1 sentinel'],['f_lzdrift','Lz_drift · diverging'],['f_dmin','d_min'],['f_sat','saturated · sticky'],['f_orbit','orbit_count / retrograde'],['f_wordhash','whole-word hash · topological basins'],['f_substep','live substeps · animated'],['f_ncos','shape n · dir-cosines'],['f_nerr','‖n‖−1 error']]],
 ['structural · quadtree (§F)',[['s_depth','quad-depth heatmap'],['s_state','quad-state enum'],['s_impurity','coherence / impurity'],['s_spread','ensemble spread'],['s_suspect','suspect fraction'],['s_priority','priority score'],['s_cache','cache age / ancestor gap'],['s_uv','UV passthrough · coordinate'],['s_bounds','quadtree boundaries'],['s_fallback','fallback tint / pending hatch']]],
 ['cross-checks · seams (§G)',[['x_invgrad','invariant-chart gradient'],['x_energy','energy agreement'],['x_winding','winding consistency'],['x_diff','diffusion · Welford'],['x_impurity','impurity mask'],['x_drift','drift shape']]],
];

// ---------- state --------------------------------------------------------
const S={
  // navigation = the chart triple (z₀, q₁, q₂)
  z0:{z_a:0,z_b:0,z_q0:0,z_q1:0,z_q2:0,z_q3:0,z_m1:0,z_m2:0},   // 8D slice centre
  axX:'z_a', axY:'z_b',                                          // the basis q₁,q₂ (as quantities)
  residX:'hold m₂=m₃', residY:'hold m₂=m₃',
  tilt1:0, tilt2:0, tiltTgt1:'z_q0', tiltTgt2:'z_q2',
  sliceDir:'z_q1', sliceAmt:0,
  cx:0,cy:0, span:3.0, locked:false,
  // sim-key
  N:4, E:8, ftle:true, dt:0.004, T:60,
  // render-key — the 4-slot colour pipeline
  colourSrc:'shape_n', sphereMode:'vmf_full', colourCustom:false, autorotate:true,
  palette:'golden', invert:false, blendMode:'none', blendAmt:0.5,
  freqF:6, cellN:48, sharpKs:8, overlayS:0.0, colourPreset:'vmffull',
  scalarPalette:'coolwarm', scalarCompact:'symlog', sphereYaw:0, spherePitch:0.35,
  nContours:8, hl:2, hm:2, nPoles:3, tiltP:0, poleRot:0, gridCol:[10,10,14], bgCol:[16,16,22],
  physBC:true, physEU:false, physLA:true, bcCols:[[0,114,178],[230,159,0],[213,94,0]], euCol:[160,160,180], laCol:[200,210,255],
  brightSrc:'none', brightMap:'lin', brightCustom:false,

// ==================== REAL 3-body integrator (for the inspector) =========
function nbody(m,r0,v0,steps,dt,soft){
  let r=r0.map(p=>[...p]),v=v0.map(p=>[...p]);const fr=[];
  const acc=r=>{const a=[[0,0],[0,0],[0,0]];for(let i=0;i<3;i++)for(let j=0;j<3;j++){if(i===j)continue;
    const dx=r[j][0]-r[i][0],dy=r[j][1]-r[i][1],d2=dx*dx+dy*dy+soft,inv=1/(d2*Math.sqrt(d2));a[i][0]+=m[j]*dx*inv;a[i][1]+=m[j]*dy*inv;}return a;};
  let a=acc(r);let dmin=1e9,E0=null;
  for(let s=0;s<steps;s++){
    for(let i=0;i<3;i++){v[i][0]+=0.5*dt*a[i][0];v[i][1]+=0.5*dt*a[i][1];r[i][0]+=dt*v[i][0];r[i][1]+=dt*v[i][1];}
    a=acc(r);for(let i=0;i<3;i++){v[i][0]+=0.5*dt*a[i][0];v[i][1]+=0.5*dt*a[i][1];}
    const d01=Math.hypot(r[0][0]-r[1][0],r[0][1]-r[1][1]),d02=Math.hypot(r[0][0]-r[2][0],r[0][1]-r[2][1]),d12=Math.hypot(r[1][0]-r[2][0],r[1][1]-r[2][1]);
    dmin=Math.min(dmin,d01,d02,d12);
    if(s%3===0)fr.push(r.map(p=>[...p]));
  }
  // outcome heuristic
  const last=fr[fr.length-1];const cen=[(last[0][0]+last[1][0]+last[2][0])/3,(last[0][1]+last[1][1]+last[2][1])/3];
  const far=Math.max(...last.map(p=>Math.hypot(p[0]-cen[0],p[1]-cen[1])));
  return{fr,dmin,escaped:far>6};
}
function shapePt(m,r){const M=m[0]+m[1]+m[2],M01=m[0]+m[1];
  const muR=m[0]*m[1]/M01,muL=m[2]*M01/M;
  const rho=[r[1][0]-r[0][0],r[1][1]-r[0][1]];const icm=[(m[0]*r[0][0]+m[1]*r[1][0])/M01,(m[0]*r[0][1]+m[1]*r[1][1])/M01];const lam=[r[2][0]-icm[0],r[2][1]-icm[1]];
  const rT=[rho[0]*Math.sqrt(muR),rho[1]*Math.sqrt(muR)],lT=[lam[0]*Math.sqrt(muL),lam[1]*Math.sqrt(muL)];
  const nr=Math.hypot(rT[0],rT[1]),nl=Math.hypot(lT[0],lT[1]);const al=Math.atan2(nl,nr);
  const be=Math.atan2(rT[0]*lT[1]-rT[1]*lT[0],rT[0]*lT[0]+rT[1]*lT[1]);
  return[Math.cos(2*al),Math.sin(2*al)*Math.cos(be),Math.sin(2*al)*Math.sin(be)];}

let insp=null;                       // current inspection {m,fr,shadow,shape,dmin,escaped,cursor}
function inspectAt(sx,sy){
  const[re,im]=s2z(sx,sy);const rnd=k=>{const x=Math.sin((re*3.3+im*7.7+k)*91.7)*1000;return x-Math.floor(x);};
  let m=[0.5+0.5*rnd(1),0.5+0.5*rnd(2),0.5+0.5*rnd(3)];const ms=m[0]+m[1]+m[2];m=m.map(x=>x/ms);
  const r0=[[-0.8+0.4*rnd(4),0.3*rnd(5)],[0.8+0.3*rnd(6),0.2*rnd(7)],[0.2*rnd(8),-0.7+0.3*rnd(9)]];
  // COM-zero the positions & give a small rotational + radial kick
  const com=[(m[0]*r0[0][0]+m[1]*r0[1][0]+m[2]*r0[2][0]),(m[0]*r0[0][1]+m[1]*r0[1][1]+m[2]*r0[2][1])];
  for(const p of r0){p[0]-=com[0];p[1]-=com[1];}
  const om=0.5+rnd(11);const v0=r0.map(p=>[-om*p[1]+(rnd(12)-0.5)*0.5,om*p[0]+(rnd(13)-0.5)*0.5]);
  // zero total momentum
  const P=[m[0]*v0[0][0]+m[1]*v0[1][0]+m[2]*v0[2][0],m[0]*v0[0][1]+m[1]*v0[1][1]+m[2]*v0[2][1]];
  for(let i=0;i<3;i++){v0[i][0]-=P[0];v0[i][1]-=P[1];}
  const res=nbody(m,r0,v0,2400,0.004,0.02);
  const r0p=r0.map((p,i)=>i===0?[p[0]+1e-3,p[1]]:[...p]);       // perturbed shadow (f32-vs-f64 stand-in)
  const sh=nbody(m,r0p,v0,2400,0.004,0.02);
  const shape=res.fr.map(fr=>shapePt(m,fr)), shShadow=sh.fr.map(fr=>shapePt(m,fr));
  insp={m,fr:res.fr,shape,shShadow,shadowR:sh.fr,dmin:res.dmin,escaped:res.escaped,cursor:res.fr.length-1,re,im,divOn:false};
  openSec('inspect');renderInspect();
}

function renderInspect(){
  document.getElementById('inspEmpty').style.display='none';const b=document.getElementById('inspBody');b.style.display='block';
  const i=insp;const fate=i.escaped?{t:'ESCAPE',c:[232,168,74]}:(i.dmin<0.05?{t:'CLOSE APPROACH',c:[224,120,80]}:{t:'BOUNDED · interacting',c:[120,140,190]});
  const fc=`rgb(${fate.c[0]},${fate.c[1]},${fate.c[2]})`;
  b.innerHTML=`<div class="fate" style="background:${fc}22;color:${fc};border:1px solid ${fc}55">${fate.t}${i.escaped?' · escaper resolving':''}</div>
    <div class="panes">
      <div class="pane"><div class="cap">real space · r_i(t)</div><canvas id="ins-real" width="150" height="120"></canvas></div>
      <div class="pane"><div class="cap">shape sphere · n(t)</div><canvas id="ins-sph" width="150" height="120"></canvas></div>
    </div>
    <div class="pane" style="margin-top:6px"><div class="cap">UV unwrap · (φ, n_z) equirectangular</div><canvas id="ins-uv" width="314" height="86"></canvas></div>
    <div class="cursorRow"><span>t_cursor</span><input type="range" id="ins-cur" min="0" max="${i.fr.length-1}" value="${i.cursor}"><span id="ins-curv">${(i.cursor*0.012).toFixed(2)}</span></div>
    <label class="chk" style="margin:2px 0" id="ins-divchk"><span class="box"></span><span>f32 GPU divergence overlay</span></label>
    <div class="kv"><span class="k">IC-plane</span><span class="v">${i.re.toFixed(4)}, ${i.im.toFixed(4)}</span></div>
    <div class="kv"><span class="k">masses</span><span class="v">${i.m.map(x=>x.toFixed(2)).join(' · ')}</span></div>
    <div class="kv"><span class="k">d_min</span><span class="v">${i.dmin.toFixed(3)}</span></div>
    <div class="kv"><span class="k">state @cursor</span><span class="v" id="ins-state">${fate.t}</span></div>
    <div class="note">shape divergence = honest f32-vs-f64 gap (peel-off ≈ local Lyapunov time). real space is CPU-f64 sugar — no GPU path to compare.</div>`;
  const cur=document.getElementById('ins-cur');cur.oninput=()=>{i.cursor=+cur.value;document.getElementById('ins-curv').textContent=(i.cursor*0.012).toFixed(2);drawInsp();};
  const dc=document.getElementById('ins-divchk');dc.onclick=()=>{i.divOn=!i.divOn;dc.classList.toggle('on',i.divOn);dc.querySelector('.box').textContent=i.divOn?'✓':'';drawInsp();};
  drawInsp();
}
function drawInsp(){const i=insp;const cols=['#e8a84a','#46b8a6','#c16eb4'];
  // real space
  let c=document.getElementById('ins-real'),g=c.getContext('2d');g.fillStyle='#15171a';g.fillRect(0,0,c.width,c.height);
  let mn=1e9,mx=-1e9;i.fr.forEach(f=>f.forEach(p=>{mn=Math.min(mn,p[0],p[1]);mx=Math.max(mx,p[0],p[1]);}));const pad=6,sc=(Math.min(c.width,c.height)-2*pad)/Math.max(0.5,(mx-mn));const ox=c.width/2,oy=c.height/2,mid=(mn+mx)/2;
  const X=v=>ox+(v-mid)*sc,Y=v=>oy-(v-mid)*sc;
  for(let bi=0;bi<3;bi++){g.strokeStyle=cols[bi];g.globalAlpha=.5;g.lineWidth=1;g.beginPath();for(let s=0;s<=i.cursor;s++){const p=i.fr[s][bi];s?g.lineTo(X(p[0]),Y(p[1])):g.moveTo(X(p[0]),Y(p[1]));}g.stroke();g.globalAlpha=1;
    const p=i.fr[i.cursor][bi];g.fillStyle=cols[bi];g.beginPath();g.arc(X(p[0]),Y(p[1]),3,0,7);g.fill();}
  // shape sphere (orthographic, azimuth=atan2(ny,nx), polar from nz)
  c=document.getElementById('ins-sph');g=c.getContext('2d');g.fillStyle='#15171a';g.fillRect(0,0,c.width,c.height);
  const R=c.height*0.4,cx=c.width/2,cy=c.height/2;
  g.strokeStyle='#2a2f34';g.beginPath();g.arc(cx,cy,R,0,7);g.stroke();g.beginPath();g.ellipse(cx,cy,R,R*0.34,0,0,7);g.stroke();
  // BC landmarks on equator + Lagrange poles
  g.fillStyle='#556';for(let k=0;k<3;k++){const a=k*2*Math.PI/3;g.beginPath();g.arc(cx+R*Math.cos(a),cy+R*0.34*Math.sin(a),2,0,7);g.fill();}
  const proj=n=>[cx+R*n[1],cy-R*n[2]*0.72-R*0.28*n[0]];
  const drawCurve=(shape,col,al)=>{g.strokeStyle=col;g.globalAlpha=al;g.lineWidth=1.2;g.beginPath();for(let s=0;s<=i.cursor;s++){const p=proj(shape[s]);s?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]);}g.stroke();g.globalAlpha=1;};
  if(i.divOn)drawCurve(i.shShadow,'#e05a5a',.7);
  drawCurve(i.shape,'#7fd8ff',1);
  const pp=proj(i.shape[i.cursor]);g.fillStyle='#7fd8ff';g.beginPath();g.arc(pp[0],pp[1],3,0,7);g.fill();
  // UV unwrap
  c=document.getElementById('ins-uv');g=c.getContext('2d');g.fillStyle='#15171a';g.fillRect(0,0,c.width,c.height);
  g.strokeStyle='#23282d';g.beginPath();g.moveTo(0,c.height/2);g.lineTo(c.width,c.height/2);g.stroke();
  const uv=n=>[((Math.atan2(n[1],n[0])/(2*Math.PI))+0.5)*c.width,(1-(n[2]+1)/2)*c.height];
  const drawUV=(shape,col,al)=>{g.strokeStyle=col;g.globalAlpha=al;g.beginPath();let px=null;for(let s=0;s<=i.cursor;s++){const p=uv(shape[s]);if(px!==null&&Math.abs(p[0]-px)<c.width*0.5)g.lineTo(p[0],p[1]);else g.moveTo(p[0],p[1]);px=p[0];}g.stroke();g.globalAlpha=1;};
  if(i.divOn)drawUV(i.shShadow,'#e05a5a',.7);drawUV(i.shape,'#7fd8ff',1);
  const up=uv(i.shape[i.cursor]);g.fillStyle='#7fd8ff';g.beginPath();g.arc(up[0],up[1],2.5,0,7);g.fill();
}

function updateHud(){document.getElementById('hudChart').textContent=(QLABEL[S.axX]||S.axX)+' × '+(QLABEL[S.axY]||S.axY);document.getElementById('hudZoom').textContent=(3.0/S.span).toFixed(2)+'×';}
let frames=[],last=performance.now(),acc=0,sphereAcc=0;
function loop(now){const dt=now-last;last=now;frames.push(dt);if(frames.length>100)frames.shift();if(S.playing)S.t+=dt*0.001*4;acc+=dt;
  if(S.autorotate){S.sphereYaw+=0.012;sphereAcc+=dt;if(sphereAcc>33){sphereAcc=0;const sp=document.getElementById('pv-sphere');if(sp&&!document.getElementById('menu').classList.contains('hidden'))renderSphere(sp);const sp2=document.getElementById('pe-sphere');if(sp2&&!document.getElementById('pipeEditor').classList.contains('hidden'))renderSphere(sp2);}}
  if(acc>130){acc=0;profUpdate();}document.getElementById('hudT').textContent=S.t.toFixed(2);requestAnimationFrame(loop);}
function pct(a,p){const s=[...a].sort((x,y)=>x-y);return s[Math.min(s.length-1,Math.floor(p*s.length))]||0;}
function profUpdate(){if(frames.length<3)return;const mean=frames.reduce((a,b)=>a+b,0)/frames.length,fps=1000/mean;
  document.getElementById('hudFps').textContent=fps.toFixed(0);
  const g=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v;};
  g('p-fr',mean.toFixed(2)+' ms');g('p-fps',fps.toFixed(0));g('p-mm',Math.min(...frames).toFixed(1)+' / '+Math.max(...frames).toFixed(1));
  g('p-pc',pct(frames,.5).toFixed(1)+' / '+pct(frames,.95).toFixed(1)+' / '+pct(frames,.99).toFixed(1));
  const fg=window._fg;if(fg){const c=fg.getContext('2d'),w=fg.width,h=fg.height;c.clearRect(0,0,w,h);c.fillStyle='#22262a';c.fillRect(0,0,w,h);
    const mx=Math.max(...frames,20);c.fillStyle='rgba(70,184,166,.18)';c.strokeStyle='#46b8a6';c.lineWidth=1;c.beginPath();c.moveTo(0,h);
    frames.forEach((f,i)=>{c.lineTo(i/frames.length*w,h-(f/mx)*h*0.92-2);});c.lineTo(w,h);c.closePath();c.fill();
    c.beginPath();frames.forEach((f,i)=>{const x=i/frames.length*w,y=h-(f/mx)*h*0.92-2;i?c.lineTo(x,y):c.moveTo(x,y);});c.stroke();
    c.strokeStyle='#4a4b4e';c.setLineDash([2,3]);c.beginPath();const yb=h-(16.7/mx)*h*0.92-2;c.moveTo(0,yb);c.lineTo(w,yb);c.stroke();c.setLineDash([]);
    c.fillStyle='#5c6469';c.font='8px monospace';c.fillText('16.7ms',3,yb-2);}
  profStack();}

      el.appendChild(tg);
      sub(el,'blob colours · customisable');
      swatchRow(el,[[S.bcCols[0],'BC₁₂',nc=>{S.bcCols[0]=nc;upd();}],[S.bcCols[1],'BC₂₃',nc=>{S.bcCols[1]=nc;upd();}],[S.bcCols[2],'BC₃₁',nc=>{S.bcCols[2]=nc;upd();}],[S.euCol,'Euler',nc=>{S.euCol=nc;upd();}],[S.laCol,'L±',nc=>{S.laCol=nc;upd();}]]);
      el.appendChild(note('Eq.11 blobs: BC κ=11, Euler/Lagrange κ=9. BCs at 120° on the equator, Lagrange at the poles.'));
    }
  } else if(selNode==='cvd'){
    row(el,'simulate',cflat([['off','off'],['deutan','deuteranopia'],['protan','protanopia'],['tritan','tritanopia'],['achrom','achromatopsia']],S.cvd,v=>{S.cvd=v;upd();},true),'n');
    el.appendChild(note('post-process, linear sRGB, after pixel + overlay (§3).'));
  } else if(selNode==='out'){el.appendChild(note('final RGB → framebuffer → render→display scale (when render_scale≠1) → canvas.'));}
}

document.getElementById('pe-close').onclick=closeEditor;
addEventListener('keydown',e=>{if(e.key==='Escape')closeEditor();});
buildMenu();render(false);requestAnimationFrame(loop);
</script>

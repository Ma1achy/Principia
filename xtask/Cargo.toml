[package]
name = "xtask"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# `cargo xtask codegen` runs the generator (R-241; systems_architecture §7.1).
ledger = { path = "../crates/ledger" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# R-191's compile check edits kernel's and ledger's manifests in its copy of the workspace (`deps::compile_check`).
toml_edit = "0.25.15"
# `cargo xtask golden` renders its cases with native wgpu offscreen (parity_contract §6; R-110), reads and writes PNG
# baselines, and hashes each reference for BASELINES.md (R-110). wgpu is an external crate, not a workspace edge
# (systems_architecture §7.1 admits xtask → validation only as a dev-dependency).
# `cargo xtask screenshot` renders an egui surface on a headless wgpu device and writes the capture as PNG (R-110,
# TASK-M0-20). wgpu's version and backends are validation's; egui-wgpu 0.36 is the release built on wgpu 30.
# Both runners share one png version, main's 0.18.
egui = "0.36.2"
egui-wgpu = { version = "0.36.2", default-features = false }
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "wgsl", "metal", "vulkan"] }
pollster = "1"
png = "0.18"
sha2 = "0.10"

# Controls reach xtask's tests through a dev-dependency on validation (R-176).
[dev-dependencies]
validation = { path = "../crates/validation" }

# Under `controls`, each `negative_control!` in xtask's tests compiles as a test (REQ-VAL-152, R-176).
[features]
controls = []

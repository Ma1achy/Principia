# The Burrau ν = 1/2 tolerance's evidence (REQ-VAL-118; R-71): the largest componentwise difference of the
# canonical (m, r, p) between the ν = 1/2 decode and the (m, n) = (2, 1) construction, and the classical
# configuration brought to the canonical section by C, in units of the precision's eps.
# Measured by crates/kernel/tests/burrau.rs, burrau_nu_half_measurement; regenerate with
# PRIN_WRITE_BURRAU_MEASUREMENT=1. Compared at an absolute 1e-9 eps.
tolerance = 4e0  # the proposed tolerance, eps
f64_triple = 0e0  # ν = 1/2 against the (2, 1) construction, f64, eps
f32_triple = 0e0  # ν = 1/2 against the (2, 1) construction, f32, eps
f64_classical_normalised = 1e0  # against the normalised classical configuration through C, f64, eps
f32_classical_normalised = 2.5e-1  # against the normalised classical configuration through C, f32, eps
f64_classical_historical = 1e0  # against the historical classical configuration through C, f64, eps
f32_classical_historical = 0e0  # against the historical classical configuration through C, f32, eps

# The curve projection's calibration evidence (REQ-ENC-026; R-71, R-24): d(ν*) under the R-24 metric, shape
# sphere chordal ⊕ mass simplex Euclidean at unit weights, on and off the Burrau curve, and the proposed
# tolerance k·ε_R, provisional until the M2 gate. Measured by crates/kernel/tests/encode_burrau.rs,
# encode_curve_projection_calibration; regenerate with PRIN_WRITE_CURVE_PROJECTION=1. On the curve: γ(ν) at
# rest under a random gauge, ν uniform on each span, 16384 draws at seed 26, d(ν(θ))'s quantiles in ε_R, and
# the share step 4 lands (dd_encode §3.1, the composition, at tol and ε_phys); its maximum at seeds 27 to 34,
# 4096 draws each. The test holds each on-curve value below k and at most twice its value here. Off it: γ(ν),
# ν uniform on [0.1, 0.9], each position moved by up to δ per component and the masses by up to δ/4 along
# (1, −½, −½) and up to δ/4 along (0, 1, −1), under a random gauge, 1024 draws per δ: the least, median and
# largest d(ν*), compared at a relative 1e-6 plus k·ε_R, and the share within tol. Near the tolerance: each
# position component and the masses along (1, 0, −1) and (0, 1, −1) moved by up to a multiple of tol, 1024
# draws per multiple: the shares kind 4 accepts, kind 4 and step 4 land, and kind 4 refuses where step 4 alone
# would land at the closed form. Every share is compared within 0.02. On the curve
# too, the largest d(ν(θ)) at ν > 0.9 and at ν ≤ 0.9 apart, and step 4's residual ‖D(Φ(c(x))) − C(x)‖_phys
# in ε_R at the quantiles 0.99, 0.999 and 1, held below 256 and at most twice its value here, with the ν of
# its largest, held above 0.9: REQ-ENC-024's evidence for the M2 gate's ε_phys (physics review P4).

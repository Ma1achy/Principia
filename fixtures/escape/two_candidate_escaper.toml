# Body 0 at the origin and at rest; bodies 1 and 2 on opposite sides of it on one line, each moving away along it.
# d_1 and d_2 are each body's distance to the centre of mass of the other two, and each has e_rel at t = 0.
construction = "collinear_two_candidates"
d_1 = 15.0
d_2 = 25.0
e_rel = 0.3
run = "constructed"
fires = true
escaper = 2
detail = 2

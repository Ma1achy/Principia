# units and tau the provisional 1e-3. Built from the contract, not transcribed from prin-rs.
name = "unequal_mass_e_rel"
m = [1.0, 1.0, 2.0]
construction = "binary_third"
binary_a = 1.0
d = 10.0
speed_squared = 0.6
direction = "radial_out"
# The total-mass form: 0.3 - 4/10. The pair-mass-only form would give 0.3 - 2/10 = +0.1.
e_rel = -0.1
e_rel_pair_mass_only = 0.1
run = "constructed"
fires = false

[package]
name = "render"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
ledger = { path = "../ledger" }
# The embedded record's CRC is PNG's CRC-32 (principia_dd_image_embedding.md §2); crc32fast is already in the build.
crc32fast = "1.5"
# The assembler parses and validates the assembled WGSL with naga, wgpu 30's front end, and reads the stain's field set
# off naga's IR (R-378; TASK-M1-04).
naga = { version = "30", features = ["wgsl-in"] }

# Controls reach render's tests through a dev-dependency on validation, whose GPU harness draws the prelude's fragment
# tests (R-176; systems_architecture §7.1: any crate but gui may take validation as a dev-dependency). They are
# integration tests in `tests/`, never unit tests in `src/` (R-176, R-187). naga, wgpu 30's front end, parses and
# validates the assembled WGSL.
[dev-dependencies]
validation = { path = "../validation" }
# The assembler's tests compile the assembled stain to naga's MSL, SPIR-V and HLSL to show which stored words it loads
# (R-378), and build stains through the engine's stain-graph type, the contract surface (gui_state_contract §5).
naga = { version = "30", features = ["wgsl-in", "msl-out", "spv-out", "hlsl-out"] }
engine = { path = "../engine" }
# The stain graph's serialised form is read back in the tests (gui_state_contract §5).
serde_json = "1"


# Under `controls`, each `negative_control!` in render's tests compiles as a test (R-176).
[features]
controls = []

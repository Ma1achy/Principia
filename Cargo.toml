[workspace]
resolver = "2"
members = [
    "crates/kernel",
    "crates/ledger",
    "crates/engine",
    "crates/render",
    "crates/gui",
    "crates/validation",
    "crates/prin",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

# Debug info for local builds: the workspace's own crates keep line tables, so a panic's backtrace still names file
# and line for every workspace frame; dependencies build with none. CI sets the same values in its environment.
# `test` inherits `dev`'s `package."*"`.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The independent convergence reference's arbitrary-precision arithmetic (validation's `reference::brutus`) runs six
# times slower unoptimised; optimised, its gate's runs stay at seconds in a debug build.
[profile.dev.package.dashu-base]
opt-level = 3

[profile.dev.package.dashu-int]
opt-level = 3

[profile.dev.package.dashu-float]
opt-level = 3

[profile.test]
debug = "line-tables-only"

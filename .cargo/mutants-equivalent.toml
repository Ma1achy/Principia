# The checked-in equivalent-mutants list (R-202), read by the per-PR `mutants` job (`cargo xtask mutants-check`): a
# mutant that survives in a PR's diff fails the job unless it is listed here. Each entry names one mutant exactly as
# cargo-mutants prints it, and carries a one-line justification of why no test can tell it from the original. A
# change to this list is approved by the code and qa reviewers, as R-197 has it for lint suppressions (R-202).
#
# [[equivalent]]
# mutant = "<file>:<line>:<col>: <mutation>"
# justification = "<one line>"

[[equivalent]]
mutant = "crates/engine/src/contract/canonical.rs:119:14: replace < with <= in format_f64"
justification = "value == 0.0 (and -0.0) has already returned \"0\", so value <= 0.0 and value < 0.0 agree on every value that reaches the sign test"

[[equivalent]]
mutant = "crates/engine/src/contract/canonical.rs:143:23: replace < with <= in format_f64"
justification = "the exponent branch needs n outside (-6, 21], and e = n - 1 = 0 means n = 1, which the 0 < n <= 21 branches always take, so e is never 0 there"

[[equivalent]]
mutant = "crates/prin/src/profile/diff.rs:169:19: replace | with ^ in parts"
justification = "fraction is masked to bits 0..52, so bit 52 is always clear and fraction ^ (1 << 52) equals fraction | (1 << 52)"

[[equivalent]]
mutant = "crates/validation/src/gpu.rs:166:9: replace GpuHarness::features -> wgpu::Features with Default::default()"
justification = "GpuHarness::new is the only constructor and requests engine::compute::required_features(backend), Features::empty() on every backend but Metal, and wgpu enables exactly the requested features, so on the mutants job's lavapipe device.features() is Features::empty() == Default::default()"

[[equivalent]]
mutant = "crates/render/src/compositor.rs:282:25: replace | with ^ in Compositor::layers"
justification = "RENDER_ATTACHMENT and TEXTURE_BINDING are distinct single-bit wgpu::TextureUsages flags, so their ^ is their |"

[[equivalent]]
mutant = "crates/render/src/compositor.rs:283:25: replace | with ^ in Compositor::layers"
justification = "COPY_SRC is a single-bit wgpu::TextureUsages flag clear in RENDER_ATTACHMENT | TEXTURE_BINDING, so their ^ is their |"

[[equivalent]]
mutant = "crates/render/src/compositor.rs:293:52: replace | with ^ in Compositor::layers"
justification = "UNIFORM and COPY_DST are distinct single-bit wgpu::BufferUsages flags, so their ^ is their |"

[[equivalent]]
mutant = "crates/render/src/pipeline_cache.rs:487:56: replace | with ^ in objects"
justification = "UNIFORM and COPY_DST are distinct single-bit wgpu::BufferUsages flags, so their ^ is their |"

[[equivalent]]
mutant = "crates/render/src/pipeline_cache.rs:503:48: replace | with ^ in frame_buffers"
justification = "UNIFORM and COPY_DST are distinct single-bit wgpu::BufferUsages flags, so their ^ is their |"

[[equivalent]]
mutant = "crates/gui/src/explore/top_bar.rs:23:5: replace overlays_on -> u32 with 0"
justification = "Overlays has no field yet (the overlay set has no toggle until its task, RQ-249), so the function's body is the constant 0 the mutant returns"

[[equivalent]]
mutant = "crates/validation/src/golden_scene.rs:238:32: replace | with ^ in d_min_samples"
justification = "w & 0xffff has bits 0..16 only and F16_QNAN << 16 bits 16..32 only, so their ^ is their |"

[[equivalent]]
mutant = "crates/render/src/colour/field_ramp.rs:92:29: replace == with != in ScalarField::payload"
justification = "every ledger field payload reaches here (a scalar SimState member, an ICDescriptor member, or the word's) has its <lane>_valid in the validity lane (field_ramp_scalar_validity_is_the_lane checks each), so the guard never refuses, and any() over != finds another member: both accept the same fields"

[[equivalent]]
mutant = "crates/validation/src/golden_scene.rs:223:49: replace % with + in scene"
justification = "set_detail writes the low 2 bits of its value (insert(w, v, 3, 2)), and i + 4 and i % 4 share their low 2 bits for every i, so each state_view sample holds the same detail code"

[[equivalent]]
mutant = "xtask/src/lint_constants.rs:131:63: replace + with * in initializer"
justification = "the initializer then starts at its `=` rather than after it; `=` is no digit, and before the next byte it is neither alphanumeric, `_` nor `.`, so has_number finds a token-starting digit exactly when it does without it"

[[equivalent]]
mutant = "crates/engine/src/contract/conformance.rs:186:17: replace + with - in shifted"
justification = "shifted only builds the navigation case's target values, by a non-zero offset d; x - d differs from x exactly when x + d does, so the case moves every field it edits either way and passes and fails on the same engines"

[[equivalent]]
mutant = "crates/gui/src/explore/compass.rs:100:35: replace / with * in plane_frame"
justification = "Z0_HALF_RANGE is 1.0, so z / 1.0 and z * 1.0 are the same value for every z"

[[equivalent]]
mutant = "crates/gui/src/explore/compass.rs:274:59: replace | with ^ in draw"
justification = "the guard above has just checked i & (1 << b) == 0, and with that bit clear i ^ (1 << b) equals i | (1 << b)"

[[equivalent]]
mutant = "crates/gui/src/explore/manifold_view/mod.rs:510:20: replace * with / in adjust"
justification = "Z0_HALF_RANGE is 1.0, so 2.0 * 1.0 and 2.0 / 1.0 are both 2.0"

[[equivalent]]
mutant = "crates/gui/src/explore/manifold_view/mod.rs:521:57: replace * with / in adjust"
justification = "Q_HALF_RANGE is 1.0, so (range * 2.0) * 1.0 and (range * 2.0) / 1.0 are the same value"

[[equivalent]]
mutant = "crates/kernel/src/canon.rs:259:18: replace / with % in wide"
justification = "both split 2^-k into two normal powers of two, each product exact: identical bits on all 2^32 f32 patterns but ±inf and on every f64 exponent field (checked); ±inf, a pair difference that overflowed, is outside mirror_decision's domain, where I_in is +inf (RQ-296)"

[[equivalent]]
mutant = "crates/kernel/src/canon.rs:277:28: replace > with >= in wide_add"
justification = "at gap = 60 both select a shift of 60, so the shift, and the sum, are the same at every gap"

[[equivalent]]
mutant = "crates/kernel/src/canon.rs:290:17: replace | with ^ in wide_greater"
justification = "a.e > b.e and a.e == b.e exclude each other, so the two operands are never both true and their ^ is their |"

[[equivalent]]
mutant = "crates/kernel/src/canon.rs:342:10: replace < with <= in mirror_decision"
justification = "c.m is ±0 only for c = 0, at the zero exponent, so left = m2*c^2 is 0 at the least exponent and wide_greater(left, right) is false: the mirror is not taken either way"


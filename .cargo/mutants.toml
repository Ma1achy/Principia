# cargo-mutants' configuration (R-196; TASK-M0-23): the one exclusion list the per-PR `mutants` job (mutants.yml) and
# the nightly full run (TASK-M0-19, R-198) share. Each exclusion names which of R-196's three categories it falls in:
# generated code, GPU-only (spirv-gated) paths, or xtask's own harness plumbing. Nothing else is excluded; a mutant
# that survives outside these is a qa finding, killed with a test or listed in `mutants-equivalent.toml` (R-202).

exclude_globs = [
    # Generated code (R-196): the checked-in files `cargo xtask codegen` writes. The plan's emitters write them under
    # a `generated/` directory (`crates/ledger/generated/`, `crates/kernel/src/generated/`) or as a `generated.rs`
    # (`crates/kernel/src/payload/generated.rs`); the two globs match every such file, so a generated file added later
    # is excluded too. Applied per R-204 — veto? (TASK-M0-23). One written elsewhere fails closed: its surviving
    # mutants are named by the job. The kernel's build-time code in `OUT_DIR` (R-185, R-190) is outside the source
    # tree, and cargo-mutants never mutates it.
    "**/generated/**",
    # Generated code (R-196): a file named `generated.rs` anywhere in the tree (a glob without `/` matches any path
    # component).
    "generated.rs",
    # xtask's own harness plumbing (R-196; RQ-162, applied per R-204 — veto?): argument dispatch and exit codes, and
    # the `codegen` wrapper, whose logic is `ledger::gen::run`, mutated in `ledger`. xtask's checks and `ci.rs` stay
    # mutated.
    "xtask/src/main.rs",
    "xtask/src/codegen.rs",
]

# GPU-only (spirv-gated) paths (R-196; RQ-162, applied per R-204 — veto?): cargo-mutants cannot match an attribute
# from configuration, so every item gated on `target_arch = "spirv"` also carries `#[cfg_attr(test, mutants::skip)]`,
# which it recognises. A missing marker fails closed: the item's mutants survive and the job names them.

# What each mutant runs (R-388 item 4; applied per R-369): the tests of the package it mutates, cargo-mutants' default
# (neither `test_workspace` nor `test_package` is set), through cargo-nextest. The baseline runs the tests of every
# package the run mutates. nextest runs each test as a process of its own and the test binaries side by side, where
# `cargo test` runs the binaries one after another (render's 296 tests: 238 s against 105 s), and stops at the first
# failing test. It runs the same tests as `cargo test`: the workspace has no doctests, which nextest would skip.
# Dependents' tests are not added: every crate but gui reaches ledger, render, kernel and engine through its
# dev-dependency on `validation`, so they would take a ledger mutant from its own 36 s of tests to the whole suite's,
# against REQ-VAL-149's limit. A narrower test set can only leave more mutants surviving, never fewer, so the gate is
# as strict as with the whole workspace's tests.
test_tool = "nextest"

# The per-mutant timeout (R-348; REQ-VAL-180, confirmed by the human at the M0 gate, R-376, R-71):
# a mutant whose tests run past it is recorded as a timeout, not a survivor (R-202), and the run goes on to its next
# mutant. cargo-mutants sets it from the unmutated baseline's test time: `timeout_multiplier` times that time, but no
# less than `minimum_test_timeout` seconds. Every run reads it here: the per-PR shards (`mutants.yml`), the nightly
# full run (TASK-M0-19) and a local run, on Linux or macOS (R-352).
timeout_multiplier = 2.0
minimum_test_timeout = 60

# The per-process memory cap on the test processes (R-348; REQ-VAL-181, confirmed by the human at the M0 gate, R-376,
# R-71): 8 GiB (8589934592 bytes) of virtual memory, RLIMIT_AS, set by `prlimit --as`. nextest runs
# each test under `prlimit` as its runner, so the cap binds each test process of the baseline and of every
# mutant, and what that process spawns, but not cargo-mutants, nor cargo and rustc building the tests. A test whose
# allocation passes the cap fails, as any failing test does. `--core=1` turns off the process's core dump, which
# otherwise holds it up: the runners pipe cores to systemd-coredump, which ignores a limit of 0 and reads all 8 GiB
# (about 45 s on ubuntu-24.04, against about 5 s without it); the kernel skips a piped dump when the limit is 1. The
# runner is set for Linux alone: CI's Linux runners enforce the cap, and a run on macOS, which has no `prlimit`, gets
# the timeout alone (R-352). nextest reads the runner from `--config`, as cargo does, and runs each test process under
# it. cargo-mutants' timeout wraps the whole `cargo nextest run`.
# `--no-tests=warn`: a package with no tests (gui) passes, as under `cargo test`. nextest's default fails such a run
# (exit 4), and cargo-mutants would then count each of its mutants as caught, a survivor hidden.
additional_cargo_test_args = [
    "--no-tests=warn",
    "--config",
    "target.'cfg(target_os = \"linux\")'.runner = ['prlimit', '--as=8589934592', '--core=1']",
]

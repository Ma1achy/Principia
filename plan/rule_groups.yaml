# The group each decisions.md entry falls under in plan/CURRENT_RULES.md (R-292). plan/tools/current_rules.py reads
# this file with decisions.md and rebuilds CURRENT_RULES.md; `python3 plan/check_plan.py` fails if an entry is in no
# group or in two, if a group names an entry decisions.md lacks, or if CURRENT_RULES.md is stale.
#
# A new ruling is added to one group here, in the same commit that records it. The groups, in the order the file
# lists them:
#   authority  — what the corpus is, what wins, how a gap is filled
#   physics    — physics and mathematical conventions: charts, encode and decode, the integrator, events, fixtures'
#                physics
#   design     — architecture, payload, scheduler and refinement, render, colour, GUI and tooling design
#   values     — numeric values, tolerances and gates
#   process    — how agents, reviewers and the human work: tasks, reviews, tests and controls, sizes, machines
#   ci         — what CI runs and checks
#   one_off    — acts rather than standing rules (a split, an acceptance, a merge, a one-time fix): history only
# `not_rules` lists entry headings that aren't rulings: a section introduction, and "R-7 amended", which R-7's
# forward line points at.

